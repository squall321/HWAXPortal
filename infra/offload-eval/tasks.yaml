# 토큰 절감 2판 비교 테스트셋의 과제 16 — 네 갈래(R 큰 결과 · M 다단계 조사 · W 긴 글 · T 변환) 넷씩
#
# 읽는 곳 — run-eval.mjs(작은 YAML 파서 — 이 파일이 쓰는 꼴만 안다) · backend/tests/test_offload_eval.py(PyYAML 로 같은지 대조).
# 쓰는 꼴만 쓴다 — 블록 매핑 · 블록 시퀀스 · 흐름 목록 [a, b] · 블록 글 | · 수 · 큰따옴표 글. 글 안에 ': ' 나 ' #' 이 들면 큰따옴표로 감싼다.
#
# 칸
#   id       — 결과 파일 이름이 된다(바꾸면 이어 하기가 새 과제로 본다)
#   group    — R · M · W · T
#   helps    — 2판의 어느 기능이 도울지(A 위임 · B 결과 손잡이와 묻기 · C 긴 글 작성 · D 변환 — docs/token-saving/offload-v2.md)
#   prompt   — Claude 에 그대로 준다. 모두 「읽기만 하고 아무것도 바꾸지 마라」 를 담는다(시험이 본다)
#   expect   — shape 는 판정 모델 · 사람이 읽는 기대 꼴. 나머지는 코드가 보는 꼴 검사
#              table_rows_min(가장 큰 마크다운 표의 데이터 행 수 ≥) · lines_exact(빈 줄을 뺀 줄 수 =) · chars([최소, 최대] 글자 수) ·
#              must_include(모두 들어야 하는 낱말) · latin_ratio_min(라틴 글자 / (라틴 + 한글) ≥)
#
# ⚠ 이 리포는 공개다 — 과제 글에 내부 주소 · 실제 이름 · 과제명을 적지 않는다(「가장 최근 과제 하나를 골라」 처럼 스스로 찾게 한다).

version: 1
tasks:
  - id: R1
    group: R
    helps: [B]
    title: StepForge 최근 과제의 파트 표
    prompt: |
      StepForge 에서 내가 볼 수 있는 과제 가운데 가장 최근 것 하나를 골라, 그 과제 형상의 파트 목록을 받아라.
      부피(없으면 크기를 나타내는 다른 값)가 큰 순으로 상위 10개 파트를 표(파트 이름 · 재료 · 부피)로 정리하고,
      표 아래에 고른 과제와 그 과제를 고른 까닭을 한 줄로 적어라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 10행 표(파트 이름 · 재료 · 부피) + 고른 과제 한 줄
      table_rows_min: 10

  - id: R2
    group: R
    helps: [B]
    title: 지식카드 검색 상위 10
    prompt: |
      지식카드(AIDataHub)에서 「솔더 접합부 열피로 수명」 을 검색해 관련도 상위 10건을 골라라.
      표(카드 제목 · 전문가 · 핵심 내용 한 줄)로 정리하고, 표 아래에 10건에 공통된 요점을 두 줄로 적어라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 10행 표(카드 제목 · 전문가 · 핵심 내용) + 공통 요점 두 줄
      table_rows_min: 10

  - id: R3
    group: R
    helps: [B]
    title: DynaForge 최근 리포트의 최악 케이스
    prompt: |
      낙하 해석 결과(DynaForge 리포트)에서 내가 볼 수 있는 가장 최근 리포트 하나를 골라,
      최대 응력 기준으로 가장 나쁜 케이스 다섯을 표(케이스 · 낙하 조건 · 최대 응력 · 위치)로 정리하라.
      볼 수 있는 리포트가 없으면 찾아본 곳과 함께 없다고만 말하라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 5행 표(케이스 · 낙하 조건 · 최대 응력 · 위치), 리포트가 없으면 없다는 말과 찾아본 곳
      table_rows_min: 5

  - id: R4
    group: R
    helps: [B]
    title: Report Archive 최근 보고서 다섯
    prompt: |
      Report Archive 에서 내가 볼 수 있는 보고서 가운데 가장 최근 다섯을 골라
      표(제목 · 작성일 · 한 줄 요약)로 정리하라. 요약은 보고서 본문을 읽고 쓴다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 5행 표(제목 · 작성일 · 한 줄 요약)
      table_rows_min: 5

  - id: M1
    group: M
    helps: [A]
    title: 재료 · 물성 전문가 셋과 카드 수
    prompt: |
      전문가 목록에서 재료 · 물성 분야 전문가 셋을 골라, 각자의 지식카드 수와 대표 주제 둘을
      표(전문가 · 카드 수 · 대표 주제)로 정리하라. 카드 수는 도구로 센 값만 쓰고, 셀 수 없으면 모름으로 적어라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 3행 표(전문가 · 카드 수 · 대표 주제)
      table_rows_min: 3

  - id: M2
    group: M
    helps: [A]
    title: 신뢰성 시험 규격 비교
    prompt: |
      휴대 기기 신뢰성 시험 가운데 낙하 시험과 열충격 시험의 조건을 찾아,
      두 시험의 적용 규격 · 주요 조건(높이나 온도 범위 · 횟수) · 판정 기준을 비교 표로 정리하라.
      표 아래에 두 시험의 조건을 어디서 찾았는지 한 줄씩 적어라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 비교 표(항목마다 낙하 · 열충격 두 칸) + 출처 두 줄
      table_rows_min: 3
      must_include: [낙하, 열충격]

  - id: M3
    group: M
    helps: [A]
    title: VOC 급상승 이슈 셋
    prompt: |
      시장 VOC(SignalForge)에서 최근 건수가 가장 크게 늘어난 이슈 셋을 찾아,
      이슈마다 최근 건수 추이와 관련 부품 · 대표 증상을 표(이슈 · 건수 추이 · 관련 부품 · 대표 증상)로 정리하라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 3행 표(이슈 · 건수 추이 · 관련 부품 · 대표 증상)
      table_rows_min: 3

  - id: M4
    group: M
    helps: [A]
    title: PLM 불량 유사 사례
    prompt: |
      PLM 불량 기록에서 「힌지 파손」 과 비슷한 사례 셋을 찾아 표(사례 · 증상 · 원인 · 대책)로 정리하고,
      셋에 공통된 원인을 한 줄로 적어라. 볼 수 있는 기록이 없으면 찾아본 곳과 함께 없다고만 말하라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 3행 표(사례 · 증상 · 원인 · 대책) + 공통 원인 한 줄, 기록이 없으면 없다는 말과 찾아본 곳
      table_rows_min: 3

  - id: W1
    group: W
    helps: [C]
    title: 리스크 심사 1쪽 메모
    prompt: |
      리스크 심사 앱에서 내가 볼 수 있는 가장 최근 심사 대상 하나를 골라 주요 리스크를 조사한 뒤,
      팀장에게 보내는 1쪽 메모(800 ~ 1,500자)를 써라. 「결론」 · 「근거」 · 「다음 할 일」 세 절로 나눈다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 1쪽 메모 — 결론 · 근거 · 다음 할 일 세 절, 800 ~ 1,500자
      chars: [600, 2000]
      must_include: [결론, 근거, 다음 할 일]

  - id: W2
    group: W
    helps: [C]
    title: 심의 결정문의 원인 정리 절
    prompt: |
      내가 볼 수 있는 심의 가운데 가장 최근 것 하나의 결정문을 읽고 원인 정리 절을 써라.
      「배경」 · 「원인 후보」 · 「근거」 · 「남은 불확실성」 네 소절, 합쳐 1,000 ~ 2,000자.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 원인 정리 절 — 배경 · 원인 후보 · 근거 · 남은 불확실성, 1,000 ~ 2,000자
      chars: [800, 2600]
      must_include: [배경, 원인 후보, 근거, 불확실성]

  - id: W3
    group: W
    helps: [C]
    title: 보고서 검토 회의록 초안
    prompt: |
      Report Archive 에서 가장 최근 보고서 하나를 골라, 그 보고서를 검토하는 30분 회의의 회의록 초안을 써라.
      「안건」 · 「논의 요지」 · 「결정」 · 「할 일」(담당 역할 · 기한) 네 절. 참석자는 이름 대신 역할로 적어라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 회의록 초안 — 안건 · 논의 요지 · 결정 · 할 일(담당 역할 · 기한)
      chars: [500, 2500]
      must_include: [안건, 논의, 결정, 할 일]

  - id: W4
    group: W
    helps: [C]
    title: 두 재료 비교 절
    prompt: |
      재료 물성 도구에서 PC 와 PC/ABS 의 기계 물성(탄성계수 · 인장강도 · 연신율 등)을 찾아,
      두 재료를 비교하는 보고서 절을 써라 — 비교 표 하나와 해석 문단 둘(합쳐 600 ~ 1,200자). 값마다 단위를 붙인다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 비교 표(물성마다 PC · PC/ABS) + 해석 문단 둘, 600 ~ 1,200자
      table_rows_min: 3
      chars: [500, 2500]
      must_include: [PC/ABS]

  - id: T1
    group: T
    helps: [D]
    title: 보고서 요약 영어 번역
    prompt: |
      Report Archive 에서 가장 최근 보고서 하나의 요약(없으면 첫 절)을 받아 영어로 번역하라.
      원문은 싣지 말고 번역문만 내라. 고유명사 · 수치 · 단위는 그대로 둔다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 영어 번역문만(원문 없이)
      latin_ratio_min: 0.8

  - id: T2
    group: T
    helps: [D]
    title: 결정문 권고를 표로
    prompt: |
      내가 볼 수 있는 심의 가운데 가장 최근 것 하나의 결정문에서 권고(없으면 결론) 항목을 뽑아
      표(항목 · 근거 · 우선순위)로 바꿔라. 결정문에 없는 항목을 더하지 마라.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 표(항목 · 근거 · 우선순위), 결정문에 있는 항목만
      table_rows_min: 3

  - id: T3
    group: T
    helps: [D]
    title: 지식카드 결과를 주제별로 묶기
    prompt: |
      지식카드에서 「방수 실링 열화」 를 검색해 나온 결과(상위 20건 안팎)를 주제별로 3 ~ 5묶음으로 묶어 정리하라.
      묶음마다 제목 한 줄과 거기 속한 카드 제목들을 적는다. 어느 묶음에도 안 맞는 카드는 「기타」 로 둔다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 3 ~ 5묶음(묶음 제목 + 속한 카드 제목들) + 기타
      chars: [200, 4000]

  - id: T4
    group: T
    helps: [D]
    title: 최근 보고서 다섯 줄 요약
    prompt: |
      Report Archive 에서 가장 최근 보고서 하나를 정확히 다섯 줄로 요약하라.
      줄마다 한 문장, 머리말 · 꼬리말 · 빈 줄 없이 다섯 줄만 낸다.
      읽기만 하고 아무것도 바꾸지 마라.
    expect:
      shape: 정확히 다섯 줄(줄마다 한 문장)
      lines_exact: 5
