# HWAX service manifest — the one place that says how each federated service starts.
#
# The portal orchestrator (infra/scripts/services.py) reads this to bring the whole stack
# up / check / down. Routing (nginx) lives in backend/config/routes.env; THIS file is about
# *starting the processes behind those routes* + the chat stack (vLLM / MCP / agent).
#
# NO SECRETS HERE. Remote hosts use SSH KEY auth (ssh_user only). If a remote start needs
# root, put a NOPASSWD line in that host's sudoers — never a password in this file.
#
# Per service:
#   name      identifier (also the audit/log name)
#   host      'local' (this box) or an IP/hostname (SSH, key auth)
#   ssh_user  remote only — the SSH user (key-based; no password)
#   dir       absolute/~ path to the project. Omit to AUTO-DISCOVER by `discover`.
#   discover  repo dir name searched in: <parent-of-portal>/, ~/Projects/, ~/claude/
#   env       extra environment for the start command
#   start     command run from `dir` (orchestrator detaches it; foreground servers are fine)
#   health    URL polled until the service answers (any HTTP response = up)
#   expect    (선택) 허용 상태코드. 주면 코드까지 본다. 프록시 뒤 서비스는 '응답이 왔다'만으로
#             판정이 안 된다 — 죽은 upstream 에 프록시가 주는 502 도 '응답'이라 up 이 됐다.
#             없으면 종전 동작(406 등을 up 으로 보는 항목들이 있어 전역 강제는 못 한다).
#   tier      startup order group (lower first): infra(0) → services(10) → chat(20)

services:
  # ── tier 0: the portal itself (nginx + backend + SPA) ──
  - name: portal
    host: local
    dir: .                      # the portal repo is the orchestrator's own root
    env: { HWAX_NO_BUILD: "1" }
    start: ./infra/scripts/start.sh
    # down/restart must stop the apptainer INSTANCES (backend :8723 + nginx), not fuser-kill the
    # health port :8088 (that kills nginx only → the portal backend keeps running OLD code, so a
    # pulled update never applies). This makes `down portal && up --update portal` truly redeploy.
    stop: 'A="$(command -v apptainer || ls -d infra/apptainer/bin-*/usr/bin/apptainer 2>/dev/null | head -1)"; for i in hwax_portal hwax_nginx; do "$A" instance stop "$i" 2>/dev/null || true; done'
    # 포털 백엔드(:8723) 직접 체크 — 공유 nginx 프론트(:8088)로 체크하면 백엔드가 죽어도 그 포트를
    # 다른 서비스가 점유해 응답하면(health_ok 는 3xx/4xx 도 up 처리) "already-up" 오판 → 백엔드 미재기동.
    # 실제 사고: 재가동 틈에 wekan 스냅의 FerretDB 디버그 핸들러가 :8088 을 선점(303) → up 이 스킵.
    health: http://127.0.0.1:8723/health
    tier: 0

  # ── tier 10: federated sub-services (proxied via routes.env) ──
  - name: mx-white-paper
    host: local
    discover: MXWhitePaper
    start: ./infra/scripts/start.sh
    # 프론트(:5173)는 정적 서버라 /zzz 도 200 이다 — 그걸 앵커로 쓰면 무엇도 판정 못 한다.
    # routes.env 는 mx-white-paper/api → :8800 을 따로 프록시하는데 그 프로세스는 아무도 안 봤다.
    # API 를 앵커로 삼는다(nginx 경유 금지 — 업스트림이 죽으면 502 인데 expect 없이는 up 이 된다).
    expect: 200
    health: http://127.0.0.1:8800/api/v1/healthz
    tier: 10

  # VoiceRecorder(voice_recorder) · WebDesignAgents(web_design_agents) 는 여기서 관리하지
  # 않는다 — 다른 HEAX 앱과 똑같이 **HEAXHub 가 SIF 로 빌드·서빙**한다(integrations/<slug>/,
  # /apps/<slug>/ 서브경로). 무거운 의존성은 스택 .def 의 Stage 훅(scripts/heaxhub-build.sh)이
  # 컨테이너에 심고(VR: torch+Chatterbox+Melo/Cosy 사이드카, WDA: chromium+ffmpeg+fonts),
  # 가중치/데이터는 /data 볼륨으로 나른다. 예전엔 자체 venv 독립 서비스로 등록했으나
  # SIF 경로와 이중 서빙이 돼 SIF 로 일원화했다.

  - name: heax-hub
    host: local
    discover: HEAXHub
    # health 앵커는 반드시 /health 여야 한다. 루트(/)는 Caddy 의 정적 SPA(file_server)라
    # 백엔드(:4040 FastAPI)가 죽어도 index.html 을 200 으로 돌려준다 — 앱이 다 죽어도 초록이었다.
    # expect: 200 도 함께 필요하다. health_ok 는 '응답이 오면 up' 이라, 죽은 upstream 에
    # Caddy 가 주는 502 마저 up 으로 봤다. 이 둘이 같이 있어야 판정이 성립한다.
    expect: 200
    env: { HEAX_NO_BUILD: "1" }
    # Rebuild the SPA with base=/heax-hub/ so its assets resolve under the portal sub-path
    # (default base=/ → /assets/ 404s behind the proxy). Kept in the portal (heax repo
    # untouched — its Makefile already takes HEAX_BASE_PATH). Hardened for the locked-down
    # server:
    #  1) rebuild ONLY when frontend/ actually changed (deploy-script-only commits were
    #     needlessly triggering a frontend build) — and always when dist is missing;
    #  2) pnpm resolution, offline: vendored .tools/node-*/bin (HEAXHub's own pinned
    #     node+pnpm — what the locked-down server has) first, then ~/.npm-packages/bin,
    #     BOTH ahead of the /usr/bin corepack shim which fetches pnpm over TLS and dies
    #     with UNABLE_TO_VERIFY_LEAF_SIGNATURE behind the corporate proxy. Corepack
    #     download prompts/attempts are disabled outright as belt-and-suspenders;
    #  3) if a NEEDED rebuild fails but a dist exists, keep serving it (warn, non-fatal) —
    #     only fail when there is no dist to fall back on.
    update: |
      before=$(git rev-parse HEAD 2>/dev/null || echo none)
      git pull --ff-only || echo "  git pull 실패(오프라인?) — 현재 체크아웃 유지"
      after=$(git rev-parse HEAD 2>/dev/null || echo none)
      need=0
      [ -f frontend/dist/index.html ] || need=1
      if [ "$need" = 0 ] && [ "$before" != "$after" ] && [ "$before" != none ]; then
        git diff --quiet "$before" "$after" -- frontend 2>/dev/null || need=1
      fi
      if [ "$need" = 0 ]; then
        echo "  frontend 변경 없음 + dist 존재 → 재빌드 생략"
      else
        VN="$(ls -d "$PWD"/deploy/apptainer/.tools/node-*/bin 2>/dev/null | head -1)"
        [ -n "$VN" ] && export PATH="$VN:$PATH"
        export PATH="$HOME/.npm-packages/bin:$PATH"
        export COREPACK_DEFAULT_TO_LATEST=0 COREPACK_ENABLE_DOWNLOAD_PROMPT=0 COREPACK_ENABLE_NETWORK=0
        echo "  pnpm: $(command -v pnpm || echo '없음')"
        if HEAX_BASE_PATH=/heax-hub/ make build; then
          echo "  build OK"
        elif [ -f frontend/dist/index.html ]; then
          echo "  ⚠ build 실패 — 기존 dist 유지(heax는 현재 빌드로 계속 서빙)" >&2
        else
          echo "  ✗ build 실패 + 폴백 dist 없음" >&2
          exit 1
        fi
      fi
    # heal.sh (not start.sh): idempotent converge-to-healthy. start.sh dies on `set -e` +
    # "instance already exists" stale state, which left heax down after an update/restart.
    # heal.sh clears stale infra → runs start.sh bootstrap → safety-net start → verify.
    start: bash deploy/apptainer/heal.sh
    health: http://localhost:4180/health
    tier: 10

  - name: ai-data-hub
    host: local
    discover: AIDataHub
    # No AIDH_ROOT_PATH: portal nginx STRIPs /ai-data-hub/, so root_path would double-prefix
    # the dashboard redirect. Standard mode + strip is the working combo (see its deploy .env).
    start: ./boot.sh --force
    health: http://localhost:8001/
    tier: 10

  - name: signalforge
    host: local
    discover: SignalForge
    start: ./scripts/up.sh
    # 프론트(:17370)도 정적이라 /zzz 가 200 이다. routes.env 의 signalforge/api → :18000 이
    # 실제 백엔드이고 /health 가 진짜 엔드포인트다({"status":"ok","service":"SignalForge API"}).
    expect: 200
    health: http://127.0.0.1:18000/health
    tier: 10

  - name: report-archive
    host: local
    discover: ReportArchive
    update: false               # do NOT auto git-pull/touch the ReportArchive repo
    start: ./start.sh
    health: http://localhost:3000/api/health
    tier: 10

  # DynaForge(KooRemapper) — /apps/kooremapper 로 노출되지만 다른 HEAX 앱과 달리 SIF 가 없다.
  # HEAXHub 는 :8700(웹)/:8701(MCP)로 프록시만 하고, 앱 등록은 HEAXHub 쪽 매니페스트에서 나온다.
  # 그래서 이 서버가 없어도 앱 목록엔 '안정'으로 뜨고 열면 502 가 난다(cae00 실측). 여기 없으면
  # status 에도 안 잡혀 '없다는 사실' 자체가 안 보였다 — 그게 이 항목을 만든 이유다.
  # 배포(Drive 아티팩트 반입 포함)는 deploy-all-from-drive.sh 가 하고, 여기서는 등록·자동클론·
  # 헬스·수동 재기동을 담당한다. 바이너리·프론트 dist·SIF 는 gitignore 라 Drive 에서 받는다.
  - name: kooremapper
    host: local
    discover: KooRemapper
    repo: https://github.com/squall321/KooRemapper.git
    update: |
      git fetch origin main --quiet && git reset --hard origin/main --quiet
      bash platform/infra/scripts/dist-from-drive.sh \
        || echo "⚠ Drive 아티팩트 반입 실패 — 기존 것으로 진행(remote 설정은 deploy-all 이 한다)"
    start: bash platform/infra/scripts/start.sh
    stop: bash platform/infra/scripts/stop.sh
    # 루트(/)를 쓰면 안 된다 — SPA 라우터가 어떤 경로든 같은 index.html 을 200 으로 돌려줘
    # API 가 죽어도 초록이다(/, /health, /zzz 의 md5 동일). /api/health 가 진짜 엔드포인트다.
    # :8701(MCP)은 루트가 404 라 앵커로 못 쓴다 — 도구 수는 update-all 이 tools-map 으로 본다.
    expect: 200
    health: http://127.0.0.1:8700/api/health
    tier: 10

  # ── tier 20: MCP chat stack (heavy GPU last; vLLM may live on a remote host) ──
  # dev 박스 전용 로컬 vLLM(qwen 테스트용). only_on 밖의 박스(cae00 등)에선 up/down/status 가
  # 자동 skip — cae00 챗은 HWAXAgentServer/.env 의 VLLM_BASE_URL(상암 B300 GLM)을 쓴다.
  - name: vllm
    host: local                 # set to a B300 host IP + ssh_user for prod (URL-only swap)
    only_on: smarttwincluster   # 이 호스트에서만 관리 (다른 박스에선 skip)
    dir: ./docs                 # start-dev-vllm.sh lives in the portal docs (dev)
    update: false               # stateless: code/model ship via SIF image, not git pull
    # stop is a no-op so `down`/`restart` DON'T kill vLLM: it's a heavy GPU load (~1-2 min)
    # and a plain port-kill leaves a VLLM::EngineCore zombie holding VRAM → next start OOMs.
    # `up` finds it already-up and skips. To really restart it: infra/scripts/restart-vllm.sh.
    stop: "true"
    start: ./start-dev-vllm.sh
    health: http://localhost:8000/health
    tier: 20

  # ── tier 15: real per-service MCP servers (the chat's tools; Agent Server consumes these) ──
  - name: reportarchive-mcp
    host: local
    discover: ReportArchive
    update: false                         # shares the ReportArchive repo — don't auto-pull it
    start: ./mcp_server/run_dev.sh        # FastMCP :3002, forwards Authorization to the backend
    health: http://localhost:3002/mcp     # 406 to GET, but answering = up
    tier: 15

  - name: signalforge-mcp
    host: local
    discover: SignalForge
    env: { MCP_PORT: "8013" }
    start: ./mcp-server/start_mcp.sh      # FastMCP :8013, VOC tools (SF_MCP_TOKEN Bearer auth)
    health: http://localhost:8013/mcp
    tier: 15

  - name: mxwp-mcp
    host: local
    discover: MXWhitePaper
    update: false                         # MX repo managed separately (own stack/systemd)
    start: 'apptainer exec instance://mxwp_api bash -lc "cd /workspace/dist/llm-docx-toolkit && MXWP_API_URL=http://127.0.0.1:8800 python3 -m mcp --http --host 127.0.0.1 --port 8765"'
    health: http://localhost:8765/mcp     # 406 to GET, but answering = up; forwards Bearer mxwp_ to API
    tier: 15

  # ── tier 16: central MCP gateway — aggregates the 3 tier-15 MCPs into one endpoint ──
  - name: mcp-gateway
    host: local
    discover: HWAXMcpGateway
    repo: https://github.com/squall321/HWAXMcpGateway.git  # update-sites.sh auto-clones/sets-remote if missing
    start: ./start.sh                     # streamable-http :9110, injects per-backend tokens
    health: http://localhost:9110/health  # unauthenticated JSON {status,tools,backends}
    tier: 16

  - name: agent-server
    host: local
    discover: HWAXAgentServer
    repo: https://github.com/squall321/HWAXAgentServer.git  # public — 익명 자동클론 가능(자격증명 불필요)
    # MCP_CONFIG 는 기동 cwd(=레포 디렉토리) 기준 상대경로 — 서버마다 경로가 달라도(~/Projects·~/claude) 동작.
    # vLLM 주소·모델은 박스별 HWAXAgentServer/.env 로 잡는다(playbook §8). manifest 에 모델 기본값을
    # 두면 .env 가 BASE_URL 만 지정한 박스에서 '상암 주소 + qwen 모델명' 같은 어긋난 조합을 만든다 —
    # 기본값은 start.sh(로컬 vLLM + qwen)에만 둔다.
    env: { MCP_CONFIG: "mcp_servers.json" }
    start: ./start.sh
    health: http://localhost:9009/health
    tier: 20

  # 일반 웹 검색 공급자. 레포가 아니라 SIF+설정이라 dir 을 직접 준다.
  # WEB_PROVIDER=searxng 일 때만 의미가 있다 — 웹 리서치 앱이 이 주소로만 나간다.
  - name: searxng
    host: local
    dir: "~/claude/HWAXPortal"
    start: ./infra/scripts/searxng.sh
    health: http://127.0.0.1:8888/
    tier: 14
