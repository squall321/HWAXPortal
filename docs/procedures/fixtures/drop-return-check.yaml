# R2d — 낙하 해석의 **결과 귀환 확인**(읽기만): 후처리 예약 잡 → 반입된 리포트 → 그 리포트가 그 잡의 것인지.
#
# ⚠ 이 파일이 정본이 아니다. 가져다 쓰는 씨앗이다. `backend/tests/test_procedures_s3.py` 가 읽어 검증한다.
#
# 무엇을 보나(docs/cae00-deploy-guide.md 「낙하 트윈」 4절의 2 · 3 을 그대로 옮겼다 — 사람이 화면을 넘겨 가며 보던 것이다).
#   ① 제출 절차(R2a)가 걸어 둔 후처리 예약 잡이 끝났는가 — `status` · 클러스터 쪽 상태 · 해석 꾸러미(온톨로지) 반입 상태.
#      실패면 잡의 `error_summary` 가 귀환 매니페스트의 까닭을 그대로 싣는다 — 그 문구를 DynaForge 쪽에 넘긴다.
#   ② 그 Slurm 잡의 리포트가 들어왔는가 — 잡 키 `stcx:<Slurm 잡 ID>` 로 **정확히** 찾는다(이름으로 찾지 않는다 — 이름은 겹친다).
#      0건이면 아직 반입 전이거나 예약이 실패했다 — ① 의 값을 본다.
#   ③ 그 리포트가 낙하 · 충격 리포트인가(단언은 기대값을 글자로만 받아 종류 하나를 변수로 묻지 않는다), 과제 메타(제출 때 채웠으면)가 실렸는가.
#   ④ 후처리 판이 실려 오고 있는가 — 최근 리포트가 실어 온 후처리 판 · 수 · 마지막 시각.
#
# 전부 읽기다 — 게이트가 없다. 쓰는 일(다시 걸기 · 수동 반입)은 이 절차에 넣지 않는다. 드라이버 매니페스트(4절의 1 — sacct · 결과 폴더의
# return_manifest.json)는 클러스터 안의 파일이라 이 절차로 보지 않는다.
#
# 도구는 DynaForge 11-15 판(`6d4dd78`)부터 있다 — `get_job` 의 `external` 요약 · `find_reports` 의 `external_job_key` · `system_status` 의
# `postprocess_versions`. 그 전 판이면 ② 가 인자를 모른다고 답한다.

title: 낙하 — 결과 귀환 확인 (읽기만)

vars:
  - key: postprocess_job_id
    label: DynaForge 후처리 예약 잡 ID
    type: string
    required: true
    why: "제출 절차(R2a)의 마지막 단계가 걸어 둔 postprocess 잡이다 — 그 실행 기록에 남아 있다"
    example: "job_0f3a9c21"
  - key: slurm_job_id
    label: Slurm 잡 ID
    type: string
    required: true
    why: "리포트의 잡 키가 `stcx:<이 값>` 이다. 제출 단계가 평문 `✅ 제출 완료 — job_id=N` 에서 뽑아 실행 기록에 남긴다"
    example: "12345"

steps:
  - backend: heax-kooremapper_mcp
    tool: get_job
    args: {job_id: "{{postprocess_job_id}}"}
    save: {job_status: "status", cluster_state: "external.cluster_state", ontology_state: "external.ontology.state"}
    assert:
      - path: external.kind
        equals: kooslurm_return
        why: "후처리 예약 잡이 아니다 — 다른 잡의 ID 를 넣었다(제출 잡 자체는 stcx_mcp 다)"
    note: 예약 잡이 끝났는지 — status 가 succeeded 가 아니면 error_summary 의 문구를 DynaForge 쪽에 넘긴다

  - backend: heax-kooremapper_mcp
    tool: find_reports
    args: {external_job_key: "stcx:{{slurm_job_id}}", limit: 20}
    # 결과는 목록이 아니라 봉투 `{items, total, reason, truncated}` 다(KR-08) — 후보는 items 에서 고른다(HP-52).
    select: {from: items, save: id, as: report_id, label: label, on_many: ask, on_none: fail}
    note: 그 Slurm 잡의 리포트 — 0건이면 아직 반입 전이거나 예약이 실패했다(앞 단계의 값을 본다). 게이트웨이가 이 조회를 300초 캐시한다

  - backend: heax-kooremapper_mcp
    tool: report_summary
    args: {report_id: "{{report_id}}"}
    save: {report_kind: "kind"}
    assert:
      - path: kind
        in: [sphere, impact]
        why: "낙하 · 충격 리포트가 아니다 — 그 잡 키로 다른 종류의 리포트가 들어왔다"
    note: 그 리포트의 종류(전각도 낙하는 sphere · 부분 충격은 impact) · 과제 메타 · 해석 조건 — 제출 때 채운 과제 메타가 실렸는지 여기서 본다

  - backend: heax-kooremapper_mcp
    tool: system_status
    args: {}
    note: 최근 리포트가 실어 온 후처리 판(postprocess_versions) — 판이 비거나 옛 판만 있으면 후처리 이미지가 안 올라간 것이다
