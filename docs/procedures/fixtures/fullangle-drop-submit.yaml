# R2a — 전각도 낙하 해석을 제출한다. 결과 회수·부품 보고서는 다른 절차다(드라이버 walltime 167시간).
#
# ⚠ 이 파일이 정본이 아니다. 가져다 쓰는 씨앗이다. `backend/tests/test_procedures_s3.py` 가 읽어 검증한다
#    (고정물: tests/fixtures/procedures/smarttwin_text_responses.json · smarttwin_schemas.json).
#
# 흐름 — 카탈로그 → **미리보기(dry_run)** → 사람 확인 → 실제 제출. 미리보기 출력 끝의 "업로드될 scenario.json"
# (프리셋 + 이 절차의 값을 깊은 병합한 최종본)을 게이트에서 대조하고 승인한다. dev 는 게이트에서 거절한다.
# 미리보기와 제출은 앵커로 같은 인자를 쓴다 — dry_run 만 다르다. 부분충격 씨앗(partial-impact-submit)과 같은 틀이다.
#
# 단위(context-notes W-91) — KMM 에는 단위계 키가 없고 받은 숫자를 **무변환**으로 쓴다. 기본은 tonne·mm·s·MPa 다.
# ⚠ 각도 프리셋 5종의 바닥 물성은 SI(7850·2e11)라 이 기본에서 **틀린 값**이다. 그래서 바닥 물성을 늘 명시한다
# (프리셋이 고쳐져도 운영 값을 확인하기 전까지는 명시하는 쪽이 안전하다). 단위계를 고르는 변수는 두지 않는다.
#
# 제출 결과는 **평문**이다(W-90). 평문 정규식(`re:`)으로 잡 ID 를 `slurm_job_id` 에 담고, 회수·예약 단계가 그 ID 와
# 이 잡 이름으로 리포트를 찾는다(W-92·W-93).

title: 전각도 낙하 — 제출 (tonne-mm-s-MPa 덱)

vars:
  - key: model_path
    label: 모델 경로(.k, 공유 FS 절대경로)
    type: string
    required: true
    why: "클러스터 헤드노드가 보는 경로다(/data/…). 클라이언트 로컬 경로는 거부된다. DynaForge 세션 산출물이면 save_result_to_path 로 먼저 내린다"
  - key: job_name
    label: 잡 이름(영문·숫자·._- 31자 이하)
    type: string
    required: true
    why: "결과 폴더 /data/single/<사용자>/<잡이름>_<잡ID>/ 와 리포트 project_name 이 된다. 한글·공백은 폴더명에서 _ 로 바뀌어 회수 절차가 이름으로 못 찾는다"
    example: "drop-demo-01"
  - key: angle_preset
    label: 각도 프리셋
    type: enum
    values: [26direction, 6face, fibonacci-100, fibonacci-1000, fibonacci-10000]
    required: true
    why: "낙하 방향 집합이다. 클러스터의 실제 목록은 카탈로그 단계가 보여 준다 — 거기 있는데 여기 없으면 values 에 더한다"
    example: 26direction
  - key: drop_height_mm
    label: 낙하 높이 (mm)
    type: number
    required: true
    why: "mm 로 넣는다. ⚠ 100 이하이면 KMM 이 m 로 보고 g=9.81 로 속도를 만든다(W-91)"
    example: 1500
  - key: drop_surface
    label: 바닥 종류
    type: enum
    values: [Plane, RigidWall, PlaneGraded, PlanewithRoughness]
    required: true
    why: "프리셋 기본은 Plane(변형 바닥)이다. RigidWall 이면 아래 바닥 물성은 쓰이지 않는다. 크기·격자는 프리셋 값을 쓴다"
    example: Plane
  - key: floor_density
    label: 바닥 밀도 (tonne/mm³)
    type: number
    required: true
    why: "강철 7.85e-9. 프리셋 기본 7850 은 SI 값이라 틀렸다 — 무변환으로 들어가 바닥이 10¹²배 무거워진다"
    example: 7.85e-9
  - key: floor_youngs_modulus
    label: 바닥 영률 (MPa)
    type: number
    required: true
    why: "강철 200000. 프리셋 기본 2e11(Pa)은 10⁶배 단단하다"
    example: 200000.0
  - key: floor_poisson_ratio
    label: 바닥 포아송비
    type: number
    required: true
    example: 0.3

steps:
  - backend: smart-twin-cluster
    tool: smarttwin_scenario_options
    args: {sim_type: fullangle_drop}
    raw: true                               # 텍스트 카탈로그 + 클러스터의 실제 프리셋 목록
    ok_text: "━━ 전각도 낙하"
    note: 옵션 카탈로그 — 단위계 표준·프리셋 목록·바닥 종류를 사람이 본다

  - backend: smart-twin-cluster
    tool: smarttwin_submit
    args: &submit_args
      sim_type: fullangle_drop
      model_path: "{{model_path}}"
      job_name: "{{job_name}}"
      angle_preset: "{{angle_preset}}"
      scenario_overrides:
        simulation_params:
          height: "{{drop_height_mm}}"
          density: "{{floor_density}}"
          youngs_modulus: "{{floor_youngs_modulus}}"
          poisson_ratio: "{{floor_poisson_ratio}}"
          drop_surface:
            type: "{{drop_surface}}"
      dry_run: true
    raw: true
    ok_text: "\\[DRY-RUN\\]"                # 미리보기가 아니면(= 실제로 나갔으면) 실패다
    note: 미리보기 — /api/jobs/preview 만 부른다. 출력 끝의 scenario.json 을 다음 게이트에서 대조한다

  - backend: smart-twin-cluster
    tool: smarttwin_submit
    gate: human
    args:
      <<: *submit_args
      dry_run: false
    raw: true
    ok_text: "✅ 제출 완료"                  # 머리 없는 실패(제출 응답 파싱 실패)도 여기서 걸린다
    save: {slurm_job_id: "re:job_id=(\\d+)"} # 평문에서 잡 ID — 회수·예약 단계가 잡 키로 쓴다(W-93)
    note: 실제 제출 — 앞 단계 scenario.json 의 바닥 물성(tonne-mm)·높이·프리셋을 확인하고 승인한다
