our_part: >-
  절차를 **읽는 쪽으로** 쓰고, 얻는 쪽은 `report_id` 변수 하나로 좁혀 둔다. 그러면
  후처리가 옮겨 왔을 때 **앞에 단계 하나를 더하는 것**으로 끝난다. 지금 사슬(REST 명령·
  파일 경로·postprocess 인자)을 절차에 박으면 옮겨진 뒤 그 절차가 전부 거짓말이 된다.

when_it_lands:
  - "DynaForge 연산으로 오면 — `run_operation(operation='postprocess')` + `describe_operation`
     이 계약을 준다. 등록부(dispatchers.yaml)에 DynaForge 가 이미 있어 **한 줄도 안 고친다**"
  - "직접 도구로 오면 — 인자 스키마가 필요하다. 지금 `job_postprocess` 는 `args` 자유
     object 하나이고 `mode`(all|deep|sphere)가 산문에만 있다. 그대로 오면 오타를 저장
     시점에 못 잡는다(`stc-template-schema` 와 같은 모양)"
  - "오래 걸리면 — 전각도 낙하는 Run 이 수십~수백이라 120초를 넘길 수 있다.
     `expect: job` 은 저장 거절이라 제출·회수가 **자동으로** 갈린다(§5-10)"
