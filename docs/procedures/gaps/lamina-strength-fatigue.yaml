note: >-
  ⚠ 'MaterialTwin 에 강도가 없다' 가 아니다 — 등방 강도 · 금속 피로 키는 많다. 없는 것은 적층 해석이 먹는 꼴(라미나 축으로 갈린 다섯 강도와
  정적 강도로 정규화한 S-N)이다. §9-4 에서 숨은 역량(DynaForge run_operation 뒤의 matdb · matswap)을 결손으로 오판한 적이 있어 요청서에
  '이미 되는 길이 있으면 알려 달라' 를 함께 적었다. 그때까지 R1 은 `laminate` 변수로 사람이 넣는다.
