# 시장불량 원인 분석 — cae00 예시 연쇄(사용자 요청 10-29 · 결정 Q7 '둘 다'). 포털 절차 › 루틴 › YAML 가져오기로 들인다.
# 백엔드 키는 cae00 의 게이트웨이 키다 — 다른 박스에서는 준비도가 '이 박스에 없음' 으로 말하고 그 단계를 건너뛴다.
version: 1
title: 시장불량 원인 분석
purpose: "{{model}} 의 {{symptom}} 시장불량 — 무엇이 · 왜 · 어떻게 시험하고 막나"
vars:
  - {key: model, label: 모델, type: string}
  - {key: symptom, label: 증상, type: string}
steps:
  - id: anchor
    title: 기준 키
    backends: [rootdesigndatahub]
    goal: "{{model}} 을 코어 허브의 plm_model(없으면 plm_project)로 푼다. 후보가 여럿이면 후보를 그대로 낸다(ambiguous)."
    tools: [object_resolve, search]               # 원래 이름(노출 이름은 허브 사본끼리 겹쳐 접두가 붙는다)
    expect: {keys: [model_key]}
    blocked: {empty: stop, denied: stop, unavailable: stop}
  - id: ft
    title: 불량 기록(FailureTrace)
    backends: [failuretrace]
    goal: "{{steps.anchor.model_key}} 의 {{symptom}} 불량 기록을 코어 고장 모드별 · 시기별로 센다. 기록의 원천(시장 · 생산)을 나눠 적는다."
    uses: [anchor]
    expect: {keys: [failure_mode]}
  - id: plm
    title: PLM 문제점
    backends: [plm-defect]
    goal: "{{steps.anchor.model_key}} 의 {{symptom}} 관련 PLM 문제점 · 원인 · 대책을 찾는다(enrich=0 — PLM 은 보류 중이라 쿼터를 아낀다)."
    uses: [anchor]
  - id: voc
    title: 관련 VOC(SignalForge)
    backends: [signalforge]
    goal: "{{model}} 의 제품 코드를 풀고(같은 코드에 묶인 다른 제품이 있으면 적는다) {{symptom}} VOC 를 부품 × 증상 × 심각도로 본다."
    uses: [anchor]
  - id: delib
    title: 메커니즘(전문가 심의)
    kind: deliberation
    goal: "{{symptom}} 불량의 메커니즘 — 상태 변수 · 지배 방정식 후보 · 모르는 값 · 반증할 관찰"
    uses: [ft, plm, voc]
    deliberation: {job: mechanism}
  - id: fmea
    title: 시험 항목(FMEA)
    backends: [fmea, rootdesigndatahub]
    goal: "{{steps.ft.failure_mode}} 을 검출 · 예측하는 시험 항목 · 기준 · 가상 검증을 찾는다(코어 graph_neighbors 의 detects · predicts · guards_against 와 FMEA 명세)."
    uses: [ft, delib]
  - id: ecad
    title: 불량 net(ECAD)
    backends: [odb-hub]
    goal: "{{steps.anchor.model_key}} 의 ODB job 을 찾고, 앞 단계가 가리킨 의심 부품(refdes)의 핀별 net 을 본다. 의심 부품이 없으면 그렇다고 적는다."
    uses: [anchor, delib]
  - id: sim
    title: 해석 결과
    backends: [heax-kooremapper_mcp, reportarchive]
    goal: "{{steps.anchor.model_key}} 과제의 기존 해석 보고서 · 최악 사례 · 부품 위험을 찾는다(작업은 제출하지 않는다 — 있는 결과만)."
    uses: [anchor, delib]
  - id: refs
    title: 기존 보고서 인용
    kind: cite
    backends: [reportarchive, mx-white-paper]
    goal: "{{symptom}} · {{steps.ft.failure_mode}} 를 다룬 기존 사람 보고서를 찾아 무엇을 말했는지 인용한다."
    uses: [ft]
report:
  title: "{{model}} {{symptom}} 시장불량 분석"
  sections: [anchor, ft, plm, voc, delib, fmea, ecad, sim, refs, insight]
  ra: {upload: auto}
limits: {minutes: 120, calls: 120}
visibility: private
