# 배선 요청·설정 목록 — 포털 메인에 뜬다. **안 되어 있으면 하라고 말하는 자리다.**
#
# 규칙
#   · `check` 가 있으면 포털이 스스로 확인하고, 통과하면 화면에서 **사라진다.**
#     확인할 방법이 없는 것(다른 박스의 파일, 사람이 해야 하는 요청)은 `check` 를 비우고
#     `manual: true` 로 둔다 — 그런 항목은 "확인한 사람이 체크" 하는 식으로 남는다.
#   · `body` 는 그대로 화면에 뜬다. **무엇을 어디서 어떻게** 하는지 적는다.
#   · 비밀·내부 IP 를 여기 적지 않는다. 이 리포는 GitHub 에 있다 — 자리 이름만 적는다.
#   · 이 파일은 요청마다 mtime 을 본다. 고쳐도 재기동이 필요 없다.
#
# check 에 쓸 수 있는 것(포털이 아는 것만):
#   ste_sso_secret   — 포털에 ste 자격 중계 시크릿이 설정돼 있나
#   ste_backend      — ste 백엔드(/ste/api/health)가 응답하나
#   gateway          — 게이트웨이가 응답하나
#   gateway_ste      — 게이트웨이 도구 목록에 ste 백엔드가 올라와 있나
#   access_ste       — access.yaml 의 smarttwin 허가에 ste 가 들어 있나

requests:
  - id: ste-sso-secret
    title: ste 자격 중계 시크릿을 양쪽에 같은 값으로
    tag: 연결
    severity: blocker
    check: ste_sso_secret
    default: generate
    body: |
      **대개 저절로 됩니다.** 이 값은 바깥이 정해 주는 비밀이 아니라 포털과 ste 사이에서만
      쓰는 난수라, 없으면 만들어도 됩니다.

      · 포털 `infra/scripts/start.sh` 가 비어 있으면 만들어 `infra/.env` 에 저장합니다.
      · cae00 에서 `SmartTwinExplorer/deploy/refresh-code.sh` 가 그 값을 ste 헤드노드
        `.env` 로 옮깁니다(없을 때만 — 있으면 건드리지 않습니다).

      이 항목이 아직 보인다면 포털을 한 번도 안 띄웠거나 `.env` 를 못 쓴 것입니다.

      ⚠ **양쪽이 같아야** 합니다. 다르면 "로그인은 되는데 ste 만 401" 이 되고 원인이 화면
      어디에도 안 보입니다. refresh-code 가 다름을 발견하면 덮지 않고 **말합니다** —
      어느 쪽을 정본으로 할지 정한 뒤 `FORCE_SSO_SECRET=1` 로 맞추세요.

  - id: ste-backend-route
    title: 포털이 ste 백엔드에 닿게 라우트를 채운다
    tag: 연결
    severity: blocker
    check: ste_backend
    default: none
    body: |
      **기본값을 둘 수 없습니다.** 주소가 박스마다 다르고, 틀린 주소를 찍으면 죽은 `/ste/`
      라우트가 생겨 사용자에게는 "열리는데 안 되는" 상태가 됩니다(gen-nginx-conf 가 같은
      이유로 경고합니다). 빈 값이면 라우트를 아예 안 만드는 쪽이 안전합니다.

      `backend/config/routes.local.env` 의 `ste=` 를 이 박스에서 **도달하는** ste 헤드노드
      주소로 채웁니다(직결 경로가 없으면 SSH 터널 경유). 그다음
      `infra/scripts/gen-nginx-conf.sh` → nginx reload.

      이 파일은 박스마다 다르고 git 에 올라가지 않습니다 — 주소를 추적 파일에 적지 마세요.

  - id: gateway-ste-backend
    title: 게이트웨이에 ste MCP 를 붙이고 재기동
    tag: 연결
    severity: important
    check: gateway_ste
    default: auto
    body: |
      **주소는 기본값이 있습니다** — `provision-config.sh` 가 `ste` 백엔드를
      `http://127.0.0.1:15812/mcp` 로 넣습니다(`STE_MCP_URL` 로 덮을 수 있습니다).
      남는 것은 **재기동**뿐입니다.

      ste MCP(:15812)는 REST 의 얇은 래퍼이고 도구 8종이 **전부 PAT 소유자 기준**입니다
      ("개인 PAT 를 쓰면 자기 잡만 보입니다"). 그래서 신원이 따라가야 의미가 있습니다.

      1. `provision-config.sh` 가 `ste` 백엔드와 사용자 위임(`STE_SSO_SECRET`)을 넣습니다.
      2. **게이트웨이를 재기동합니다** — `POST /refresh` 는 설정 파일에 직접 적은
         정적 백엔드를 다시 읽지 않습니다.
      3. 판정은 소스가 아니라 게이트웨이 `tools/list` 실호출로 합니다.

  - id: access-policy-ste
    title: ste 를 smarttwin 허가에 넣는다
    tag: 연결
    severity: blocker
    check: access_ste
    default: auto
    body: |
      **이미 기본으로 들어 있습니다**(`access.yaml` 에 커밋돼 있습니다). 이 항목이 보인다면
      그 파일이 옛 판이거나 다른 정책 파일을 보고 있는 것입니다.

      `backend/config/access.yaml` 의 `smarttwin` 항목 `gateway:` 에 `ste` 를 넣습니다.
      **백엔드를 붙이기 전에** 적어야 합니다 — 정책에 없는 백엔드는 "전체 공개" 로
      판정되므로, 순서가 반대면 잠깐이지만 아무나 부를 수 있습니다.

  - id: dynaforge-gateway-pat
    title: DynaForge 에 게이트웨이 PAT 를 넣는다
    tag: 배포
    severity: blocker
    manual: true
    default: none
    body: |
      **이것만은 기본값을 둘 수 없습니다.** 자격증명이라 누구의 것인지가 뜻을 가집니다 —
      임의로 만들어 넣으면 그 잡이 누구 것인지 알 수 없어집니다.

      1. 포털 `/tokens` 에서 PAT 를 발급합니다(audiences 에 mcp-gateway 포함).
      2. DynaForge 박스의 `platform/.env` 에 `KOORM_GATEWAY_PAT=` 로 넣습니다.
      3. `KOORM_GATEWAY_MCP` 는 기본값이 있으니 생략해도 됩니다.
      4. `./infra/scripts/start.sh` — 컨테이너에 그 값이 넘어갑니다.

  - id: dynaforge-restart
    title: DynaForge 를 재기동한다 (마이그레이션은 자동)
    tag: 배포
    severity: important
    manual: true
    default: auto
    body: |
      **마이그레이션은 따로 할 일이 없습니다** — `infra/scripts/start.sh` 가
      `migrate.sh`(alembic upgrade head)를 먼저 부릅니다. 외부 잡 칸(0007)도 그때 들어갑니다.

      남는 것은 **재기동**입니다. 작업 카탈로그가 기동 때 한 번 읽히므로(lru_cache),
      재기동 전에는 새 작업("stcx 로 전각도 낙하")이 목록에 **안 뜹니다**.
      "고쳤는데 안 바뀐다" 가 나는 자리입니다.

  - id: stcx-chain-env
    title: (stcx 운영자 요청) 드라이버 잡 자원을 시나리오로 바꿀 수 있게
    tag: 요청
    severity: request
    manual: true
    default: none
    body: |
      전각도 낙하의 **드라이버 잡 자원**은 지금 템플릿 env 에 고정돼 있어 scenario.json
      으로 바꿀 수 없습니다 — `CHAIN_NODES`(2) · `CHAIN_JOBS_PER_NODE`(2) ·
      `CHAIN_NCPU`(4) · `CHAIN_POSTPROCESS`(true).

      그래서 화면에서 자식 잡 packing 을 조절할 방법이 없습니다. 큰 캠페인에서 이 값이
      고정이면 노드를 다 못 쓰거나 큐 회전이 나빠집니다.

      **요청** — 이 넷을 scenario.json 의 `environment` 아래로 받아 주시거나(템플릿 env 가
      비면 scenario 값을 쓰는 식), 템플릿을 자원별로 몇 벌 나눠 주시면 그쪽을 고르겠습니다.
      받아 주시면 포털 쪽은 칸만 더하면 됩니다(매핑·시험 자리는 이미 있습니다).
