# 배선 요청·설정 목록 — 관리자의 '사용자 관리' 맨 위에 뜨고, 헤더 '관리' 옆에 남은 건수가 붙는다.
# **안 되어 있으면 하라고 말하는 자리다.**
#
# 규칙
#   · `check` 가 있으면 포털이 스스로 확인하고, 통과하면 화면에서 **사라진다.**
#     확인할 방법이 없는 것(다른 박스의 파일, 사람이 해야 하는 요청)은 `check` 를 비우고
#     `manual: true` 로 둔다 — 그런 항목은 해 둔 관리자가 화면에서 **확인함**을 눌러야 빠진다
#     (누가·언제는 users.sqlite setup_acks 에 남고, '확인한 항목' 에서 되돌릴 수 있다).
#   · `body` 는 그대로 화면에 뜬다. **무엇을 어디서 어떻게** 하는지 적는다.
#   · 비밀·내부 IP 를 여기 적지 않는다. 이 리포는 GitHub 에 있다 — 자리 이름만 적는다.
#   · 이 파일은 요청마다 mtime 을 본다. 고쳐도 재기동이 필요 없다.
#
# check 에 쓸 수 있는 것(포털이 아는 것만):
#   ste_sso_secret   — 포털에 ste 자격 중계 시크릿이 설정돼 있나
#   ste_backend      — ste 백엔드(/ste/api/health)가 응답하나
#   gateway          — 게이트웨이가 응답하나
#   gateway_ste      — 게이트웨이 도구 목록에 ste 백엔드가 올라와 있나
#   access_ste       — access.yaml 의 smarttwin 허가에 ste 가 들어 있나
#   ra_sso           — 포털에 RA 사람별 위임 비밀(RA_SSO_SECRET)이 있나
#   access_overlay   — 권한 표 박스 오버레이(access.local.yaml)를 탈 없이 읽었나(없는 박스는 통과). 사유는 화면에 함께 뜬다
#   sso_default_affiliation — SSO 기본 소속(SSO_DEFAULT_AFFILIATION)이 표에 있는 값이고 전권 소속이 아닌가(꺼져 있으면 통과)
#   tiles_in_access_table — 포털 타일이 전부 권한 표의 어느 플랫폼에든 속하나(박스 파일로 붙인 타일 포함). 빠진 타일 id 가 화면에 함께 뜬다

requests:
  - id: ste-sso-secret
    title: ste 자격 중계 시크릿을 양쪽에 같은 값으로
    tag: 연결
    severity: blocker
    check: ste_sso_secret
    default: generate
    body: |
      **대개 저절로 됩니다.** 이 값은 바깥이 정해 주는 비밀이 아니라 포털과 ste 사이에서만
      쓰는 난수라, 없으면 만들어도 됩니다.

      · 포털 `infra/scripts/start.sh` 가 비어 있으면 만들어 `infra/.env` 에 저장합니다.
      · cae00 에서 `SmartTwinExplorer/deploy/refresh-code.sh` 가 그 값을 ste 헤드노드
        `.env` 로 옮깁니다(없을 때만 — 있으면 건드리지 않습니다).

      이 항목이 아직 보인다면 포털을 한 번도 안 띄웠거나 `.env` 를 못 쓴 것입니다.

      ⚠ **양쪽이 같아야** 합니다. 다르면 "로그인은 되는데 ste 만 401" 이 되고 원인이 화면
      어디에도 안 보입니다. refresh-code 가 다름을 발견하면 덮지 않고 **말합니다** —
      어느 쪽을 정본으로 할지 정한 뒤 `FORCE_SSO_SECRET=1` 로 맞추세요.

  - id: ste-backend-route
    title: 포털이 ste 백엔드에 닿게 라우트를 채운다
    tag: 연결
    severity: blocker
    check: ste_backend
    default: none
    body: |
      **기본값을 둘 수 없습니다.** 주소가 박스마다 다르고, 틀린 주소를 찍으면 죽은 `/ste/`
      라우트가 생겨 사용자에게는 "열리는데 안 되는" 상태가 됩니다(gen-nginx-conf 가 같은
      이유로 경고합니다). 빈 값이면 라우트를 아예 안 만드는 쪽이 안전합니다.

      `backend/config/routes.local.env` 의 `ste=` 를 이 박스에서 **도달하는** ste 헤드노드
      주소로 채웁니다(직결 경로가 없으면 SSH 터널 경유). 그다음
      `infra/scripts/gen-nginx-conf.sh` → nginx reload.

      이 파일은 박스마다 다르고 git 에 올라가지 않습니다 — 주소를 추적 파일에 적지 마세요.

  - id: gateway-ste-backend
    title: 게이트웨이에 ste MCP 를 붙이고 재기동
    tag: 연결
    severity: important
    check: gateway_ste
    default: auto
    body: |
      **주소는 기본값이 있습니다** — `provision-config.sh` 가 `ste` 백엔드를
      `http://127.0.0.1:15812/mcp` 로 넣습니다(`STE_MCP_URL` 로 덮을 수 있습니다).
      남는 것은 **재기동**뿐입니다.

      ste MCP(:15812)는 REST 의 얇은 래퍼이고 도구 8종이 **전부 PAT 소유자 기준**입니다
      ("개인 PAT 를 쓰면 자기 잡만 보입니다"). 그래서 신원이 따라가야 의미가 있습니다.

      1. `provision-config.sh` 가 `ste` 백엔드와 사용자 위임(`STE_SSO_SECRET`)을 넣습니다.
      2. **게이트웨이를 재기동합니다** — `POST /refresh` 는 설정 파일에 직접 적은
         정적 백엔드를 다시 읽지 않습니다.
      3. 판정은 소스가 아니라 게이트웨이 `tools/list` 실호출로 합니다.

  - id: access-policy-ste
    title: ste 를 smarttwin 허가에 넣는다
    tag: 연결
    severity: blocker
    check: access_ste
    default: auto
    body: |
      **이미 기본으로 들어 있습니다**(`access.yaml` 에 커밋돼 있습니다). 이 항목이 보인다면
      그 파일이 옛 판이거나 다른 정책 파일을 보고 있는 것입니다.

      `backend/config/access.yaml` 의 `smarttwin` 항목 `gateway:` 에 `ste` 를 넣습니다.
      **백엔드를 붙이기 전에** 적어야 합니다 — 정책에 없는 백엔드는 "전체 공개" 로
      판정되므로, 순서가 반대면 잠깐이지만 아무나 부를 수 있습니다.

  - id: access-local-overlay
    title: 권한 표의 박스 파일(access.local.yaml)에 읽지 못한 것이 있다
    tag: 권한
    severity: blocker
    check: access_overlay
    default: none
    body: |
      **위에 적힌 사유를 고치면 이 항목은 저절로 사라집니다**(재기동 불필요 — 요청마다 파일 시각을 봅니다).

      `backend/config/access.local.yaml` 은 이 박스에만 있는 것을 권한 표에 더하는 파일입니다(git 에 올라가지 않습니다).
      · `platforms:` — 추적 파일 `access.yaml` 의 플랫폼에 id 기준으로 더하거나 바꿉니다(박스 전용 게이트웨이 백엔드).
        ⚠ 같은 id 는 그 항목을 **통째로 바꿉니다**(합치지 않습니다). `access.yaml` 에 있는 플랫폼에 백엔드를 더하려면 그 플랫폼의
        `systems`·`gateway` 를 전부 다시 적으세요 — 빠뜨린 타일·백엔드는 표에서 사라져 허가와 무관하게 열립니다(위 사유에 뜹니다).
      · `sso_affiliation_map:` — SSO Claim → 소속 표. 모양은 `access.yaml` 끝의 예시를 보세요.
      소속·기본 허가·기능은 `access.yaml` 에서만 읽습니다.

      ⚠ **파일이 깨져 있는 동안은 직전에 읽은 정책이 그대로 쓰입니다** — 방금 고친 내용은 반영되지 않았습니다.
      이 상태로 포털이 재기동되면 정책을 읽지 못해 모든 요청이 실패하므로, 재기동 전에 고치세요.
      버려진 `sso_affiliation_map` 행은 없는 행과 같습니다 — 몇 번째 행이 왜 버려졌는지는 위 사유에 있습니다.

  - id: tiles-outside-access-table
    title: 권한 표의 어느 플랫폼에도 없는 타일이 있다 — 모두에게 보인다
    tag: 권한
    severity: blocker
    check: tiles_in_access_table
    default: none
    body: |
      **위에 적힌 타일은 권한과 무관하게 로그인한 모두에게 보입니다.** 포털 타일은 그 타일을 여는 플랫폼 허가가 있는 사람에게만
      보이는데, 어느 플랫폼에도 속하지 않은 타일은 막을 표가 없어 그대로 보입니다. 고치면 이 항목은 저절로 사라집니다.

      · 이 박스의 `backend/config/systems.local.yaml` 로 만든 타일이면 — `backend/config/access.local.yaml` 의 `platforms:` 에
        그 타일을 여는 플랫폼을 같이 적습니다(`- {id: <플랫폼 id>, label: <이름>, systems: [<타일 id>]}`). 재기동은 필요 없습니다.
      · 추적 파일 `systems.yaml` 의 타일이면 — `access.yaml` 의 맞는 플랫폼 `systems:` 에 그 타일 id 를 넣습니다.
        `access.yaml` 에 이미 있는데도 여기 보이면 — `access.local.yaml` 이 그 플랫폼을 같은 id 로 바꿔 쓰며 `systems:` 를
        빠뜨린 것입니다(같은 id 는 통째로 바뀝니다). 박스 파일의 그 항목에 다시 적습니다.
      · 방금 리포를 갱신한 박스라면 — 권한 표는 바로 새로 읽히고 타일 목록은 포털 재기동 때 읽힙니다. 이름이 바뀐 옛 타일이
        그 사이에 여기 보일 수 있습니다. 포털을 다시 띄우면 사라집니다.

      모두에게 보여도 되는 타일이라도 플랫폼 하나에 넣어 두는 편이 낫습니다 — 그래야 나중에 닫을 수 있습니다.

  - id: sso-default-affiliation
    title: SSO 기본 소속(SSO_DEFAULT_AFFILIATION)을 다시 본다
    tag: 권한
    severity: blocker
    check: sso_default_affiliation
    default: none
    body: |
      `SSO_DEFAULT_AFFILIATION` 은 SSO 로 **처음** 들어온 사람에게 넣는 소속입니다(이미 있는 사람은 바뀌지 않습니다).
      위에 적힌 사유가 둘 중 어느 쪽인지 보세요.

      · **표에 없는 값** — 적용되지 않습니다. 새로 들어온 사람은 소속 없이(일반 챗만) 생깁니다. `infra/.env` 의 값을
        `backend/config/access.yaml` 의 `affiliations` id 로 고치고 포털을 다시 띄웁니다.
      · **전권 소속** — 막지 않았습니다. 다만 지금은 사내 SSO 를 통과한 누구나 처음 로그인하는 순간 모든 기능·플랫폼을 받습니다.
        일부에게만 줄 것이면 값을 비우고, `backend/config/access.local.yaml` 의 `sso_affiliation_map` 으로 Claim(회사·부서
        코드)이 맞는 사람에게만 주세요. 의도한 설정이라면 이 항목은 값이 그대로인 동안 계속 남습니다.

      누구에게 자동으로 넣었는지는 '접속 이력' 의 로그인 줄(소속 자동 지정)과 서버 로그에 남습니다.

  - id: ra-sso-secret
    title: RA 사람별 위임 — RA 쪽이 준비되면 같은 비밀을 양쪽에
    tag: 연결
    severity: request
    check: ra_sso
    default: none
    body: |
      **포털이 만들지 않습니다.** RA 는 남의 서버라 포털이 값을 심을 수 없고, 포털에 비밀이
      먼저 생기면 게이트웨이가 RA 를 사람별 위임으로만 불러 RA 쪽이 준비되기 전의 RA 호출이
      전부 거부됩니다.

      1. RA 담당이 `docs/sso-delegation/ra-request.md` 대로 RA 를 고칩니다(옛 `/api/auth/sso`
         되살리기 + 부서 헤더가 없으면 홈 부서) — RA 서버 `.env` 에 `HEAX_SSO_SECRET`.
      2. **같은 값**을 이 박스 `infra/.env` 의 `RA_SSO_SECRET=` 에 넣습니다(비밀은 메신저 평문 말고 안전한 경로로).
      3. `./infra/scripts/update-all.sh` — 포털 재기동(비밀 전달)·게이트웨이 재프로비저닝(`per_user_sso.reportarchive`).

      그 전까지는 종전 '토큰 등록'(개인 토큰 › 외부 연결) 방식이 그대로 돕니다. 확인 방법은
      `docs/sso-delegation/server-setup.md` A 절입니다.

  - id: dynaforge-gateway-pat
    title: DynaForge 에 게이트웨이 PAT 를 넣는다
    tag: 배포
    severity: blocker
    manual: true
    default: none
    body: |
      **이것만은 기본값을 둘 수 없습니다.** 자격증명이라 누구의 것인지가 뜻을 가집니다 —
      임의로 만들어 넣으면 그 잡이 누구 것인지 알 수 없어집니다.

      1. 포털 `/tokens` 에서 PAT 를 발급합니다(audiences 에 mcp-gateway 포함).
      2. DynaForge 박스의 `platform/.env` 에 `KOORM_GATEWAY_PAT=` 로 넣습니다.
      3. `KOORM_GATEWAY_MCP` 는 기본값이 있으니 생략해도 됩니다.
      4. `./infra/scripts/start.sh` — 컨테이너에 그 값이 넘어갑니다.

  - id: dynaforge-restart
    title: DynaForge 를 재기동한다 (마이그레이션은 자동)
    tag: 배포
    severity: important
    manual: true
    default: auto
    body: |
      **마이그레이션은 따로 할 일이 없습니다** — `infra/scripts/start.sh` 가
      `migrate.sh`(alembic upgrade head)를 먼저 부릅니다. 외부 잡 칸(0007)도 그때 들어갑니다.

      남는 것은 **재기동**입니다. 작업 카탈로그가 기동 때 한 번 읽히므로(lru_cache),
      재기동 전에는 새 작업("stcx 로 전각도 낙하")이 목록에 **안 뜹니다**.
      "고쳤는데 안 바뀐다" 가 나는 자리입니다.

  - id: stcx-chain-env
    title: (stcx 운영자 요청) 드라이버 잡 자원을 시나리오로 바꿀 수 있게
    tag: 요청
    severity: request
    manual: true
    default: none
    body: |
      전각도 낙하의 **드라이버 잡 자원**은 지금 템플릿 env 에 고정돼 있어 scenario.json
      으로 바꿀 수 없습니다 — `CHAIN_NODES`(2) · `CHAIN_JOBS_PER_NODE`(2) ·
      `CHAIN_NCPU`(4) · `CHAIN_POSTPROCESS`(true).

      그래서 화면에서 자식 잡 packing 을 조절할 방법이 없습니다. 큰 캠페인에서 이 값이
      고정이면 노드를 다 못 쓰거나 큐 회전이 나빠집니다.

      **요청** — 이 넷을 scenario.json 의 `environment` 아래로 받아 주시거나(템플릿 env 가
      비면 scenario 값을 쓰는 식), 템플릿을 자원별로 몇 벌 나눠 주시면 그쪽을 고르겠습니다.
      받아 주시면 포털 쪽은 칸만 더하면 됩니다(매핑·시험 자리는 이미 있습니다).
