# 소속·허가 정책 정본 — 기능·플랫폼 표와 소속별 기본 허가. 사용자별 소속·개별 허가는 users 원장에 있다.
#
# 권한 키는 두 종류다 — 기능 feat:<id> · 플랫폼 plat:<id>. 포털이 요청마다 계산해 합성 그룹으로
# principal.groups 에 얹고, 에이전트서버·게이트웨이는 그 그룹을 그대로 받는다(docs/access-control).
#
#   · 유효 권한 = default_grants ∪ 소속 grants ∪ 사용자 개별 grants (+ 함의 implies). portal-admin 은 전부.
#   · "*" 는 표에 있는 모든 기능·플랫폼이다.
#   · platforms[].systems 는 포털 타일 id(systems.yaml), gateway 는 게이트웨이 백엔드 키다 — 타일은
#     그 플랫폼 허가가 있어야 보이고, 게이트웨이 백엔드는 그 플랫폼 허가가 있어야 도구가 붙는다.
#   · 모든 포털 타일·게이트웨이 백엔드·HE팀 페르소나 앱은 어느 플랫폼에든 속해야 한다 — 표에 없으면 아무도 못 쓰거나
#     아무나 쓴다. 대조는 둘이다: backend/tests/test_access_control.py(알려진 백엔드 목록 + 닿으면 실제 게이트웨이)와
#     update-all §6(그 박스의 실제 게이트웨이 백엔드 — cae00 에만 있는 백엔드는 시험이 못 본다, 5차 요청 §2).
#   · 이 파일은 요청마다 mtime 을 본다. 고쳐도 재기동이 필요 없다.

default_grants: [feat:chat]

affiliations:
  - id: CAEG
    label: CAE그룹
    grants: ["*"]          # 지금 만드는 것은 모두 CAEG 것 — 다 같이 쓴다(사용자 결정 2026-09-11)

features:
  - id: chat
    label: 일반 챗
    desc: LLM 과 대화한다. 플랫폼 도구는 그 플랫폼 허가가 있을 때만 붙는다.
  - id: expert-chat
    label: 전문가와 대화
    desc: 조직도에서 전문가(HE팀 운영자 포함)를 골라 그 역할로 대화한다. /전문가 검색 포함.
    implies: [plat:aidatahub]          # 역할·지식카드가 AI 데이터 허브에 있다(D-3)
  - id: deliberation
    label: 전문가 심의
    desc: /심의·/시뮬심의·/시험계획, 심의 화면, 챗에서 심의로 넘기기·이어하기, MCP 심의 도구.
    implies: [plat:aidatahub]
    gateway: [hwax-deliberation]       # Claude·PAT 로 deliberate_* 를 직접 부르는 길도 막는다
  - id: thinking
    label: Thinking
    desc: 질문에 답할 수 있는 전문가만 각자 답한다.
    implies: [plat:aidatahub]
  - id: upload
    label: 파일 올리기
    desc: 챗에서 파일을 올려 물성 DB·StepForge 로 보낸다(보낼 곳의 플랫폼 허가도 있어야 한다).
  - id: api-token
    label: API 토큰 · MCP 개인 연결
    desc: Claude·스크립트에서 게이트웨이 도구를 쓰는 개인 토큰을 발급한다.
  - id: procedures
    label: 절차 · 업무 절차
    desc: 도구를 한 단계씩 돌린 기록을 절차로 굳혀 대상만 바꿔 재생한다. 도구 인가는 각자 권한 그대로다.

platforms:
  - id: heaxhub
    label: HEAXHub 앱 허브
    systems: [heax-hub]
  - id: aidatahub
    label: AI 데이터 허브
    systems: [ai-data-hub]
    gateway: [ai-data-hub]
  - id: mxwhitepaper
    label: MX 백서
    systems: [mx-white-paper]
    gateway: [mx-white-paper]
  - id: signalforge
    label: SignalForge VOC
    systems: [signalforge]
    gateway: [signalforge]
  - id: reportarchive
    label: Report Archive
    systems: [report-archive]
    gateway: [reportarchive]
  - id: testscope
    label: TestScope
    systems: [testscope]
    # 다른 조직의 포털 — 호출은 사람이 '외부 연결' 에 등록한 그쪽 토큰으로만 간다(RA 와 같은 토큰 등록, docs/sso-delegation).
    # ⚠ 게이트웨이에 testscope 백엔드를 붙이기 **전에** 여기 적는다(표에 없는 백엔드는 '전체 공개') — update-all 은
    #   게이트웨이 provision.env 에 TESTSCOPE_MCP_URL 이 있는 박스에서 그 백엔드를 기대한다.
    gateway: [testscope]
    hide_unless_routed: true   # 타일 주소(systems.local.yaml)가 없는 박스에서는 권한 표·요청에서 뺀다(권한 계산은 그대로)
  - id: smarttwin
    label: SmartTwin 시뮬레이션
    systems: [smart-twin-cluster, ste]
    # ⚠ 백엔드를 게이트웨이에 붙이기 **전에** 여기 적는다. 정책에 없는 백엔드는
    #   "전체 공개" 로 판정되므로, 순서가 반대면 잠깐이지만 아무나 부를 수 있다.
    gateway: [smart-twin-mcp, smart-twin-cluster, ste]
  - id: spdm
    label: SPDM
    systems: [spdm]
  - id: risk
    label: HWAX Risk Review
    systems: [hwax-risk]
    gateway: [heax-hwax_risk]
  - id: arp
    label: AI Ready Portal
    systems: [aireadyportal]       # 타일 id 개명(2026-10-07). 플랫폼 id 는 arp 로 둔다 —
                                   # plat:arp 가 게이트웨이 allowed_groups 의 값이라 바꾸면 전원 차단이다
    gateway: [arp]
  - id: odbhub
    label: ECAD Automation Hub
    systems: [odb-hub]
    gateway: [odb-hub]
  - id: knoxbridge
    label: Knox 연계
    systems: [knox-bridge]
    gateway: [knox-bridge]     # cae00 실측 백엔드 키(5차 요청 §2-c) — allowed_groups 는 provision 이 다시 써 정본이 아니다
    hide_unless_routed: true   # knox-bridge 가 안 열리는 박스에서는 권한 표·요청에서 뺀다(권한 계산은 그대로)
  - id: stepforge
    label: StepForge
    # step-forge 는 게이트웨이 REST 다리의 사이트 키다(heax-step_forge 는 그 앱의 MCP 백엔드).
    # ⚠ 표에 없는 키는 게이트웨이가 "전체 공개" 로 판정한다 — 사이트를 붙이기 **전에** 적는다.
    gateway: [heax-step_forge, step-forge]
  - id: dynaforge
    label: DynaForge
    gateway: [heax-kooremapper_mcp, dyna-forge]
  - id: laminate
    label: Laminate Analyzer
    gateway: [heax-laminate_analyzer_mcp]
  - id: thermalshock
    label: Thermal Shock SED
    gateway: [heax-thermal_shock_mcp]
  - id: materialtwin
    label: MaterialTwin
    gateway: [heax-materialtwin_web]
  - id: webdesign
    label: Web Design Agents
    gateway: [heax-web_design_agents]
  - id: webresearch
    label: 웹 리서치(사외 검색)
    gateway: [heax-web_research_mcp]
  - id: paperingest
    label: Paper Ingest
    gateway: [heax-paper_ingest]
  # 아래 둘은 cae00 게이트웨이에만 있는 백엔드다(5차 요청 §2 — 실측 키). 표에 없을 때 simflow 는 allowed_groups 가 비어
  # 도구 21개가 **전원 공개**였고, plm-defect 는 allowed_groups 가 plat:plmdefect 를 요구하는데 그 키가 표에 없어 **전원 차단**이었다.
  - id: simflow
    label: SimFlow
    gateway: [simflow]
  - id: plmdefect              # id 는 바꾸지 않는다 — 게이트웨이 allowed_groups 가 plat:plmdefect 를 요구한다
    label: PLM 결함 검색
    gateway: [plm-defect]

# ── 박스 파일 access.local.yaml(gitignore, 이 파일 옆) ─────────────────────────────────────────────────────
# 이 박스에만 있는 것은 추적 파일을 고치지 말고 거기에 적는다. 읽는 절은 둘뿐이다(나머지는 이 파일에서만 읽는다).
#   · platforms            위 표에 id 기준으로 더하거나 바꾼다 — 박스 전용 게이트웨이 백엔드를 붙일 때, 그리고 systems.local.yaml 로
#     만든 박스 전용 타일을 붙일 때(systems: 에 그 타일 id — 안 적으면 그 타일은 권한과 무관하게 모두에게 보인다).
#   · sso_affiliation_map  SSO Claim → 소속 표. 한 행은 {claim, value, affiliation} 이고 affiliation 은 위 affiliations 의 id 다.
#     SSO 로 **처음** 생기는 사람에게만 쓴다(위에서부터 처음 맞는 행, 값은 앞뒤 공백만 떼고 글자 그대로). 이미 있는 사람은
#     로그인해도 안 바뀐다 — 소속은 관리자가 정한 값이 이긴다. 맞는 행이 없으면 SSO_DEFAULT_AFFILIATION(기본 빈 값 = 소속 없음).
#     claim 은 Assertion 의 Attribute 이름 그대로(운영 ADFS 는 전체 URI)가 정확하다. 짧은 이름(CompId)은 마지막 경로 조각이
#     같은 Attribute 가 그 Assertion 에 하나뿐일 때만 맞는다 — 둘이면 고르지 않고 경고한다.
#     ⚠ Claim 값(회사·부서 코드)은 사내 식별자다 — **이 파일에 적지 않는다.** 여기 풀어 적은 표는 읽지 않고 경고만 낸다.
#     ⚠ 값은 따옴표로 감싼다 — 따옴표 없는 0123 은 숫자 83 으로 읽혀 영영 안 맞는다(그런 행은 버리고 관리자 화면에 알린다).
# 깨졌거나 버려진 행이 있으면 관리자 화면 '배선 설정' 에 뜬다. 아래는 지어낸 값의 예시다.
#
#   platforms:
#     - id: boxonly
#       label: 이 박스 전용 앱
#       systems: [box-only-tile]
#       gateway: [box-only-backend]
#   sso_affiliation_map:
#     - {claim: CompId, value: "C999", affiliation: CAEG}
#     - {claim: "http://idp.example/claims/DeptId", value: "D12345", affiliation: CAEG}
