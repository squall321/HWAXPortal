# 포털 업데이트 이력 — 로그인하면 '아직 안 본 것'만 팝업으로 뜨고, /updates 에서 전체를 본다.
#
# 규칙
#   · 최신 항목이 **위**다. date 는 ISO(YYYY-MM-DD), 하루에 여러 건이면 항목을 여러 개 둔다.
#   · items 는 커밋 제목이 아니라 "무엇이 달라졌는지"다.
#     나쁨 — "feat(chat): AgentCatalogBlock 추가"
#     좋음 — "'/전문가' 로 찾은 사람을 그 자리에서 바로 고를 수 있습니다."
#   · **기술적인 변경도 전부 싣는다**(사용자 지시, 2026-10-12 — 고르지 않는다). 사용자가 겪는 변화는
#     아래 다섯 분류로, 그 밖의 변경(내부 배선·운영 스크립트·성능·설정 손잡이·리팩터)은 tag: 기술 로 쓴다.
#     시험만·문서만 바꾼 커밋만 뺀다. 날짜는 한국 시각이다(dev 박스는 UTC). 조작법은 docs/changelog.md.
#   · tag 는 화면에 배지로 뜨고 이력 페이지의 필터 칩이 된다. 아래 다섯을 재사용하면
#     색이 붙는다 — 챗 · 심의 · 연결 · 배포 · 수정. 새 분류(기술 등)는 기본 배지로 그려진다.
#   · 이 파일은 요청마다 mtime 을 확인한다. 고쳐도 재기동이 필요 없다.
#
#   ⚠ title 이 `*` 로 시작하면(예: **강조**로 열면) YAML 이 앵커 별칭으로 읽어 파일 전체가
#     파싱에 실패한다. 그때는 title 도 큰따옴표로 감싼다(2026-09-14 에 한 번 났고 테스트가 잡았다).
#
#   ⚠ items 는 **반드시 큰따옴표로 감싼다.** 따옴표 없이 쓰면 '/전문가' 처럼 작은따옴표로
#     시작하는 줄이 YAML 스칼라로 열려 파일 전체가 파싱에 실패한다(실제로 한 번 났다).
#     안쪽 큰따옴표는 \" 로 이스케이프한다. backend/tests/test_changelog.py 가 이 파일을
#     실제로 파싱해 보므로, 깨뜨리면 테스트가 잡는다.

entries:
  - date: 2026-10-31
    title: "챗 — 시키지 않은 잡 · 쓰기는 확인 카드로 멈추고, 이 턴에 건 잡의 상태는 서버가 기다립니다"
    tag: 챗
    items:
      - "운영자가 사람이 이번 말로 시키지 않은 잡(체크리스트 · 해석 · 변환 · 클러스터 제출 등)이나 쓰기 · 되돌리기 어려운 도구를 부르려 하면, 부르지 않고 답 끝에 확인 카드를 띄웁니다. '실행' 을 누르면 서버가 그 호출을 처음 꼴 그대로 한 번 보내고, '취소' 면 보내지 않습니다. 답했거나 30분이 지난 카드는 잠깁니다."
      - "StepForge 잡 카드에는 미리 잰 작업량(합칠 형상 수 · 모형 값 · 같은 인자로 끝난 잡의 시간)이 함께 나옵니다. 모형 값은 예상 시간이 아닙니다."
      - "이 턴에 건 잡의 상태 조회는 모델이 되풀이해 묻지 않고 서버가 10초 간격으로 기다립니다(한 턴 합 10분까지). 기다리는 동안 상태 줄에 진행률이 오르고, 끝나면 마지막 결과로 답합니다. 중지를 누르면 기다림만 멈추고 잡은 계속 돕니다."
      - "한 허브에서 받은 id 를 다른 허브 도구에 넘기면 부르지 않고, 그 허브에서 key 로 다시 풀라고 돌려줍니다. 허브마다 id 가 달라 엉뚱한 객체를 읽던 일을 막습니다."
      - "이 관문들은 웹 챗에만 걸립니다. 개인 Claude(MCP 직결) · 분석 루틴 · 심의 좌석은 그대로입니다."
  - date: 2026-10-31
    title: "챗 — StepForge 운영자의 확인 카드가 StepForge 가 가른 대로 뜹니다"
    tag: 챗
    items:
      - "StepForge 에서 되돌리기 어려운 여덟(과제 지우기 · 치수 기록 지우기 · STEP 등록 · zip 반입 · 잡 취소 · 관리자 지정 · 실패모드 사전 고치기 · 분석 레시피 저장)은 이번 말로 시켰어도 늘 확인 카드가 뜹니다."
      - "그 밖의 수정 도구 서른셋(파트 이름 바꾸기 · 파트 빼기 · 관계 확정 · 형상 연산 · 그림 정합 · 영역 옮기기 · 치수 기록 · 재질 등록 등)은 이번 말로 시켰을 때만 카드 없이 나가고, 시키지 않았으면 카드가 뜹니다."
      - "메시 크기 권장도 권장값을 파트 메타에 적는 수정 도구라, 묻기만 한 말에는 카드가 뜹니다."
  - date: 2026-10-31
    title: "챗 자기검증 — 맞는 수치를 지우지 않고, 근거를 찾지 못한 수치는 짚기만 합니다"
    tag: 챗
    items:
      - "자기검증이 검토자의 고침을 이번 턴 도구 결과 원문(접거나 자르기 전)과 다시 대조합니다. 원문에 있는 수를 지우거나 다른 수로 바꾸는 고침은 버리고, 원문에서 찾지 못한 새 수는 답에 넣지 않고 짚기만 합니다."
      - "짚기만 한 답 아래에는 '짚었습니다 — 답은 고치지 않았습니다' 와 짚은 곳이 나옵니다. 고친 답에 짚은 곳이 있으면 고친 곳 아래 따로 보입니다."
  - date: 2026-10-31
    title: "운영자 · 앱 — ECAD 허브 운영자를 두고, 운영 앱 둘이 목록 · 검색에 다시 보입니다"
    tag: 연결
    items:
      - "ECAD Automation Hub 운영자(he-cad-odbhub)를 둡니다. 입구 도구 다섯(작업 찾기 · 작업 목록 · 결과 목록 · 체크리스트 결과 · 작업 상태)은 그 박스 게이트웨이에 있을 때만 잇습니다."
      - "dynaforge-prod · stepforge-prod 가 시험 사본 숨김에서 빠져 웹 챗 묶음 · 개인 Claude 목록 · 도구 찾기에 보통 앱으로 다시 보입니다. 두 앱은 운영 앱입니다(10-29 의 숨김을 사용자 결정으로 되돌림)."
  - date: 2026-10-31
    title: "10-31 내부 — 챗 관문 넷 · update-all §7 · 운영자 목록 점검 · 손잡이 · 받은 편지함 · AIDataHub 병합"
    tag: 기술
    items:
      - "에이전트 서버 /health 에 self_check.gate(모드 · 넣음 · 짚음 · 버림 · 고친 비율) · status_wait · confirm_gate(목록 수 · 살아 있는 카드 · 셈) · xhub_gate 가 생겼습니다. update-all §7 이 한 줄씩 찍고, 손잡이로 끈 관문은 '○ … 켜려면' 으로 찍어 끝 요약에서 다시 말하며, 칸 하나의 꼴이 달라도 그 줄만 ⚠ 로 말합니다. 운영자 목록을 못 읽었으면 ⚠ 입니다."
      - "env 킷 챗 절에 관문 손잡이(CHAT_SELF_CHECK_GATE · CHAT_SELF_CHECK_RAW_CHARS · CHAT_STATUS_WAIT_MAX_S · CHAT_STATUS_WAIT_POLL_S · CHAT_STATUS_TOOLS · CHAT_CONFIRM_GATE · CONFIRM_LISTS_PATH · CHAT_XHUB_ID_GATE)를 주석으로 적었습니다. 모두 바꾸면 에이전트 서버를 재기동해야 먹습니다(start.sh 가 .env 를 기동 때 한 번 싣습니다). 운영자 정의 파일의 내용만 재기동 없이 다시 읽습니다."
      - "자기검증 관문은 이번 턴 도구 결과 원문을 턴당 600만 자까지 붙잡아 대조하고, 검토자 입력은 결과마다 몫을 나눠 잘린 결과에 까닭 머리를 답니다(잘린 결과의 수치는 짚기만). 검토자에게 다시 묻지 않습니다."
      - "상태 기다림은 원래 이름 목록의 상태 도구(get_task · job_status · docforge_status 등) 가운데 게이트웨이가 읽기로 확인한 것에만 걸리고, 이 턴에 건 잡의 id 이거나 같은 호출의 되풀이일 때만 기다립니다. 숫자 status 는 도구 오류로 보고 기다리기를 끝냅니다."
      - "확인 관문이 막는 것은 셋입니다 — 잡 시작 바닥 목록 25개 · 운영자 정의의 writes · confirm(늘 카드). '시켰다' 는 이번 사람 발화 원문으로만 가리고(잡은 그 일의 낱말 바로 뒤에 잡을 거는 동사가 올 때), 승인한 호출은 사람 자격으로만 보냅니다(서비스 계정으로 내려가지 않습니다)."
      - "다른 허브 id 막이는 이번 턴 허브 결과에서 id → 허브를 배우고, 막은 호출을 에이전트 로그 [gate] 줄과 /health xhub_gate.blocked 로 남깁니다."
      - "운영자 정의의 리스크 운영자 목록에 risk_job_action(취소 · 재개)과 리스크 앱이 '확인한 뒤 부른다' 로 적은 쓰기 여섯을, StepForge 확인 목록에 되돌릴 수 없는 forget_dimension 을 더했습니다. 확인 카드가 이 목록을 읽습니다."
      - "운영자 프롬프트의 확인 줄은 확인하는 길을 시스템 규칙에 맡깁니다 — 카드가 있는 웹 챗에서 글로 한 번 · 카드로 한 번 두 번 묻지 않고, 카드가 없는 곳에서는 먼저 말해 확인을 받습니다. 동기화 미리보기와 update-all §6 이 쓰기 목록에 적었는데 게이트웨이가 읽기로 확인한 도구(조회마다 카드가 선다)를 모든 운영자에 걸쳐 알립니다."
      - "확인 카드 단추는 켜 둔 분석 루틴을 싣지 않고 바로 다음 말로만 답하고, 입력창에 쓰던 글 · 붙인 그림이 있으면 잠깁니다. 버린 고침 · 관문 수는 화면 · 브라우저 사본에 남기지 않습니다. 검증 못 한 답의 고친 점과 짚은 곳은 한 목록으로 보입니다."
      - "코어 어휘표에서 dynaforge-prod · stepforge-prod 를 지워 게이트웨이 /health 의 core_vocab.staging_hidden 이 [] 입니다. 역할 staging 은 박스 덧씌우기로 진짜 시험 사본을 숨기는 길로 남습니다. 박스 권한표의 '(시험)' 라벨은 cae00 운영자가 고칩니다."
      - "update-all 이 git 받기 뒤 cae00 받은 편지함(docs/cae00-inbox)에 그 박스에 마지막으로 알린 뒤 새로 들었거나 바뀐 글을 찍고 끝 요약에서 다시 냅니다. 알린 판은 끝 요약을 낸 뒤 infra/.state/inbox-head 에 적어, git pull 을 먼저 해도 빠지지 않고 끊긴 실행 뒤에는 다시 알립니다(기록이 없는 첫 실행은 글을 모두 찍습니다). 바깥 답이 필요한 물음을 마크다운으로 실어 보내 운영 박스가 읽고, 답은 사용자를 거쳐 돌아옵니다."
      - "AIDataHub — 병합이 전문가 표본 임베딩을 dev 의 id 로 덮지 않고 전문가 단위로 맞춥니다. 순번을 표의 가장 큰 id 뒤로 올리고(cae00 표본 저장이 겹친 id 로 거절되던 원인 후보), 덤프로 고칠 수 없는 전문가는 다시 짓는 명령과 함께 알립니다."
  - date: 2026-10-31
    title: "10-31 점검 — 스크립트 둘이 허브의 박스 덮어쓰기를 따르고, StepForge 운영자 목록이 앱의 수정 도구와 같아집니다"
    tag: 기술
    items:
      - "check-mcp-registration.sh 가 허브와 같은 효과 매니페스트(추적 manifest.yaml 위에 박스 덮어쓰기 manifest.local.yaml — HEAXHub HH-15)로 업스트림 · 선언을 봅니다. 덮어쓴 dev 에서 추적 업스트림을 두드려 멀쩡한 앱을 '업스트림 무응답' NG · rc 1 로 읽던 것, 꼬리 주석이 달린 id 를 '매니페스트 없음' 으로 읽던 것을 고쳤습니다. 허브 · 게이트웨이 설정은 이 리포의 형제(../HEAXHub · ../HWAXMcpGateway)에서 찾습니다 — 박힌 dev 경로라 cae00 에서 못 찾았습니다(HUB_ROOT · GATEWAY_CONFIG 로 덮어씁니다)."
      - "drive-drift.sh 가 박스 덮어쓰기가 있는 앱의 SIF 크기 · 캐시 열쇠가 Drive 와 달라도 예상된 것(○)이라 하고 처방(보내는 앱은 빌드 박스에서 덮어쓰지 않는다)을 적습니다 — 허브 dist-to-drive 가 그 SIF 를 기본으로 싣지 않습니다. 열쇠 대조의 ✗ 는 받은 글에서 바로 셉니다 — grep -q 파이프는 대조 글이 길면 SIGPIPE 로 실패해 드리프트를 '✓ 일치' 로 알렸습니다."
      - "운영자 정의 he-cad-stepforge 의 writes 33 · confirm 8 이 StepForge 가 수정 도구로 등록한 마흔하나와 같습니다(시험이 형제 리포 소스와 견줍니다). rename_part · remove_part · confirm_interfaces 는 confirm 에서 writes 로, upload_step · import_archive · save_recipe 는 writes 에서 confirm 으로 옮겼고, save_failure_mode 와 목록 밖이던 열둘을 더했습니다. 함정 줄에 인자 하나로 덮어쓰는 호출(overwrite=true · redefine=true · 같은 이름)과 mesh_size_advice 의 store=false 를 적었습니다. 동기화 미리보기 · update-all §6 에 '읽기를 쓰기로 he-cad-stepforge: 1개 — mesh_size_advice' 가 섭니다 — 게이트웨이가 이름의 advice 낱말로 읽기로 확인하지만 store 기본이 쓰기입니다(게이트웨이 읽기 목록의 deny 로 닫을 일입니다)."
  - date: 2026-10-30
    title: "챗 — 다른 물음이 든 전문가 질문은 챗이 답하고, 이 박스에 없는 운영자는 미리 표시합니다"
    tag: 챗
    items:
      - "'PCB 크랙을 잘 아는 전문가를 추천하고 근거가 된 기록 수를 알려줘' 처럼 수 · 근거 · 비교 · 조건을 함께 묻는 질문은 이제 전문가 목록으로 가로채지 않고 챗이 답합니다. 전문가를 고른 대화에서도 가로채지 않습니다. '/전문가' 는 그대로 목록입니다."
      - "운영자(디지털 워커) 가운데 이 박스 게이트웨이에 앱이 없는 운영자는 고르기 화면 · 지정 칩에 표지가 붙습니다. 보내기 전에 압니다."
      - "전문가 추천에서 '전문가 · 추천 · 근거 · 기록' 같은 요청 낱말은 점수를 주지 않고, 데이터 없이 이름만 조금 맞는 전문가는 근거 있는 전문가 뒤로 갑니다(AIDataHub)."
  - date: 2026-10-30
    title: "심의 — 'VOC 먼저 보기' 가 다시 건수를 보입니다"
    tag: 심의
    items:
      - "SignalForge 가 VOC 결과를 봉투에 담아 주게 바뀐 뒤 심의 전 'VOC 먼저 보기' 가 말없이 0건이던 것을 고쳤습니다. 0건이면 까닭 줄('검색어' 0건 — …)을 보이고, 읽지 못하면 '못 물어봄' 으로 알립니다."
  - date: 2026-10-30
    title: "가림 · 절차 · 문서 변환 — 숫자는 그대로, 사람 정보는 가리고, 멈추던 씨앗을 고쳤습니다"
    tag: 수정
    items:
      - "계산 결과의 소수(소수점 뒤 숫자 15자리)가 '[가림:IMEI]' 로 바뀌던 것을 고쳤습니다."
      - "도구 결과의 담당자 · 제출자 · 사용자 칸, 메일, 사내 계정(이름.성 꼴), 사설 IP 를 가립니다. whoami 에서 내 메일도 가려지고 표시 이름은 보입니다."
      - "정본 예제 '전각도 낙하 · 전위치 부분충격 — 부품 보고서 (회수·판독)' 가 첫 단계에서 멈추던 것을 고쳤습니다. 이미 가져간 사람은 절차 목록의 '… 최신으로' 를 눌러 새 판을 받습니다."
      - "'AI 데이터 허브로' · '이 대화에서 분석' 에 사내 DRM(또는 암호를 건) 문서를 보내면 '손상' 대신 DRM 문서라고 알리고 할 일을 말합니다(AIDataHub)."
  - date: 2026-10-30
    title: "10-30 수정 요청 내부 — 재시도 · 접기 흔적 · 타입 대응 · 운영자 목록 · AIDataHub"
    tag: 기술
    items:
      - "챗 LLM 이 'System message must be at the beginning' 400 을 내면 자동 재시도는 이 턴의 안내를 첫 시스템 메시지에 합쳐 다시 보냅니다(평소 안내 자리는 사람 발화 머리). 에이전트 로그에 한 줄을 남깁니다."
      - "허브 응답을 접으면 에이전트 로그에 도구 이름 · 원문 자 수 · 접은 뒤 자 수를 한 줄로 남기고, /health 에 hub_fold 계수를 싣습니다."
      - "코어 어휘표에 낱말 → 허브 타입 이름(types) 칸이 생겼고, 규칙 글에 한 줄로 실려 챗이 없는 타입 이름을 지어내지 않습니다. 발동 낱말에 '전작' · '후속 모델' 을 더했습니다."
      - "심의의 위키 꺼짐 판정이 MX 백서 MCP 문구('…열리지 않았습니다')도 받습니다."
      - "운영자 정의의 writes · confirm 을 채웠습니다(ODB · ARP · 코어 허브 · 리스크 · StepForge · DynaForge). 동기화 미리보기가 목록 밖 쓰기 도구와 이 박스에 없는 운영자 앱을 알리고, AIDataHub 가 저장 뒤 500 을 내도 다시 읽어 저장됐으면 이어 갑니다."
      - "update-all 의 챗 도구 문구가 박스 값(TOOL_MAX=0 · 도구 설명 예산과 그 출처)을 그대로 적습니다."
      - "에이전트 서버의 도구 래퍼를 동작 그대로 정리했습니다(막은 호출의 반환 하나 · 성공 길 한 갈래 · 걸음 자리 주석)."
      - "AIDataHub — 전문가 저장 뒤 500(표본 색인 실패가 세션을 롤백 대기로 둔 것)을 고쳤고, 전문가 기록 목록이 추천과 같은 정본(records.agents)을 봅니다. agent_search 에 as_of(그 날 뒤 카드 빼기 · 날짜 없는 카드는 고름)가 생겼고, MX 백서 하위 절을 평탄화하며 박스별 절 다시 짓기 명령(기본은 셈만)을 두었습니다."
  - date: 2026-10-30
    title: "분석 루틴 — 챗에서 골라 켜면 정한 플랫폼 차례로 조회해 보고서 · RA 초안까지 갑니다"
    tag: 챗
    items:
      - "챗 입력창 도구 줄의 '루틴' 으로 내 루틴을 고르고 입력을 채워 켜면, 보낸 글이 그 루틴을 돌립니다. 단계마다 그 단계에 정한 플랫폼의 읽기 도구만 쓰고, 단계 칩 · 단계 요약 · 고를 것이 메시지 안에 보입니다."
      - "끝나면 단계 요약 · 근거 부록 · 커버리지(건너뛴 단계와 까닭)를 담은 보고서가 답으로 오고, Report Archive 초안이 내 이름으로 만들어집니다. 내 RA 토큰이 없으면 건너뛰고 까닭을 적습니다. 'ask' 로 짠 루틴은 'RA 초안 올리기' 를 누릅니다."
      - "탭을 닫아도 루틴은 서버에서 계속 돕니다. 다시 열면 같은 대화의 실행 보기가 원장에서 단계를 다시 그립니다. '이어서' 는 끝난 단계를 건너뛰고 잇고, '멈춤' 은 실행과 그 실행이 시작한 심의를 함께 멈춥니다."
      - "기준 키 후보가 여럿이면 멈추고 고르게 합니다. 고르면 이어서 돕니다. 처음 덧붙인 말은 이어서 · 고른 뒤에도 그대로 쓰입니다."
      - "권한 '분석 루틴'(feat:routines)이 있어야 보입니다."
  - date: 2026-10-30
    title: "분석 루틴 — 절차 탭에서 내 권한의 플랫폼을 차례로 엮어 두고, 개인 Claude 도 같은 루틴을 돌립니다"
    tag: 연결
    items:
      - "절차 › 루틴 탭에서 단계(플랫폼 · 할 일 · 넘길 키 · 예산 · 막히면 어떻게)를 차례로 엮어 저장 · 공유 · YAML 로 주고받습니다. 단계마다 지금 내가 부를 수 있는지(권한 · 토큰 · 이 박스에 있나)를 보입니다."
      - "개인 Claude 는 게이트웨이 도구 routine_list · routine_get · routine_run_start · routine_call · routine_step_done · routine_report_submit 로 같은 루틴을 같은 원장 · 같은 보고서 꼴로 돌립니다. Claude Code 는 /mcp__hwax__routine-<루틴 id> 로 한 번에 시작합니다."
  - date: 2026-10-30
    title: "절차 — 비운 선택 칸은 빼고 보내고, 낙하 제출 절차가 결과 반입을 예약합니다"
    tag: 수정
    items:
      - "절차의 선택 변수를 비우면 그 칸을 빼고 도구를 부릅니다. 그동안은 그 단계에서 '변수 없음' 으로 멈췄습니다. 문자열 안이나 목록에 섞어 쓴 선택 변수는 비우면 그 단계에서 멈추고 까닭을 말하며, 저장할 때 미리 알립니다."
      - "전각도 낙하 · 부분충격 제출 절차(정본 예제)가 제출 직후 DynaForge 결과 반입을 예약합니다. 과제 · 개발 차수 · 설계 변형 · DOE 를 선택으로 물어 리포트 메타로 넣고, 개발 차수는 DynaForge 가 받는 값 열한 개에서 고릅니다. 이미 들인 사람은 '다시 가져오기' 로 새 판을 받습니다."
  - date: 2026-10-30
    title: "분석 루틴 내부 — 단계 울타리 · 실행 원장 · 떼어 낸 실행"
    tag: 기술
    items:
      - "게이트웨이 routine_call 이 단계 울타리입니다. 그 단계 허용 목록 안에서 읽기로 확인된 도구(readOnlyHint · 읽기 목록 · 읽기 낱말)만 부르고 원장에 남깁니다. 모르는 이름은 막힙니다 — 읽기 도구라면 앱이 readOnlyHint 를 달거나 박스의 read_tools.local.json 에 더하고, 읽기처럼 보이는 쓰기는 같은 파일의 deny 로 닫습니다. /tools-map 에 routine_read 목록이 생겼습니다. 심의 단계의 deliberate_start 는 도구 미리 부르기 · 위키 쓰기 · RA 저장 인자를 빼고 보냅니다."
      - "포털 /routines-api 에 실행 원장(실행 · 단계 · 호출) · 이어서 · 보고서 다시 읽기가 생겼습니다. 호출 원장 쓰기는 한 쓰기 트랜잭션 안에서 실행 상태 · 단계 닫힘 · 예산 · 상한을 다시 보고, 읽기 전용 토큰은 원장에 쓰지 못합니다."
      - "에이전트 서버 실행기(routine.py)가 단계마다 그 단계 도구만 묶은 작은 ReAct 를 돌리고, 도구 없는 따로 턴이 단계 봉투를 씁니다. 동시 실행은 2개(ROUTINE_MAX_RUNNING)이고 /health 에 routine_active 가 실립니다. update-all 은 도는 루틴을 심의처럼 기다립니다(심의 멈춤이 풀리길 기다리는 루틴은 세지 않습니다)."
      - "챗 중계는 루틴 턴을 브라우저가 떠나도 끝까지 읽어 대화에 남기고(동시 8개까지), 두 탭이 같은 실행을 읽어도 보고서는 한 번만 남깁니다."
      - "챗에서 웹 검색 원천을 바꾸고 곧바로 보내면 옛 원천이 나가던 것을 고쳤습니다."
  - date: 2026-10-30
    title: "관리자 '도구 검색 검토' — 실사용 도구 찾기를 보고 정답을 달고 그 자리에서 잽니다"
    tag: 연결
    items:
      - "관리 메뉴에 '도구 검색 검토' 가 생겼습니다. 이 박스에서 챗 · 개인 Claude 가 도구를 찾은 질의마다 상위 다섯 · 보정 덕에만 든 결과 · 찾은 뒤 10분 안에 부른 도구를 봅니다. 부른 사람은 기록하지 않습니다."
      - "질의마다 정답 도구를 달면 이 박스의 정답쌍에 남고, '평가 돌리기' 가 지금 값 · 기본값 · 보정 끔 · 묶음 하나씩 끔을 그 정답으로 잽니다. dev 를 거치지 않습니다."
  - date: 2026-10-30
    title: "도구 찾기 보정 손잡이 · 박스 덧씌우기 · 굴러가는 질의 기록 · 플랫폼별 피드백 보고서"
    tag: 기술
    items:
      - "게이트웨이 search_tools 의 손 동의어 73 · 쓰기 의도 · 품질 · 심의 낱말 · 가중치를 코드에서 search_tuning.json 으로 옮겼습니다. 순위는 옮기기 전과 바이트까지 같습니다. 박스는 search_tuning.local.json 에 바꿀 칸만 적으면(JSON merge patch) 재기동 없이 탑니다. 묶음별로 끌 수 있습니다."
      - "코어 어휘표의 박스 덧씌우기(backend/config/core_vocab.local.json)를 게이트웨이 · 에이전트 서버가 같은 규칙으로 읽습니다. 두 /health 에 지문이 실리고 update-all 이 둘을 견줍니다."
      - "도구 찾기 질의 기록이 30일 일회성에서 날짜 파일의 굴러가는 창(30일)으로 바뀌었습니다. 결과마다 점수를 보탠 규칙과 보정 덕에만 든 것을 적고, 찾은 뒤 600초 안의 호출을 결과 줄로 잇습니다."
      - "게이트웨이에 공유 비밀로만 여는 창구 셋(/search-log · /search-review · /search-eval)과 tool_search_eval/run.py live 가 생겼습니다."
      - "게이트웨이 platform_feedback_report.py 가 플랫폼마다 보정 덕에만 찾아진 질의와 고칠 낱말 · 보이고도 안 불린 도구 · 결과에 없었는데 불린 도구 · 실패 · 큰 응답 · 인자 설명 · 안 불린 도구를 마크다운으로 냅니다. 우리가 다루지 않는 플랫폼에 돌려줄 보고서입니다."
  - date: 2026-10-29
    title: "챗 답이 더 빨리 끝나고, 같은 대화는 같은 GPU 로 갑니다"
    tag: 챗
    items:
      - "자기검증이 고친 답 전체를 다시 쓰지 않고 고칠 곳만 적어 초안에 넣습니다. 답이 끝난 뒤 기다리는 시간이 줍니다. 고칠 곳을 초안에서 찾지 못하면 초안을 그대로 내고 까닭을 답 아래에 적습니다."
      - "같은 대화의 챗 LLM 호출에 대화 머리를 실어, 박스 부하분산기가 그 머리를 보면 같은 GPU 복제본으로 갑니다. 앞 대화를 서버가 다시 읽지 않아 첫 글자가 빨라집니다(cae00 부하분산기 설정은 사람 몫입니다)."
      - "챗의 시스템 안내 앞부분을 턴마다 같게 둡니다. 바뀌는 안내(고른 앱 · 전문가 · 붙인 문서)는 이번 질문 바로 앞에 놓여 서버의 접두 캐시가 듣습니다."
      - "도구 결과 머리에 '이 결과는 ○○ 앱' 이 붙고, 같은 도구를 네 번째 부르면 '앞 결과를 써라' 를 덧붙입니다. 허브의 큰 응답 셋(이웃 · 칸 · 참조)은 6만 자를 넘으면 앞 50개와 전체 수로 접습니다."
      - "답에 섞인 한자 · 가나 낱말을 자기검증이 짚어 질문의 언어로 바꿉니다. 짧은 답도 그 낱말이 있으면 검증합니다."
  - date: 2026-10-29
    title: "숨겨 둔 탭으로 돌아오면 끝난 답이 곧바로 보이고, 멈춘 챗은 15분 뒤 알립니다"
    tag: 수정
    items:
      - "답을 받는 중에 다른 탭에 20초 넘게 있다가 돌아오면 서버에 저장된 답과 맞춥니다. 답이 끝났으면 받는 중을 끝내고 그 답을 보입니다."
      - "챗도 15초마다 살아 있다는 신호를 보냅니다. 15분(900초) 넘게 아무것도 오지 않으면 끊고 '다시 물어보라' 고 알립니다. 종전엔 13시간을 기다렸습니다. 심의는 그대로입니다."
  - date: 2026-10-29
    title: "시험 사본 앱이 도구 목록 · 검색에서 빠집니다"
    tag: 연결
    items:
      - "어휘표에서 역할이 '시험' 인 앱(stepforge-prod · dynaforge-prod)이 웹 챗 묶음 · 개인 Claude 기본 목록 · 도구 찾기에서 빠집니다. 시험 사본의 결과를 운영 결과로 읽던 일을 막습니다. 이름으로 부르면 그대로 닿습니다."
  - date: 2026-10-29
    title: "update-all 이 새로 붙은 앱을 점검하고, 오래 안 불린 도구를 앱별로 뽑을 수 있습니다"
    tag: 배포
    items:
      - "update-all §6 이 처음 본 앱을 기록하고, 붙은 지 14일 동안 영역 없는 도구 · 포털 권한표 행 · 이름 겹침 · 인자 설명 부족을 ⚠ 로 짚습니다(막지 않습니다). 기록이 없던 첫 실행은 지금 앱을 전부터 있던 것으로 적기만 합니다."
      - "게이트웨이 리포의 python3 tool_usage_report.py 가 지금 노출된 도구 가운데 30일 동안 한 번도 안 불린 것을 앱별 마크다운으로 냅니다(앱 주인에게 넘기는 보고서 — 부른 사람 · 주소는 싣지 않습니다)."
  - date: 2026-10-29
    title: "챗 도구 설명 예산 손잡이 · 검토자 상한 4,096 · 챗 침묵 한도 분리 · DocForge 영역 · StepForge 과제 찾기"
    tag: 기술
    items:
      - "에이전트 서버에 CHAT_TOOL_SCHEMA_BUDGET(캡 없는 길의 도구 설명 예산, 비면 종전대로 챗 창의 45%)을 더했습니다. 30,000 · 40,000 을 박스에서 견준 뒤 정합니다. CHAT_STABLE_PREFIX=0 은 안내 자리를 종전으로 돌립니다. 둘 다 env 킷에 주석으로만 적었습니다."
      - "자기검증 검토자의 출력 상한을 4,096 토큰으로 줄였습니다(고칠 곳만 쓰게 된 뒤). 검토자 글은 판정 · 고친 점 · 바꿀 곳 그대로 '생각' 칸에 흐릅니다."
      - "포털 챗 중계가 서버 대화 id 를 에이전트 서버에 싣고, 챗의 침묵 한도(AGENT_CHAT_IDLE_TIMEOUT_S, 900초)를 심의의 한도(AGENT_STREAM_IDLE_TIMEOUT_S)와 뗐습니다. 심의 판정은 에이전트 서버의 시작 낱말과 같습니다."
      - "게이트웨이 도구 영역 표에 DocForge 를 '보고서 · 문서 · 발표' 로 넣었습니다. 도구 5개가 미분류였습니다."
      - "StepForge find_plm_task 가 과제가 속한 프로젝트의 이름 · 별칭(마케팅명)으로도 찾고, 받기 상태(sync)는 요약만 싣습니다. 0~2행 응답이 11~12천 자였습니다. StepForge 배치 뒤에 반영됩니다."
  - date: 2026-10-29
    title: "챗이 고장모드 · 시험항목 · 가상검증 · 관리 기준 · 물성 질문을 정본 허브에서 먼저 풉니다"
    tag: 챗
    items:
      - "챗의 코어 데이터 규칙이 PLM 과제 · 개발모델 · 부품 · 고장모드 · 시험항목 · 가상검증 · 관리 기준 · 해석 방법 · 물성 같은 낱말에 걸리고, 첫 걸음은 자주검증 Datahub 의 object_resolve 하나로 둡니다. 사례 · 실측 · 규격 원문은 그 뒤에 다른 앱에서 덧붙입니다."
      - "FMEA(사내 규격 · 사례) · ARP(해석 실측) · ODB 허브(보드 규칙)는 코어 객체를 갖지 않는다고 알려 주고, 자주 묻는 관계(부품에서 나는 고장 = occurs_in_part · 시험이 잡는 고장 = detects …)를 함께 줍니다."
      - "도구 찾기(search_tools)가 이 낱말을 허브 읽기 도구에 잇고, 같은 도구의 허브 사본은 정본 한 줄로 접습니다(사본 앱 이름을 부르면 그 사본입니다). 정본 도구 설명 앞에 '사내 코어 정본 — …' 소개가 붙습니다."
      - "코어 낱말이 든 질문은 '심의 · 토의 · 회의' 를 말하지 않으면 원인 · 판정 · 설계 같은 일반 낱말로 심의 시작 도구를 올리지 않습니다."
  - date: 2026-10-29
    title: "다른 탭으로 옮겨도 답이 멈추지 않고, 중지 단추가 곧바로 듣습니다"
    tag: 수정
    items:
      - "답을 기다리며 다른 탭으로 옮겨도 포털이 답을 끝까지 받아 대화에 저장합니다. 종전엔 탭을 깨울 때까지 답이 멈췄습니다(10-29 시험에서 25분). 탭을 닫거나 중지하면 지금처럼 끊습니다."
      - "중지 단추가 받는 중인 연결을 기다리지 않고 화면을 곧바로 풉니다. 받은 부분 답은 그대로 남습니다."
  - date: 2026-10-29
    title: "코어 어휘표 하나 · 자기검증 출력 상한 · 챗 중계 버퍼"
    tag: 기술
    items:
      - "코어 낱말 · 허브 읽기 도구 · 관계 · 앱 역할의 정본을 포털 리포 backend/config/core_vocab.json 하나에 둡니다. 게이트웨이 · 에이전트 서버가 같은 박스의 이 파일을 읽고(고치면 재기동 없이 반영), 없으면 지금 동작으로 돕니다. 둘 다 /health 의 core_vocab 에 읽었는지 싣습니다(게이트웨이는 정본 키의 백엔드가 이 박스에 있는지도 — canonical_backend)."
      - "챗 자기검증의 검토자 호출에 출력 상한(초안 토큰 × 2 + 1,024, 2,048 ~ 16,384)을 줍니다. 상한이 없어 검토 한 번이 399초 · 24만 자까지 늘었습니다. 걸리면 초안을 그대로 냅니다. 본답에는 상한을 두지 않습니다."
      - "포털 챗 중계가 브라우저에 아직 못 보낸 프레임을 64 MiB 까지 쥐고, 넘으면 그 스트림만 종전처럼 브라우저를 기다립니다. 응답이 끝나면 중계 생성기를 직접 닫아 끊긴 연결의 상류를 곧바로 끊습니다."
  - date: 2026-10-29
    title: "사람별 위임마다 발급 요청의 클라이언트 이름을 정합니다"
    tag: 기술
    items:
      - "게이트웨이의 일반 사람별 위임(PER_USER_SSO_APPS)에 <접두>_SSO_CLIENT 를 적으면 그 이름으로 그 사람의 토큰을 받습니다(비면 지금처럼 gateway). 한 발급처가 위임 둘에 토큰을 내는 경우(KooSlurm — SmartTwinMCP · 클러스터 도구) 두 위임이 서로의 토큰을 회수하지 않게 이름을 가릅니다."
      - "update-all 이 이 값을 게이트웨이에 넘기고, 바꾸면 재프로비저닝을 당깁니다(로그 「사람별 위임 클라이언트 이름 드리프트」)."
  - date: 2026-10-28
    title: "챗 업로드에 SimFlow 가 생겼습니다"
    tag: 챗
    items:
      - "`.x_t` 같은 워크플로우 입력 파일을 「SimFlow — 워크플로우 입력 파일」 로 보내면 본인 명의로 SimFlow 에 올라가고, 받은 업로드 id 가 대화에 남습니다. 「그 id 로 run_workflow 를 돌려 줘」 지시문도 입력창에 들어갑니다."
      - "DRM 문서도 원본 그대로 보내고, SimFlow 가 풀 때까지(기본 2분) 기다립니다. 크기 한도(기본 500 MB)를 넘으면 보내기 전에 막고, 거절되면 SimFlow 가 밝힌 사유를 그대로 보여 줍니다."
      - "받는 확장자 · 한도는 박스 설정입니다(SIMFLOW_UPLOAD_EXTS · SIMFLOW_UPLOAD_MAX_MB). 입력창의 파일 고르기 · 끌어 놓기도 그 확장자를 받습니다. SimFlow 가 연결된 박스에서만 보입니다."
  - date: 2026-10-28
    title: "update-all 이 챗 자기검증 상태를 말하고, 스모크 오류로 엉뚱한 복구를 돌리지 않습니다"
    tag: 배포
    items:
      - "§7 스모크 뒤에 챗 자기검증의 결과 수 · 걸린 시간(p50/p95) · 마지막 실패가 한 줄로 나옵니다. 실패가 있으면 ⚠, 꺼져 있으면 '꺼짐' 입니다."
      - "MCP 스모크가 예상하지 못한 오류로 멈추면 '판정 불가' 로 셉니다. 종전엔 '전량 실패 백엔드' 와 같은 종료코드라 재프로비저닝 · 게이트웨이 재기동이 엉뚱하게 돌았습니다."
  - date: 2026-10-28
    title: "코어 온톨로지 운영자가 생기고, 운영자 도구 이름을 cae00 에 맞췄습니다"
    tag: 챗
    items:
      - "부품 · 모델 · 과제 · 불량 질문을 정본 허브(자주검증 Datahub)에서 풀고 · 세고 · 관계로 잇는 '코어 온톨로지 운영자' 를 더했습니다. FailureTrace · CAE 그룹 데이터 허브가 붙은 박스에서는 그쪽으로도 건너갑니다(cae00 에서 페르소나 동기화를 반영하면 조직도에 보입니다)."
      - "DynaForge · AI 데이터 허브 · Report Archive 운영자의 도구 넷을 cae00 이 내놓는 이름으로 적어, 그 박스의 페르소나 동기화가 멈추지 않습니다."
  - date: 2026-10-28
    title: "재기동 뒤 첫 대화 검색이 이미 색인한 메시지를 다시 임베딩하지 않습니다"
    tag: 수정
    items:
      - "포털을 다시 띄울 때마다 첫 '지난 대화 찾기' 가 BGE-M3 로 이미 색인한 메시지까지 다시 보내 느렸습니다. 이제 처음 한 번 지금 임베딩 공간을 확인하고 남은 것만 색인합니다."
  - date: 2026-10-28
    title: "업무 절차가 FMEA · MatNexus 토큰이 없으면 시작 전에 알려 줍니다"
    tag: 수정
    items:
      - "박스에 선언한 외부 연결(FMEA · MatNexus …) 단계가 있는데 토큰을 등록하지 않았으면, 실행 도중 거절되기 전에 시작 화면에서 '개인 토큰 › 외부 연결' 에 등록하라고 알려 줍니다(막지는 않습니다)."
  - date: 2026-10-28
    title: "외부 연결 토큰을 박스 키로 암호화해 둡니다"
    tag: 기술
    items:
      - "사람마다 등록한 Report Archive · TestScope · FMEA · MatNexus 토큰을 박스 고유 키(backend/secrets/conn.key, 0600)로 암호화해 저장합니다. 이미 있는 토큰은 포털이 처음 뜰 때 제자리에서 바꿉니다."
      - "포털 sqlite 파일을 뜰 때마다 0600 으로 맞춥니다. 키는 비밀 백업 묶음에만 들어가고, 키를 잃으면 등록한 연결을 다시 등록해야 합니다(기동 로그가 몇 건인지 말합니다)."
  - date: 2026-10-28
    title: "/health/ready 가 소속을 싣는 시스템을 말하고, 개인 토큰 기본 청중에 simflow 가 들어갑니다"
    tag: 기술
    items:
      - "/health/ready 에 진입 토큰에 소속을 싣는 시스템 id(claims_affiliation)가 실립니다 — 박스 파일이 덮은 뒤의 떠 있는 값을 점검이 봅니다."
      - "개인 토큰의 기본 청중에 simflow 를 더했습니다 — 게이트웨이가 SimFlow 를 REST 다리 사이트로 열었습니다."
  - date: 2026-10-28
    title: "챗 시작 패널에서 고른 전문가의 지식카드 전체를 엽니다"
    tag: 챗
    items:
      - "시작 패널에서 전문가를 고르면 이름 옆 「전체 보기 →」 로 그 전문가의 지식카드 전체를 바로 엽니다. 종전엔 조직도 창에서만 열렸습니다."
  - date: 2026-10-28
    title: "위키가 꺼진 박스에서는 위키 버튼이 보이지 않습니다"
    tag: 챗
    items:
      - "MX 백서 위키가 꺼진 박스에서는 답 아래 '위키에 남기기' · '해결됨' 과 심의의 위키 옵션을 숨깁니다. 종전엔 보이는데 누르면 실패했습니다."
      - "그래도 보내면 게이트웨이까지 가지 않고 '위키가 꺼져 있다' 고 바로 알려 줍니다."
  - date: 2026-10-28
    title: "Report Archive 로 보내기가 크기 한도를 미리 알려 주고, 거절 사유를 보여 줍니다"
    tag: 챗
    items:
      - "'Report Archive 로' 는 25 MB 를 넘는 파일을 고르기 전에 막고(한도 표시), RA 가 거절하면 그 사유('파일이 너무 큽니다' 등)와 다른 길(사진 압축 · 나눠 보내기 · AI 데이터 허브)을 함께 보여 줍니다."
      - "AI 데이터 허브로 보낸 파일의 inbox 사본을 24시간 뒤 지웁니다(그 사이엔 같은 이름으로 다시 부를 수 있습니다). '이 대화에서 분석' 문서 칩 제목은 원래 파일 이름입니다."
      - "사내 DRM 이 걸린 문서도 알아보고 PC 도우미를 안내합니다. 서버가 변환한 문서는 근거에 'aidh-convert' 로 표시됩니다."
      - "보내기 실패도 감사 기록에 남고, 게이트웨이를 잠깐 못 읽어도 지금 없는 목적지('정밀 변환')가 다시 보이지 않습니다."
  - date: 2026-10-28
    title: "도구 찾기가 품질 · 온톨로지 질문에 맞는 도구를 먼저 보여 줍니다"
    tag: 연결
    items:
      - "'시장 불량 원인 대책' 같은 질문에 심의 도구 여덟이 한꺼번에 위로 오던 것을 고쳤습니다. 품질 · VOC 도구(PLM 문제점 검색 · 결함 프로필)가 먼저 나옵니다."
      - "과제 · 고장모드 · 시험항목 · 가상검증 · 관리기준 · 물성 · 영률 · 전작 같은 코어 온톨로지 낱말이 허브 읽기 도구에 닿습니다."
      - "조회 질문에서는 등록 · 실행 같은 쓰기 도구가 아래로 가고 '쓰기' 표지가 붙습니다. 질문이 앱 이름(StepForge 등)을 부르면 그 앱 도구가 앞섭니다."
      - "설명까지 같은 사본 도구는 하나만 보이고 나머지는 '같은 도구' 로 접힙니다. 결과는 한 줄 요약과 필수 인자만 실어 가볍습니다(전체는 detail=true)."
  - date: 2026-10-28
    title: "게이트웨이로 나가는 결과의 개인정보를 기본으로 가립니다"
    tag: 연결
    items:
      - "Claude · 챗 · 심의가 게이트웨이로 받는 도구 결과에서 작성자 · 검출자 이름, 커뮤니티 계정, 기기 IMEI · 일련번호를 [가림] 으로 바꿉니다(사용자 결정 10-27). 원문이 필요하면 그 앱 화면에서 봅니다."
  - date: 2026-10-28
    title: "Claude Desktop 에서 게이트웨이로도 SimFlow · ARP 패널이 뜹니다"
    tag: 연결
    items:
      - "게이트웨이(/mcp-gw/mcp)에 붙은 Claude Desktop 에서 패널 도구를 부르면 패널이 뜹니다. 패널 화면은 그 사람 명의로 받아 옵니다. 패널 도구는 invoke_tool 이 아니라 이름으로 바로 부르도록 안내합니다."
      - "앱 목록에 내 토큰을 아직 등록하지 않은 외부 연결 앱은 '등록 필요'(needs_connect)와 등록 위치(/tokens?tab=connect)가 함께 나옵니다."
  - date: 2026-10-28
    title: "게이트웨이 재기동이 하던 도구 호출을 끊지 않습니다"
    tag: 수정
    items:
      - "재기동할 때 그 순간 돌던 도구 호출이 응답 없이 끊기던 것을 고쳤습니다. 새 연결은 바로 새 게이트웨이로 가고, 하던 호출은 끝까지 마칩니다(최대 30초)."
      - "SimFlow 처럼 사람별로 이어지는 앱에서 토큰을 쓸데없이 다시 받아 같은 사람의 다른 작업이 끊기던 것을 고쳤습니다. 상대가 토큰을 거절했을 때만 다시 받습니다."
  - date: 2026-10-28
    title: "게이트웨이 — ODB 토큰 헤더 · SimFlow REST · 감사 · 영역 분류"
    tag: 기술
    items:
      - "ODB 자동화 허브 토큰을 주소 쿼리가 아니라 인증 헤더로 싣습니다(접속 · 프록시 로그에 남지 않게). update-all 이 옛 꼴을 보면 재프로비저닝을 한 번 당겨 옮깁니다."
      - "SimFlow 를 REST 중계(/api/simflow/…)로도 부를 수 있습니다. 상대가 토큰을 거절하면 그 토큰을 버리고 다시 받습니다."
      - "감사 기록이 오류 응답을 성공으로 세던 것을 고쳤습니다(점검기 · 사용 통계가 실패를 셉니다)."
      - "도구 영역 분류에 허브 · 외부 연결 앱의 기본값을 넣어 미분류(10-27 cae00 61.8%)를 줄였습니다. 외부 연결의 목록 토큰이 없을 때 포털을 묻는 간격을 10분까지 늘리고, 상태가 바뀐 때를 알립니다."
  - date: 2026-10-28
    title: "update-all 의 프록시 우회 점검이 거짓 경보를 내지 않습니다"
    tag: 배포
    items:
      - "'NO_PROXY 에 없는 내부 목적지' 경고가 정문(nginx)이 부르는 경로까지 세어 거짓으로 뜨던 것을 고쳤습니다. 이제 부르는 쪽별로 봅니다 — 포털이 부르는 곳(RA · AI Ready Portal · TestScope)은 지금 셸의 설정으로, 게이트웨이가 부르는 곳은 게이트웨이가 스스로 맞춘 결과로 판정합니다."
      - "설정으로 붙는 외부 연결(FMEA · MatNexus)의 주소도 점검합니다. 게이트웨이 /health 는 프록시 우회 결과를 수로만 알립니다(주소는 싣지 않습니다)."
  - date: 2026-10-28
    title: "ste 긴 내려받기 시한 · SimFlow · stcx LLM 경로를 설정 한 줄로 맞춥니다"
    tag: 기술
    items:
      - "ste 경로의 응답 대기 한도가 정문 설정을 다시 만들 때마다 600초로 돌아가던 것을 infra/.env 의 NGINX_STE_READ_TIMEOUT 한 줄로 정할 수 있게 했습니다."
      - "SimFlow(600MB 업로드 · MCP 스트리밍)와 stcx LLM(60초 넘는 생성 · 큰 본문) 경로가 정문에서 임시 디스크에 쌓이거나 60초에 끊기던 것을 고쳤습니다."
      - "ste 결과 파일을 한 곳에서 되풀이해 받아 다른 사용자가 느려질 때 쓸 속도 · 연결 제한 설정을 두었습니다. 기본은 꺼져 있고, 결과 파일 경로에만 걸립니다."
  - date: 2026-10-28
    title: "update-all 이 놓치던 것 넷을 봅니다"
    tag: 배포
    items:
      - "사람별로 이어지는 앱(SimFlow · AI Ready Portal · ODB 허브 · MX 백서 등)의 연결 비밀이 상대와 다르면 실패로 셉니다. 예전엔 사람 호출만 실패하고 업데이트는 초록이었습니다."
      - "ste 터널이 MCP 포트(15812)를 열지 않는 옛 설정이면, 다른 것이 그 포트를 잠시 쥐고 있어도 고칠 대상으로 봅니다."
      - "AIDataHub 데이터를 합친 뒤 HE팀 운영자 전문가가 이 박스 판과 달라졌으면 알립니다(고치는 명령을 같이 보입니다)."
      - "감시 · 부팅 · 손으로 띄운 서비스도 infra/.env 의 프록시 예외(NO_PROXY)를 받습니다. 에이전트 서버 설정 킷은 심의 호출 한도를 더는 심지 않고 코드 기본값(1800초)을 따릅니다."
  - date: 2026-10-28
    title: "MX 백서 운영자가 위키가 꺼진 박스에서도 만들어집니다"
    tag: 수정
    items:
      - "MX 백서가 위키가 꺼진 박스에서 위키 도구를, 게이트웨이에서는 서버 파일을 읽는 도구를 내놓지 않게 바뀐 뒤 HE팀 운영자 동기화가 통째로 멈추던 것을 고쳤습니다. 위키 몫은 위키가 켜진 박스에서만 붙고, 파일 가져오기는 MX 백서 화면으로 안내합니다."
  - date: 2026-10-28
    title: "일일 백업이 KooRemapper DB 를 다시 뜨고, 비밀 묶음이 빠뜨리던 것을 담습니다"
    tag: 기술
    items:
      - "03:30 일일 백업이 크론의 빈 환경에서 KooRemapper DB 를 덤프하지 못해 10-02 부터 매일 실패하던 것을 고쳤습니다. 백업 스크립트가 사용자 세션 변수 둘을 스스로 채웁니다."
      - "비밀 묶음에서 infra/.env 가 backend/.env 에 덮여 사라지던 것을 고쳤습니다. 두 파일을 따로 담고, 박스에만 있는 설정 파일(권한표 · 타일 · 라우트 · SAML 등) · .git/info/exclude · crontab · 리스크 앱 비밀도 함께 담습니다."
      - "백업 · 감시 · 로그 회전 크론을 설치할 때 crontab 을 잠깐 못 읽으면 다른 줄까지 지워질 수 있던 것을 고쳤습니다. 'crontab 없음' 일 때만 새로 만들고, 그 밖의 실패에는 손대지 않고 멈춥니다. 데이터 이관기의 크론 일시정지도 같은 기준으로 바꿨습니다."
  - date: 2026-10-28
    title: "배포가 DynaForge 를 다시 띄우는 동안 감시가 겹쳐 띄우지 않게 표지를 둡니다"
    tag: 배포
    items:
      - "update-all 이 DynaForge(KooRemapper)를 내렸다 올리는 사이에 1분 감시가 start.sh 를 겹쳐 돌려 DB 가 멈춘 일이 있었습니다(10-09 · 10-17). 이제 배포가 내리기 직전에 platform/infra/data/deploy.lock.d 표지를 만들고, 다 올린 뒤(실패해도) 지웁니다. 감시가 이 표지를 보고 비키는 쪽은 KooRemapper 몫입니다."
  - date: 2026-10-28
    title: "update-all 이 거짓 실패를 내지 않고, heax 앱이 빠지면 실패로 셉니다"
    tag: 배포
    items:
      - "헬스게이트가 게이트웨이 도구 지도(cae00 150 KB)를 환경 변수로 넘기다 'Argument list too long' 으로 파이썬이 뜨지 못해, MCP 앱의 정상 404 를 실패로 세어 종료코드 1 로 끝나던 것을 고쳤습니다. 지도는 파일로 넘기고, 못 읽으면 그렇다고 알립니다."
      - "heax 게이트웨이 토큰 발급이 실패해 리스크 · StepForge · DynaForge · 재료 도구가 챗에서 빠져도 '키가 있다' 로 넘어가던 재검증을, 토큰과 앱 목록 주소가 실제로 있는지로 바꿨습니다. 마지막 점검에서도 HEAX Hub 앱이 0개면 실패로 셉니다."
      - "MCP 자동 복구(재프로비저닝 · 게이트웨이 재기동)가 도는 심의의 도구 호출을 끊지 않게, 심의가 돌거나 줄 서 있으면 미루고 경고만 남깁니다."
      - "원격 LLM 박스에서 박스가 적어 둔 TOOL_MAX 값을 더는 0 으로 덮지 않습니다(값이 없을 때만 0). '전량 바인딩' 이라던 안내도 실제(챗 창 예산 안에서 질의마다 고른다)대로 고쳤습니다."
  - date: 2026-10-27
    title: "창을 닫아 넣지 못한 정밀 변환을 입력창 위에서 다시 엽니다"
    tag: 챗
    items:
      - "「Report Archive — 정밀 변환」 을 맡기고 창을 닫으면 변환은 끝나도 보고서가 만들어지지 않았습니다. 이제 입력창 위에 '끝나지 않은 정밀 변환 N건' 이 뜨고, '이어 보기' 를 누르면 그 잡의 진행부터 보다가 끝나면 본인 명의로 Report Archive 에 넣고 지금 대화에 결과를 남깁니다. 저절로 넣지는 않습니다."
      - "맡긴 지 7일(DocForge 가 변환 결과를 두는 기간)까지 다시 열 수 있습니다. 넣은 잡 · 실패하거나 취소한 잡은 보이지 않고, '숨기기' 는 목록에서만 뺍니다(잡은 그대로)."
  - date: 2026-10-27
    title: "DocForge 운영자가 '연결된 과제 · 모델' 칸을 풀어 말합니다"
    tag: 기술
    items:
      - "DocForge 정밀 변환 보고서 첫 쪽 맨 위에 붙는 '연결된 과제 · 모델' 칸(SP 허브의 과제코드 · 모델명이 원문에 글자 그대로 나온 것만)을 운영자 페르소나가 설명하도록 개념 한 줄을 더했습니다. 페르소나 동기화 뒤 반영됩니다."
  - date: 2026-10-25
    title: "Drive 배포물 점검이 허브 앱의 캐시 열쇠까지 봅니다"
    tag: 기술
    items:
      - "drive-drift.sh 가 허브 앱 SIF 마다 캐시 열쇠(앱 커밋 + 등록 사본 + 틀)를 앱 갈래 끝 커밋으로 계산해 Drive 의 것과 견줍니다. cae00 허브는 앱 커밋이 바뀌면 열쇠를 다시 재고, 다르면 다시 지으려다(그 박스는 짓지 못한다) 실패해 그 앱을 띄우지 않습니다. 크기만 보던 때는 dev 와 Drive 가 함께 낡은 경우를 놓쳤습니다."
      - "dev 는 새로 지었는데 Drive 가 옛 판이면 올리라고, 새 커밋을 아직 안 지었으면 다시 짓고 올리라고, 앱 리포를 GitHub 에 push 하지 않아 GitHub 이 뒤에 있으면 그렇다고 알립니다. 커밋은 그대로이고 등록 사본 · 틀만 바뀐 앱은 cae00 이 다시 재지 않으므로 한 줄 정보로만 묶어 보입니다."
  - date: 2026-10-25
    title: "update-all 전에 돌리는 사전 점검 — 무엇이 끊기고 무엇이 사라지나"
    tag: 배포
    items:
      - "박스에서 update-all 을 돌리기 전에 python3 infra/scripts/update-preflight.py 로 한 번에 봅니다. 도는 심의 · 카드 대조 · DynaForge · StepForge · DocForge · 위키 작업, update-all 이 치울 파일(설정이 가리키는 파일은 ✗)과 버릴 로컬 커밋, 갱신이 막힐 리포, 들어올 DB 이관과 MX 백서 이관 0056 이 지울 줄 수, 디스크, 새 기능에 빠진 설정(비밀은 해시 앞자리로만 견줍니다), Drive 에 이 박스가 받을 판(포털 화면 · MX 백서 이미지 · 허브 대조 목록)을 봅니다. 아무것도 바꾸지 않습니다."
      - "아직 받지 않은 박스에서도 원격 판을 그대로 돌릴 수 있습니다 — 포털 리포 루트에서 git show origin/main:infra/scripts/update-preflight.py | python3 -. 순서와 확인은 cae00 배포 가이드의 '2026-10-25 반영분' 에 있습니다."
  - date: 2026-10-25
    title: "박스 고유 타일 목록이 update-all 에 치워지지 않습니다"
    tag: 배포
    items:
      - "박스마다 따로 두는 타일 목록(backend/config/systems.<박스>.yaml — cae00 은 systems.cae00.yaml)을 git 이 무시하게 했습니다. 그동안은 update-all 첫 단계가 이 파일을 작업 트리에서 치워, 포털이 카탈로그를 못 읽고 뜨지 못할 수 있었습니다. 이 규칙이 아직 없는 박스의 첫 실행은 옛 규칙으로 돌기 때문에 사전 점검이 따로 알립니다."
  - date: 2026-10-25
    title: "Drive 배포물 점검이 앱 데이터 어긋남을 제대로 보고, 안전하게 올리는 길을 알려 줍니다"
    tag: 기술
    items:
      - "drive-drift.sh 의 허브 앱 데이터 검사가 /data 로 옮긴 링크를 따라가지 못해 늘 통과였습니다. 이제 링크를 따라가되 dev 에서 박스로 보내는 앱(재료 DB 등 — 레지스트리의 publish 규칙)만 견줍니다. 박스마다 따로인 StepForge · DocForge · 음성 기록 · 리스크 DB 는 보지 않습니다."
      - "어긋남이 있으면 구역마다 따로 올리는 명령을 안내합니다(포털 · 허브 앱 SIF 하나씩 · KooRemapper · MX 백서). 전체 올리기는 허브 되돌림 판을 셋만 남기고 대조 목록을 이번 것으로 덮으며 dev 데이터를 박스에 씨앗으로 싣기 때문에 권하지 않습니다."
      - "데이터 레지스트리(infra/services.yaml)에 DocForge 데이터를 박스 고유(mirror)로 적었습니다."
  - date: 2026-10-25
    title: "DocForge 가 아직 연결되지 않은 곳에서는 「Report Archive — 정밀 변환」 을 보이지 않습니다"
    tag: 연결
    items:
      - "DocForge 가 게이트웨이에 실리지 않은 박스에서는 파일을 올린 뒤 '어디로 보낼까요' 에 정밀 변환 목적지를 띄우지 않습니다. 그동안은 보이기는 했지만 고를 때마다 실패했습니다. 게이트웨이의 도구 목록은 1분마다 다시 보고, 목록을 받지 못하면 지금처럼 띄웁니다."
  - date: 2026-10-25
    title: "update-all 이 도는 DynaForge 작업을 끊지 않습니다 · 받기 · 이관 실패를 실패로 셉니다"
    tag: 배포
    items:
      - "update-all 이 DynaForge 를 다시 띄워야 할 때 그 박스에서 로컬 해석 작업이 돌고 있으면 재기동을 미룹니다. 건너뛴 것(○)으로 적고 까닭과 다시 할 때를 보여 줍니다. 그동안은 작업이 끊기고 실패로 적혔습니다. 지금 내려야 하면 KOORM_RESTART_FORCE=1 로 돌립니다."
      - "DynaForge 배포물을 Drive 에서 받지 못했을 때와 MX 백서 DB 이관이 실패했을 때를 경고가 아니라 실패로 셉니다. 그동안은 옛 화면 · 옛 스키마로 돌면서 초록으로 끝났습니다."
      - "허브를 다시 띄울지는 앱 SIF 와 그 해시만 보고 정합니다. 곁 파일(잠금 · 정의 파일)이 바뀌었다고 허브 전체를 다시 띄워 도는 StepForge · DocForge 작업을 끊지 않습니다."
      - "죽은 StepForge 를 update-all 이 다시 살리지 못하던 것을 고쳤습니다. 재배포에 넘기는 폴더 이름이 step-forge 로 바뀌어 '폴더 없음' 이었습니다."
      - "앱 데이터를 /data 로 옮긴 박스(dev · cae00)에서 포털이 DocForge 정밀 변환 결과를 읽지 못해 모든 배달이 '패키지를 찾지 못했다' 로 끝나던 것을 고쳤습니다. 포털이 뜰 때 그 링크의 끝을 읽기 전용으로 붙입니다."
  - date: 2026-10-25
    title: "Drive 배포물 점검이 MX 백서 이미지도 봅니다"
    tag: 기술
    items:
      - "drive-drift.sh 가 MX 백서가 짓는 이미지 셋(web · api · wiki)을 Drive latest/ 와 견줍니다. 그동안 이 구역을 보지 않아, 위키 워커 이미지가 Drive 에 한 번도 올라가지 않은 것을 아무도 몰랐습니다."
  - date: 2026-10-25
    title: "'이 대화에서 분석' 을 DocForge 가 읽습니다 · DocForge 운영자 페르소나"
    tag: 챗
    items:
      - "DocForge 를 쓸 수 있는 사람이 문서를 올려 '이 대화에서 분석' 을 고르면 DocForge 가 읽습니다. 차트 값(원본 파일의 값) · SmartArt · 수식 · 발표자 노트 · 병합된 표까지 원문에서 옮겨 입력창에 문서로 붙입니다. 읽는 동안 진행이 보이고, 어디에도 저장하지 않습니다. DocForge 를 쓸 수 없으면 지금처럼 AI 데이터 허브 변환기로 읽습니다."
      - "HE팀 운영자에 'DocForge 문서 정밀 변환 운영자' 를 더했습니다. 정밀 변환으로 옮기는 법 안내, 맡긴 변환의 진행 · 변환 보고서(버린 요소 · 모델 판독 · 경고) 풀이, 만든 보고서 점검을 돕습니다. DocForge 가 게이트웨이에 실린 뒤 운영자 목록에 나타납니다."
      - "정밀 변환의 그림 판독이 그래프로 읽힌 그림은 차트 값까지('모델 판독 — 값 확인 필요' 차트), 글 · 표 그림은 그림 속 글까지 한 번 더 읽어 원본 그림 뒤에 답니다. 다른 그림은 한 번만 읽습니다."
  - date: 2026-10-25
    title: "PC 도우미로 가져온 DRM 문서도 「Report Archive — 정밀 변환」 으로"
    tag: 연결
    items:
      - "서버가 열 수 없는 DRM 문서를 'PC 의 PowerPoint 로 열어 가져오기' 로 받은 뒤, 다음 단계에서 「Report Archive — 정밀 변환」 을 고를 수 있습니다. 받은 글과 슬라이드 그림을 함께 DocForge 에 넘겨, 슬라이드마다 글 · 표 · 발표자 노트와 슬라이드 그림(모델 판독 포함)이 든 보고서를 만듭니다."
      - "PC 추출본으로 만든 보고서는 위치 · 차트 값 · 박힌 그림이 없어 충실도가 낮다고 대화 알림에 적힙니다. 추출기가 만들지 않은 .md 는 맡기지 않고 까닭을 말합니다."
  - date: 2026-10-25
    title: "'MX 백서 운영자' 가 LLM 위키에 먼저 묻습니다"
    tag: 챗
    items:
      - "HE팀 'MX 백서 운영자' 와 대화하면 지식 질문은 MX 백서 위키에 먼저 묻고, 위키가 단 근거 각주를 그대로 옮겨 답합니다. 위키에 아직 없으면 그렇다고 말하고 백서 문서를 찾아 답합니다."
      - "위키 답이 맞다고 하면 그 답을 위키 문답으로 남깁니다(요청했을 때만). 지금은 dev 에 반영됐습니다."
  - date: 2026-10-25
    title: "상태판이 MX 백서 위키 워커를 보고, cae00 배치가 위키 워커도 새 이미지로 다시 띄웁니다"
    tag: 기술
    items:
      - "상태판(켠 박스만)이 MX 백서 위키 워커를 봅니다 — 최근 10분 안에 박동한 워커가 있고 멈춘 상태가 아니어야 하며, 줄 선 작업 · 24시간 실패 수를 화면에 보입니다. MX 백서가 위키를 켠 박스(WIKI_ENABLED)에서만 싣습니다 — 끄면 위키 주소가 전부 404 라 늘 빨갛게 됩니다."
      - "cae00 배치가 MX 백서의 새 이미지를 받으면 위키 워커(mxwp_wiki)도 내렸다 올립니다. 빠지면 갈아 끼운 이미지 위에서 워커가 깨진 채 남았을 것입니다."
      - "게이트웨이 도구 영역 — MX 백서 위키의 쓰기 도구 넷을 '데이터 등록·온톨로지' 로 옮겼습니다('사내 지식 검색' 에는 읽기만 남습니다)."
  - date: 2026-10-25
    title: "심의 결정문을 MX 백서 LLM 위키에도 남길 수 있습니다"
    tag: 심의
    items:
      - "MX 백서 권한이 있으면 심의 옵션에 'MX 백서 위키에도 남기기' 가 생깁니다. 켜고 시작한 심의는 결정문 · 좌석별 표 · 소수 의견 · 근거(보고서 번호 · 좌석이 조회한 도구)를 내 소속 범위로 MX 백서 위키에 남깁니다. Report Archive 보고서와 함께 남고, 단이 여럿인 심의(메커니즘 → 해석 설계 → 구축 계획)는 단마다 하나씩입니다."
      - "소속이 정해지지 않은 계정은 MX 백서 '내 후보' 로 가고, 내가 범위를 골라 승인해야 위키에 들어갑니다. 결과는 결정문 끝에 한 줄로 보입니다 — 남긴 원천 번호, 또는 남기지 못한 까닭(권한 · 연결 · MX 백서가 거절한 사유 그대로)."
      - "기본은 꺼져 있고, 켜 두면 이후 심의마다 남습니다. Claude 에서 MCP 로 여는 심의(deliberate_start)도 wiki 인자로 같은 일을 하고, 이어하기는 그 설정을 이어받습니다."
  - date: 2026-10-25
    title: "포털이 에이전트 서버에 원장의 소속을 함께 보냅니다 — 위키에 남기는 심의의 범위로만 씁니다"
    tag: 기술
    items:
      - "포털 챗 중계가 검증된 사람의 원장 소속(권한표에 있는 것만)을 에이전트 서버로 싣습니다. 브라우저가 실어 보낸 소속은 버립니다. 에이전트 서버는 위키를 켠 심의에만 그 값을 엔진에 넘기고, MCP 로 연 심의는 게이트웨이가 실은 소속을 씁니다."
      - "에이전트 서버 잡 러너는 위키를 켠 잡에만 잡 번호와 소속을 입구에 넘깁니다(위키 원천의 열쇠 · 범위). 다른 심의의 진입 호출은 종전 그대로입니다."
  - date: 2026-10-24
    title: "챗 답을 MX 백서 LLM 위키에 남길 수 있습니다 — '위키에 남기기' · '해결됨'"
    tag: 챗
    items:
      - "MX 백서 권한이 있으면 챗 답 아래에 두 버튼이 생깁니다. '위키에 남기기' 는 그 질문 · 답 · 이번에 조회한 근거를 내 소속 범위로 MX 백서 위키에 남깁니다. '해결됨' 은 나만 보는 후보로 보내고, MX 백서 '내 후보' 에서 범위를 골라 승인하면 위키에 들어갑니다(승인하지 않으면 7일 뒤 버려집니다)."
      - "보내는 내용은 화면이 아니라 서버에 저장된 그 대화에서 다시 짓습니다. 보낸 결과는 대화에 알림으로 남아 다음 질문 때 함께 갑니다. 소속이 없는 계정은 '위키에 남기기' 대신 '해결됨' 으로 보내야 합니다."
      - "MX 백서 쪽 위키가 켜진 박스에서 동작합니다. 내 계정이 MX 백서에서 읽기 전용(reader)이면 MX 백서가 받지 않습니다 — MX 백서 관리자에게 편집 권한을 요청하세요."
  - date: 2026-10-24
    title: "게이트웨이가 MX 백서 서비스 토큰을 살아 있으면 잇고, 죽으면 update-all 이 알아서 다시 받습니다"
    tag: 기술
    items:
      - "게이트웨이 재프로비저닝이 MX 백서 서비스 토큰을 매번 새로 발급하던 것을, 살아 있으면 그대로 잇게 바꿨습니다(DynaForge 토큰과 같은 규칙). 그동안은 재프로비저닝할 때마다 떠 있는 게이트웨이의 토큰이 그 순간 무효가 되어, 게이트웨이를 다시 띄울 때까지 MX 백서 호출이 실패했습니다."
      - "update-all 이 게이트웨이가 쥔 MX 백서 서비스 토큰으로 MX 백서에 물어 401 이면 다시 프로비저닝해 새 토큰을 받습니다. MX 백서가 내려가 있을 때는 판정을 미룹니다."
  - date: 2026-10-24
    title: "게이트웨이 REST 다리도 사람별 위임 앱에 소속 · 플랫폼 권한 증명을 싣습니다"
    tag: 기술
    items:
      - "챗 · Claude 가 rest_call 이나 게이트웨이 /api/<사이트>/ 로 사람별 위임 앱을 부를 때도, MCP 도구 호출과 똑같이 그 사람의 소속과 (앱이 바라면) 플랫폼 권한을 서명과 함께 넘깁니다. 지금까지는 MCP 도구 호출에만 실려, 같은 사람이 REST 로 부르면 앱이 소속 · 플랫폼 단위 범위를 보지 못했습니다."
      - "사람이 요청에 직접 실어 보낸 같은 이름의 헤더는 떼고 게이트웨이가 지은 것만 보냅니다."
  - date: 2026-10-24
    title: "챗 업로드에 「Report Archive — 정밀 변환」 목적지(DocForge)"
    tag: 연결
    items:
      - "PPT · Word · Excel · PDF 를 올리고 「Report Archive — 정밀 변환(배치 유지 · 그림 판독)」 을 고르면 DocForge 가 배치 · 표 · 차트 값 · 발표자 노트를 원본 그대로 옮기고, 그림은 모델이 읽어 '모델 판독' 으로 따로 답니다. 변환이 도는 동안 진행이 보이고, 끝나면 본인 명의로 내 공간에 보고서가 만들어집니다."
      - "만든 뒤 대화에 알림 한 건이 남습니다 — 보고서 링크와 쪽 · 블록 · 버린 요소 · 모델 판독 · 무음 누락 수. '모델 판독' 블록이 있으면 원본과 맞는지 확인하라는 문구가 붙습니다."
      - "기존 「Report Archive 로 보내기」(RA 가져오기 + AI 초안)는 비교 기준선이라 그대로 둡니다. 새 목적지는 Report Archive 와 DocForge 권한이 둘 다 있어야 보입니다 — DocForge 앱이 게이트웨이에 실리기 전까지는 보이지 않습니다."
      - "기술 — 포털이 DocForge 패키지를 데이터 루트(형제 리포 HEAXHub 의 앱 데이터) 밑에서만 읽고, 리소스를 하나씩 올려 자리표를 바꾼 뒤 엄격 생성(POST /api/reports)으로 넣습니다. 한 잡은 한 번만 넣고(두 번 눌러도 보고서 하나), 진행 · 배달은 맡긴 사람만 부를 수 있습니다. 권한표에 DocForge(plat:docforge — 게이트웨이 heax-doc_forge)를 더했습니다."
  - date: 2026-10-24
    title: "MX 백서를 사람 명의로 부를 준비 — 진입 토큰에 소속, 게이트웨이에 플랫폼 권한 전달"
    tag: 기술
    items:
      - "포털 타일로 MX 백서에 들어갈 때 넘기는 진입 토큰에 그 사람의 포털 소속(affiliation)을 싣습니다. MX 백서에만 켰고, 소속이 없거나 권한표에서 지운 소속이면 싣지 않습니다. 플랫폼 권한(plat:)은 원래 토큰의 groups 에 실려 있었습니다. MX 백서에 들어갈 LLM 위키가 소속 · 플랫폼 단위로 읽기 범위를 가르는 데 씁니다."
      - "게이트웨이가 사람별 위임으로 부르는 앱에 그 사람의 플랫폼 권한(plat:)을 서명과 함께 넘길 수 있게 했습니다. 앱마다 켜며(게이트웨이 provision.env 의 <접두>_SEND_PLAT=1), update-all 이 그 값을 넘기고 게이트웨이 설정과 다르면 다시 프로비저닝합니다. 아직 켠 앱은 없습니다."
      - "MX 백서의 REST 다리는 사람별 위임이 설정되면 그 사람 명의로 부르고(쓰기도 본인 이름으로), 위임이 없으면 지금처럼 서비스 토큰으로 조회만 합니다. MX 백서 쪽 위임 창구가 올라온 뒤 비밀을 넣으면 켜지고, 그 전에는 달라지는 것이 없습니다."
  - date: 2026-10-24
    title: "포털을 거쳐 올리는 파일 상한을 2GB 에서 10GB 로 올렸습니다"
    tag: 연결
    items:
      - "포털 정문(nginx)이 받는 업로드 상한이 모든 경로에서 10GB 가 됐습니다 — 포털 자체 업로드(챗의 '+' 등)와 ste · HEAX 허브 앱 · Report Archive · ODB 로 가는 길 모두입니다. ste 웹도 자체 상한을 10GB 로 같이 올렸습니다(ste 를 다시 배포하면 들어갑니다). 그 밖의 서비스가 따로 거는 상한은 그대로입니다."
      - "ste · HEAX 허브 앱 · Report Archive · ODB 로 가는 길은 파일을 서버 디스크에 쌓지 않고 바로 흘려보냅니다. 그 밖의 길은 nginx 가 본문을 서버의 임시 디렉터리에 다 받은 뒤 넘기므로, 큰 파일은 그만큼 서버 디스크를 씁니다. cae00 에는 다음 update-all 에서 nginx 설정을 다시 만들 때 들어갑니다."
  - date: 2026-10-23
    title: "챗 답을 근거와 한 번 더 대조해 고친 뒤 보여 줍니다(자기검증)"
    tag: 챗
    items:
      - "답을 다 쓴 뒤 같은 챗 모델이 질문 · 이번에 조회한 결과 · 붙인 문서 · 앞 대화와 대조합니다 — 빠진 물음, 근거 없는 수치, 근거와 어긋나는 말, 계산 · 단위, 조회해 놓고 빠뜨린 결과를 봅니다. 본문에는 검증을 거친 답만 나오고, 고치기 전 초안과 검토 내용은 접힌 '생각' 칸에 남습니다."
      - "고쳤으면 답 아래에 '검증에서 N곳을 고쳤습니다' 가 뜨고, 펼치면 무엇을 왜 고쳤는지 보입니다. 고칠 것이 없으면 모델 표시 옆에 '검증 ✓', 인사처럼 근거도 수치도 없는 짧은 답은 '검증 생략' 입니다. 검토 답이 끊기거나 답을 지나치게 줄이거나 그림을 빠뜨리면 고친 답을 버리고 초안을 그대로 보이며 '검증하지 못해 초안을 그대로 보였습니다' 와 까닭을 적습니다."
      - "검토를 한 번 더 하므로 답이 나오기까지 더 걸립니다(대략 답을 한 번 더 쓰는 시간). 답 아래 근거 블록의 '출처 없는 수치' 는 고친 답으로 다시 셉니다."
  - date: 2026-10-23
    title: "챗 자기검증의 배선 — 초안은 생각 칸으로, 고친 답은 본문으로, 결과는 meta.self_check 로"
    tag: 기술
    items:
      - "에이전트 서버가 챗 한 턴을 감싸 안쪽 턴의 글을 reasoning 으로 돌리고 결과 · 끝 · meta 를 붙잡았다가, 검증 뒤 고친 답을 token 으로 냅니다(글을 내는 자리 열다섯을 고치지 않고 턴을 감싼다). 끄려면 에이전트 서버 환경에 CHAT_SELF_CHECK=0(기본 켬), 검토자의 생각을 켜려면 CHAT_SELF_CHECK_THINK=1(기본 끔)."
      - "검토자 입력은 이 턴의 창에서 고친 답을 쓸 몫을 먼저 떼고, 넘치면 조회 결과 55% · 붙인 문서 25% · 앞 대화 20% 로 나눕니다(쓰지 않는 몫은 넘치는 쪽으로). 잘린 근거에는 표지를 달고, 코드가 찾은 '출처 없는 수치' 를 먼저 짚어 줍니다. 서버 대화 · 다음 턴 이력에는 고친 답이 갑니다."
  - date: 2026-10-23
    title: "올린 PPT · Word · PDF · Excel 을 '이 대화에서 분석' 으로 바로 읽고 물을 수 있습니다"
    tag: 챗
    items:
      - "문서를 올리면 뜨는 '어디로 보낼까요' 에 '이 대화에서 분석' 이 맨 앞에 생겼습니다. 글 · 표 · 차트 데이터 · 발표자 노트를 읽어 입력창에 문서로 붙이고, 그대로 묻거나 '붙인 문서로 할 일' 단추를 쓰면 됩니다. Report Archive · AI 데이터 허브 어디에도 저장하지 않습니다."
      - "읽기는 AI 데이터 허브의 변환기를 빌려 씁니다 — 그래서 허브를 쓸 수 있는 사람에게 뜹니다. 그림 내용은 아직 글로 옮기지 않고 그림이 있던 자리만 표시합니다(그림 판독은 다음 단계). 암호가 걸린 문서는 지금처럼 'PC 의 PowerPoint 로 열어 가져오기' 로 붙입니다."
  - date: 2026-10-23
    title: "파일을 대화창에 끌어다 놓아도 올라갑니다"
    tag: 챗
    items:
      - "챗 · 심의 화면에서 그림 · PPT · Word · PDF · CSV · STEP 같은 파일을 대화창 어디에 끌어다 놓아도 '+' 로 고른 것과 똑같이 올라갑니다 — 끄는 동안 화면 전체에 '여기에 놓으면 업로드됩니다' 가 뜹니다. 엉뚱한 자리에 놓아도 브라우저가 파일을 열어 화면을 떠나지 않습니다."
      - "다른 화면의 떠 있는 챗 창은 입력창 위에 놓을 때만 받습니다. 그림은 여러 장을 한 번에, 그 밖 파일은 한 번에 하나씩 붙고, 함께 놓은 나머지와 붙이지 않는 형식은 이름을 대고 알려 줍니다('+' 로 여럿 골랐을 때도 같습니다). 답을 받는 중에는 놓아도 붙이지 않고 그렇다고 말합니다."
  - date: 2026-10-23
    title: "AI 데이터 허브 · Report Archive 로 보낸 결과가 대화에 남아, 다음 질문이 그 파일을 근거로 답합니다"
    tag: 챗
    items:
      - "챗에서 파일을 AI 데이터 허브 · Report Archive 로 보내면 그 결과가 대화에 알림 한 건으로 남습니다(서버 대화에도). 다음 질문에는 그 결과가 '사람이 올려 보낸 결과' 근거로 함께 가서 「방금 변환한 것 검토해 줘」 가 그 파일을 가리킵니다. 예전에는 결과가 업로드 패널 안에서만 끝나, 앞서 올린 그림을 대신 검토했습니다."
      - "보내기가 끝나면 파일 이름 · 보고서 번호가 박힌 검토 지시문을 입력창에 넣습니다 — 쓰던 글이 있으면 덮지 않고 '검토 지시문을 입력창에 넣기' 단추로 넣습니다. 대화가 없던 첫 화면에서 보내면 새 대화가 생깁니다."
      - "앞 대화의 그림을 다시 실을 때 몇 턴 전 그림인지 함께 알리고, 질문이 올리거나 변환한 파일을 가리키면 그 그림으로 대신 답하지 않게 했습니다."
      - "보내기 패널이 열린 채 다른 파일을 붙이면 고른 목적지 · 완료 표시를 새로 시작합니다."
  - date: 2026-10-23
    title: "Report Archive 로 보낸 PPT 가 내용이 빈 보고서가 되던 것을 고쳤습니다"
    tag: 수정
    items:
      - "PPT 를 Report Archive 로 보내면 쪽만 있고 블록이 하나도 없는 초안(제목 · 본문 · 표 · 그림이 전부 빠짐)이 만들어졌습니다. 이제 RA 의 'PPT에서 불러오기' 와 같은 블록이 들어갑니다(배치는 RA 자동 배치라 그림이 둘씩 나란히 섭니다). 패널에 보고서 번호 · 쪽 · 블록 수 · 변환하지 못한 요소와 'Report Archive 에서 열기' 링크가 보입니다."
      - "가져온 쪽에 블록이 하나도 없으면 빈 보고서를 만들지 않고, 까닭(가져오기 경고)과 함께 알립니다."
  - date: 2026-10-23
    title: "DRM 문서를 'PC 의 PowerPoint 로 열어 가져오기' 단추 하나로 챗에 붙입니다"
    tag: 챗
    items:
      - "암호가 걸린(DRM) PPT · Word 를 붙이면 뜨는 안내에 'PC 의 PowerPoint(또는 Word) 로 열어 가져오기' 단추가 생겼습니다. 누르면 PC 도우미가 받는 계정을 보여 주고 묻고, 고른 파일을 이 PC 의 Office 로 읽어 글(과 고르면 슬라이드 그림 12장까지)만 올립니다 — 원본 파일은 올리지 않고, PC 임시 파일도 지웁니다. 받은 글은 입력창의 문서 칩으로 붙고, 원하면 그 글을 AI 데이터 허브로도 보냅니다."
      - "처음 한 번은 안내의 '도우미 설치 배치' 를 받아 실행합니다(관리자 권한 불필요 — 추출기를 내 사용자 폴더에 두고 hwax-doc 링크를 이 사용자에게만 잇습니다). 도우미가 15초 안에 안 열리면 설치 안내가 뜨고, 손으로 하는 세 걸음도 접힌 칸에 그대로 있습니다."
  - date: 2026-10-23
    title: "PC 도우미 일회용 표 · 챗 이력의 업로드 근거(기술)"
    tag: 기술
    items:
      - "PC 도우미 업로드는 브라우저 세션 + CSRF 로만 받는 일회용 표(10분 · 한 번 · 디스크에는 해시만 · 한 사람의 열린 표 다섯)로 엽니다. 도우미 자리(POST /agent/upload/pc/<표>)는 표를 먼저 닫고 본문을 읽으며(길이 머리 필수 · 상한), .hwax.md(머리말 schema hwax-doc/1 · 8MB)와 PNG(12장 · 장당 8MB)만 받습니다. 받은 것은 그 사람 스테이징(6시간 청소)에 두고 대화에는 쓰지 않습니다. 감사에 발급 · 열림 · 받음 · 실패 · 취소 · 만료를 남깁니다(본문 없음)."
      - "도우미는 추출기(hwax-doc-extract.ps1)의 -Url 모드입니다 — 올릴 곳은 URL 이 아니라 설치 때 적은 %LOCALAPPDATA%\\HWAX\\hwax-doc.json 의 포털 주소뿐이고, 판(HWAX_DOC_HELPER)이 포털의 helper_min 보다 낮으면 멈춥니다. 연결은 직결 먼저 · 안 되면 시스템 프록시 · TLS 1.2. Windows 실기 시험은 아직입니다."
      - "챗 이력 근거에 kind=upload 를 더했습니다 — 에이전트 서버가 '어시스턴트가 조회한 결과' 대신 '사람이 챗 화면에서 올려 보낸 결과' 머리로 알림 바로 앞에 따로 싣고(띵킹 세션 맥락도 같은 표기), 압축본에는 '(올림: 도구)' 로 남깁니다. 앞 대화 그림의 출처 설명에 '(N턴 전)' 을 붙입니다(챗 · 띵킹 · 심의 공통)."
  - date: 2026-10-22
    title: "점검 중에는 새 심의가 '약 N분 뒤 다시' 로 안내되고, 서버를 다시 띄워도 줄 선 심의가 남습니다"
    tag: 심의
    items:
      - "운영이 에이전트 서버를 다시 띄우기 전에 새 심의를 잠시 멈출 수 있습니다. 그동안 새 심의 · 이어하기는 '점검 중 — 약 N분 뒤 다시' 로 안내되고(포털 화면 · Claude 모두), 도는 심의는 끝까지 갑니다. 리스크 심사 패널은 그대로 돕니다."
      - "줄을 선 심의는 서버를 다시 띄워도 사라지지 않고 처음 줄 선 차례 그대로 다시 섭니다. 예전에는 '대기열이 사라졌다 — 다시 시작하라' 로 닫혔습니다."
      - "서버 재기동으로 끊긴 심의는 이어하기(deliberate_continue) 한 번으로 — 사람 의견 없이도 — 끝난 라운드 뒤부터 남은 라운드만 돕니다. 처음 근거 · 지정한 전문가 · 사람 의견을 그대로 씁니다. 진행 조회의 resume 이 끝난 라운드 수를 알려 줍니다."
      - "이어 돌 때 실리는 '끝난 라운드의 전문가별 입장' 은 전문가마다 같은 몫으로 줄여 싣습니다 — 전문가가 스무 명인 패널도 빠지는 사람이 없습니다(줄인 입장에는 원래 길이를 적습니다)."
  - date: 2026-10-22
    title: "동시 심의 한도를 재기동 없이 바꾸고, 창이 다른 GLM 풀에서도 작은 쪽 창으로 예산을 짭니다(기술)"
    tag: 기술
    items:
      - "동시 심의 한도 셋(전역 · 사용자별 · 줄)을 박스 덮개(<잡 원장>/state/limits.json)와 루프백 POST /limits 로 바꿉니다 — 판정 때마다 읽어 재기동이 없습니다. 올리면 줄이 곧바로 빠지고, 내리면 도는 심의는 그대로 새 시작만 줄을 섭니다. /health.limits 에 지금 값과 출처가 보입니다."
      - "동시 심의 한도에 네 번째 칸 '좌석 합 상한'(max_seats_running · DELIB_JOB_MAX_SEATS_RUNNING · 기본 꺼짐)을 더했습니다. 건수 한도는 3석 심의도 20석 심의도 1건으로 세지만, 한 심의는 단계마다 좌석 수만큼 LLM 호출을 한꺼번에 냅니다. 걸면 좌석이 많은 심의는 자리가 나기를 기다립니다(앉기 전은 어림 · 앉으면 고침 · 혼자면 넘어도 돎 · 먼저 선 심의부터). /health.delib_seats_running 에 지금 좌석 합이 보입니다."
      - "LLM_CONTEXT_TOKENS 를 적으면 서버가 알려 준 창의 상한으로도 씁니다(창이 다른 서버를 한 풀로 묶은 박스는 작은 쪽 창을 적습니다). 창은 600초마다(LLM_CONTEXT_TTL_S) 뒤에서 세 번씩 다시 묻고 줄일 때만 받습니다 — 넓히기는 재기동 때입니다. /health.context 에 근거가 보입니다."
      - "새 심의 멈춤은 POST /drain {scope: \"delib\"}(리스크 검토 비우기와 같은 규칙의 따로 된 깃발 · 15초 주기로 줄을 다시 봅니다), 줄은 잡마다 시작 인자 파일(<잡 원장>/args · 0600 · 토큰 없음)로 재기동을 넘깁니다. 정상 종료로 끊긴 심의는 '취소됨' 이 아니라 '중단됨(interrupted)' 으로 남습니다. 에이전트 start.sh 는 줄을 넘기는 서버면 줄 선 수로 재기동을 막지 않습니다."
  - date: 2026-10-22
    title: "update-all 이 심의가 도는 에이전트 서버를 미루지 않고 멈춰 기다린 뒤 재기동합니다(기술)"
    tag: 기술
    items:
      - "재기동할 에이전트 서버에 심의가 돌면 새 심의를 멈추고 끝나기를 최대 10분(HWAX_DELIB_WAIT_S) 기다린 뒤 재기동합니다. 못 기다리면 종전대로 미루고 멈춤을 그 자리에서 내립니다. 재기동했으면 멈춤은 update-all 끝에서 내립니다(update-sites 를 혼자 돌리면 그 끝에서)."
      - "재기동 뒤 다시 선 줄의 수를 찍습니다(이번에 다시 떴을 때만). 줄 선 심의만 있으면 — 줄을 넘기는 엔진이면 — 재기동을 미루지 않습니다(update-sites · deploy-all · §5 재프로비저닝 판정 모두). 새 심의 멈춤을 모르는 옛 엔진에는 멈춤 요청을 보내지 않습니다."
  - date: 2026-10-22
    title: "심의 도중 전문가가 조회로 받은 그림도 판독문으로 근거에 실립니다"
    tag: 심의
    items:
      - "심의 중에 전문가가 도구로 조회한 결과에 그림(도구가 만든 그림 · AIDataHub 첨부 그림)이 나오면, 그림을 읽는 모델이 글로 옮겨 그 조회 바로 뒤에 근거로 붙입니다. 그 전문가의 발언, 다른 전문가가 받는 조회 결과, 근거 카드와 결정문 근거 목록에 함께 실립니다. 예전에는 심의를 열 때 걸린 그림만 판독했고, 도중에 받은 그림은 주소 글로만 갔습니다."
      - "판독하지 못한 그림(그림을 읽는 모델이 없는 박스 · 조회 한 번의 상한 8장 밖 · 판독 실패)은 라운드마다 상태 줄과 근거 카드로 알립니다. 같은 그림은 한 번 읽은 판독문을 다시 씁니다."
  - date: 2026-10-22
    title: "좌석 조회 그림 판독기를 에이전트 서버 기동 때 엔진에 답니다(기술)"
    tag: 기술
    items:
      - "웹 챗의 /심의 · MCP 심의 잡 · 리스크 패널 심의가 모두 같은 판독기를 씁니다 — MCP 심의 잡은 심의를 열 때의 그림 준비를 지나지 않아, 요청 길이 아니라 엔진에 답니다."
      - "판독은 서버 전체에서 한 번에 한 묶음(묶음 안 넷)씩 돌아 20석이 한꺼번에 판독해도 챗 서버를 혼자 차지하지 않습니다. 판독문은 조회 예산을 쓰지 않습니다."
  - date: 2026-10-21
    title: "개인 토큰 › 외부 연결에 FMEA Agent · MatNexus 같은 플랫폼 카드가 설정대로 생깁니다"
    tag: 연결
    items:
      - "운영자가 박스 설정에 플랫폼을 적으면 '외부 연결' 탭에 그 플랫폼의 토큰 등록 카드가 생깁니다 — 화면을 다시 빌드하지 않습니다. 그쪽에서 발급한 개인 토큰을 붙여 넣으면 Claude · 챗이 그 플랫폼을 내 토큰으로 부릅니다('Bearer ' 까지 붙여 넣어도 됩니다)."
      - "이 토큰의 주인은 확인하지 않습니다 — 등록한 토큰의 계정 명의로 기록되니 남의 토큰이나 HWAX 포털 토큰은 넣지 마세요(포털 토큰은 등록 단계에서 거절합니다). 등록 · 해제는 브라우저 로그인으로만 됩니다(개인 토큰 PAT 로는 안 됩니다)."
      - "그 플랫폼 권한만 있어도 '연결 설정' 메뉴로 들어갑니다 — 예전에는 API 토큰 · Report Archive 권한이 없으면 '내 권한' 으로 튕겼습니다(TestScope 도 함께 풀립니다). 권한이 없는 플랫폼 카드는 '권한 요청' 이나 '관리자에게 문의' 를 보입니다."
      - "더 이상 연결하지 않는 플랫폼에 남은 내 토큰은 카드 아래에 보이고 지울 수 있습니다."
  - date: 2026-10-21
    title: "외부 연결 플랫폼을 게이트웨이가 설정만으로 붙이고 뗍니다(기술)"
    tag: 기술
    items:
      - "포털 박스 권한표(access.local.yaml)의 플랫폼 항목에 connect: 블록 하나를 적으면 포털은 다음 요청부터, 게이트웨이는 다음 패스(최대 약 2분, /refresh 면 바로)에 붙입니다 — 코드 · 빌드 · 재기동이 없습니다. 추적 권한표에 적힌 connect 는 읽지 않습니다(박스 파일에서만). 틀린 블록은 그 블록만 버리고 알립니다."
      - "게이트웨이는 그 플랫폼의 도구 목록만 사람 없이 받아 두고(목록 전용 세션), 호출은 언제나 부르는 사람이 등록한 토큰으로 보냅니다. 신원 없는 호출은 거절하고, 권한 행이 없거나 선언이 지워지면 내부 서비스 호출에도 닫힙니다. 감사 줄에 토큰 지문(tok:)을 남기고, 상태는 /health 의 conn_platforms 로 봅니다."
      - "도구 이름이 기존 앱과 겹치면 새 플랫폼 쪽 도구에만 접두가 붙습니다 — MaterialTwin · SignalForge 의 get_material 같은 이름은 그대로 불립니다. 선언의 read_tools 로 읽기 도구를 정하면 읽기 전용 토큰과 응답 캐시가 그것을 따릅니다(그 밖의 도구는 캐시하지 않습니다)."
      - "게이트웨이의 주기 재활 패스와 /refresh 가 겹쳐 돌면 한 패스가 백엔드 표를 도는 사이 다른 패스가 표를 바꿔 패스가 죽을 수 있던 것을 막았습니다(잠금)."
      - "update-all 의 MCP 스모크는 외부 연결 플랫폼을 신원 없이 부르지 않고, 다운이면 '그쪽 서버 상태' 로 알리며 되살리려 하지 않습니다."
  - date: 2026-10-21
    title: "Claude 로 돌린 심의에서도 전문가가 도구로 조회합니다"
    tag: 심의
    items:
      - "판단 LLM 을 Claude 로 고른 심의는 지금까지 전문가가 도구를 부를 수 없어 근거와 지식카드만으로 발언했습니다(evidence_only). 이제 전문가가 부를 도구를 적으면 에이전트 서버가 그 도구를 실행해 결과를 돌려줍니다 — 이 박스의 LLM 으로 돈 심의와 같은 도구 · 같은 호출 상한 · 같은 근거 기록입니다. 대신 전문가마다 조회 과제가 몇 개 더 듭니다."
      - "리스크 심사의 Tier 패널 잡(A · B · C)도 판단 LLM 을 Claude 로 고를 수 있습니다 — 검토 잡과 같이 반출 동의(JSON true)가 있어야 하고, 동의한 사람의 PAT 로만 돌며, 그 사람이 Claude Code 에서 hwax-risk-claude 워크플로를 돌려야 나아갑니다."
      - "리스크 대상이 없는 일반 심의(MCP deliberate_start 를 Claude 로 연 것)도 그 심의 잡 id 로 hwax-risk-claude 워크플로가 맡아 답합니다(jobId)."
  - date: 2026-10-21
    title: "Claude 로 돌린 심의의 그림 안내를 바로잡았습니다"
    tag: 수정
    items:
      - "Claude 로 돌린 심의에 그림이 있으면 '그림 N장을 좌석 · 의장 호출마다 싣는다' 고 말했지만 실제로는 그림이 빠졌습니다(Claude 과제는 글뿐입니다). 이제 그림 자체는 싣지 않는다고 바로 말하고, 그림을 글로 옮긴 판독문은 종전처럼 근거로 갑니다."
  - date: 2026-10-21
    title: "Claude 길 심의 — 글 왕복 조회 · 잡 id · 패널 잡(기술)"
    tag: 기술
    items:
      - "에이전트 서버 — 외부 응답자(llm=external) 심의가 free_tools 를 0 으로 닫지 않습니다. _TextReactAgent 가 create_react_agent 자리에 들어가 좌석 도구 목록(이름 · 설명 · 인자 스키마)과 규약을 과제에 싣고, 답의 `CALL {\"tool\": …, \"args\": {…}}` 줄을 엔진이 실행합니다(호출 합 tool_budget · 차례 tool_budget+1, 목록 밖 · 깨진 줄 · 예산 밖은 실행하지 않고 까닭을 알림). result 프레임 · MCP 잡 기록의 tool_mode 는 실제로 돈 길(tools · evidence_only)이고, external_closed · external_forced 는 걷었습니다."
      - "에이전트 서버 — MCP 심의 잡의 외부 과제 머리 · 기록에 job_id 를 싣습니다(포털 /chat 심의에는 없음). 외부 응답자 심의에 그림이 오면 그림 조각(DELIB_IMAGES)을 세우지 않습니다."
      - "리스크 앱 — 패널 잡(mode=panels)이 llm=claude 를 받습니다(check_llm_choice · resolve_job_credential · require_external_llm — 검토 잡과 같은 문, Claude 패널 잡만 감사 job.create 한 행). 살아 있는 같은 Tier 잡의 판단 LLM 이 다르면 그 잡을 돌려주며 differs: ['llm'] 을 답합니다. 통합 보고서 [패널] 줄에 외부 응답자 패널만 llm=external 을 붙이고, 쟁점 패널의 판단 LLM 줄은 패널 tool_mode 로 '글 왕복' · 'evidence_only' 를 가릅니다."
      - "포털 워크플로 hwax-risk-claude.js — jobId · jobIds 를 받아 그 잡의 과제도 맡고(target_key 또는 job_id), 답 지시에 좌석 조회 과제의 CALL 줄 꼴을 적었습니다(도구는 엔진이 실행 — 응답자는 부르지 않음)."
      - "에이전트 서버 MCP deliberate_jobs — 외부 응답자 길이 열린 서버에서 limits_external(외부 창으로 잰 근거 · 사람 의견 상한)을 더합니다. 진행판(리스크 앱 coverage)의 Claude 패널 잡에 판단 LLM 칸이 붙습니다."
  - date: 2026-10-21
    title: "쟁점 패널 — 카드 절은 다 들어가면 원문 그대로 싣습니다(1M 창에서 잘라내지 않음)"
    tag: 수정
    items:
      - "오늘 앞서 올린 '긴 카드 절은 인용 둘레로' 가 근거 칸이 넉넉한 1M 창에서도 긴 절을 잘랐습니다. 이제 인용된 절이 근거 칸에 다 들어가면 원문 그대로 싣고, 칸이 모자랄 때만 긴 절을 인용 둘레로 줄여 더 많은 카드 절이 실리게 합니다."
  - date: 2026-10-21
    title: "리스크 심사 보고서에 '누락 0 증명' 줄이 붙습니다"
    tag: 심의
    items:
      - "전문가 · 종합 보고서의 검토 품질 블록에 '[누락 0 증명]' 줄이 실립니다 — 닫힌 칸마다 지식카드가 어떤 길로 전문으로 읽혔는지(판정 · 카드 밖/입력 결손 호출의 전문 · 훑기의 전문 대조)를 세고, 어느 길로도 읽히지 않은 카드(놓침)를 셉니다."
      - "놓친 카드가 하나라도 있으면 그 칸과 카드가 불변식 목록에 적히고 종합 보고서의 완결이 서지 않습니다 — 조용히 '다 봤다' 로 닫지 않습니다. 이 기능 전에 닫힌 칸은 '모름' 으로 따로 셉니다."
  - date: 2026-10-21
    title: "쟁점 패널 — 긴 카드 절도 인용 둘레는 실리고, 전문가가 절 전문을 다시 읽을 수 있습니다"
    tag: 심의
    items:
      - "쟁점 패널 근거의 '인용된 카드 절' 이 칸보다 긴 절을 통째로 건너뛰던 것을 고쳤습니다 — 이제 인용 둘레를 싣고 그 절이 몇 자 가운데 얼마인지 적습니다. 창이 작은 모델에서 긴 절을 가진 카드의 원문이 패널에 하나도 안 실리던 자리입니다."
      - "패널 전문가는 근거에 표시된 카드 절을 AIDataHub 에서 절 단위로 다시 읽을 수 있습니다(get_record_sections) — 리스크 심사에서 앱 제한으로 빠지던 읽기 도구를 늘 남기고 도구 순위 맨 앞에 둡니다."
  - date: 2026-10-21
    title: "카드 커버리지 · 패널 근거(기술)"
    tag: 기술
    items:
      - "리스크 앱 — 카드 밖 · 입력 결손 호출의 마지막 답에서 셀 extras_json.coverage = {cards, judged, full, swept_only, missed[], hit_title[]} 를 적습니다(스키마는 그대로 v5). 불변식 G10 — 닫힌 셀의 missed 가 비어야 합니다. 훑기 기록(sweep_json.gaps)과 엔진 meta.aliases.cards(전문으로 실린 카드)로 셈합니다."
      - "에이전트 서버 — 쪽으로 나눠 부른 결과의 meta.aliases.cards 를 전문으로 실린 카드만으로 바로잡았습니다(한 번에 부른 호출과 같은 뜻). 리스크 심사 좌석의 유지 도구(_RISK_KEEP_TOOLS)에 get_record_sections 를 넣고 좌석 도구 순위 고정에 더했습니다(프롬프트는 그대로)."
      - "리스크 앱 — 쟁점 브리프 I6 은 절이 I6 칸의 1/3(바닥 400자)을 넘으면 인용 둘레만 싣고 meta.cited_sections{sections, full, excerpt, no_text, omitted} 를 셉니다."
  - date: 2026-10-21
    title: "리스크 심사 — 변경 단위가 커도 멈추지 않고 카드를 나눠 검토합니다"
    tag: 심의
    items:
      - "변경 단위가 커서 지식카드 한 장과 함께 모델 창에 들지 않으면, 예전에는 그 단위의 검토가 '창이 작다' 로 멈췄습니다(사람이 풀어야 하는 보류). 이제 그 카드를 그 단위와 함께 들 만큼 조각으로 나눠 묻고 한 판정으로 합칩니다."
      - "카드 밖 리스크를 찾는 호출은 단위가 창을 거의 다 쓰면 반드시 전문으로 실어야 할 카드를 실을 자리가 없을 수 있습니다 — 그때는 멈추지 않고 그 카드를 제목으로 두되, 몇 장을 그렇게 했는지 기록에 남깁니다(그 카드는 훑기에서 이미 전문으로 그 단위와 맞대어 봤습니다)."
  - date: 2026-10-21
    title: "큰 단위의 카드 조각(기술)"
    tag: 기술
    items:
      - "에이전트 서버 card_review — prepare 가 카드 한 장의 verdict · sweep 이 창을 넘으면(over_budget) 그 카드를 조각 냅니다. 조각 크기는 한 장 자리(card_room)와 '이 단위와 함께 들 자리'(카드 − 넘친 만큼 − 보충 지적 블록 몫 hint_max) 가운데 작은 것의 90%이고, 돌릴 바닥(RUN_FLOOR 1,000자) 밑이면 나누지 않습니다. 자리가 좁으면 조각 틀에서 전체 목차를 뺍니다. 통째로 드는 카드는 한 장 자리를 넘어도 조각 내지 않습니다."
      - "계획(/card-review/plan)은 조각을 켠 창에서 돌릴 바닥만큼의 카드 자리도 못 남기는 단위만 oversize 로 둡니다(종전: 가장 큰 카드 한 장과 함께 넘으면). 카드 밖 · 입력 결손은 반드시 전문인 카드를 실을 자리가 없으면 제목으로 내리고 meta.must_dropped 로 셉니다."
  - date: 2026-10-21
    title: "리스크 심사 — 훑기에 걸린 카드는 카드 밖 · 입력 결손 검토에서도 제목이 아니라 전문으로 봅니다"
    tag: 심의
    items:
      - "카드 밖 리스크를 찾는 호출과 입력이 빠진 전문가의 호출이 카드를 '몫' 만큼만 전문으로 싣고 나머지는 제목으로 내렸습니다. 창이 20만 토큰인 모델에서는 그 몫이 2만여 자라 훑기에서 이 단위에 걸린다고 한 카드 한 장도 제목으로 내려갔습니다."
      - "이제 그 단위의 훑기에 걸린 카드와, 훑기가 실패해 답이 없는 카드는 반드시 전문으로 싣습니다 — 몫을 넘어도 모델 창 한도까지 싣고, 그래도 넘치면 나눠서 여러 번 묻고 한 답으로 합칩니다. 나머지 카드는 훑기에서 이미 전문으로 그 단위와 맞대어 봤기 때문에 제목으로 둡니다."
  - date: 2026-10-21
    title: "카드 밖 · 입력 결손 쪽 실행(기술)"
    tag: 기술
    items:
      - "에이전트 서버 card_review — run 요청에 extra.must_full(offcard · noinput, 실린 카드 안의 별칭)을 받습니다. 그 카드는 몫(body)이 아니라 창 한도(p_hard − 선언한 틀 몫 − 단위)까지 싣고, 넘으면 쪽마다 보통 run 을 돌려(status{page, of}) 코드로 합칩니다 — 같은 줄 하나로, m 은 합, more 는 '더 있다' 가 이기고, none 은 지적이 없을 때만, maybe_more 는 쪽의 답을 모읍니다. 결과의 meta.paged{n, pages, must_full} 에 남습니다."
      - "limits 에 features(chunk · must_full)를 더했습니다 — 리스크 앱은 여기 있을 때만 새 칸을 보냅니다(옛 엔진은 모르는 칸을 거절합니다). 리스크 앱은 훑기의 실패한 (묶음, 목록 쪽)을 훑기 기록(sweep_json.gaps)에 적어 그 카드를 그 단위에서 반드시 전문으로 알립니다."
  - date: 2026-10-21
    title: "리스크 심사 — 창이 20만 토큰인 모델에서도 긴 지식카드를 멈추지 않고 나눠 검토합니다"
    tag: 심의
    items:
      - "카드 한 장이 모델 창에 한 번에 들지 않으면, 예전에는 그 전문가의 검토가 '창이 작다' 로 통째로 멈췄습니다. 이제 그 카드를 절 → 문단 → 문장 경계에서 조각으로 나눠 조각마다 한 번씩 묻고, 결과는 카드 한 장의 판정으로 합칩니다(dev 표본 32명으로 계획해 보니 멈추던 전문가 19명 · 카드 143장이 모두 조각으로 잡혔습니다)."
      - "조각들의 판정이 갈리면(한 조각은 걸림, 다른 조각은 문제없음) 두 쪽이 인용한 대목만 모아 그 카드를 한 번 더 판정합니다. 조각 하나라도 끝내 답을 못 받으면 나머지만으로 '판정함' 으로 두지 않고 다시 냅니다."
      - "창이 1백만 토큰인 박스에서는 동작이 그대로입니다 — 한 번에 들지 않는 카드가 없어 조각이 생기지 않고, 검토 판(지문)도 바뀌지 않아 도는 검토를 다시 시작하지 않습니다."
  - date: 2026-10-21
    title: "카드 대조 조각 실행(기술)"
    tag: 기술
    items:
      - "에이전트 서버 card_review — 계획(/card-review/plan)이 한 장 자리(card_room)를 넘는 카드를 oversize 대신 혼자 한 묶음(chunked · 조각 수 어림 chunks)으로 냅니다. run 이 그 카드를 조각(별칭 K12.1 …)마다 보통 run 으로 돌려(status{chunk, of}) 한 행으로 합치고, 갈리면 재판정(status{step: reconcile})을 부릅니다. 결과의 meta.chunked{parent, n, aliases, reconcile, unjudged} 에 남습니다."
      - "조각 크기 상수(CHUNK_SHARE 0.9)는 계획 · 판(limits_rev)에 넣지 않습니다 — 넣으면 1M 박스의 셀 지문까지 바뀝니다. 조각 호출에 모델이 원래 별칭(K12)으로 답하면 그 조각의 답으로 읽습니다(버리면 조각째 실패했습니다)."
  - date: 2026-10-20
    title: "리스크 심사 쟁점 패널 — 근거 칸이 모자랄 때 반대 측 카드가 먼저 빠지지 않습니다"
    tag: 수정
    items:
      - "쟁점 패널 근거의 '인용된 카드 절' 을 제기 측과 반대 측이 번갈아 싣습니다. 예전에는 제기 측을 먼저 다 싣고 반대 측을 뒤에 실어, 칸이 모자라면 반대 측 카드가 먼저 빠졌습니다(1백만 토큰 창에서는 거의 생기지 않고, 창이 작은 모델에서 드러납니다)."
      - "칸보다 긴 카드 절 하나가 그 뒤의 절을 모두 막던 것을 고쳤습니다 — 그 절만 건너뛰고 뒤의 절은 싣습니다. 빠진 줄 수는 패널 품질 기록에 그대로 남습니다."
  - date: 2026-10-20
    title: "MatNexus · FMEA Agent 를 설정만으로 붙일 준비(기술)"
    tag: 기술
    items:
      - "다른 조직 서버의 MCP 를 게이트웨이 설정 몇 줄로 붙입니다 — 사람별 위임 목록(PER_USER_SSO_APPS)의 앱에 <접두>_MCP_URL 을 더하면 같은 이름의 MCP 백엔드가 생기고, 호출은 그 사람 이름으로 받은 토큰으로만 나갑니다(서비스 토큰을 싣지 않습니다). 게이트웨이가 원래 만드는 백엔드 이름과 겹치면 덮지 않고 알립니다."
      - "MatNexus 와 FMEA Agent 를 권한표 · 앱 목록에 넣었습니다 — 박스에 주소를 넣기 전에는 어디에도 보이지 않습니다. MatNexus · TestScope 는 그쪽이 사람별 토큰 발급 창구를 이미 갖춰, 박스 설정과 공유 비밀만 남았습니다."
      - "update-all 이 그 백엔드가 게이트웨이에서 빠졌는지 보고(빠지면 다시 프로비저닝), 그 서버 주소가 사내 프록시 우회(NO_PROXY)에 들어 있는지도 봅니다."
      - "10-21 — MatNexus · FMEA 는 토큰 등록(외부 연결 connect:)으로 바뀌었습니다. 위의 사람별 위임 · 공유 비밀 길은 이 둘에는 쓰지 않습니다(10-21 '외부 연결' 항목)."
  - date: 2026-10-20
    title: "개인 토큰 화면에서 인증서만 따로 받고, 배치 없이 직접 설정하는 명령을 봅니다"
    tag: 연결
    items:
      - "설치 배치파일 옆에 '인증서 내려받기 (.crt)' 버튼이 생겼습니다. 토큰을 새로 발급하지 않아도 개인 토큰 탭의 '포털 인증서' 칸에서 받을 수 있습니다 — 이미 등록한 설정에 인증서만 넣거나 배치를 못 쓰는 PC 에서 씁니다."
      - "'배치파일 없이 인증서로 직접 설정하기' 안내가 생겼습니다 — 인증서를 제자리에 두기, 회사 인증서와 한 파일로 묶기(PowerShell), 연결 확인(node 한 줄 — OK HTTP 200 이면 됩니다), Claude Code 등록, Claude Desktop 설정 조각, 모든 Node 프로그램에 늘 적용(setx)을 차례로 복사해 씁니다."
      - "화면에 보이는 수동 등록 명령이 설치 배치와 같은 인증서 묶음(%USERPROFILE%\\.hwax\\hwax-ca-bundle.pem)을 가리킵니다 — 예전에는 포털 인증서만 가리켜 사내 프록시 뒤 PC 에서 배치와 결과가 달랐습니다."
  - date: 2026-10-20
    title: "**Claude 설치 파일(hwax-claude-setup.bat)이 Store 판 · 사내망 · 토큰 갱신에서도 붙습니다**"
    tag: 연결
    items:
      - "Microsoft Store 에서 설치한 Claude 도 hwax 가 보입니다 — 설치판 설정과 함께 Store 판 설정 위치도 찾아 고칩니다(어느 파일을 고쳤는지 줄마다 보여 줍니다)."
      - "설정에 NO_PROXY 와 no_proxy 가 함께 있어도 멈추지 않습니다 — 대소문자를 구분해 읽고 두 값을 그대로 둡니다. 고치기 전 원본은 .bak 으로 남깁니다."
      - "사내망 설정을 기본으로 넣습니다 — hwax 의 NO_PROXY 에 포털 주소 · localhost · 127.0.0.1, 회사 인증서는 PC 의 윈도우 신뢰 인증서를 포털 인증서와 한 파일로 묶어 씁니다(사람마다 경로를 몰라도 됩니다)."
      - "토큰을 다시 받아 실행해도 손으로 맞춘 설정이 지워지지 않습니다 — 토큰과 주소만 바꾸고, 직접 넣은 NO_PROXY · 회사 인증서 경로는 그대로 둡니다."
      - "Claude Desktop 이 켜져 있으면(창만 닫아 트레이에 남은 경우 포함) 아무것도 바꾸지 않고 멈춰 '트레이 아이콘까지 종료' 를 안내합니다 — 켠 채 설치하면 종료할 때 예전 설정으로 되돌아갔습니다."
  - date: 2026-10-19
    title: "로그 회전 넓힘 · 남은 점검 넷(기술)"
    tag: 기술
    items:
      - "MX WhitePaper 시험이 dev 에서 380여 건 401 로 깨져 있던 것을 고쳤습니다 — 08-19 보안 수정이 개발용 인증 우회의 기본을 닫은 뒤 시험이 그대로였습니다. 시험 프로세스에서만 켜고, 닫힌 기본값을 지키는 시험을 더했습니다(전체 1,204 통과)."
      - "AI 데이터허브 임베딩 백필이 GPU 가 바쁠 때 묶음마다 실패하던 것을 고쳤습니다 — 검색 질의처럼 CPU 로 내려가 다시 인코딩합니다."
      - "백서 분석(mx-whitepaper-analyst)과 VOC 분석(market-voc-analyst) 전문가가 늘 '자료를 찾지 못했다' 로 거절하던 것을 고쳤습니다 — 문서 종류를 태그 조건으로 잘못 적어 묶인 카드가 전부 걸러졌습니다. 이제 백서 좌석은 질의마다 10건, VOC 좌석은 2~4건을 찾습니다."
      - "죽은 서비스를 다시 띄우는 감시를 더했습니다 — 포털 · 게이트웨이 · 에이전트 서버 · mxwp-mcp · searxng 가 죽으면(포트에 연결 거부가 세 번) 다시 뜹니다. 느리거나 오류를 내는 것은 건드리지 않습니다. dev 는 켰고 운영 서버는 infra/.env 에 HWAX_WATCHDOG=1 을 적으면 켜집니다. KooRemapper 감시도 MCP 가 응답하는지 봅니다."
      - "허브 백엔드 · 워커 · beat 와 AI 데이터허브 API, 포털이 띄운 서비스들의 로그도 매일 · 200MB 마다 돌립니다. 회전 직전에 그 로그를 쥔 프로세스가 모두 이어 쓰기(O_APPEND)인지 보고, 옛 방식으로 연 프로세스가 남아 있으면 그 로그만 이번 회전을 건너뜁니다(자르면 파일 앞이 빈 바이트로 채워지기 때문). 그 프로세스가 다시 뜨면 저절로 돕니다."
  - date: 2026-10-18
    title: "**토큰 하나로 허브 앱까지 — 포털 개인 토큰으로 허브 앱을 열고, 읽기 전용 토큰은 조회만 합니다**"
    tag: 연결
    items:
      - "포털에서 만든 개인 토큰(PAT)으로 HEAX 허브 안의 앱(/apps/…)도 열립니다. 열리는 앱은 허브의 권한 그대로입니다. 허브에 한 번도 들어간 적이 없으면 '포털에서 HEAX Hub 타일을 한 번 눌러 허브에 로그인한 뒤 다시' 라고 안내합니다."
      - "읽기 전용 토큰(read 만 가진 토큰 — 지금은 리스크 앱의 교환 토큰)은 게이트웨이에서 조회 도구만 부릅니다. 읽기로 확인한 도구 목록 · 도구가 스스로 밝힌 읽기 표시 · 게이트웨이의 조회 도구만 열리고, REST 다리와 허브 앱은 GET · HEAD 만 통합니다."
      - "폐기한 토큰은 허브에서도 1분 안에 막힙니다. 포털에 닿지 않아 폐기 목록을 한 번도 못 읽었으면 허브는 포털 토큰을 받지 않고(503) 그 까닭을 돌려줍니다."
  - date: 2026-10-18
    title: "**같은 소속의 심의를 볼 수 있습니다** — 남의 심의는 주인 · 같은 소속 · 관리자만"
    tag: 심의
    items:
      - "심의의 상태 · 결과 · 발언 기록 · 이어하기가 이제 주인 · 같은 소속 · 관리자에게만 열립니다. 예전엔 잡 번호만 알면 누구나 남의 결정문을 보거나, 이어하기로 내 심의에 옮겨 올 수 있었습니다."
      - "심의 목록에는 내 것과 같은 소속 사람의 것이 주인 표시와 함께 나옵니다. 소속은 심의를 시작할 때의 포털 소속으로 정하고, 주인이 적히지 않은 옛 심의는 관리자만 봅니다."
  - date: 2026-10-18
    title: "도구 검색 실사용 질의 모으기 · 평가셋 검토 화면 · 심의 A/B 러너 · 허브 진입 토큰과 감시(기술)"
    tag: 기술
    items:
      - "게이트웨이 search_tools 의 질의를 이름 · 주소 없이 30일 동안 모읍니다(날짜 · 질의 · 순위 방식 · 상위 다섯 — tool_search_eval/queries.local.jsonl, 첫 줄 날짜부터 30일 뒤 저절로 멈춤, 끄기 GATEWAY_TOOL_QUERY_LOG=0). 의미 순위(RRF)를 켤지 실사용 질의로 다시 재려는 것입니다."
      - "도구 검색 평가셋 150쌍의 검토 화면(claude.ai 아티팩트 — 두 순위의 상위 다섯을 보고 맞음 · 고침 · 빼기)과, 그 표시를 평가셋에 되돌리는 tool_search_eval/apply_review.py 를 두었습니다."
      - "심의 A/B 러너(tools/delib_ab.py)가 결정문을 못 잡던 것 · 기본 주소가 :8000 이던 것 · 사내 프록시를 타던 것을 고쳤고, 재는 심의는 RA 보고서를 남기지 않습니다(--save-report 로 남김). 근거 선주입(T1)을 cae00 에서 재기 전에 드러났습니다."
      - "허브 · SignalForge · MX WhitePaper 의 포털 진입 토큰 확인이 필수 클레임(aud · jti · exp · sub)을 실제로 요구합니다. python-jose 가 'require' 목록을 말없이 버려 aud 없는 토큰이 청중 확인을 건너뛰었고 jti 없는 토큰은 500 이었습니다. 포털의 진입 토큰은 넷을 늘 싣으므로 로그인은 그대로입니다."
      - "허브 감시가 막 띄운 백엔드를 기동 중(앱 재등록에 1분 넘게)에 죽이고 두 번 띄우던 것을 고쳤습니다. 띄운 뒤 300초는 기다리고, 백엔드 · 워커 · beat 로그를 다시 띄울 때 지우지 않습니다."
  - date: 2026-10-18
    title: "**그림 인식 — 진짜 그림 모델로 확인했고, 처음 그림이 조용히 빠지던 것을 고쳤습니다**"
    tag: 수정
    items:
      - "작은 그림 모델을 잠깐 띄워 실제로 돌려 봤습니다 — 올린 응력 지도에서 최대값 · 부품을, 다음 질문에서 앞 그림의 제목을, 도구가 낸 그래프에서 봉우리 값 · 시각 · 한계값을 그림만 보고 읽었고, 심의는 그림 판독문을 근거로 실었습니다."
      - "막 뜬 서버나 바쁜 서버는 '그림을 받는가' 확인이 15초를 넘겨, 그 턴의 그림이 빠지고 '이 챗 모델은 그림을 읽지 못한다' 로 보였습니다. 확인 한도를 120초로 늘렸고, 확인하지 못한 것은 '그림을 받는지 아직 모른다(까닭)' 로 따로 알립니다."
      - "기술 — 그림 탐침의 까닭을 에이전트 서버 로그와 /health vision 의 why 에 남깁니다(VISION_PROBE_TIMEOUT_S 120). 그림 · 다중모달을 말하는 400 만 '못 받는다' 로 굳히고 다른 400 은 다시 묻습니다."
  - date: 2026-10-18
    title: "**챗이 그림을 봅니다** — 올린 그림 · 도구가 낸 그림 · 앞 대화의 그림을 모델이 직접 보고 판단합니다"
    tag: 챗
    items:
      - "입력창에 그림을 붙여넣거나(Ctrl+V) '파일 붙이기'(+)로 고르면(PNG · JPG · GIF · WEBP, 한 번에 12장 · 한 장 8MB) 그 질문과 함께 모델에 갑니다. 큰 그림은 긴 변 1,568px 로 줄여 보내고, 보낸 그림은 내 메시지 아래에 남습니다."
      - "도구가 그래프 · 응력 지도 같은 그림을 내면 모델이 그 그림을 직접 보고 다음 판단을 합니다. 예전엔 그림 주소 글자만 갔습니다."
      - "다음 질문 · 띵킹 · 심의로 넘어갈 때 앞 대화의 그림(최근 6장)도 같이 갑니다. 다른 기기에서 연 대화도 같습니다."
      - "띵킹 · 심의 — GLM 이 그림을 받으면 그림을 그대로, 못 받으면 Qwen 이 그림마다 읽은 판독문(수치 · 축 · 범례 · 표)을 근거로 싣습니다. 심의는 판독문을 근거 목록에 남겨 결정문이 짚을 수 있습니다."
      - "그림을 싣지 못하면(모델이 그림을 못 읽음 · 서버에서 지워짐 · 너무 큼 · 그림이 아님) 화면에 그 사실을 한 줄로 알립니다."
  - date: 2026-10-18
    title: "**챗이 깊게 생각합니다** — 생각 모드 최고 강도 · 생각하는 동안 '생각 중' 칸 · 답한 모델 표시"
    tag: 챗
    items:
      - "챗 기본 모델(stcx Qwen)이 생각 모드를 최고 강도(xhigh)로 켜고 답합니다(10-17 의 '생각 끔' 을 뒤집은 사용자 결정). 답이 느려지는 대신 깊어집니다."
      - "생각하는 1~2분 동안 메시지 위 접힌 '생각 중' 칸에 생각 글이 실시간으로 흐릅니다. 펼쳐 볼 수 있고, 다음 질문의 대화 이력에는 넣지 않습니다."
      - "메시지 아래에 답한 모델과 생각 강도가 보입니다 — Qwen 이 응답하지 못해 GLM 이 답했으면 그것도 보입니다."
      - "긴 대화로 창이 가득 차 생각할 자리가 없어지지 않게, 챗의 대화 · 문서 · 도구 예산을 출력 몫(65,536 토큰)을 뗀 창에서 잡습니다."
  - date: 2026-10-18
    title: "**앞 턴에서 조회한 값을 다음 질문 · 띵킹 전문가가 기억합니다**"
    tag: 챗
    items:
      - "앞 턴에서 도구가 조회한 결과(어떤 도구를 · 어떤 인자로 · 무엇이 나왔는지)가 다음 질문의 대화 이력에 함께 실립니다. '아까 그 값' 을 다시 조회하거나 지어내던 것을 줄입니다."
      - "띵킹(전문가 자문)의 각 전문가가 앞 대화와 그 조회 결과를 받아 답합니다. 전문가를 찾는 검색어에는 대화 화두만 써서 엉뚱한 전문가가 불리지 않게 했고, 전문가 한 명의 답 한도는 30분입니다."
  - date: 2026-10-18
    title: "**챗에서 일부 앱 도구가 통째로 빠지던 것 · 「앱」 검색이 허브 앱을 못 찾던 것 · DynaForge DB 감시 고침**"
    tag: 수정
    items:
      - "도구 설명이 챗 모델의 예산(창의 45%)을 넘으면 뒤에 있던 앱의 도구가 통째로 빠졌습니다(10-18 운영 — MaterialTwin 34개). 이제 질문과 관련 없는 것부터 빼고, 도구를 찾아 부르는 안내 도구 셋은 늘 남깁니다."
      - "포털 「앱」 검색이 HEAX 허브 안의 앱(MaterialTwin · StepForge 등)도 찾고, 고르면 허브의 그 앱 화면을 새 탭으로 엽니다."
      - "DynaForge 의 감시가 데이터베이스가 죽은 것을 18시간 동안 못 보던 것을 고쳤습니다 — 감시가 DB 가 실제로 접속을 받는지 보고, 응답이 없으면 다시 띄웁니다. 헬스 점검도 DB 를 봅니다."
  - date: 2026-10-18
    title: "챗 생각 손잡이 · 이력 근거 · 띵킹 세션 맥락 · 도구 절단 표시 · 그림 판정 · 감시 판정(기술)"
    tag: 기술
    items:
      - "에이전트 서버 — CHAT_LLM_ENABLE_THINKING 기본 1 · CHAT_LLM_REASONING_EFFORT(xhigh) · CHAT_LLM_MAX_TOKENS(기본 보내지 않음 — stcx 서버가 131,072 로 막는다) · CHAT_LLM_OUTPUT_RESERVE(65,536 — 챗 턴의 창에서 뗀다). /health chat_llm 에 effort · max_tokens · output_reserve."
      - "챗 이력 항목에 evidence({tool, args, result}) — 화면이 활동 기록에서 모으고(글 먼저 · 남는 몫에 근거), 포털이 받아 이력 합계 상한에 세어 넘기고, 에이전트 서버가 HIST_EVIDENCE_SHARE(0.5) 몫 안에서 그 턴의 물음 뒤에 붙인다. 심의 전 도우미 셋에는 넘기지 않는다."
      - "띵킹 — THINK_WITH_HISTORY · THINK_SESSION_SHARE(0.4) · THINK_SESSION_SHARE_SOLO(0.85) · THINK_LLM(기본 GLM, chat 이면 Qwen) · THINK_SEAT_TIMEOUT_S 600→1800. 설정 킷의 참고 값도 맞췄다."
      - "도구 절단 — 무캡 경로가 넘칠 때만 관련도 순 · 안내대 셋(search_tools · invoke_tool · list_tool_apps)은 늘. /health tool_cut · 에이전트 서버 로그 '— 뺀 것:' · update-all 헬스게이트 「챗 도구 절단 N개」, 챗 스모크 한도 900초."
      - "그림 — LLM_VISION · CHAT_LLM_VISION(auto|1|0 — 그림이 실릴 때 빨간 그림으로 한 번 묻는다, 기동 때는 묻지 않는다), VISION_MAX_IMAGES 12 · VISION_MAX_BYTES 8MiB(포털 · 화면도 같은 수) · VISION_HISTORY_IMAGES 6 · VISION_TRANSCRIBE_MAX 8, /health vision. SSE user_images · reasoning · meta. 판독문은 그림 해시로 디스크에 남기고, 서버 대화 사본은 그림 주소를 답 meta(user_images)에 남긴다."
      - "KooRemapper 감시 — pg_isready 가 두 번 연속 무응답이면 stop → start, 같은 이름의 셸이 둘이면 알리기만, 헬스가 DB 때문에 503 이면 API 를 다시 띄우지 않는다, start.sh 가 rc 0 이어도 접속을 안 받으면 '복구 실패'. /api/health 에 database.ok(3초 한도)."
  - date: 2026-10-18
    title: "**챗 — 빠른 LLM 이 '글이 창보다 길다' 로 거절하면 GLM 으로 넘어갑니다**"
    tag: 챗
    items:
      - "챗 전용 LLM(stcx Qwen)이 요청을 '이 모델의 창보다 길다' 로 거절하면, 그 질문을 오류로 끝내지 않고 GLM 으로 넘깁니다. 잘못된 요청 같은 다른 거절은 예전처럼 넘기지 않습니다."
      - "stcx Qwen 을 1M 토큰 창으로 올리는(YaRN) 동안 창이 다른 복제본이 잠시 섞여도 챗이 끊기지 않게 하려는 것입니다. 올리는 절차는 docs/chat-llm-stcx/server-setup.md 9절이고 운영 서버에서 사람이 합니다."
  - date: 2026-10-18
    title: "**리스크 심사 기록을 매일 암호화해 백업합니다** — 평문 원장은 어느 길로도 Drive 에 가지 않습니다"
    tag: 수정
    items:
      - "리스크 심사 원장과 반출 파일을 age 로 암호화해 서버마다 따로 매일 03:30 에 Drive 로 올립니다(최근 5벌). 그동안 정기 백업이 없었고, 백업 스크립트는 암호 키를 넣어도 평문 원장을 함께 올렸습니다."
      - "허브 앱 데이터 백업은 암호 사본(.age)이 곁에 있는 평문을 누가 부르든 싣지 않습니다 — 포털 배포 묶음 길도 같습니다."
      - "리스크 앱의 '백업 평문' 경고(backup_unencrypted)가 키를 넣은 서버에서 사라집니다. dev 는 10-18 에 걸었고, 운영 서버는 절차서(docs/followups-1017/server-setup.md 4절)대로 겁니다."
  - date: 2026-10-18
    title: "허브 앱 기동 실패 억제 · 로그 이어쓰기와 회전 · 지식 리포 백업(기술)"
    tag: 기술
    items:
      - "늘 실패하는 통합 앱(예: heax_demo_nextjs)을 45초마다 다시 띄우지 않습니다 — 실패하면 60초부터 두 배씩 늦추고(최대 1시간), 매니페스트 · SIF 가 바뀌거나 운영자가 다시 배포하면 곧바로 다시 합니다. 그동안 그 앱 로그가 하루 약 16MB 씩 쌓였습니다(운영 서버 392MB). 앱 로그는 새로 띄울 때 64MB 를 넘었으면 한 벌만 넘깁니다. 스캔 요약은 억제 중인 앱을 실패로 셉니다."
      - "허브 백엔드 · 워커 · beat 로그와 AI 데이터허브 API 로그는 다시 띄울 때 지우지 않고 이어 씁니다(크면 한 벌만 넘김). Caddy 는 로그를 스스로 64MB 마다 돌립니다(5벌 · gzip — 운영 서버 557MB 였습니다)."
      - "MXWhitePaper 갱신이 이 계정의 apptainer 인스턴스 전부를 내리던 것을 고쳤습니다 — 이제 제 인스턴스 다섯만 내립니다."
      - "KooRemapper 배포 안내 문구의 'command not found' 두 줄을 고쳤습니다."
      - "ExpertAgents · ExpertGrounding 리포를 git 묶음과 커밋 안 된 변경 사본으로 매일 Drive 에 올립니다(dev 04:20 · 최근 5벌 · 안 바뀌면 건너뜀). 두 리포는 dev 한 대에만 있었습니다."
      - "공개 저장소의 설정 킷에 남은 사내 주소를 뺐습니다 — NO_PROXY 는 적용할 때 그 서버의 설정으로 채웁니다. 사내 주소를 적은 추적 파일이 0 이 됐습니다."
      - "10-17 밤에 고친 것 다섯 묶음(챗 LLM 넘김 · 업데이트 스크립트 · 지식카드 병합 · 허브 앱 데이터 병합 · 게이트웨이 로그)은 10-17 에 있습니다 — 이력 보충이라 팝업에는 안 뜹니다."
  - date: 2026-10-17
    title: "**챗 — 빠른 LLM 이 키를 거절하거나 첫 글자 전에 멈추면 GLM 으로 넘어갑니다**"
    tag: 챗
    items:
      - "챗 전용 LLM 이 401 · 403(키 거절)을 내거나 첫 조각 전에 멈추면, 그 질문을 오류로 끝내지 않고 GLM 으로 넘깁니다. 예전엔 300초를 기다린 뒤 챗 오류였습니다."
      - "에이전트 서버 /health 의 chat_llm 이 첫 답을 굳히지 않습니다 — 창 탐침은 200 만 받고 10분마다 다시 보며, 실패하면 그 사유(ctx_probe_error)를 보입니다."
      - "업데이트 스크립트가 챗 LLM 키 거절을 '서버에 닿지 않는다' 가 아니라 키 문제로 말합니다. 안내서의 '키는 없다' 를 바로잡았습니다."
  - date: 2026-10-17
    title: "**지식카드(AI 데이터허브) — BGE-M3 벡터가 병합에서 빠지던 것 · 기동 점검 고침**"
    tag: 수정
    items:
      - "운영 DB 이행이 늦은 채 병합이 돌면 새 열(BGE-M3 벡터)이 조용히 빠지고 다음 업데이트는 같은 덤프라 병합을 건너뛰었습니다 — 이제 빠진 열을 이름째 알리고, 다음 업데이트가 다시 병합합니다."
      - "레코드의 BGE-M3 시그니처가 병합으로 한 건도 오지 않던 것(운영 59,032건)을 고쳤습니다 — 비어 있고 제목 · 본문이 같으면 채웁니다. 운영에서 고친 레코드는 그 서버가 새 내용으로 다시 계산합니다. 병합은 운영의 수정 시각을 병합 시각으로 올리지 않고, 바뀌지 않은 행은 다시 쓰지 않습니다."
      - "기동이 이행 전에 '쉬는 트랜잭션' 의 pid · 시간을 보입니다(이행이 잠금으로 실패할 때 무엇이 쥐었는지 바로 압니다). 기동 때 임베딩 차원 점검이 늘 건너뛰어지던 것도 고쳤습니다."
      - "내부 동기화가 주소 가드에 막히면 원장에 '막힘' 과 사유를 남깁니다(예전엔 'ok' 그대로). 새 서버의 API 기본 바인드는 서버 안(127.0.0.1)입니다."
  - date: 2026-10-17
    title: "업데이트 · 배포 스크립트 고침 — 운영 서버 업데이트 리뷰 후속(기술)"
    tag: 배포
    items:
      - "서비스 로그를 다시 띄울 때 지우지 않고 이어 씁니다(폴더 700 · 파일 600). 게이트웨이는 gateway.log 한 곳에 쓰고, 로그에 찍히는 주소의 토큰 · 키 값은 *** 로 가립니다(httpx 요청 줄은 끕니다)."
      - "업데이트가 자동 보관(stash)할 때 비밀이 든 .env 손 백업을 쓸어 가지 않고, 쓸어 간 파일 목록에 추적 안 되던 파일도 보입니다."
      - "AI 데이터허브 병합이 '빠진 열' 로 끝나면 실패와 갈라 말하고 다음 업데이트가 다시 병합합니다."
      - "MCP 스모크가 인자를 요구하는 거절을 실패로 세지 않습니다. 재기동을 건너뛰었으면 'nginx reloaded' 라고 하지 않습니다. 허브 pip · npm 미러가 없으면 빨간 ✗ 대신 ○(건너뜀)입니다. 꺼진 상태판 · 호출 추적 이미지는 받지 않습니다."
      - "서비스 판정(services.py enabled)이 고장 나면 '이 서버 대상 아님' 이 아니라 '모름' 으로 답합니다 — 고장을 꺼짐으로 읽고 조용히 건너뛰던 것을 막습니다."
      - "허브 앱 데이터 병합이 SQLite 부속 파일(-wal · -shm)을 운영 DB 옆에 심지 않고, 병합 전 안전백업은 쓰는 중인 DB 도 온전히 뜹니다. MaterialTwin 병합이 나중에 채워진 발행처 때문에 같은 출처를 새로 넣던 것을 고쳤습니다."
  - date: 2026-10-17
    title: "**절차 실행 기록에 '합성 데이터' 경고가 남습니다** — 도구 설명에만 있던 경고 · 결과가 합성이라는 표시"
    tag: 수정
    items:
      - "절차를 돌릴 때(저장한 절차든 한 단계씩이든) 도구 설명이 '합성(synthetic) 데이터로 학습한 모델' 이라고 경고하면 그 문단을 단계 경고에 남깁니다 — 단계 화면과 배치 비교표의 경고 칸에 보입니다. 지금은 PCB 휨 대리모델(pcb_warpage_surrogate)이 해당합니다. 이 경고는 응답에 없고 설명에만 있어 그동안 실행 기록에서 빠졌습니다."
      - "결과에 따라 합성인 응답의 표시도 경고 칸에 올립니다 — 리포트 거동 군집이 합성(mock)일 때의 안내, 리포트 형상의 footprint 를 파트 id 로 지어냈을 때의 안내."
      - "'합성' 이라는 낱말만으로는 잡지 않습니다 — 복합재의 '완전합성' 이나 '합성 경로' 처럼 다른 뜻이 많습니다(게이트웨이 도구 519종 실측)."
  - date: 2026-10-17
    title: "**리스크 심사 — 다음 리비전에서 바뀐 부품을 인용한 의견이 재검토 없이 넘어가던 것을 고쳤습니다**"
    tag: 수정
    items:
      - "같은 과제의 다음 리비전을 열 때, 부품 키가 병합돼 있으면 옛 키를 인용한 좌석 의견이 '바뀐 부품' 을 못 알아보고 재검토 없이 승계됐고 과제 성격 서술에도 재확인이 안 섰습니다. 이제 둘 다 인용 키를 병합 끝까지 풀어 대조합니다(등록부는 이미 그렇게 하고 있었습니다)."
      - "StepForge(mcad) 소스를 붙이면 응답에 '격리 없음' 경고(stepforge_no_isolation)가 붙습니다 — StepForge 는 사용자 격리가 없어 누구나 같은 프로젝트를 봅니다. 웹 · MCP 둘 다이고, 화면 카드의 상시 경고는 화면 작업으로 따로 붙습니다."
      - "cae00 은 다음 update-all 이 새 리스크 앱 SIF 를 받으면 반영됩니다 — 도는 검토 잡이 없을 때 받습니다."
  - date: 2026-10-17
    title: "도구 인구조사 점검 · 에이전트 서버 /health 의 생성 파라미터(기술)"
    tag: 기술
    items:
      - "도구 인구조사(backend/scripts/refresh-census.py)가 백엔드가 내려가 통째로 빠진 도구를 '사라짐' 과 따로 보이고(게이트웨이 /health 로 까닭을 붙인다) 그런 때의 갱신을 막습니다(--force 로 사람이 넘긴다). 기록 나이도 보입니다. dev 실측으로 '사라짐 92' 는 내려간 두 백엔드 88종과 진짜 바뀐 4종이었습니다."
      - "에이전트 서버 /health 에 sampling(심의 LLM 의 temperature · top_p · max_tokens — 보내지 않는 값은 null)을 싣습니다. 리스크 앱이 패널의 모델 출처에 도장으로 남깁니다."
  - date: 2026-10-17
    title: "**리스크 심사 — 관련 없는 셀 거르기를 켭니다**(새 검토 잡부터 · 거르기 표 승인)"
    tag: 심의
    items:
      - "리스크 심사의 거르기 표(메커니즘 → 영역 52행 · 변경 → 메커니즘·역할 표)를 사용자가 그대로 승인했습니다. 새로 만드는 검토 잡부터, 코드 신호와 그 전문가의 훑기가 둘 다 '무관' 인 셀만 거릅니다. 지금 표대로면 거르기가 호출을 줄이는 영역은 mem · soc · std · sh · passive 다섯입니다."
      - "영역마다 1순위 대표는 거르지 않고, 거를 셀의 5%(최소 59건 · 영역마다 1건)는 끝까지 판정해 놓친 걸림을 잽니다. 놓친 걸림이 나온 영역은 그 대상에서 거르기를 넓혀 다시 봅니다. 이미 도는 잡은 만들 때의 승인 상태 그대로 갑니다."
      - "적용 판정 가운데 보류가 20% 를 넘으면 종합 보고서를 완결로 표기하지 않고 막음 잔여로 남깁니다(사용자 확인 — 동작은 그대로입니다)."
      - "cae00 은 다음 update-all 이 새 리스크 앱 SIF(0d120ea3)를 받으면 켜집니다 — 도는 검토 잡이 없을 때 받습니다(docs/risk-review-redesign/server-setup-m3.md 2-6)."
  - date: 2026-10-17
    title: "**상시 상태판 2단계**(기술, STATUS_BOARD 박스만) — MCP 도구 실호출 · Drive latest/ 를 30·60분마다 보고, update-all 동안 경보를 멈춘다"
    tag: 기술
    items:
      - "상태판이 Gatus 가 직접 못 보는 둘을 스크립트로 봅니다 — MCP 도구 실호출(30분마다, 백엔드마다 읽기 도구 하나 — 목록은 오는데 호출이 전부 실패하는 백엔드를 잡는다)과 Drive latest/(60분마다, 가장 새 업로드 폴더의 파일이 latest/ 에 같은 MD5 로 있는가 — 업로드가 반만 돼 옛 산출물이 조용히 가는 것을 잡는다). 밀어 넣는 쪽(infra/scripts/status-push.py)은 상태판과 함께 뜨고 함께 내려가며, 끊기면 heartbeat 가 실패로 칩니다. 연속 2번 실패(1시간 · 2시간)에 메일이 갑니다."
      - "주기 스모크(mcp-smoke.py --periodic)는 읽기 낱말 허용 목록(list · get · status …)에 드는 도구만 백엔드당 하나 부르고, 호출마다 X-HWAX-Corr: status-board:mcp-smoke 를 실어 게이트웨이 감사에서 가려낼 수 있습니다. 검사용 PAT 는 따로 받지 않습니다 — PAT 의 읽기·쓰기 범위는 어디서도 강제되지 않아 막아 주는 것이 없습니다."
      - "기록을 sqlite(infra/.state/status/data/gatus.db)에 둡니다. 그동안은 메모리라 설정을 다시 읽거나 다시 뜰 때마다 기록과 경보 상태를 잃어, 울린 경보의 풀림 메일이 오지 않았습니다(Gatus v5.37.0 실측)."
      - "update-all 이 서비스를 다시 띄우는 동안(1c~§5) 경보 메일을 멈춥니다(1b2 가 걸고 5b 가 풀고, 실패는 그대로 기록). update-all 이 중간에 죽어도 60분 시한이 지나면 상태판이 스스로 풉니다. 점검 전에 손으로 멈추려면 python3 ./infra/scripts/gen-status-config.py --pause <분>, 풀려면 --unpause 입니다(docs/improvement-1015/status-board.md '2단계')."
      - "따로 켤 것은 없습니다 — STATUS_BOARD=1 박스에서 다음 update-all 이 설정을 다시 만들고 상태판을 다시 띄웁니다."
  - date: 2026-10-17
    title: "**update-all 이 ste 때문에 매번 게이트웨이를 다시 띄우던 것 · 상태판을 못 내리던 것을 고쳤습니다**"
    tag: 수정
    items:
      - "update-all 의 MCP 실호출 스모크가 사람 신원으로만 답하는 ste 를 '호출 0성공' 으로 셌습니다(게이트웨이 토큰에는 신원이 없어 ste 가 401 로 거절한다). 그래서 매번 자동 복구(게이트웨이 재프로비저닝 · 재기동)를 돌리고 ✗ 로 끝났습니다. 이제 ste 처럼 서비스 자격 없이 사람별 위임만 있는 백엔드는 '검사 못 함' 으로 말하고 부르지 않습니다 — ste 는 update-all 의 '사람 신분 실호출' 이 사람 명의로 따로 봅니다. DynaForge 처럼 서비스 자격이 있는 앱의 토큰 만료는 그대로 잡힙니다."
      - "상시 상태판을 내리는 스크립트(status-board.sh stop)가 진짜 Gatus 를 '상태판이 아니다' 로 거부했습니다(명령줄이 /gatus 하나라 판정이 맞지 않았다). 그래서 update-all 이 설정이 바뀐 상태판을 다시 띄우거나 끈 박스에서 내리지 못했습니다. 고쳤고, 진짜와 같은 꼴의 시험을 더했습니다."
  - date: 2026-10-17
    title: "**챗은 stcx GPU LLM, 심의는 GLM — 챗 전용 LLM 설정**(운영은 절차서대로 두 줄, 설정 전에는 그대로)"
    tag: 챗
    items:
      - "챗만 따로 다른 LLM 서버로 보낼 수 있습니다 — cae00 에 새로 생긴 stcx GPU LLM(Qwen3.8-Flash-Next 10벌)을 챗에 쓰고, 띵킹 · 심의 준비 · 심의 · 카드 대조는 GLM 에 그대로 둡니다. 포털 infra/.env 에 두 줄(CHAT_LLM_BASE_URL · CHAT_LLM_MODEL)을 적고 update-all 을 돌리면 켜집니다(docs/chat-llm-stcx/server-setup.md)."
      - "stcx 가 죽으면(연결 실패 · 시간 초과 · 5xx) 그 LLM 호출을 GLM 으로 넘겨 답합니다. 턴 전체를 다시 돌리지 않아 이미 실행한 도구가 두 번 돌지 않습니다. 넘긴 횟수와 사유는 에이전트 서버 /health 의 chat_llm 에 보입니다."
      - "챗에서는 Qwen 의 생각 모드를 끕니다(빠른 답). 챗 턴의 문맥 예산은 stcx 창(262,144 토큰)으로 잡아 긴 대화가 넘치지 않고, 챗 서버와 GLM 의 스트리밍 설정이 달라도 넘겨받은 답의 글이 빠지지 않습니다."
      - "update-all 3.5c 가 infra/.env 의 설정을 에이전트 서버로 맞추고 그 서버가 모델을 내는지 봅니다. 끄려면 CHAT_LLM_BASE_URL 을 빈 값으로 둡니다."
  - date: 2026-10-17
    title: "**한국어로 물어도 영어 지식카드를 찾습니다 — 지식카드 검색을 BGE-M3 로 바꿨습니다**(dev, 운영은 절차서대로 한 줄)"
    tag: 심의
    items:
      - "지식카드 검색의 임베더를 e5-base 에서 BGE-M3 로 바꿨습니다(dev). 같은 평가셋(질의 397개)으로 재 보니 전문가 좌석이 받는 카드에 정답이 드는 몫이 0.70 → 0.85(영어 카드 0.59 → 0.82 · 한국어 카드 0.88 → 0.89), 전체 지식카드 의미검색은 0.51 → 0.81(영어 카드 0.22 → 0.74 · 한국어 카드 0.94 → 0.91)로 올랐습니다. 전체 검색에서 한국어 카드가 조금 내린 것은 관련 영어 카드도 함께 가까워져서입니다."
      - "심의 · 띵킹 · 전문가 챗의 카드 찾기, 전체 지식카드 검색, 포털 대화 검색이 모두 새 임베더를 씁니다. 포털 대화 검색은 BGE-M3 용으로 잰 관련성 하한(긴 질의 0.58 · 짧은 질의 0.30)으로 바로 거르고, 사람마다 다음 검색 때 지난 대화를 새로 색인합니다."
      - "운영(cae00)은 절차서(docs/embedder-bge-m3/server-setup.md)대로 사람이 AIDataHub 설정 한 줄로 켭니다 — 모델 묶음(e5 + BGE-M3)과 BGE-M3 벡터가 든 dev 덤프를 Drive 에 올렸습니다. 되돌리기도 그 한 줄이고, 옛 e5 벡터는 계속 채워 둡니다."
  - date: 2026-10-17
    title: "**전체 지식카드 의미검색이 가까운 카드를 놓치던 것을 고쳤습니다**"
    tag: 수정
    items:
      - "전체 지식카드를 대상으로 하는 의미검색(semantic_search · hybrid_search 의 의미 순위)이 색인 탐색 폭을 PostgreSQL 기본값(40)으로 두어, 정확히 쟀을 때의 상위 10건 가운데 3분의 1 남짓을 놓치고 있었습니다(e5 · BGE-M3 모두). 탐색 폭을 1000 으로 넓혀 재현율이 0.64 → 0.96(e5) · 0.67 → 0.97(BGE-M3)로 올랐고, 탐색은 30ms 안쪽입니다."
      - "운영(cae00)도 AIDataHub 를 갱신하면 바로 적용됩니다(임베더를 바꾸지 않아도). 되돌리려면 AIDataHub 설정에 AIDH_HNSW_EF_SEARCH=0 한 줄입니다. 전문가 좌석의 카드 찾기는 원래 정확 검색이라 영향이 없습니다."
  - date: 2026-10-17
    title: "**웹 리서치 문서 안 검색 — 임베더가 바뀌어도 순위가 틀어지지 않게**(기술)"
    tag: 기술
    items:
      - "웹 리서치 앱은 수집한 문서의 문장 벡터를 저장해 두고 검색 때 다시 씁니다. 임베더가 바뀌면 옛 벡터와 새 질의가 섞여 순위가 오류 없이 틀어질 뻔해, 벡터에 모델 이름을 함께 저장하고 모델이 다르면 다시 계산해 갈아 끼우게 했습니다(WebResearchMCP e6cc2ed — dev 교체, Drive 올림)."
  - date: 2026-10-17
    title: "**Drive 대조가 KooRemapper 를 올린 직후마다 '올려야 한다'고 하던 오탐**(기술)"
    tag: 기술
    items:
      - "build-all-to-drive 끝의 Drive 대조(drive-drift.sh)가 KooRemapper 를 올린 직후마다 '올려야 한다'고 했습니다 — 게시 스크립트가 tar 를 만든 뒤 bin/ 에 내려놓는 BUILD_INFO.txt 까지 비교했기 때문입니다. 그 파일을 빼서 이제 실제로 바뀐 바이너리만 잡습니다."
  - date: 2026-10-16
    title: "**지식카드 임베더 BGE-M3 전환 준비**(기술, 읽기는 아직 e5 그대로 — 견주기 뒤 전환)"
    tag: 기술
    items:
      - "AIDataHub 에 임베딩 슬롯 둘을 두었습니다 — 지금의 e5-base(768) 열 옆에 BGE-M3(1024 · halfvec) 열을 나란히 더하고(이행 0032 — 열만 더하고 데이터는 다시 쓰지 않는다) 읽기는 설정 한 줄(AIDH_EMBED_ACTIVE)이 고릅니다. 아무것도 안 적은 박스는 지금과 같고, 되돌리기도 그 한 줄입니다. 한국어 질의로 영어 카드를 찾는 정합성을 올리려는 것입니다(포털 docs/embedder-bge-m3)."
      - "임베딩 백필을 새로 지었습니다 — 빈 절 전부를 한꺼번에 올려 몇 시간짜리 트랜잭션 하나로 쓰던 것(dev 에서 프로세스 29GB)을 1,024행씩 읽고 커밋하는 백필로 바꿨고, 30분마다 겹쳐 뜨던 스윕은 (슬롯, 표)마다 하나만 돕니다. 끊겨도 다시 돌리면 빈 행부터 잇습니다. 백필과 검색이 한 토크나이저를 함께 써 실패하던 것(Already borrowed)도 막았습니다."
      - "dev 에서 BGE-M3 로 절 109만 개를 채우는 중입니다(GPU, 약 2시간). PG 데이터가 HDD 라 색인 갱신의 무작위 읽기에 묶였던 것은 관련 파일을 한 번 순차로 읽어 캐시를 데워 풀었습니다(레코드 4.8 → 120행/초, PG 설정은 그대로). 같은 평가셋으로 e5 · BGE-M3 를 견준 뒤 전환합니다."
      - "포털 대화 검색 — BGE-M3 의 관련성 하한을 처음 하한과 같은 방법으로 쟀습니다(긴 질의 0.58 · 짧은 질의 0.30 — 정답 손실 0/120 · 무관 통과 0/20. 같은 표본에서 지금 e5 하한 0.84 는 무관 4/20 을 통과시킨다). 전환하면 곧바로 이 하한으로 거릅니다."
  - date: 2026-10-16
    title: "**지식카드 좌석 검색 — 카드가 많은 전문가에서 정답을 놓치던 것을 고쳤습니다**"
    tag: 수정
    items:
      - "심의 · 챗 · 띵킹에서 전문가가 자기 지식카드를 찾을 때, 카드가 100여 장을 넘는 전문가(전체 카드 묶음의 65%)는 의미검색이 전역에서 가까운 카드 40개만 뽑은 뒤 자기 카드만 남겨 대부분을 잃고 있었습니다. 이제 그 전문가의 카드 안에서 정확히 찾습니다 — 같은 평가 질의 397개로 좌석이 받는 검색의 정답률이 0.617 에서 0.667 로, 카드 300장이 넘는 좌석의 의미검색은 0.12 에서 0.44 로, 영어 카드는 0.30 에서 0.59 로 올랐습니다. 카드가 많은 좌석은 검색이 조금 느려질 수 있습니다(정확 검색의 대가)."
  - date: 2026-10-16
    title: "**한국어 검색 기준선**(기술, 재기만 — 검색은 그대로)"
    tag: 기술
    items:
      - "지식카드 검색이 한국어 질의에 정답 카드를 몇 번째에 내는지 재는 판을 AIDataHub 에 더했습니다 — 카드에서 짧은 검색어 · 자연어 질문을 만드는 생성기(dev 로컬 LLM, 시드 고정)와 지금 검색(전역 어휘 · 의미 · 하이브리드, 좌석 agent_search)을 그대로 불러 순위 · 지연을 재는 실행기입니다. 평가셋은 사내 내용이라 리포에 넣지 않습니다."
      - "좌석이 실제로 받는 지식카드 검색은 앞 6건 안에 정답이 드는 몫이 0.62 였습니다 — 한국어 카드는 대부분 찾고(태그 조건이 어긋난 두 좌석을 빼면 0.98~1.00) 영어 카드는 0.39~0.57 입니다. 카드가 100여 장을 넘는 좌석에서는 의미검색이 히트를 잃는 것(좌석 224개 — 카드 묶음의 65.5%)을 찾았습니다. 바꿀 것의 순서와 까닭은 AIDataHub docs/ko-search-baseline.md 에 있고, 무엇을 바꿀지는 사람이 정합니다."
  - date: 2026-10-16
    title: "**호출 추적 반대 검토 1라운드**(기술) — 끊긴 호출도 남기고, 정지 · 켜기 판정을 좁혔다"
    tag: 기술
    items:
      - "에이전트 서버 — 끝나기 전에 끊긴 LLM 호출(띵킹 좌석 시간 초과 · 심의 잡 취소 · 카드 대조 구독 닫힘 · 챗 연결 끊김)도 error.type=CancelledError 로 남깁니다. 그동안은 LangChain 이 끝 콜백을 부르지 않아 가장 긴 대기가 기록에서 빠졌습니다. 자리 id 는 짧은 ASCII 표지만 받고(한글 낱말 · 메일 주소는 버린다), 줄이 찼다는 알림은 한 번만, 싸인 오류의 HTTP 상태도 남깁니다."
      - "포털 — update-all 5c 가 에이전트 서버의 CALL_TRACE_URL 이 받는 쪽과 맞는지(포트 · 줄 끝 설명 · 스킴) 보고 다르면 알립니다. 포트를 바꾸고 옛 Phoenix 를 안 내리면 새 것이 같은 DB 를 쓰지 않게 막습니다. 호출 추적 · 상태판의 정지는 그 포트에서 정확히 그 프로그램인 리스너만 내리고, 꺼진 박스는 상태 확인이 200 일 때만 내리러 갑니다(이름만 비슷한 남의 프로세스를 내리던 것)."
  - date: 2026-10-16
    title: "**리스크 심사 도구 인자 설명**(기술) — Claude 가 hwax_risk 도구를 부를 때 인자마다 뜻 · 허용값 · 범위를 본다"
    tag: 기술
    items:
      - "리스크 심사 앱의 MCP 도구 31종 인자 134개 전부에 설명을 달았습니다 — 허용값(볼 쪽 · 등급 · 상태 · Tier · 층 · 판단 LLM · 검토 범위 칸), 범위와 상한(코드 상수와 REST 본문 모델에서 읽어 싣는다 — 손으로 옮겨 적지 않는다), id 를 어디서 얻나(risk_list_projects · risk_next_step 의 facts · 앞 도구의 응답), 그리고 동의 인자(consent · consent_external)는 사용자에게 받은 뒤에만 참이고 자동으로 채우지 않는다는 규칙입니다. 그동안은 설명이 0/134 라 이름만 보고 값을 짐작해야 했습니다(게이트웨이 인자 설명 점수판 — 운영·관측·검색 개선 6번). 동작 · 형 · 필수 인자 · 기본값은 그대로이고 시험이 main 의 인자 계약과 맞댑니다."
  - date: 2026-10-16
    title: "**search_tools 의미 순위 옵션과 평가셋**(기술, 기본 꺼짐 — 켜지 않기로 했다)"
    tag: 기술
    items:
      - "게이트웨이 search_tools 에 의미 순위 옵션을 넣었습니다 — 지금의 부분문자열 순위에 AIDataHub 임베딩 순위를 RRF 로 더합니다(갈아 끼우지 않는다 · 순위만 쓰고 코사인 값으로 거르지 않는다). 기본 꺼짐이고(GATEWAY_TOOL_SEARCH_EMBED_URL), 꺼져 있으면 답이 종전과 바이트째 같습니다. 켜도 색인이 덜 찼거나 임베더가 오류 · 2초 초과면 그 검색은 부분문자열 순위로 답하고 결과의 mode 가 말합니다."
      - "평가셋 150쌍(문서 · 커밋에 남은 오배정 · 업무어 사례 42쌍과 도구 설명만 보고 쓴 초안 108쌍 — 전부 사람 검토 전)과 견주기 러너(tool_search_eval/)를 두었습니다. dev 측정에서 문서 사례는 지금 방식이 낫고(5위 안 적중 0.88 대 0.71 — 이미 동의어로 고친 심의 낱말 14쌍 가운데 8쌍이 밀렸다) 설명 초안은 RRF 가 나아(0.39 대 0.71 — 설명을 옮긴 문장이라 임베딩에 유리하다) 지금 꼴로는 켜지 않습니다. 켤지는 쌍을 사람이 검토하고 실사용 질의를 모은 뒤 정합니다."
  - date: 2026-10-16
    title: "**LLM·도구 호출 추적 — Phoenix**(기술, 기본 꺼짐 — 원문 없이 시간·토큰만)"
    tag: 기술
    items:
      - "에이전트 서버가 LLM 호출과 MCP 도구 호출을 하나씩 Phoenix 로 남길 수 있습니다(에이전트 서버 .env 의 CALL_TRACE_URL, 기본 꺼짐). 남는 것은 어느 서버(LLM 라우터를 지났으면 실제로 받은 서버) · 시작과 끝 · 스트리밍이면 첫 조각까지 · 서버가 준 토큰 수 · 모델 이름 · HTTP 상태와 시도 수 · 실패면 예외 이름, 그리고 챗 턴 · 심의 잡 · 라운드 · 좌석 · 카드 대조 id 뿐입니다. 프롬프트 · 답 · 도구 인자 · 결과 · 예외 문구는 코드가 읽지 않고 켜는 손잡이도 없습니다. Phoenix 가 죽거나 느려도 호출은 기다리지 않고 기록만 버립니다(로그 한 줄). 꺼져 있으면 콜백 · 감싸기 · 스레드가 하나도 생기지 않습니다."
      - "포털 — Phoenix 20.19.0 인스턴스를 더했습니다. 이미지 굽기(build-phoenix.sh — 판 · 다이제스트 고정, Drive 로 나른다) · 띄우는 스크립트(call-trace.sh — 루프백 8750 한 포트, 모든 인터페이스에 열리는 gRPC 수신기는 끈다) · 매니페스트 항목 call-trace. infra/.env 에 CALL_TRACE=1 을 적으면 update-all 5c 가 띄우고, 줄을 지우면 내립니다(꺼져 있으면 ○ 한 줄). 보내는 쪽 줄(CALL_TRACE_URL)과 어긋나면 update-all 이 알립니다. LLM 라우터는 넘긴 응답에 받은 서버의 호스트:포트 머리(x-hwax-llm-upstream)를 답니다. 보는 법은 SSH 터널입니다(docs/improvement-1015/call-trace.md)."
  - date: 2026-10-16
    title: "**심의 도구 인자 설명**(기술) — Claude · 챗이 심의 도구를 부를 때 인자마다 뜻과 범위를 본다"
    tag: 기술
    items:
      - "에이전트 서버의 심의 도구 일곱(deliberate_start · continue · status · result · list · cancel · transcript)의 인자 39개 전부에 설명을 달았습니다 — 값의 종류(심의 종류 · 층 · 웹 리서치 소스), 범위(라운드 2~8 · 목록 1~100 · 전사 1~200), 상한(도구 · 앱 · 후보안 · 근거 건수 — 엔진 상수에서 읽어 싣는다), 어디서 id 를 얻나. 그동안은 이름만 보고 값을 짐작해야 했습니다(게이트웨이 인자 설명 점수판의 근거 — 운영·관측·검색 개선 6번). 동작 · 필수 인자 · 기본값은 그대로입니다."
  - date: 2026-10-16
    title: "**리스크 심사 Claude 길 — 리스크 앱 · 엔진 거절 · 대상 열쇠**(기술, 기본 꺼짐)"
    tag: 기술
    items:
      - "리스크 앱 검토 잡에 판단 LLM 선택(llm: glm | claude, 없으면 glm)이 생겼습니다. claude 는 반출 동의(consent_external: true — 엄격한 참, MCP 도 같다)가 있어야 하고, 엔진이 외부 응답자를 열지 않았으면 409 external_llm_unavailable 입니다. 동의한 사람의 PAT 로만 돌고, 누가 언제 동의했는지 잡에 남습니다. 동의 글은 사슬이 이어 도는 쟁점 패널·종합 요약의 입력(이 대상 전체의 등록부 행·쟁점·요약)까지 나간다고 말합니다."
      - "동의가 번지지 않습니다 — 쟁점·종합 잡을 줄(GLM · 동의한 사람별 Claude)로 나눠, Claude 사슬 잡은 제 걸음이 고른 일만 하고 남이 GLM 으로 낸 일(사슬 · 사람이 다시 줄 세운 쟁점 · 보고서 다시 내기)은 GLM 잡으로 갑니다. 워크플로가 과제를 집지 않거나 답하지 않으면 잡이 external_worker 로 멈추고(차감 없음, 재개하면 재시도 몫이 돌아온다), Claude 로 고른 잡이 실제로 GLM 으로 돌았으면 llm_mismatch 로 표시합니다. GLM 잡의 동작은 그대로입니다(옛·새 출력 대조) — 보이는 차이는 보고서 다시 내기 응답의 llm 칸과 패널 모드에 동의 칸을 보내면 422 인 것뿐입니다."
      - "에이전트 서버 — 이 박스의 GLM 챗·심의는 risk_start_job 의 Claude 선택·동의 칸과 REST 다리의 동의 칸을 쓸 수 없습니다(사람의 동의는 사람의 클라이언트에서만). 외부 심의는 delib_opts.target_key(diff:·snap:)를 과제 머리에 싣고, 포털 심의 중계가 그 칸을 넘겨 쟁점 패널 과제도 워크플로가 답할 수 있습니다."
  - date: 2026-10-16
    title: "**LLM 풀 용량 측정 도구 — GuideLLM**(기술, 측정은 운영자가 cae00 에서)"
    tag: 기술
    items:
      - "카드 대조 동시 수 세 손잡이(에이전트 서버 관문 CARD_REVIEW_CONCURRENCY · 리스크 앱 워커 HWAXRISK_REVIEW_CONCURRENCY · 포털 중계 CARD_REVIEW_MAX_STREAMS)를 정할 데이터를 재는 도구를 더했습니다. 리스크 앱 원장의 카드 대조 호출 길이(본문 없이 수만 — infra/scripts/llm-lengths.py)로 GuideLLM 합성 부하를 만들어 서버 하나 직결과 측정용 라우터 경유(붙임 문턱 2 · 0)를 동시 수 단계마다 재고, 표와 세 손잡이 권장값을 냅니다(infra/scripts/llm-capacity.sh — 운영 라우터 · infra/.env 는 건드리지 않습니다)."
      - "GuideLLM 0.8.0 측정 이미지(infra/scripts/build-guidellm.sh — 판 고정 · GLM-5.2 토크나이저를 구워 인터넷 없이 돈다, 약 440MB)를 dev 에서 굽고 images-to-drive · images-from-drive 가 다른 이미지와 함께 나릅니다. 키는 환경으로만 넘기고 명령줄 · 결과에 남지 않습니다. 측정은 GPU 를 차지하므로 심의 없는 때 docs/llm-pool/capacity.md 대로 돌립니다."
  - date: 2026-10-16
    title: "**리스크 심사 Claude 길 — 워크플로 hwax-risk-claude**(기술, 기본 꺼짐)"
    tag: 기술
    items:
      - "리스크 심사 잡을 판단 LLM=Claude 로 만든(반출에 동의한) 사람이 자기 Claude Code 에서 돌리는 워크플로를 더했습니다(infra/pipeline/hwax-risk-claude.js — Workflow 의 scriptPath 로 부르고 args 는 {targetKey}). 엔진이 그 잡의 판단 호출을 과제로 세우면 집어서, 맡은 대상의 과제만 그 프롬프트가 요구한 꼴로 답하고 냅니다. 다른 대상의 과제와 대상이 없는 과제는 읽지 않습니다."
      - "답은 코드 포인트 조각으로 나눠 내고 조각마다 서버가 받은 길이를 맞춘 뒤에야 마칩니다 — 옮겨 싣다 바뀐 답은 엔진에 가지 않고 처음부터 다시 냅니다. 일꾼은 기본 4 · 최대 8 이고, 빈 집기가 이어지면 멈추되 다른 일꾼이 과제를 쓰는 동안은 기다리며, 끝에 답 · 건너뜀 · 실패를 종류별로 알립니다. 실제 Claude 로는 돌려 보지 않았습니다(가짜 런타임 시험만)."
      - "아직 쟁점 패널 심의 과제에는 대상 표지가 없어 이 워크플로가 답하지 않습니다 — 엔진 · 리스크 앱 쪽에 남은 일입니다(docs/risk-claude-engine X-D8)."
  - date: 2026-10-16
    title: "**MCP 게이트웨이 — 도구 인자 설명 점수판**(기술)"
    tag: 기술
    items:
      - "게이트웨이가 도구 목록을 다시 모을 때마다 앱별로 '인자 가운데 설명이 있는 비율' 과 '설명에 단위·범위가 든 비율' 을 세어 무인증 /tools-map 의 arg_scores 에 싣습니다(앱별 점수 · 가장 나쁜 도구 다섯 — 수만, 인자 이름·설명은 싣지 않습니다). 보고만 하고 막거나 숨기지 않습니다."
      - "기동 때는 기준(GATEWAY_ARG_DESC_WARN_RATIO, 기본 30%) 아래 앱 수를 요약 한 줄로, 기동 뒤 새로 붙는 앱은 붙을 때 한 줄로 알립니다. 10-16 dev 실측은 앱 15개 · 인자 1,531개 가운데 설명 23개(1.5%)입니다 — 인자 설명은 LLM 의 인자 선택과 앞으로의 도구 검색 색인 재료라, 앱 주인이 채울 수 있게 점수를 보여 줍니다(운영·관측·검색 개선 6번)."
  - date: 2026-10-16
    title: "**상시 상태판(Gatus)**(기술, 기본 꺼짐) — infra/.env 한 줄로 서비스 리스너를 1분마다 보고 메일로 알린다"
    tag: 기술
    items:
      - "infra/.env 에 STATUS_BOARD=1 을 적으면 update-all 5b 가 상태판 설정을 만들고(gen-status-config.py → infra/.state/status/config.yaml, 600) 상태판을 띄웁니다(status-board.sh · services.yaml 의 status-board, 루프백 8740). 이 박스가 다루는 서비스의 리스너 전부(health + urls)를 인스턴스가 아니라 응답으로 보고, 게이트웨이 백엔드마다 · 도구 수 · 에이전트 서버의 도는 심의 칸 · LLM 라우터(풀을 켠 박스만)의 모델 대조를 함께 봅니다. 줄을 지우면 다음 update-all 이 상태판을 내립니다."
      - "경보 메일은 STATUS_ALERT_TO(팀 공용 주소)와 포털 backend/.env 의 SMTP 설정(MAIL_BACKEND=smtp · SMTP_HOST · MAIL_FROM)이 다 있을 때만 켜지고, 포털을 거치지 않고 그 SMTP 서버로 직접 보냅니다. 같은 검사가 연속 5번 실패하면 보내고 2번 성공하면 풀림을 보냅니다. 메일 자격은 생성 설정에만 들어갑니다."
      - "이미지는 Gatus v5.37.0(태그와 다이제스트로 고정) — dev 에서 build-gatus.sh 로 굽고 images-to-drive · images-from-drive 가 portal·nginx 와 함께 나릅니다. 포트를 8740 으로 둔 것은 9100~9999 가 HEAXHub 의 앱 포트 풀이어서입니다(docs/PORT-MAP.md). 안내는 docs/improvement-1015/status-board.md 입니다."
  - date: 2026-10-16
    title: "**리스크 심사 Claude 길 — 포털 중계**(기술, 기본 꺼짐)"
    tag: 기술
    items:
      - "카드 대조 limits 중계(GET /agent/card-review/limits)가 질의 문자열의 llm 을 엔진에 옮깁니다(엔진이 읽는 이름만 — 없으면 종전과 같은 주소). 그동안은 ?llm=external 을 버려 외부 응답자 잡에도 GLM 예산과 판이 돌아왔습니다."
      - "심의 옵션(delib_opts)이 llm(glm · external 만)과 consent_external(엄격한 참·거짓 — \"true\"·1 은 422)을 엔진에 그대로 넘깁니다. 그동안은 포털을 거치면 외부 선택이 말없이 떨어져 GLM 으로 돌았습니다. 보내는 곳은 리스크 앱뿐이고 포털 화면에는 이 선택이 없습니다."
  - date: 2026-10-16
    title: "**업데이트 이력 보충** — 10-12~10-15 에 빠졌던 변경을 날짜별로 채웠습니다"
    tag: 수정
    items:
      - "지난 나흘 동안 이 이력에 오르지 않았던 변경을 그날그날 항목으로 채웠습니다(새 항목 18개, 기존 항목에 덧붙인 줄 넷). StepForge(CAD 개정 잇기 · 이름으로 부른 파트가 0건이던 것 · 붐빌 때 측정 호출 2분 한도), DynaForge(해석 리포트의 핫스팟과 결과 그림 · SP 허브 과제·개정 잇기 · stcx 전각도 낙하 · 만든 덱이 LS-DYNA 에 바로 들어감 · 개정 비교와 되돌리기), 낙하 해석 전처리(강체 전환에서 뺀 파트로 해석이 시작도 못 하던 것), 리스크 심사 앱(접촉을 바꾼 변경을 근거로 든 리스크 저장 · 변경 종류 택소노미)입니다."
      - "지난 날짜에 들어간 항목이라 이 팝업에는 다 뜨지 않습니다. 상단 메뉴 '업데이트' 에서 날짜별로 볼 수 있습니다."
  - date: 2026-10-16
    title: "**LLM 서버 둘 나눠 쓰기**(기술) — infra/.env 한 줄로 라우터를 켠다(기본 꺼짐)"
    tag: 기술
    items:
      - "LLM 라우터(infra/llm-router, 127.0.0.1:8730) — vLLM 의 /metrics(도는·대기 요청 · KV)로 덜 바쁜 서버를 고르고, 메시지 앞부분 해시로 같은 대화·같은 카드 묶음을 같은 서버에 붙인다(접두 캐시, 붙인 서버가 2 이상 바쁘면 떨어진다). 연결 실패만 다른 서버로 넘기고 흐르기 시작한 요청은 다시 보내지 않는다. 손님이 끊으면 위 연결을 곧바로 닫아 vLLM 이 생성을 멈춘다. 손님의 Authorization 을 그대로 넘기고(키를 끼워 넣지 않는다) 프록시 환경을 타지 않는다."
      - "서버는 /v1/models 가 모델 목록을 답할 때만 올라옴이고, 요청 모델을 내는 서버 가운데 창이 가장 큰 서버로만 보낸다. 지표 일시 실패는 세 번까지 마지막 값을 쓰고, 부하는 라우터가 보낸 도는 수 밑으로 내려가지 않는다. 기동 탐침은 2초까지만 기다린다. infra/.env 를 다시 읽어 서버를 더하고 빼는 데 재기동이 없고, 목록이 비거나 틀리면 마지막 목록으로 계속 낸다."
      - "update-all 1i — infra/.env 의 LLM_UPSTREAMS 한 줄이 있으면 라우터를 띄우고, 라우터가 서버를 올렸고 모델이 같다고 답할 때만 LLM 주소 사본(에이전트 서버 · AIDataHub · SignalForge · 허브 앱 · MXWhitePaper · PaperIngest)을 라우터로 바꾼다(관리하는 값만 · 원자적 · 백업은 포털 infra/.state 에만). 줄을 지우면 사본을 직접 주소로 되돌리고 §4 뒤에 라우터를 내린다. 라우터를 지나는 요청이 있으면 재기동을 미룬다(○). 목록 규칙은 bash lib 한 곳이 정본이고 라우터와 표로 대조한다."
      - "services.py 매니페스트에 if_env · fp_git 두 칸 — llm-router 는 LLM_UPSTREAMS 가 있는 박스에서만 다루고, 지문은 라우터 파일과 portal.sif 뿐이다(포털 커밋마다 재기동하지 않는다). 이미지 설치는 임시 파일 → 이름 바꾸기(도는 프로세스가 옛 이미지를 쥔다), env-sync 의 백업도 서비스 리포 밖(infra/.state)으로 옮겼다. 풀을 켜지 않은 박스는 ○ 한 줄 말고 달라지는 것이 없다(첫 실행만 env-sync 가 선택 주석 두 줄을 붙인다)."
      - "라우터는 이미지에 든 파이썬 패키지로만 돈다 — apptainer 가 홈 디렉터리를 붙이므로 ~/.local 의 패키지가 이미지의 httpx·fastapi 를 가릴 수 있어, 실행 스크립트가 사용자 패키지 경로를 끈다(PYTHONNOUSERSITE=1)."
  - date: 2026-10-16
    title: "**리스크 심사 Claude 길 — 엔진 몫**(기술, 기본 꺼짐)"
    tag: 기술
    items:
      - "에이전트 서버에 외부 응답자 — EXTERNAL_LLM_ENABLED=1 인 박스에서만 카드 대조(llm=external)와 심의(delib_opts.llm=external)의 판단 호출이 주인별 과제 줄로 가고, Claude Code 워크플로가 MCP review_task_next · review_task_read · review_task_submit 으로 집어 답한다(엔진의 프롬프트 · 파서 · 보충 되묻기는 그대로). 실제 Claude 로 돌리는 시험은 하지 않았다(사용자 결정)."
      - "안전 장치 — 반출 동의(consent_external: true) 없이는 과제를 만들지 않는다 · 집기마다 lease(늦은 제출이 다른 집기에 섞이지 않는다) · GLM 관문 자리를 쓰지 않고 주인마다 상한 · 비우기 중 거절 · 이 박스의 GLM 챗·심의는 과제 도구와 외부 선택을 쓸 수 없다 · 값이 틀리면 기능이 닫힌 채 뜬다. 스위치를 끈 박스는 main 과 바이트째 같다(도구 목록 · /health · /drain · 계약 · 심의 장면 대조)."
      - "켜는 법과 손잡이 — 포털 docs/risk-review-redesign/server-setup-m3.md 8절(엔진 한 줄 · 확인 명령 · 게이트웨이 도구 판정 · 잡 주인의 Claude Code), 에이전트 서버 env 킷의 '외부 응답자' 구획과 README 시간 한도 표(기다림 300초 · 답 1,200초 — 과제 하나의 최악 3,000초가 심의 LLM 논리 호출 1회의 최악보다 작아야 길이 열린다)."
  - date: 2026-10-15
    title: "**StepForge** — CAD 개정을 줄로 잇고, 개정을 건너 같은 파트의 이력을 봅니다"
    tag: 연결
    items:
      - "같은 PLM 과제의 CAD 개정을 순서 있는 줄로 잇습니다. 개정 이름은 허브의 모델 리비전 · 과제명 끝 조각 · STEP 헤더 · 파일 이름에서 후보와 근거를 보여 주고 사람이 `set_revision` 으로 확정합니다(미리 보기 · 지우기). `revision_history` 가 이웃 개정 사이의 차이를 수로 보여 주고, 내용이 같은 다른 과제는 알리기만 합니다."
      - "개정을 건너는 같은 파트의 대응을 `record_part_lineage` 로 남기고, `part_history` 가 과제코드 → 개정 줄 → 파트 이력(같은 파트 · 따라감 · 끊김과 그 까닭)을 보여 줍니다. 파싱하지 않은 과제로는 남기지 않고 parse 호출문을 줍니다."
      - "`ontology_model` 이 StepForge 자체 정의(CAD 개정 · 파트 · 파트 역할과 그 관계)와 SP 허브 카탈로그를 한 보기로 보여 줍니다(읽기). 허브의 과제 정보는 허브 주소와 토큰을 넣은 박스에서만 받습니다."
  - date: 2026-10-15
    title: "**StepForge** — 이름으로 부른 파트가 0건이던 것 · 같은 자리를 회전했다고 하던 것을 고쳤습니다"
    tag: 수정
    items:
      - "`list_joints` · `fastener_report` 에 있는 파트를 이름으로 주면 0건이 나오던 것을 고쳤습니다. 없는 이름이나 어셈블리 이름을 주면 말없이 0건 대신 `part_unknown` 으로 까닭을 말합니다(`list_interfaces` · `risk_screen` 도 같습니다)."
      - "두 판에서 같은 자리에 놓인 파트를 아주 작은 각도(백만분의 1도 남짓)로 회전했다고 하던 것을 고쳤습니다. 실물 짝 325개 가운데 40개가 거짓 회전이었습니다(`compare_snapshots`)."
      - "파싱한 판과 막 올린 판을 견주면 '6개 삭제 · −100%' 처럼 말하던 것을, 파싱하지 않은 파일을 맨 앞에 알리고 수를 말하지 않게 했습니다. STEP 을 올리기만 한 과제의 파트 이름에는 '그런 파트가 없다' 대신 '아직 모른다' 와 parse 호출문을 줍니다."
      - "`risk_screen` 이 목록을 상한에서 자른 뒤에 파트를 걸러 뒤쪽 파트를 이름으로 불러도 아무것도 안 나오던 것, `find_plm_task` 가 Ö · Δ · 전각 글자가 든 과제를 제 글자로도 못 찾던 것을 고쳤습니다."
      - "서버가 붐빌 때 리브 · 보스 찾기(`rib_boss_features`)가 원환이 많은 파트의 시간을 짧게 어림해 2분을 넘기거나 구멍 판을 거짓으로 거절하던 것을 고쳤습니다."
  - date: 2026-10-15
    title: "**StepForge** — 수신기 이음매 · 자체 온톨로지 · 개정·계보 표 · 토큰은 secrets.env · 관문 남은 것(기술)"
    tag: 기술
    items:
      - "SP 허브 수신기(D-527 · D-534 · D-539) — 허브 주소를 바꾸면 타입마다 처음부터 받고(hub_changed), 개명 뒤에도 renamed_from 을 싣는 허브에서 key 를 다시 쓴 새 과제를 지우지 않으며, 주소 · 토큰 파일의 비밀을 거절 문구로 되뇌지 않습니다(BOM 이 붙은 토큰 파일은 utf-8-sig). 찾기는 LIKE 대신 instr 이고, 마지막 전체 대조 시각(objects_full_at · relations_full_at)과 멈춘 판에서 안 온 과제(absent_held)를 실으며, 선은 두 끝점이 살아 있는 것만 셉니다(live_edges)."
      - "gmsh.initialize() 가 SIGPIPE 처리를 기본(죽음)으로 되돌려, 러너가 죽은 뒤 메시 워커가 첫 출력에서 즉사하던 것을 직전 처리로 되돌려 고쳤습니다(D-528 — 실제 서버에서 메시 잡이 34% 에서 failed). 회귀의 gmsh 날 호출 가드는 별칭 import 도 봅니다."
      - "자체 정의 core/data/ontology/stepforge-core.json(cad_revision · cad_part · part_role · revision_of · supersedes · same_part_as)과 SP 의 두 문(가져오기 · 화면)을 출처째 옮긴 검증기 core/onto_model.py, 원 표 투영 검사(20만 행 0.44초), REST GET /api/ontology-model, 파일로만 묶는 scripts/onto_export.py(네트워크 0). 표 cad_revisions(core/revisions.py)와 part_lineage(core/lineage.py) — same_part_as 선은 두 끝 · 신뢰도 sure 이상 · 지금 형상의 기록만, 과제코드 줄은 supersedes 가 증명하는 이웃만 잇습니다(D-532). system_capabilities · revision_history 는 챗 접기 표에 넣었습니다."
      - "허브 토큰은 데이터 폴더 secrets.env 의 STEPFORGE_SP_TOKEN 줄이 기본입니다(리스크 앱과 같은 관례 — 허브의 Drive 백업이 이 이름을 뺀다). 허브 루트 .env 에는 주소 한 줄(APPTAINERENV_STEPFORGE_SP_CORE_URL)만 두고, STEPFORGE_SP_TOKEN_FILE 을 주면 그 파일이 먼저입니다. 같은 파일에 든 다른 앱의 비밀은 읽지도 싣지도 않습니다(D-533 · D-537)."
      - "관문 남은 것(D-535 · D-539) — rib_boss_features 예상을 정의 축 모형(치수 기록부와 같은 단가 표)으로 바꿔 실제 서버 rib_30 이 73.1초에서 5.4초가 됐고, 병렬 예상이 같은 코어의 SMT 짝(measure.worker_capacity · WORKER_SMT_RATIO 1.5)과 cgroup v1 몫을 세며, 혼자 도는 파트에는 짝 느려짐을 곱하지 않습니다. field_check 에 cpu_quota · cpu_cores_usable · smt_active 칸을 더했고 붐빔 말은 budget_words 한 자리에서 나옵니다."
  - date: 2026-10-15
    title: "**리스크 심사 M3 뒤처리** — 긴 문서 발췌로 본 셀이 완결을 막던 것 · 보고서 다시 내기 중복 · 거르기 꺼짐에 남은 셀 안내"
    tag: 수정
    items:
      - "카드가 없는 전문가가 긴 문서 발췌만으로 본 셀이 있으면 그 과제가 완결(C1)에 오르지 못하던 것을 고쳤습니다. 진행판과 품질 줄도 그 셀을 '바탕 모름' 대신 '긴 문서 발췌만' 으로 셉니다."
      - "종합 보고서 다시 내기를 거푸 누르면 대기 종합 잡이 둘 서던 것을 고쳤습니다. 아직 시작하지 않은 종합 잡이 있으면 그 잡을 그대로 돌려줍니다."
      - "거르기가 꺼졌는데 거른 셀이 검토 없이 남은 과제(잡이 도중에 멈추거나 취소된 경우)에서, 잔여 '거름' 이 '거르기 꺼짐 — 검토 잡을 하나 돌리면 그 잡이 다시 본다' 를 말하고 길잡이가 '끝났다' 대신 검토 잡 걸음을 줍니다. 전에는 잔여 확인만 남아 그 셀이 검토 없이 닫힐 수 있었습니다."
  - date: 2026-10-15
    title: "**리스크 심사 M3 뒤처리**(기술)"
    tag: 기술
    items:
      - "리스크 앱 CELL_BASES 에 search_only — 불변식 (G4) 가 그 셀마다 '바탕 없음' 을 내 나갈 기준 1(invariants == [])이 서지 않던 것. 품질 [격자] 줄에 그 수."
      - "synth.create_synth_job 이 대기(queued) 종합 잡이 있으면 새 행 없이 그 잡을 created:false 로 돌려준다(확인과 쓰기를 한 트랜잭션으로). 도는 잡은 막지 않는다(사슬 _busy 와 같은 규칙). 사슬은 그 경합을 받으면 그 잡에 지금 원장의 표지를 단다."
      - "closure 의 filtered 잔여에 off 칸과 '거르기 꺼짐(넓힌 영역 N)' 표기, risk_next_step 이 원장(closure_cells)에서 거르기 꺼짐에 남은 거른 셀을 세어 where=review · risk_start_job 걸음 · 까닭을 준다(basis_hash 는 그대로 — 이미 받은 확인은 유효)."
      - "create_review_job · REST 잡 만들기 독스트링이 견주는 값을 calls_estimate.expected 로 바로잡았다(동작 변화 없음)."
  - date: 2026-10-15
    title: "**DynaForge** — 만든 덱이 LS-DYNA 에 바로 들어갑니다(`*KEYWORD` 첫 카드 · 10칸 덱)"
    tag: 수정
    items:
      - "DynaForge 가 쓴 덱의 첫 카드에 `*KEYWORD` 가 없던 것을 고쳤습니다(`generate` · `unfold` · `map` · `warpage` · `offset` · prestress 동반 덱 등 — 추적 덱 496장 가운데 177장). 첫 카드가 `*KEYWORD` 가 아니면 LS-DYNA 가 옛 입력 형식으로 읽으려 해 해석에 바로 쓸 수 없었습니다. 이미 있는 덱에는 덧붙이지 않습니다."
      - "`cnrb2solid` · `cnrb2spring` 이 `*KEYWORD I10=Y`(10칸) 덱에 절점 · 요소를 8칸으로 써 넣어 다시 읽으면 칸이 어긋나던 것을 고쳤습니다. 10칸 덱의 멀쩡한 ID 를 거절하던 것도 함께 고쳤고, 8칸 덱의 출력은 한 글자도 바뀌지 않습니다."
  - date: 2026-10-15
    title: "**DynaForge** — 개정끼리 견주고 잇기를 되돌립니다 · 기능 스위치를 시스템 화면에서 봅니다"
    tag: 연결
    items:
      - "같은 과제의 개정 줄을 표로 견줍니다 — 판마다 최악 응력 · 최악 G · 심각도 · 케이스 수와 앞 판 대비 변화(늘면 빨강). 재지 않은 값은 0 이 아니라 '—' 로 적고, 한 판에 리포트가 여럿이면 하나를 대표로 고르지 않고 몇 건에서 모았는지 말합니다."
      - "리포트의 개정 잇기를 풀 수 있고(개정 자체는 남습니다), 과제 별칭을 뗄 수 있습니다(이미 이어 둔 개정은 그대로입니다). 예전에는 '먼저 떼라' 고 안내하면서 떼는 길이 없었습니다."
      - "시스템 화면에 과제 · 개정 기능 카드가 생겼습니다 — 켜짐 · 꺼짐, 누가 정했는지(옵션 · 추론), 사유, 비어 있는 설정 이름과 넣을 자리. '켰는데 안 보인다' 를 curl 없이 봅니다."
  - date: 2026-10-15
    title: "**DynaForge** — stcx 업로드 정리 · 개정 비교와 되돌리기 · 덱 첫 카드 판정(기술)"
    tag: 기술
    items:
      - "stcx 제출이 registry_id 를 받으면(응답이든 work_dir 로 되찾았든) stcx 쪽에 올린 덱을 지웁니다 — 받는 쪽이 스테이징으로 복사한 뒤라 원본이 더는 필요 없습니다. 잡을 먼저 커밋하고 지우며 실패는 경고뿐이고 external_ref.upload_id 를 남깁니다. result_dir(실제 결과 폴더) · model_source 를 external_ref 에 남기고, model_source 가 existing 이면 묵은 덱으로 돌았다고 경고합니다(잡은 닫지 않는다)."
      - "개정 — remove_alias · DELETE /ontology/aliases, unlink_revision · DELETE /reports/{id}/revision, compare() 는 리포트에 이미 승격된 칸만 씁니다(두 곳에서 계산하지 않는다). MCP 도구 넷(68 → 72) — remove_task_alias 가 쿼리를 문자열로 이어 붙여 공백 · & · = 가 든 별칭이 다른 요청이 되던 것을 params 로 고쳤고, 도구 문서(TOOLS.md 등)에 빠진 열 줄을 채웠습니다."
      - "`*KEYWORD` 판정 정본 hasKeywordCard 와 쓰는 자리 셋(KFileWriter::writeHeader · ModelAssembler::writeOutput · prestress 동반 덱) — 없을 때만 넣어 I10=Y 덱의 폭 판정(첫 `*KEYWORD` 에서 멈춘다)을 지킵니다. 관문 test_keyword_card.py(129항 · 훑은 덱 56장)가 고치기 전 바이너리에서 여섯 op 을 이름으로 뭅니다."
      - "cnrb2solid · cnrb2spring 의 절점 · 요소 줄이 KFileWriter 와 같은 deckFieldWidth 를 따르고 ID 상한도 폭에서 유도합니다(`*PART` · `*SET_NODE_LIST` 의 10칸은 표준이라 그대로). 2026-09-26 감사 장부를 다시 돌려 열린 15건 가운데 셋이 이미 끝난 것으로 고쳐 적었습니다."
  - date: 2026-10-15
    title: "**리스크 심사 M3** — 전원(359명)이 카드 대조를 끝내면 쟁점 토의와 종합 보고서가 저절로 이어 돕니다"
    tag: 심의
    items:
      - "카드 대조가 로스터 전원으로 넓어졌습니다. ECAD 가 없어 판정할 수 없던 회로 쪽 전문가도 들어와 '지금 변경으로 말할 수 있는 영향' 과 'ECAD 가 오면 확인할 것' 두 질문에 답하고, 카드가 0장인 전문가는 역할(과 묶인 문서 발췌)로 답합니다. 둘 다 보고서와 완결 표기에 잔여로 남습니다."
      - "관련 없는 셀을 거릅니다. 변경 → 영역 대응표와 그 전문가의 훑기 판단이 둘 다 '무관' 일 때만 거르고, 영역 1순위 대표는 거르지 않으며, 거른 셀의 5%(최소 59건 · 영역마다 1건)는 끝까지 판정해 놓친 걸림을 잽니다. 놓친 걸림이 나온 영역은 다시 넓혀 봅니다. 대응표는 아직 초안이라 사용자가 승인하기 전까지는 아무것도 거르지 않습니다."
      - "순서를 뒤집어 다시 묻는 이중 판정은 걸린 카드에만 하고, 영역 1순위는 보정용으로 전부 합니다. 리스크 앱의 검토 워커가 4 에서 8 로 늘어 에이전트 서버의 동시 8건을 다 씁니다."
      - "검토가 끝나면 갈린 판정 · hold 가 가린 FAIL · 한 사람만 중대로 본 리스크를 쟁점으로 골라 3라운드 쟁점 패널로 다시 봅니다. 패널 결론이 원판정을 덮되 원래 분포('제기 12명(FAIL 9 · WARNING 3) → 쟁점 패널 하향')를 같은 줄에 남깁니다. 과제당 24건(검증된 FAIL · 치명은 48건까지 먼저)이고 넘치는 것은 '미토의 쟁점' 으로 보고서에 남습니다."
      - "영역 요약과 종합 보고서가 나옵니다. 표와 수는 코드가 원장에서 세고 서술만 LLM 이 쓰며, LLM 이 실패해도 '서술 없음 — 까닭' 과 함께 보고서 판은 섭니다. 단계마다 판 번호가 오르고 Claude 에서 risk_get_report 로 쪽을 이어 읽습니다."
      - "완결 표기가 잔여를 달고 나옵니다(예 'C2 · C3 대기(입력 결손 110명·250셀 · 미토의 쟁점 7건 · 2차 영향 미실행 · 결손 사냥 미실행)'). 막음 잔여는 과제 소유자 · 관리자가 사유와 함께 확인해야 C3 로 오르고, M3 에는 2차 영향 · 결손 사냥이 아직 없어 맨 C3 는 나오지 않습니다."
      - "실패한 셀을 다시 돌리거나 사유와 함께 넘길 수 있습니다(Claude 는 risk_job_action 의 retry_failed · skip_failed). 넓힘 · 표본으로 다시 연 셀이 동의받은 호출의 20%(최소 30회)를 넘으면 잡이 멈추고 동의를 묻습니다."
      - "쟁점 올리기 · 건너뛰기와 잔여 확인을 할 웹 화면은 준비 중입니다. 그동안 Claude 의 risk_next_step 이 단계와 막힌 곳을 안내합니다."
  - date: 2026-10-15
    title: "**리스크 심사 앱 M3** — 원장 v5 · REST · MCP 31종(기술)"
    tag: 기술
    items:
      - "스키마를 v5 로 올립니다 — 새 표 다섯(rr_issues · rr_summaries · rr_reports · rr_close_acks · rr_unit_live), 새 열 열셋, 새 색인, 클러스터 별칭 표를 소유자별 열쇠(owner_sub, old_cluster_key)로 다시 짓기. 첫 기동이 이행 전 사본 risk_review.db.pre-migrate-v4-<시각> 을 남기고(여유 공간이 원장의 1.2배보다 작으면 이행하지 않고 멈춘다) 한 트랜잭션으로 올립니다. 옛 SIF 는 v5 원장을 열지 않습니다."
      - "REST — POST /api/targets/{key}/cells/retry · cells/skip(실패 셀 처분 — 사유 4~300자, 넘김 응답의 걸림 셈 hits · hits_by · hits_basis), POST …/undefer(패널 대상의 보류 풀기), GET …/closure(?fresh=1) · POST · DELETE …/closure/acks/{item}(소유자 · 관리자, basis_hash 대조, 응답에 report_version), GET …/issues · PUT /api/issues/{id}(queue · skip, 사유 필수, 편성 · 도는 쟁점은 409), GET · POST …/report(쪽 · version 대조 409 report_version_moved · refresh_summaries)."
      - "진행판에 level_label · qualifiers · stage · report 와 review.filter · dispositions · noinput, 잡의 phase live · progress.reopened_extra · waiting(health_unknown · draining)이 생겼습니다. 재개는 ?consent=true 를 받고 잡 상한을 넘으면 409 max_calls 입니다."
      - "MCP 도구가 29종에서 31종이 됐습니다 — risk_get_issues · risk_get_report(읽기). risk_job_action 에 reason · filter · consent 와 action retry_failed · skip_failed 가 더해졌습니다. 359명 로스터에서도 응답 하나가 와이어 25,000자 안이고 쪽으로 이어 받습니다(쟁점 · 등록부 쪽의 ledger_rev 가 바뀌면 처음부터)."
      - "과제 구성원이 아닌 사람에게는 모든 쓰기 · 읽기 경로와 MCP 도구가 없는 것과 같은 404(not_visible)로 답하고 과제 id 를 싣지 않습니다. 쓰기 51 · 읽기 41 · MCP 31 을 시험이 라우터와 서버에서 뽑아 봅니다."
      - "남의 과제가 섞여 나오지 않게 했습니다 — 브리프의 좌석 기억(E7) · 성격 진술(E6) · 코퍼스 수(E8)와 유사 과제 · 선례 · 패턴 후보는 그 대상 주인이 볼 수 있는 과제만(MCP 는 주인과 부른 사람 둘 다 볼 수 있는 것만) 싣고, 앞 과제 · 계보로 남의 과제를 읽지 않으며, 원장 참조(reg · narr · tool)는 구성원만 엽니다. 야간 근접 중복 쌍 · 재제기 표기 · 새 패턴 큐 · 패턴 특징 범위는 한 소유자 안에서만 만들고, 과제 거름을 밝히지 않은 AIDataHub 클라이언트로는 서술 · 좌석 기억 2차 경로를 찾지 않습니다."
      - "반출 · 폐기 · 들여오기 — 기본 반출은 대상 · 스냅샷 · diff 열쇠 표도 과제 규칙으로 걸러 코퍼스에서 뺀 기밀 과제의 행을 싣지 않고, 쟁점 패널이 옮겨 적은 카드 글도 판정당 200자로 줄입니다. 과제 폐기는 등록부 merged_json 과 패널의 엔진 결과 원문까지 비우고 폐기 뒤에 끝난 패널 · 요약의 쓰기를 버리며, 들여오기는 사람의 확인 취소와 쟁점 결정을 잃지 않습니다."
  - date: 2026-10-15
    title: "**리스크 심사 앱 M3** — 러너 · 거르기 · 사슬 · 안전장치(기술)"
    tag: 기술
    items:
      - "검토 루프가 전문가마다 단계를 따로 밟습니다(근거 꾸러미 live → 묶음 pack → 검토 review → 마감). 입력 결손 전문가에게는 엔진의 noinput 호출(더 있으면 세 번까지 되묻기), 카드 0장 전문가의 카드 밖 호출에는 긴 문서 검색(못 물으면 세 번 다시 낸 뒤 역할만)을 씁니다. 셀 지문과 기대 판은 그 셀이 부르는 종류의 판만 잇습니다(요약 판이 올라도 셀은 다시 돌지 않는다)."
      - "거르기 — 열 줄 결정표 · 표본 · 대표 그림자 · 넓힘(셋째 영역에서 대상 전체 끔) · 잡 끝 보충 표본. 이중 판정은 걸린 별칭만 rev 하고 1순위는 보정용 전량이며, 보정의 놓침이 5% 를 넘으면 걸림 없는 묶음의 10% 를 무작위로 뒤집어 봅니다. 승인 문은 mech-owners.v1.json 과 change-routing.v1.json 이 둘 다 approved 일 때만 열리고 잡마다 얼립니다(지금 둘 다 draft)."
      - "근거 꾸러미 실호출(B 층) — 단위마다 compare_reports · compare_materials 를 그 잡의 사용자 PAT 로 한 번 불러 얼립니다. 그 PAT 시야에 없는 도구는 live_denied, 인프라 실패는 60초부터 두 배로 여섯 번 뒤 partial 입니다. HWAXRISK_EVIDENCE_LIVE=0 이면 호출 0 입니다."
      - "잡 사슬 — 검토 잡이 마감 범위를 닫으면 병합 → 보고서 판 → 쟁점 선정 → 쟁점 잡 → 종합 잡이 사람 손 없이 잇고, 끊긴 사슬은 러너 30초 틱이 메웁니다. M2 코드가 세운 잡에서는 사슬을 시작하지 않습니다. 쟁점 패널은 started_by=app 이라 관문을 줄이지 않고 하루 패널 상한에 세지 않으며, 재기동으로 닫히면 잡이 멈춰 사람이 재개합니다(포털 대화 id 를 스트림 전에 적어 고아 대화를 남기지 않는다)."
      - "다시 연 셀의 몫 — 살아 있는 잡에 묶이는 추정 밖 셀을 셀마다 돈 횟수로 세고, 여유(동의받은 추정의 20% · 최소 30회)를 넘으면 consent_extra, 추정 합이 HWAXRISK_REVIEW_MAX_CALLS 를 넘으면 max_calls 로 멈춥니다(차감 없음). 처분이 세우는 잡은 그 셀만 묶고 추정합니다. 어떤 취소든 그 잡이 건드린 전문가 보고서를 엔진 없이 다시 짓습니다."
      - "비우기 — /health 캐시를 15초로 줄였고, /health 를 못 읽거나 비우기 중이면 묶음 · 검토 워커를 띄우지 않고 진행판에 까닭(waiting health_unknown · draining)을 적습니다. 마감 · 근거 꾸러미는 그동안에도 돌고, 새 쟁점 패널 · 요약은 내지 않습니다."
      - "새 손잡이(knobs.env) — HWAXRISK_REVIEW_CONCURRENCY 8(4 에서) · HWAXRISK_REVIEW_FILTER on · HWAXRISK_FILTER_AUDIT_PCT 5 · HWAXRISK_REVIEW_DUAL flagged · HWAXRISK_REVIEW_DUAL_NEG_PCT 10 · HWAXRISK_EVIDENCE_LIVE 1 · HWAXRISK_ISSUE_PANEL_CAP 24 · HWAXRISK_ISSUE_PANEL_HARD_CAP 48 · HWAXRISK_ISSUE_SPLIT_MIN_OPPOSERS 2 · HWAXRISK_ISSUE_MAX_CHARGED 2 · HWAXRISK_SUMMARY_MAX_CHARGED 2 · HWAXRISK_SUMMARY_INFRA_MAX 6. 동의 · 상한(1,500 · 30,000)은 이제 calls_estimate.expected(거르기 없음 가정)와 견줍니다."
      - "반대 검토 여러 라운드와 단계 D 리허설(359명 × 단위 5, 실제 엔진의 쟁점 패널)에서 찾은 결함을 고쳤습니다 — 넘긴 셀의 걸림이 사라지던 것, 다시 연 셀이 어떤 잡에도 묶이지 않던 것, 요약을 모두 다시 쓰면 종합 잡이 끝나지 않던 것, 상한 재선정이 판정된 쟁점의 결과를 지우던 것, 비우기 깃발 뒤에도 호출이 나가던 것, 남이 다른 사람의 대상으로 등록부 병합을 부를 수 있던 것(main 핫픽스 12130f9 와 같은 수리)."
      - "택소노미 1.2 — 메커니즘 14종(광학 셋 · 음향 셋 · RF 넷 · 계면 둘 · 전기 둘)과 대분류 셋(optical · acoustic · rf)을 더하고 한 · 영 동의어를 넓혔습니다. 옛 38행은 한 칸도 바꾸지 않아 1.1 에서 풀리던 finding 은 1.2 에서도 같습니다. 카드 대조 요청의 메커니즘 목록이 38개에서 52개가 되고, 카드 대조 finding 의 메커니즘이 비거나 택소노미 밖이면 cells 대상에서만 자유 기술로 클러스터를 쪼개 서로 다른 지적이 process.unclassified 한 덩이로 뭉치지 않게 했습니다(배정표 밖 메커니즘에는 mech_out_of_domain 표지만 달고 판정은 그대로입니다)."
  - date: 2026-10-15
    title: "**지식카드 검색 · 빈 전문가 · 동기화** — 낱말 검색, 등록 안 된 키 거절, MX 카드 요약"
    tag: 수정
    items:
      - "카드 검색이 검색어를 낱말로 나눠 모든 낱말이 제목이나 요약에 있는 카드를 찾습니다. 카드에 있는 낱말 둘을 순서를 바꾸거나 띄어 쳐도 「맞는 카드가 없습니다」가 뜨던 것을 고쳤습니다. %·_ 도 글자 그대로 찾습니다."
      - "등록되지 않은 전문가 키로 카드를 올리면 이제 거절합니다. 그동안은 이름도 설명도 없는 빈 전문가가 전문가 목록에 말없이 생겼습니다(dynaforge-report · kooremapper-modelmeta 가 그렇게 생겼습니다)."
      - "MX 백서 카드처럼 원본 요약이 빈 카드는 첫 본문 앞 300자로 요약을 채우고, 상세 조회에 실패한 카드는 목록 정보로 덮어쓰지 않고 실패로 남깁니다. 본문이 같아도 제목·요약이 바뀌면 갱신합니다."
      - "KooRemapper 의 DynaForge 해석 리포트 등재가 빈 전문가 대신 「세트 낙하·충격 해석 전문가(sim-drop-impact)」 밑으로 들어갑니다. kr2datahub 시험 실행은 --upload 를 줄 때만 허브에 올립니다(기본은 미리보기)."
  - date: 2026-10-15
    title: "**AIDataHub · KooRemapper 적재·검색**(기술)"
    tag: 기술
    items:
      - "AIDataHub list_records 의 q 를 낱말 AND 로 거릅니다(icontains autoescape — % · _ 이스케이프, 낱말 상한 FTS_OR_MAX_TOKENS 12). 본문 절까지 찾는 스위치 AIDH_RECORDS_Q_BODY_SEARCH 를 더했습니다 — 기본 꺼짐, 운영 DB 사본에서 EXPLAIN ANALYZE 로 잰 뒤 켭니다. MCP·REST 설명이 스위치를 따라갑니다."
      - "적재 strict_agent_validation(기본 켬) — records.agents 에 등록 안 된 키가 있으면 쓰기 전에 422 로 거절합니다. 되돌리기는 STRICT_AGENT_VALIDATION=false(그때는 예전처럼 경고 + 빈 행)."
      - "동기화 — 매핑 규칙 summary_from_body(mxwp 만), 상세 조회 실패는 건너뛰고 dead_letter 에 사유(실행은 partial), 본문 해시·제목·요약이 모두 같을 때만 건너뜀, materialtwin 규칙에 sections_field(절 여러 개 — 없으면 body 로 받음)."
      - "KooRemapper reports/datahub.py 의 HUB_AGENT='sim-drop-impact' 와 양식 문서(agents 는 허브에 등록된 전문가 키), tools/kr2datahub.py 의 --upload(--dry-run 없앰, 기본 미리보기는 <id>.zip 저장)."
  - date: 2026-10-15
    title: "**전문가·지식카드 화면** — 빈 카드 · 로그인 만료 · 긴 카드 · 시작 패널 수를 고쳤습니다"
    tag: 수정
    items:
      - "MX 백서 분석가·kooremapper-iga 처럼 블록 구조로 된 카드가 제목만 늘어선 빈 카드로 열리던 것을 고쳤습니다. 본문을 풀어 보이고, 정말 글이 없는 카드에는 「본문이 비어 있는 카드입니다」를 띄웁니다."
      - "로그인 8시간 뒤 모든 화면이 「조회 실패(http_401) — 다시 시도」만 되풀이하던 것을 고쳤습니다. 쓰는 동안은 세션이 이어지고(갱신할 때 연장), 정말 만료되면 로그인 화면으로 보냅니다."
      - "긴 카드가 6만 자에서 말없이 잘리고 「표는 앞 0행」이라는 틀린 안내가 붙던 것을 고쳤습니다. 「본문 N절·N자 중 앞 N자」와 「다음 부분 보기」로 끝까지 읽을 수 있고, 표 안내는 표가 실제로 잘렸을 때만 붙습니다."
      - "전문가 상세를 못 받으면 역할도 지식도 없는 사람처럼 보이던 것을 「다시 시도」로 바꿨습니다. 설명이 정말 없는 전문가는 「설명과 역할 문서가 아직 등록되지 않은 전문가입니다」라고 씁니다."
      - "챗 시작 패널이 보유 지식을 미리보기 20건으로 세던 것을 전문가 목록과 같은 수(「N건 · 앞 20건」)로 고쳤습니다."
      - "SIM 카드의 원문(JSON)이 비례폭 문단 하나로 보이던 것을 코드 블록으로 보입니다."
  - date: 2026-10-15
    title: "**HE팀 운영자 · 심의 좌석** — 운영자 동기화가 다시 돌고, 빈 역할이 영문 안내로 채워지지 않습니다"
    tag: 수정
    items:
      - "HE 운영자 정본의 도구 이름 두 개를 고쳐 cae00 운영자 동기화가 다시 돕니다(ODB 허브 운영자를 만들 수 있습니다). 붙지 않은 앱의 도구는 '선택' 으로 두어 앱이 빠져 있어도 운영자가 만들어집니다."
      - "운영자 챗이 실제로 연결된 앱만 말하고, 앱이 다 빠졌으면 '도구로 답한다' 고 하지 않습니다(한 턴에 서로 반대인 메시지 셋이 뜨던 것)."
      - "smart-twin-cluster 운영자 설명이 '조회 전용' 이라고 하던 것을 고쳤습니다. 잡을 제출하는 두 도구(smarttwin_submit · slurm_submit_job)는 사용자 확인 뒤에만 부릅니다."
      - "역할 문서가 빈 전문가를 심의에 앉히면 영문 허브 안내 3천 자가 역할로 들어가던 것을 고쳤습니다. 이름으로 앉히고 「등록된 역할 문서가 비었다」 경고를 냅니다."
  - date: 2026-10-15
    title: "**지식카드 읽기 · 세션 갱신 · 운영자 동기화**(기술)"
    tag: 기술
    items:
      - "에이전트 서버 catalog_record 가 블록 구조(blocks·subsections·children)를 마크다운으로 풀고(표가 200행을 넘으면 그 자리에 안내), 글이 없으면 RAG 절로 채웁니다. total_sections·total_chars·next{section,char} 를 싣고 section_offset·char_offset 으로 이어 읽습니다. 포털 중계가 두 칸을 넘깁니다(0~1e6 · 0~2e6, 음수는 422)."
      - "catalog_agent 가 상세·목록 실패를 빈 전문가·0건이 아니라 error:session_failed · records_error:records_failed 로 줍니다(성공이면 그 칸이 없습니다). 포털 화면 다섯 곳이 같은 실패 문구와 「다시 시도」를 씁니다."
      - "/auth/refresh 가 접근 쿠키와 함께 갱신 토큰(8시간)·CSRF 쿠키를 다시 발급합니다. 8시간 동안 갱신이 없으면 만료되고, 사용 중지된 계정은 갱신을 거절합니다. 갱신이 401·403 이면 화면이 hwax:session-expired 로 로그인으로 보내고 ste 사본도 지웁니다."
      - "sync-he-personas.py 에 앱별 optional 블록과 미리보기의 '· 일부' 줄을 더했습니다. 정본 he-team.json 의 도구 이름 둘(reportarchive_upload_*)과 search_web 의 위치를 고쳤습니다."
      - "심의 _restore_role 이 역할 원문을 _role_doc 으로 거르고, 빈 역할 좌석에 persona_role_empty 경고를 냅니다. 원문(JSON) 보기는 ```json 코드 펜스로 감쌉니다."
      - "그림 입력 탐침 scripts/llm_vision_probe.py — GLM 이 content 배열의 image_url 을 받는지 HWAX 를 거치지 않고 확인합니다(진단 — HWAX 의 챗·심의 요청에는 지금 image_url 이 없습니다, docs/chat-vision)."
  - date: 2026-10-15
    title: "**업데이트가 리스크 심사를 기다리지 않습니다** — 재기동 전에 카드 대조를 잠깐 비웁니다"
    tag: 배포
    items:
      - "리스크 심사가 며칠 돌아도 update-all 을 막지 않습니다. 재기동 전에 카드 대조의 새 호출과 새 패널을 멈추고, 도는 카드 대조는 최대 5분 기다린 뒤 넘어갑니다. 그래도 끊긴 호출은 리스크 앱이 차감 없이 다시 돌립니다. 끝나면 깃발을 내려 이어 돕니다."
      - "도는 심의 때문에 재기동을 미룬 실행이면 카드 대조는 곧바로 이어 돌고 새 패널만 멈춰 둡니다. 심의가 끝나면 30분 창이 열리고, 그 안에 update-all 을 다시 돌리면 미룸 없이 지나가며 깃발이 내려갑니다."
      - "update-all 끝의 상태 점검에 '리스크 검토' 줄이 생겼습니다 — 비우기 깃발·도는 카드 대조 수·챗 첫 응답 지연(평소 대비). 챗이 평소의 2배 넘게 느리면 경고와 함께 카드 대조 동시 수를 낮추는 법을 알려 줍니다."
      - "관리자는 ./infra/scripts/review-drain.sh 로 깃발을 보고(status) 세우거나(on · on --hold) 내릴 수 있습니다(off · off --force)."
  - date: 2026-10-15
    title: "**에이전트 서버 카드 대조** — 새 호출 둘·판 올림·동시 8건·비우기 깃발(재설계 M3)"
    tag: 기술
    items:
      - "카드 대조에 호출 종류 둘을 더했습니다 — noinput(ECAD 처럼 입력이 없는 전문가가 카드 전부를 보고 '지금 변경으로 말할 수 있는 영향' 과 'ECAD 가 오면 확인할 것' 을 답함)과 summary(영역 요약·과제 종합의 서술 — 꼭 다룰 행이 빠지면 그것만 다시 묻는다). 판정 틀은 걸린 줄에 택소노미 1.2 의 메커니즘(mech)을 달고, 훑기는 결측을 알고 답하며, 카드 0장 전문가는 묶인 문서의 절을 발췌 근거로 씁니다."
      - "프롬프트 판이 cr-sweep-2·cr-verdict-2·cr-offcard-2·cr-noinput-1·cr-summary-2, 예산 공식이 cr-l2 로 올랐습니다. 판이 바뀌면 도는 M2 카드 대조 셀은 처음부터 다시 돌므로 살아 있는 검토 잡이 없을 때 반영합니다."
      - "카드 대조 동시 호출 상한이 8 이고, 사람이 띄운 심의가 돌면 4 로 줄어듭니다(리스크 앱이 띄운 패널은 줄이지 않는다 — delib_opts.started_by). 카드 대조만의 출력 상한 CARD_REVIEW_MAX_TOKENS 를 둡니다."
      - "비우기 깃발 POST·GET /drain — scope all(새 카드 대조를 받지 않음)·panels(새 패널만 멈춤), TTL(요청 하나 6시간 상한 · 살아 있을 때 주인이 늘리면 창이 새로), until_idle(심의가 끝난 뒤 grace), 사람의 hold. 주인 아닌 비보류 요청은 409 drain_owned, 쓰기·지우기 실패는 503. /health 에 review_active·draining·drain·capabilities·card_review 칸이 생겼습니다."
      - "/health.load.chat — 챗 첫 조각 지연(p50·평소)을 재고 카드 대조가 챗을 밀어내면 slow 를 세웁니다. LLM 탐침과 가짜 LLM 서버의 --capacity·스트리밍을 더했습니다."
      - "결과 계약 — 종류별 판 limits_rev_by_kind(plan 응답에도) · run 의 expect.limits_rev_kind · 걸린 줄은 OK 줄에 흔적 없이 밀려나지 않음(checks.dup_conflict·flipped_from·contested_by, quality.dup_conflict·flipped) · meta.clipped · ctx_too_small 의 종류별 사유와 필요한 창·출력 상한 · 거절 되비춤 80자."
      - "모델이 어휘 밖 말로 답하면 짧은 별칭표로 뜻을 읽습니다(예: FAILED·실패 → FAIL, 경고 → WARNING, none·없음·무관 → no, n/a·해당 없음 → na — 원래 말은 checks.alias). 그래도 모르는 말은 '모름' 쪽으로 두고, 다른 답과 부딪치면 다툼(dup_conflict·contested_by.raw)으로 남겨 흔적 없이 지우지 않습니다."
      - "M0-b 탐침에 보강 팔 셋(--extra agree·merged·summary)과 팔별 OK+na 비율을 더했습니다."
      - "반대 검토 다섯 라운드의 54건(엔진 49 · 포털 5)을 고쳤습니다 — 행 검사(덜 된 답을 완결로 받던 것 · 고친 줄이 옛 줄을 대신하지 못하던 것 · 상한이 진짜 걸림을 밀어내던 것), 비우기 깃발(고정 · 주인 · 수명 · 깨진 파일 · 동시 쓰기), 자리 누수, 검색 오류 봉투, 절단 표식, 요약 덮기(한 줄은 셋까지 — 요약 프롬프트 판 cr-summary-2)."
  - date: 2026-10-15
    title: "**포털 카드 대조 중계·update-all 비우기**(기술)"
    tag: 기술
    items:
      - "카드 대조 중계가 새 종류(noinput·summary)를 그대로 넘기고, 요약 호출의 감사 줄은 단위 자리에 범위 키를 싣습니다. 포털은 /drain 을 중계하지 않습니다."
      - "심의 요청의 delib_opts.started_by(human·app)를 받아 넘깁니다 — 리스크 앱이 띄운 패널의 표지가 중계에서 사라지지 않습니다."
      - "update-all 1h) 리스크 검토 비우기와 lib/review-drain.sh — 손잡이 HWAX_DRAIN_TTL_S(1800, 21,600 에서 자름)·HWAX_DRAIN_WAIT_S(300)·HWAX_DRAIN_GRACE_S(1800)·HWAX_DRAIN_MAX_S(46800)·HWAX_AGENT_URL. 옛 엔진(/drain 없음)이면 ○ 한 줄로 지나갑니다. 비우기는 실패해도 배포를 막지 않습니다. 사람이 세운 깃발은 건드리지 않고(고정이면 끝까지, 수명 있는 것은 풀리면 update-all 이 이어받는다), 실행 중에 사람이 내린 깃발은 다시 세우지 않습니다."
      - "워크플로 hwax-risk-review 의 안내에 '카드 대조(flow=cells) 대상은 받지 않는다 — 그 대상의 쟁점·종합 보고서는 risk_get_issues·risk_get_report 로 읽는다' 를 더했습니다(두 도구는 리스크 앱 M3 와 함께 올라갑니다)."
      - "에이전트 서버 env 킷(infra/env-kits/agent-server.env)에 카드 대조 손잡이 구획을 주석으로 더했습니다 — CARD_REVIEW_CONCURRENCY(8)·CARD_REVIEW_CONCURRENCY_WITH_DELIB(4)·CARD_REVIEW_MAX_TOKENS(0)·CARD_REVIEW_PARSE_RETRIES(2)·CARD_REVIEW_SEARCH_TIMEOUT_S(60). 값은 엔진 기본값이고 시험이 엔진 상수와 맞댑니다."
  - date: 2026-10-14
    title: "**StepForge** — StandardPlatform 참고본 · SP 허브 과제 정보 수신기(기술)"
    tag: 기술
    items:
      - "StandardPlatform 을 submodule 로 둡니다(external/StandardPlatform 을 f7485c0 에 고정 — DynaForge 와 같은 경로 · 같은 커밋). 런타임(app · core · scripts · fixtures)이 그것을 import 하거나 sys.path 로 우회하면 깨지는 구조 시험을 두었습니다(D-525)."
      - "SP 허브 코어 API 수신자 core/sp_core.py — StandardPlatform 수신 키트를 httpx 로 옮겨 카탈로그 → 가리키는 타입 → 객체 → 열린 선 순으로 받고, 수신 규칙 열하나(삭제 · 병합 · 개명 · 숨김, 모르는 칸 무시, 부재 대조는 끝까지 받은 뒤, 404 둘을 코드로)를 지킵니다. reset 은 거울을 비우지 않고 처음부터 받은 뒤 대조합니다(D-526)."
      - "읽기 전용 거울 표 다섯(onto_types · onto_relation_types · onto_objects · onto_relations · onto_sync_state — 쓰는 코드는 sp_core 하나), 잡 plm_sync(잡 종류 13 → 14 · 도구 141 → 142), get_project_meta.plm_task(0건이면 까닭) · find_plm_task · REST GET /api/find-plm-task. 설정은 STEPFORGE_SP_CORE_URL · STEPFORGE_SP_TOKEN_FILE 이고 토큰은 응답 · 로그 · DB 에 남지 않습니다. 진짜 허브가 아직 없어 가짜 코어 서버로 끝까지 돌렸습니다."
  - date: 2026-10-14
    title: "**DynaForge** — 해석 리포트를 SP 허브의 과제·개정에 잇습니다(설정으로 켭니다)"
    tag: 연결
    items:
      - "해석 리포트를 과제(PLM)와 개발 개정에 잇습니다. 개정 이름은 리포트 메타 · 과제명 꼬리 · 허브의 모델 리비전에서 후보와 근거를 보여 주고 사람이 고릅니다. 짐작으로 붙이지 않고, 사람이 확정한 것은 리포트를 다시 올려도 기계가 덮지 않으며, 순환하는 개정 줄은 거절합니다."
      - "리포트 화면에 개정 패널이 생겼습니다. 메타와 이어진 개정이 다르면 조용히 맞추지 않고 빨간 띠로 먼저 보이고, 쓸 수 없는 후보도 사유와 함께 보이며, 같은 과제의 개정 줄과 판마다 결과 건수를 보여 줍니다."
      - "지난 리포트를 정본 과제에 붙이는 계획은 글자 그대로 같거나 사람이 별칭을 적어 둔 것만 자동으로 붙이고, 나머지는 근거 있는 후보와 '못 붙였다' 목록으로 줍니다. 계획을 보는 것만으로는 아무것도 쓰지 않습니다."
      - "과제는 허브에서 받기만 하고 이쪽에서 고치는 길은 없습니다. DynaForge 박스의 `platform/.env` 에 허브 코어 API 주소와 `core:read` 토큰 두 줄을 넣으면 켜지고(`KOORM_ONTOLOGY=1` · `=0` 으로 적으면 그것이 이깁니다), 꺼지면 화면에서 사라지고 API 도 409 와 사유로 거절합니다. 포털 관리자 화면의 배선 설정 목록에 이 항목(dynaforge-ontology)을 더했습니다."
  - date: 2026-10-14
    title: "**DynaForge** — stcx 전각도 낙하가 SmartTwinMCP 로 덱을 실어 보냅니다"
    tag: 연결
    items:
      - "stcx(356대) 전각도 낙하 제출이 SmartTwinMCP 도구로 바뀌고, 제출 전에 덱을 stcx 쪽에 나눠 올려 그 경로를 넘깁니다. 두 쪽이 같은 경로를 본다는 전제가 사실이 아니어서 stcx 가 이 서버의 덱을 열 수 없었습니다."
      - "`*INCLUDE` 가 든 덱은 올리기 전에 막고 `extract-parts` 로 한 파일 덱을 만들라고 안내합니다(받는 쪽은 모델 파일 하나만 받습니다). 덱 앞부분만이 아니라 끝까지 훑어 찾습니다."
      - "제출 폼에 이번 판이 실제로 받는 칸만 남겼습니다. 예전 폼의 98칸은 대부분 제출에서 거절됐습니다."
  - date: 2026-10-14
    title: "**DynaForge** — SmartTwinMCP 제출 배선 · 과제·개정 표와 수신기 · StandardPlatform 참고본(기술)"
    tag: 기술
    items:
      - "stcx 제출 — 도구 smarttwincluster_* → smarttwinmcp_*(인자는 args 한 겹, 응답은 JSON 봉투 — 성공은 봉투 ok · result.ok · registry_id 셋 다), 반입 StcxUploader(init → chunk → complete). stcx 설정 넷 가운데 하나라도 비면 제출이 명시적으로 실패합니다. 시간 초과에 다시 내지 않고(받는 쪽이 묵은 덱으로 돈다) job_status(work_dir) 로 registry_id 를 되찾으며, 끝 판정은 get_job_details 를 함께 봅니다."
      - "업로드는 잡 번호를 싣지 않고 이름 <잡 id>_<이름>.k 로 가릅니다 — 받는 쪽 1.1.2 가 jobs/ 경로를 허용 범위 밖으로 거절하고, SSO 가 꺼진 받는 쪽에서는 모두 admin 이라 같은 이름이 서로 덮습니다. /api/v1/stcx/options 는 빈 목록 + 사유, 카탈로그 params 98 → 14, 받지 않는 80칸은 _SCENARIO_MAP 에 남기고 시험이 이름으로 고정합니다."
      - "StandardPlatform 을 submodule 로 둡니다(external/StandardPlatform @ f7485c0 — StepForge 와 같은 경로 · 커밋, 허브 토큰은 platform/.env). 런타임이 그것을 import 하지 않는다는 경계 시험은 훑은 파일 수까지 봅니다(추적 파일만 훑어 늘 초록이던 것을 고쳤습니다)."
      - "과제 수신 — 표 다섯(0011_ontology)과 수신기 app/runner/sp_core.py(renamed_from 을 previous_keys 로 옮김 · 한 쪽에 같은 key 가 두 번 오면 접음 · 0건이면 아무것도 비활성으로 만들지 않음 · APP-CORE-0001 은 멈추고 알림), 주기 수신 plm_sync(잡이 아니라 주기 작업 · 간격 기본 3600초 · 주소나 토큰이 없으면 꺼짐). 부서 행은 만들지 않습니다(소속 정본은 포털입니다)."
      - "자체 정의 platform/core/ontology/dynaforge-core.json(dev_revision · revision_of · supersedes · measured_at)과 정의 검증기 app/runner/ontology_def.py, 0012 관계 카디널리티 · 0013 과제 별칭 표. 라우트 10 · MCP 도구 6(62 → 68) — 과제를 쓰는 길이 없다는 것(쓰기 경로 집합)과 관리자 관문을 시험이 고정하고, 켜짐 판정은 app/shared/features.py 한 곳입니다. MCP 기본 호출이 빈 limit 때문에 422 로 깨져 있던 것과 isError 를 못 보던 스모크를 고쳤습니다."
  - date: 2026-10-14
    title: "**리스크 심사** — 로그인한 사람의 자격으로 끝까지 돕니다(PAT 를 손으로 등록하지 않아도)"
    tag: 연결
    items:
      - "Claude 로 리스크 앱 도구를 부르면 그 사람의 포털 PAT 가 저절로 등록되고, 만료 7일 전쯤 저절로 바뀝니다. 게이트웨이가 Claude 에 넣은 본인 PAT 로 포털에서 더 좁은 PAT(이름 hwax-risk · 읽기 · 원 PAT 수명 이하)를 바꿔 받아 앱에 넘깁니다. 토큰 화면에 '교환으로 생김' 표지로 보입니다."
      - "사람이 시작한 패널 잡도 서비스 계정 시야로 내려가지 않습니다. 그 사람이나 과제 owner 의 PAT 가 없으면 잡을 시작하지 않고, 까닭과 등록하는 길(Claude 에서 리스크 도구를 한 번 부르거나 웹 설정의 「포털에서 발급해 등록」)을 말합니다."
      - "Claude 로 StepForge 과제를 캡처해도 단위 검문(G6)이 「모름」으로 막히지 않습니다. 그 사람의 PAT 로 게이트웨이를 거쳐 StepForge 의 /tree 를 읽습니다(그 PAT 에 step-forge 청중이 있어야 합니다 — Claude 에 넣는 PAT 는 청중을 고르지 않고 발급하세요)."
      - "RA 로 아직 보내지 않은 일이 '반영 안 됨 — 보내는 쪽이 아직 없다' 로 과제·진행판·Claude 길잡이에 보입니다(RA 쓰기 자체는 다음 단계입니다)."
      - "설정 화면의 '이 박스' 가 왜 자격이 모자란지 까닭별로 말합니다(이관 직후 · 필수 키 없음 · 키가 틀림 · 앱이 만든 개발용 키 사용 중 · 선택 키 없음). 필수 키는 자격 암호화 키 하나이고, 나머지 키는 없으면 무엇이 닫히는지만 알립니다."
  - date: 2026-10-14
    title: "**포털 PAT 교환·자기 폐기** · 토큰 화면 '교환으로 생김' 표지"
    tag: 기술
    items:
      - "POST /auth/pat/exchange — 사람이 발급한 PAT 하나(Bearer)로 같은 사람의 더 좁은 PAT 를 받습니다. 청중·범위는 원의 부분집합, 만료는 원 이하, feat:api-token 이 있어야 하고, 챗·절차 PAT 와 이미 교환한 PAT 는 원이 될 수 없습니다. min_remaining_s 보다 짧게 살 PAT 는 서명 전에 거절하고(source_expiring), 원 하나에 살아 있는 교환 PAT 는 다섯까지입니다. 교환 PAT 에는 원을 가리키는 par 클레임이 붙고, 원을 폐기하면 함께 폐기됩니다."
      - "POST /auth/pat/revoke-self — PAT 가 자기 자신만 폐기합니다(이미 폐기돼 있어도 200). 리스크 앱은 새 PAT 를 받아들인 뒤에 옛것을 이것으로 지웁니다."
      - "토큰 목록에 parent_jti 가 실리고, 토큰 화면이 교환으로 생긴 토큰에 표지를 답니다. PAT 범위 이름은 소문자·숫자·_- 꼴만 받고, 발급·교환 기록 줄은 이름을 그대로 찍지 않아(%r) 줄 위조를 막습니다."
      - "update-all 이 게이트웨이의 리스크 앱 위임 항목에 PAT 자동 등록 칸 둘(portal_pat_url·portal_pat_spec)이 없으면 다시 프로비저닝합니다."
  - date: 2026-10-14
    title: "**MCP 게이트웨이** — 위임 단언을 받을 때 포털 PAT 교환을 대신 겁니다 · REST 다리 시간 한도"
    tag: 기술
    items:
      - "per_user_sso 항목의 portal_pat_url·portal_pat_spec — 앱의 단언 발급 응답이 portal_pat_wanted 를 실으면, 포털 PAT 로 들어온 호출에 한해 호출자의 Authorization 그대로 포털 교환을 부르고(운영자가 박은 명세 ∩ 앱의 바람 ∩ 호출자 PAT 청중) 결과를 그 도구 호출보다 먼저 앱에 넘깁니다. 최선 노력(8초)이고 토큰 값은 어디에도 적지 않으며, 결과는 감사 note(portal-pat:…)에 남깁니다."
      - "GW_TOKEN·웹 챗·절차 PAT·교환 PAT 로 온 호출은 건너뛰고, 그 바람은 남겨 두었다가 같은 사람의 다음 포털 PAT 호출에서 건넵니다. 앱이 확실히 거절했을 때만 새 PAT 를 스스로 폐기하고(결과를 모르면 두어 쓰던 자격까지 잃지 않게), 명세가 빠진 설정은 기동 로그에 경고하고 앱에도 알립니다."
      - "REST 다리 상류 한도를 REST_PROXY_UPSTREAM_TIMEOUT_S(기본 110초)로 두고, 시간 초과는 손잡이 이름을 실은 504 로 답합니다(앱의 120초보다 안쪽 — 큰 StepForge 트리가 30초에 끊기던 것)."
  - date: 2026-10-14
    title: "**리스크 심사 앱** — 자동 등록·자격 판정 배선(기술)"
    tag: 기술
    items:
      - "POST /api/auth/portal-pat(게이트웨이 비밀·위임 이메일로만 열림)과 단언의 portal_pat_wanted, GET /api/me 의 portal_pat.auto(enabled·due·due_reason·마지막 출처·마지막 실패와 종류)와 PUT /api/me/portal-pat-auto, 살림 표 _user_prefs 를 더했습니다. 일시 오류는 10분, 포털 거절은 6시간 쉰 뒤 다시 바랍니다."
      - "등록이 새 PAT 를 받아들인 뒤에 앱이 스스로 받은 옛 PAT(교환·웹 버튼)만 포털에서 폐기합니다. 손으로 붙여넣은 PAT 나 새것의 원은 건드리지 않습니다."
      - "캡처의 StepForge REST 는 웹 로그인 토큰 → 게이트웨이 다리(사람 PAT) → 서비스 키 순이고, 다리가 실패하면 그 캡처 동안 서비스 키로 넘어가며 다리의 HTTP 상태를 길잡이에 싣습니다. 캡처 응답에 credentials.rest·rest_ok·rest_bridge 가 실립니다."
      - "자격 암호화 키를 Fernet 으로 확인하고(cred_key_invalid), 설정 화면 글에서 절대경로를 빼고 익명에게는 까닭 코드만 줍니다. 고칠 명령은 값을 화면에 찍지 않고 끝 줄바꿈 없는 secrets.env 에도 안전합니다. 갱신 문턱 손잡이 HWAXRISK_PAT_RENEW_BEFORE_S·쉼 HWAXRISK_PAT_AUTO_RETRY_S 와 그 기동 검사를 더했습니다."
  - date: 2026-10-14
    title: "**낙하 해석 전처리(pyKooCAE)** — 강체 전환에서 뺀 파트 때문에 해석이 시작도 못 하던 것을 고쳤습니다"
    tag: 수정
    items:
      - "낙하 해석에서 일부 파트를 강체 전환에서 빼면(`ELASTIC_TO_RIGID` 의 `*PIDExcept`) 뺀 파트의 재질이 출력 덱에서 사라지고, 그 재질 번호를 같이 쓰던 파트에는 재질이 하나도 남지 않아 LS-DYNA 가 입력 단계에서 멈추던 것을 고쳤습니다. 뺀 파트의 재질은 그대로 두고, 같은 재질 번호를 쓰는 강체화 파트에는 강체 재질을 새 번호로 만들어 줍니다. 빼는 파트가 없는 덱은 출력이 그대로입니다."
      - "KooChainRun 낙하(DROP) 도움말에 10월에 더한 접촉 · 강체 전환 키(drop_surface.deformable_to_rigid · drop_contact 의 Type · Scope · InheritGeneral · tied_options 등)와 실제로 돌려 확인한 강체 전환 사례를 실었습니다. SmartTwinMCP 의 낙하 시나리오 도구 설명이 이 도움말에서 만들어집니다."
  - date: 2026-10-13
    title: "**StepForge** — 서버가 붐벼도 측정 호출이 2분 한도를 넘기지 않습니다"
    tag: 수정
    items:
      - "서버가 바쁠 때 판 전체 단면 · 단면 위 치수 · 파트 색인 · 모서리 근접 · 리브와 보스 찾기가 2분(게이트웨이 한도)을 넘겨 끊기던 것을 고쳤습니다. 재기 전에 얼마나 붐비는지(같은 코어를 나눠 쓰는 하이퍼스레드 짝까지)를 재어 한 호출에 할 몫을 줄이고, 넘칠 것 같으면 일찍 멈춰 찾은 데까지와 같은 계산을 끝까지 재는 잡 호출문을 줍니다. 그때 응답이 '붐볐다' 고 말합니다."
      - "한가할 때의 답은 그대로이고, 잡음 수준의 바쁨으로는 몫을 줄이지 않습니다."
      - "`estimate_cost` 가 치수를 재지 않는 단면 호출에도 '재기 전에 스스로 멈춘다' 고 말하던 것을 고쳤습니다."
  - date: 2026-10-13
    title: "**StepForge** — 판 전체 합치기 벽 모형 · 단면 치수 관문 · 실행 대기 한 함수 · 하이퍼스레드 짝 몫(기술)"
    tag: 기술
    items:
      - "판 전체 합치기 벽 모형(D-519) — 결과를 짓는 몫은 면마다 한 스레드라 따로 셉니다(fuse_seconds, FUSE_BUILD_WALL_PER_CPU 0.42 — 쌍 수로 세는 모형 다섯은 버렸다). section_profile 판 전체와 stackup 외곽이 한 함수를 쓰고, 붐빈 서버에서 120.6초 걸리던 구멍 1,600개 판 둘이 합치기 전에 4.6초에 멈춥니다."
      - "단면 위 치수 진행 관문(D-520) — section_report(dims=true) 의 분기한정이 원시 호출(최근접 · 점 분류 · 교선 등)을 부르기 전에 꼴별 단가로 세어 멈추고, 찾은 행은 지키며 못 본 쌍은 하한과 함께 냅니다(rows_certain · skipped_work · work_skipped_pairs). 측정 잡에 section_report 를 더했습니다."
      - "실행 대기 보정 한 함수(D-521 · D-522) — 재기 전 작업량 예상과 견주는 관문 전부가 measure.paced_budget 으로 상한을 받고(셈표 가드 GATES · 사유 문장 budget_words · 공개 표 load_pace 14블록), 겹침 부울만 OVERLAP_PACE_FILL 0.665 로 덜 나눕니다. 견적은 인자에 딸린 관문 표 GATED_WHEN 으로 판정합니다."
      - "하이퍼스레드 짝 몫(D-523 · D-524) — 재는 창에서 짝 논리 CPU 의 바쁨 b 를 읽어 나눌 값을 대기 비 × (1 + b(σ−1)) / 1.3 으로 셉니다(σ 1.3, 칸 sibling_busy · sibling_share). 한가할 때 짝 몫만으로 넘긴 잔 나눔은 무시하고(LOAD_PACE_GRAIN_RATIO 1.03), 병렬 형상 도구의 일꾼 수는 묶인 CPU · cgroup 몫(core.parallel.usable_cpus)을 넘지 않습니다."
  - date: 2026-10-13
    title: "**DynaForge** — 해석 리포트의 핫스팟 군집과 결과 그림을 화면과 Claude 에서 봅니다"
    tag: 연결
    items:
      - "리포트에 들어 있었는데 플랫폼이 버리던 블록을 이제 전부 꺼내 봅니다(deep 21키 중 11 · impact 27키 중 18 이 어디에도 닿지 않았습니다). 핫스팟 군집 · 거동 군집 · 분석 요약 일곱 블록이 따로 오르고, 나머지도 블록 이름과 경로로 꺼냅니다. 큰 배열은 잘랐다고 말하고, 계산하지 않은 블록은 0 이 아니라 '미계산' 으로 적습니다."
      - "리포트를 번들(.zip · .tar)로 올리면 결과 그림과 영상이 함께 들어옵니다. Claude 가 결과 그림을 직접 보고(`report_image`), 케이스 여러 개의 지표 표와 그림을 한 번에 견줍니다(`report_compare` — 그림 8장까지, 넘으면 뺀 수를 말합니다). 영상은 모델이 볼 수 없어 피크 그림을 권합니다."
      - "리포트 분석 화면에 탭 넷(핫스팟 군집 · 거동 군집 · 결과 그림 · 분석 블록)이 생겼습니다. 합성(mock) 데이터나 한 가지로 뭉친 거동 군집, 값이 고르게 퍼진 핫스팟은 눈에 띄게 따로 적습니다."
      - "파트 시계열이 응력 하나만 싣던 것을 변형률 · 주응력 · 주변형까지 일곱 계열로 넓혔습니다."
      - "`extract-parts` 가 원본의 초기응력 · 초기변형(`*INITIAL_STRESS_*` · `*INITIAL_STRAIN_*` · `*INTERFACE_SPRINGBACK_*`)을 뽑은 덱에 옮기지 못할 때 따로 세어 경고하고 이어 가는 법을 알려 줍니다. 예전에는 버린 키워드 목록에 묻혀 프리스트레스 모델의 초기응력이 조용히 사라졌습니다."
  - date: 2026-10-13
    title: "**DynaForge** — 리포트 블록 전수 · 결과 그림 번들 반입 · 규모 측정 생성기(기술)"
    tag: 기술
    items:
      - "리포트 정규화의 허용 목록 대신 list_blocks(최상위 블록 전수와 해석 여부 read_by_parser) · get_block(name, path) 로 무엇이든 꺼내고, 회귀가 '해석하지 않는 블록 집합' 을 이름으로 고정합니다 — 생성기가 키를 늘리면 빨개집니다. 분석 요약은 다시 계산하지 않고 생성기의 summary 를 그대로 올립니다(다시 계산하면 HTML 화면 숫자와 갈린다)."
      - "결과 그림 반입 — app/reports/bundle.py 가 번들을 풀며 경로 탈출 · 링크 · 장치 파일 · 멤버 수 · 크기 · 확장자를 막고, 마이그레이션 0010_report_media(JSONB)에 리포트가 선언한 위치 ↔ 그림 매핑만 싣습니다(그림 없는 위치는 비워 두고 deep 은 파일명으로 짐작하지 않는다). API 여섯(/blocks · /blocks/{name} · /hotspots · /clusters · /analytics · /media)을 더했고, MCP report_image 는 ImageContent 로 내며 reports_smoke 가 콘텐츠 블록의 종류를 봅니다(dict 속 base64 는 성공처럼 보인다)."
      - "규모 측정 생성기 tools/scale/gen_scale_deck.py 를 리포에 넣었습니다(측정 폴더를 지워 재현할 길이 없었다). 1.9GB 합성 덱에서 cleanup-nodes(report) 16.7초 · 686MB, extract-parts 34.0초 · 1.18GB 로 덱 전문을 들지 않는 것을 쟀습니다."
  - date: 2026-10-13
    title: "**리스크 심사 앱** — 전문가가 자기 지식카드 전부로 변경 단위를 하나씩 대조합니다(카드 대조, 재설계 M2 · 박스마다 켬)"
    tag: 기술
    items:
      - "심사 대상을 '카드 대조' 방식(`flow=cells`)으로 열면 변경을 검토 단위로 나누고, 고른 전문가마다 지식카드 전부를 얼려 단위마다 카드별로 걸림·보류·걸림 없음을 판정합니다. 카드 밖에서 보이는 위험도 따로 받습니다. 판정은 포털 중계(`/agent/card-review/*`)를 거쳐 에이전트 서버 엔진이 내고, 포털 대화는 만들지 않습니다."
      - "기본은 꺼져 있습니다. 박스마다 데이터 디렉터리의 `knobs.env` 에 `HWAXRISK_REVIEW_ENABLED=1` 한 줄로 켭니다(값과 출처는 관리자 `GET /api/meta/runtime`). 패널 방식은 그대로 남고, 패널을 돈 대상에 카드 대조를 얹을 수 있습니다."
      - "전문가마다 보고서가 나옵니다 — 읽는 법·올린 finding 이 앞에, 걸림·보류는 카드 인용과 함께 자세히, 걸림 없음은 한 줄로. 인용은 카드 원문과 다시 대조해 '둘 다 찾음·하한 밑·한쪽만 찾음·못 찾음' 으로 적고, 다른 박스로 반출할 때는 200자로 줄이며 원래 길이를 남깁니다. 카드 하나의 FAIL 은 과제 판정을 WARNING 까지만 올립니다."
      - "검토는 검토자 본인의 포털 PAT 로만 돕니다. PAT 가 만료·거절되면 서비스 계정으로 내려가지 않고 잡을 멈추고 알립니다. 앱·에이전트 서버가 재기동해도 끊긴 호출은 차감 없이 다시 돌고, 취소는 도는 호출이 닫힐 때까지 `cancelling` 입니다."
      - "MCP 도구가 26종에서 29종이 됐습니다 — `risk_get_units`(검토 단위)·`risk_get_cells`(전문가 × 단위 격자)·`risk_get_expert_report`(보고서 쪽). 검토 잡은 `risk_start_job(mode='reviews', scope=...)` 로 세우고, 진행은 `risk_get_coverage` 의 `review` 칸이며 검토 순서 전부는 `order_offset` 쪽으로 받습니다(수백 명 로스터도 응답 하나가 잘리지 않게)."
      - "스키마를 v4 로 올렸습니다 — 검토 단위 표 둘, 셀 원장 표 다섯(셀·판정·카드 묶음·호출·전문가 머리), 잡의 보류 열, finding 의 출처 열. 추가만 하는 이관이라 기존 원장은 그대로입니다."
      - "과제를 폐기하는 동안 돌던 카드 대조 호출이 다음 재기동까지 '도는 중' 으로 남아 그 대상의 새 검토를 막던 것을 배선 리허설에서 찾아 고쳤습니다."
      - "배포된 게이트웨이에 리스크 앱 도구가 실제로 떠 있는지 이 체크아웃의 도구 목록과 대조하는 scripts/rr_gateway_check.py 를 더했습니다(읽기 전용 · 표준 라이브러리만 · PAT 는 환경변수로만 받는다). 종료코드는 0 이상 없음 · 2 판정 불가 · 3 배포본이 낡음이고, update-all 에는 배선하지 않았습니다."
  - date: 2026-10-12
    title: "챗이 **'동시 챗 한도' 에 묶여 풀리지 않던** 경우를 막았습니다"
    tag: 수정
    items:
      - "챗을 여는 순간 연결이 끊기면(응답 머리를 보내는 중) 그 챗의 자리가 돌아오지 않던 것을 고쳤습니다. 이런 일이 쌓이면 서버를 다시 띄울 때까지 모든 챗이 '잠시 뒤 다시 시도' 로 막힐 수 있었습니다."
  - date: 2026-10-12
    title: "**카드 대조 엔진** — 에이전트 서버 `/card-review/*` 넷과 관문(리스크 심사 재설계 M2)"
    tag: 기술
    items:
      - "에이전트 서버에 카드 대조 모듈 `card_review` 를 더했습니다. 전문가 한 명의 지식카드 전부를 원문으로 받아 팩으로 묶고(`POST /card-review/pack`), 이 박스의 모델 창에서 한 호출에 실을 몫을 유도하며(`GET /card-review/limits` — 창 출처 `server·env·fallback`, 창이 모자라면 쪼개지 않고 `ctx_too_small`), 카드 묶음과 검토 단위를 짝짓고(`POST /card-review/plan` — 넘치는 짝은 `pair_over`), 훑기·판정(fwd·rev·solo)·카드 밖 호출을 SSE 로 돌립니다(`POST /card-review/run`). 아직 부르는 곳이 없어 동작 변화는 없습니다."
      - "관문 `review_gate.py` 가 카드 대조 호출을 동시 4건(심의가 돌면 2건)으로 묶고, 자리가 없으면 줄을 세우지 않고 1초 안에 `review_busy` 로 답합니다. 카드 대조는 `/health.delib_active` 를 움직이지 않고 `review_active`·`card_review{…}` 로 따로 보입니다."
      - "팩 조회는 사용자 토큰이 거절되면 서비스 계정으로 내려가지 않고 `credential_rejected` 로 멈춥니다(`deliberation._tools_by_name` 에 `svc_fallback` 인자를 더했고 기본값은 종전 동작)."
      - "반대 검토 10건을 고쳤습니다 — 보충 시도에서 같은 제목의 카드 밖 행이 하나로 합쳐지던 것, 한 줄 배열의 깨진 원소가 셈에서 빠지던 것, 창 조회 실패 중 판 어긋남으로 답하던 것(이제 503 `ctx_unknown`), 안쪽 항목 모양 미검사, 카드 제목·줄 참조가 «» 틀 밖에 그려지던 것, `limits_rev` 가 식의 상수를 담지 않던 것, 함께 실으면 넘치는 묶음·단위 짝을 내주던 것, 팩 빌드가 떠난 호출자를 위해 계속 돌던 것, 자격 거절 뒤에도 남은 카드 조회가 나가던 것."
      - "시험용 가짜 LLM(대본)과 OpenAI 호환 가짜 LLM 서버를 시험 디렉터리에 두고, 엔진이 만든 계약 예제(run SSE 20장면·거절·팩 오류)를 포털 중계 시험이 그대로 흘려 봅니다."
      - "운영 LLM 에 카드 대조 프롬프트를 직접 보내 재는 탐침 `scripts/m0b_probe.py` 를 더했습니다. 호출 초·글자/토큰 비·출력 상한·창 초과 문구·판정 묶음 크기(K)별 행 누락을 재고, 여러 전문가의 카드를 합쳐 큰 K 를 채울 수 있으며, 도중에 멈춰도 거기까지의 요약을 씁니다. cae00 에서 한 번 돌려 K 를 다시 정합니다(절차서 `server-setup-m0b.md`)."
  - date: 2026-10-12
    title: "카드 대조 중계 — 포털 `/agent/card-review/*` 넷(리스크 심사 재설계 M2)"
    tag: 기술
    items:
      - "리스크 앱 러너가 PAT 로 부르는 `/agent/card-review/limits`(GET)·`pack`·`plan`·`run`(SSE)을 더했습니다. 본문은 통째로 에이전트 서버 `/card-review/*` 로 넘기고, 신원 칸 넷(groups·user_email·user_pat·entitlements)만 포털이 검증한 사람의 것으로 덮어씁니다. 대화를 만들지 않고 `/agent/chat` 을 타지 않습니다."
      - "`feat:deliberation` 이 없으면 403 이고 에이전트 서버로 아무것도 나가지 않습니다. 본문 상한은 1M 토큰 창 하나(4,194,304바이트, 넘으면 413 `body_too_large`)이고, 감사에는 종류·전문가 키·단위 id·바이트 수·sha256·상류 상태만 남깁니다."
      - "챗과 연결·자리를 다투지 않게 전용 연결 풀과 세마포어를 둡니다(`CARD_REVIEW_MAX_STREAMS` 기본 12, 넘으면 429 `engine_busy` — 30초 뒤 다시). 단발 셋은 `AGENT_UNARY_TIMEOUT_S` 를 따르고 넘으면 504 `agent_timeout` 입니다(기본값으로 진행하지 않습니다). run 은 침묵 한도에 걸리면 `agent_stream_idle` 을 내고, 앱이 끊으면 에이전트 쪽 연결도 닫습니다."
      - "엔진이 code 를 실은 오류(422 `over_budget`·409 `rev_mismatch`·503 `tools_unavailable` 등)는 상태와 본문 그대로 넘기고, code 가 없는 404 는 `agent_outdated`(옛 에이전트 서버), code 가 없는 5xx 는 502 `agent_5xx` 로 바꿉니다. 부르는 곳이 아직 없어 화면과 동작은 바뀌지 않습니다."
  - date: 2026-10-12
    title: "**리스크 심사** — 접촉을 바꾼 변경을 근거로 든 리스크가 제대로 저장됩니다"
    tag: 수정
    items:
      - "접촉 종류나 마찰 계수를 바꾼 변경을 근거로 든 리스크가 변경 종류 '없음' 으로 저장되고 분류 오류 목록에 오르던 것을 고쳤습니다. 이제 그 변경 종류(접촉 종류 · 파라미터)로 남습니다."
      - "실제로 있는 접촉 범위 변경을 인용한 리스크가 저장할 때 '가리키는 변경이 없다' 로 남던 것을 고쳤습니다."
  - date: 2026-10-12
    title: "**리스크 심사 앱** — 변경 종류 택소노미 1.1 · 합성 설계의 계층 엣지(기술)"
    tag: 기술
    items:
      - "택소노미 1.0 → 1.1 — change_kind 에 contact_type · parameter 를 더해 정규화(_CHANGE_KINDS) · risk_spec 스키마 · 택소노미 자산 · RA 온톨로지 부트스트랩 표를 diff 생산자의 14종과 맞췄습니다. 새 스냅샷 · finding 은 1.1 로 찍히고 옛 IR 위의 finding 은 그 IR 의 판을 그대로 씁니다. 이미 만든 RA 온톨로지는 drift 로 보고만 합니다."
      - "SpecContext.diff_item 이 구조층의 dict 버킷(dyna)도 한 단계 더 열어 contact.scope_changed 의 cid 를 찾습니다 — 리스트 버킷만 훑어 그 인용이 저장 때 dangling 으로 남았습니다."
      - "합성 설계 생성기(devseed)가 실제 어댑터처럼 part_of 엣지를 싣습니다(adapters.mcad._part_of_edges 를 그대로 부른다). 합성 쌍에 계층 엣지가 없어 부품 추가 · 삭제 · 조립 이동이 내는 계층 구조 항목을 시험이 보지 못했습니다. 노드에서 유도되는 엣지라 내용 해시 · 계면 수에는 넣지 않습니다."
  - date: 2026-10-12
    title: "**DynaForge** — 보 요소가 든 파트도 떼어 내고, `info` 가 `--strict` 를 알려 줍니다"
    tag: 연결
    items:
      - "`extract-parts` 가 보 요소(`*ELEMENT_BEAM` · `_DISCRETE` · `_MASS` · `_SEATBELT` · `_PLOTEL`)가 든 파트도 떼어 냅니다. 볼트 · 용접점처럼 보로만 된 파트도 받습니다. 예전에는 그런 파트를 거절했습니다. `*ELEMENT_MASS_NODE_SET` · `*ELEMENT_SEATBELT_*` 는 아직 받지 않습니다."
      - "`cleanup-nodes` 가 보 족의 칸 자리를 알아, 보의 해제 플래그(RT1 · LOCAL)나 안전벨트의 SBRID 를 절점으로 세지 않습니다. 그 값과 번호가 같은 고아 절점이 지워지지 않고 남던 것을 고쳤습니다."
      - "`info` 가 메시 검증 오류를 찾고도 종료코드 0 으로 끝날 때, `--strict` 로 돌리면 실패(1)로 받을 수 있다고 한 줄 알려 줍니다. 정상 덱에서는 아무것도 덧붙이지 않고 기본 종료코드도 그대로입니다."
  - date: 2026-10-12
    title: "**StepForge** — 오래 걸리는 측정은 멈추고 잡으로 끝까지 잽니다"
    tag: 수정
    items:
      - "측정·그림 도구가 STEP 을 다시 읽지 않고 기하 캐시를 씁니다. 큰 판의 측정·그림이 191초에서 4초로, 관계 그림이 최대 214초에서 37초로 줄었습니다."
      - "무거운 계산이 도는 동안에도 앱이 멈추지 않습니다. 예전에는 큰 측정 중 앱이 1분 넘게 응답하지 않았습니다."
      - "한 번에 감당하기 어려운 측정은 재기 전에 멈추고, 같은 계산을 시간 제한 없이 끝까지 재는 잡 호출문을 함께 줍니다. 멈춘 자리와 남은 것은 응답이 말합니다."
      - "같은 측정은 형상이 그대로면 다시 재지 않습니다. `estimate_cost` 로 무거운 도구가 얼마나 걸릴지 미리 볼 수 있습니다."
  - date: 2026-10-12
    title: "**StepForge** — 챗에 판정이 먼저 가고, 낡은 결과는 낡았다고 말합니다"
    tag: 수정
    items:
      - "챗이 도구 응답의 앞부분만 읽을 때 판정·사유·주의가 긴 목록 뒤로 밀려 잘리던 것을 고쳤습니다. 이제 그 칸들을 먼저 보냅니다."
      - "긴 목록은 요약과 앞 몇 줄로 접어 보내고, `full=true` 로 전부 받는 길을 함께 알려 줍니다."
      - "파싱 전이거나 앞 단계 없이 부른 도구는 빈 답 대신 까닭을 말합니다."
      - "형상이 바뀐 뒤 옛 형상 위에 만든 관계·구조 문서·메시는 낡았다고 막고, `what_next` 가 다시 할 일을 순서대로 안내합니다. 같은 내용의 사이드카를 다시 올리면 다시 파싱을 요구하지 않습니다."
  - date: 2026-10-12
    title: "**StepForge** — 판 전체 단면 관문 · 실행 대기 보정 · 챗 컷 설정 · 데이터 폴더 이동"
    tag: 기술
    items:
      - "판 전체 `section_profile` 이 합치기(`oc.fuse_many`)와 단면 몫을 재기 전에 세어, 넘치면 멈춘 응답과 같은 값을 내는 `measure` 잡 호출문을 냅니다. 33분 넘게 걸리던 호출이 3초 남짓에 멈춥니다. 훑기는 정확한 상자를 한 번만 재고(`sweep_plan`), 값을 매길 수 없는 단면에서는 `section_profile`·`section_area` 가 그 자리에서 멈춥니다."
      - "`explain_kind` 계산을 계산 서버로 옮겨, 관계가 10만 행을 넘는 판에서 호출마다 서버 루프를 2.5~3.5초 막던 것을 없앴습니다."
      - "붐빈 기계에서는 재기 전에 계산 스레드의 실행 대기 비(`/proc/thread-self/schedstat`, `measure.load_pace`)를 재어 1.3 을 넘으면 한 호출 상한을 그만큼 나눕니다. `stackup_profile`·`section_profile`·`section_area` 가 같은 보정을 쓰고 `STEPFORGE_LOAD_PACE=off` 로 끕니다. 외곽 합치기도 판 전체 합치기와 같은 식으로 한 장부에서 세고(`outline_skipped`), 직선 모서리가 평면 면을 꿰뚫는 쌍은 거리 0 꼴로 셉니다."
      - "챗 컷 6000자를 코드 상수에서 배포 설정 `STEPFORGE_CHAT_CUT`(기본 6000, 0 이면 컷 없음)으로 바꾸고 `system_capabilities.chat_cut` 이 지금 값을 말합니다. 값은 매니페스트 `launch.env` 나 허브 `.env` 의 `APPTAINERENV_STEPFORGE_CHAT_CUT` 로 줍니다."
      - "DB·JSON 에 저장된 절대 경로(stored_path·provided_mesh·file_path·log_path·메시 캐시 색인)를 읽는 자리를 `config.data_file` 하나로 모아, 데이터 폴더를 옮겨도 지금 루트 아래의 제 파일을 읽습니다(옛 루트의 상위 폴더로 옮긴 경우도 다시 달고, 루트 밖 경로는 따르지 않습니다). 쓰는 꼴(`config.stored_form`)은 옛 판 서버도 읽도록 절대 경로로 두었고, 데이터 루트가 심볼릭 링크일 때 파싱한 파일이 failed 로 적히던 것도 고쳤습니다."
      - "러너가 쓰기 잠금을 쥔 채 얼면 `cancel_job` 이 60초 뒤 'database is locked' 로 끝나던 것을, 잠금 기다림을 2초(`CANCEL_WAIT_S`)로 줄이고 못 얻으면 요청 파일(`servers/cancel/<잡>.json`)로 남겨 러너가 집행하게 했습니다. 잠금 아래에서 러너가 아닌 서버의 `/health` 가 30초 가까이 멎던 것은 도구 이력 쓰기를 스레드로 옮겨 고쳤습니다."
  - date: 2026-10-11
    title: "리스크 심사 패널이 **끝까지 돕니다** — 저장 실패 수리 · 변경 목록 · Claude 에서 시작"
    tag: 심의
    items:
      - "같은 과제에서 두 번째 패널부터 결과 저장이 실패하던 것을 고쳤습니다. 이제 결과를 먼저 남긴 뒤 저장하므로, 저장이 실패해도 결과를 잃지 않고 '다시 저장' 할 수 있습니다."
      - "변경 목록이 6~12건에서 잘리던 것을 고쳤습니다. 줄어든 치수를 먼저 싣고 치수·결과 칸을 함께 넘기며, 다 싣지 못하면 전체 건수와 빠진 줄 수를 남깁니다."
      - "부품 이름에 든 낱말 하나 때문에 브리프가 만들어지지 않던 것을 고쳤습니다."
      - "검증되지 않은 인용으로는 리스크 등급을 올리지 못합니다. 이미 끝난 심사의 등급은 그대로 둡니다. 좌석은 같은 과제의 앞 패널 판정을 보지 않고 따로 판단합니다."
      - "Claude 에서 리스크 심사를 할 수 있습니다. hwax MCP 에서 `risk_next_step` 부터 부르면 과제 올리기·캡처·변경 비교·심사 시작을 차례로 안내하고, 결과는 웹 리스크 화면에 그대로 보입니다. 쓰기는 본인 이름으로만 되며, 리스크 앱 MCP 를 개인 토큰으로 직접 등록한 길은 읽기 전용입니다."
      - "의장이 결정문의 칸 모양을 틀려도(목록 자리에 숫자, 목록 대신 낱말 하나 등) 결과 저장이 죽지 않습니다. 낱말 하나는 한 항목 목록으로 읽고, 읽을 수 없는 값은 버리지 않고 남깁니다. 저장이 실패한 패널은 Claude 에서도 다시 저장할 수 있습니다(`risk_repersist_panel`)."
  - date: 2026-10-11
    title: "심의·챗이 **긴 글을 자르지 않습니다** — 1백만 토큰 모델 기준"
    tag: 심의
    items:
      - "작은 모델 시절에 박아 둔 글자 상한(발언 700자, 조회 결과 900자·3,500자, 이어하기 결정문 8,000자 등)을 1백만 토큰 모델에 맞춰 넓혔습니다. 좌석이 받는 사전 근거는 약 39만 자까지 들어갑니다."
      - "챗에서 심의로 넘기는 맥락과 챗 이력을 최근 것부터 담아, 길어져도 가장 최근 대화가 빠지지 않습니다."
      - "Claude 로 받는 심의 결과가 길면 자르지 않고 쪽을 나눠 다음 쪽을 안내합니다. 그래도 남는 한도(임베딩 모델 등)에서 잘린 것은 원문 길이와 함께 알립니다."
      - "Word 내보내기가 긴 심의 대화에서 실패하던 것을 고쳤고, 정리본에 넘기는 대화 원문도 60,000자에서 자르지 않습니다."
      - "챗 한 턴에 도구를 너무 많이 오가 상한에 걸리면, 같은 도구를 처음부터 다시 돌리는 '다시 시도' 대신 까닭을 보여 줍니다."
  - date: 2026-10-11
    title: "**리스크 심사** — 좌석이 무엇이 바뀌었는지 알고 심사합니다"
    tag: 심의
    items:
      - "패널 질문에 변경 요지(바뀐 부품 이름과 무엇이 바뀌었는지)가 실리고, 지식카드 검색어도 그 요지로 만듭니다. 예전에는 좌석이 무엇이 바뀌었는지 모른 채 도구와 지식카드를 찾았습니다."
      - "변경 요지와 검색어에 부품을 내부 번호 대신 부품 이름으로 적습니다."
      - "좌석이 브리프에 다 싣지 못한 변경도 `risk_get_diff(part='lines')` 로 같은 순서로 전부, 종류·검색어로 걸러 볼 수 있습니다."
      - "개인 과제의 변경 비교를 심사를 건 사람의 자격으로 엽니다. 예전에는 다른 계정으로 바뀌어 변경 비교 조회가 말없이 거절됐습니다."
  - date: 2026-10-11
    title: "**리스크 심사** — 등록부와 심사 레벨이 실제 판정을 따릅니다"
    tag: 심의
    items:
      - "패널이 기각한 리스크가 등록부에 열린 리스크로 남던 것을 고쳤습니다. 모든 좌석이 기각한 묶음은 기각으로 세고, 반대석의 기각 사유도 남습니다."
      - "등록부를 분야로 거르면(웹 화면과 Claude 의 `risk_get_registry`) 늘 0건이 나오던 것을 고쳤습니다."
      - "한 번 닫혔다 다시 돈 패널이나 기각과 생존이 섞인 묶음 때문에 심사 레벨이 C2 에 오르지 못하던 것을 고쳤습니다."
      - "'이 위험을 무시할 수 없다' 같은 평범한 발언을 프롬프트 주입으로 오인해 그 리스크를 큐레이션 대기열로 보내던 것을 고쳤습니다. 실제 주입은 그대로 잡습니다."
      - "Claude 에서 스냅샷·등록부·인용 조회가 상한 뒤를 `next_offset` 으로 이어 받습니다. 예전에는 잘렸다는 표시만 있었습니다."
  - date: 2026-10-11
    title: "**DynaForge** — 파트만 떼어 내고 고아 절점을 정리합니다"
    tag: 연결
    items:
      - "`extract-parts` 가 큰 덱에서 고른 파트만 떼어 홀로 도는 덱 한 파일로 만듭니다. 만든 덱을 되읽어 없는 절점·파트·섹션·재질을 가리키면 실패로 알립니다."
      - "`cleanup-nodes` 가 어느 요소도 쓰지 않는 고아 절점을 찾습니다. 기본은 보고만 하고, 세트나 인클루드가 쓰는 절점은 지우지 않습니다."
      - "`info`·`modelmeta` 가 모델 크기를 무엇 기준으로 쟀는지 말하고, 요소 밖 고아 절점이 크기를 키우면 경고합니다. 고아 절점 때문에 낙하판이 기기 밖에 놓인 사례가 있었습니다."
      - "`modelmeta` 가 2차 솔리드 덱의 부피를 틀리게 내면서 말하지 않던 것을 경고하게 했습니다."
  - date: 2026-10-11
    title: "**StepForge** — 틀린 값을 내던 자리를 고쳤습니다(거리 0 · 시트 바디 · 넓이)"
    tag: 수정
    items:
      - "나선 스프링처럼 곡면이 복잡한 쌍에서 떨어져 있는데 거리 0 이 나오던 것을 고쳤습니다. 그 값으로 저장된 관계는 판정을 막고, 다시 검출하면 고쳐집니다."
      - "`clearance_field` 가 파고든 표본을 뜬 것처럼 내고 평평한 면 가운데의 밀착을 놓치던 것을 고쳤습니다. `stackup_profile` 은 이웃한 층만이 아니라 겹치는 모든 층 쌍을 봅니다."
      - "열린 셸(시트 바디)이 솔리드를 지나는 쌍은 뜻 없는 침투 부피 대신 지나간 넓이를 내고 판정도 그것으로 가립니다."
      - "B-spline 면의 넓이가 틀리거나 음수로 나오던 것과, 겹침 계산이 뒤 쌍의 판정을 바꾸던 것을 고쳤습니다."
      - "쓰기·지우기 도구가 과제 이름의 일부만 맞는 다른 과제에 기록하던 것을 고쳤습니다."
  - date: 2026-10-11
    title: "운영 갱신이 **도는 심의를 끊지 않습니다** — 재기동을 미루고 ○ 로 알립니다"
    tag: 배포
    items:
      - "운영 갱신(update-all)이 서비스를 다시 띄우기 전에 도는·줄 선 심의가 있는지 묻습니다. 있으면 에이전트 서버·포털·nginx·HEAX 허브 재기동을 미루고 '○ … 재기동 건너뜀 — 심의 N건 진행 중' 을 남깁니다. 예전에는 배포 한 번이 몇 시간 돈 리스크 패널과 심의를 말없이 끊었습니다."
      - "미룬 실행은 반영이 끝난 것이 아닙니다. 심의가 끝난 뒤 한 번 더 돌리고, 지금 끊어도 되면 `AGENT_RESTART_FORCE=1` 로 강행합니다."
      - "미룬 것은 실패로 세지 않습니다. 에이전트 서버가 잠깐 늦게 답해도 곧바로 내리지 않고 몇 번 다시 묻습니다."
      - "게이트웨이·AIDataHub·KooRemapper 재기동과 HEAX 앱 하나씩의 재배포는 이 보호 밖입니다. 이 변경이 처음 들어가는 갱신에서는 떠 있는 서버가 옛 판이라 보호가 걸리지 않습니다."
  - date: 2026-10-11
    title: "**포털 심의 중계·서버 대화 저장** — 1백만 토큰 창에 맞춘 상한과 색인 시간 예산"
    tag: 기술
    items:
      - "포털 요청 스키마의 글 칸 상한을 1백만 토큰 창(1,048,576 × 4자)에서 유도하고 이력 합계는 창 하나로 묶었습니다. 이력 한 건 24,000자·메시지 65,536자·이어하기 요약 24,000자·사람 의견 8,000자·도우미 화두 8,192자·대화 한 칸 20,000자·조항 12건 상한이 결정문이 든 대화와 21석 패널의 이어하기를 422 로 막았습니다. 에이전트 서버 오류 사유를 200자에서 표식 없이 자르던 것도 없앴습니다."
      - "웹 심의의 서버 대화 사본에 줄이지 않은 발언·조항·도구 활동·근거와 알림 카드를 그대로 남깁니다. 예전에는 회의 버블을 20,000자·뒤 199건에서 다시 자르고 조항 1,200자·반박 4건·활동 60건에서 끊었으며, 청크마다 따로 푼 UTF-8 이 한글을 '�' 로 넣었습니다."
      - "대화 검색이 검색 한 번에 하는 게으른 색인을 시간 예산(60초)에서 멈추고, 멈춘 사실을 응답에 싣습니다. 벡터는 임베딩 묶음마다 씁니다. 서버 사본이 발언 원문을 다 남기면서 큰 심의 뒤 첫 검색이 게이트웨이 120초를 넘겼고, 끝에 한 번에 쓰던 벡터 때문에 다음 검색과 임베더 실패가 같은 미색인분을 처음부터 다시 보냈습니다."
      - "색인 시간 예산을 메시지 사이가 아니라 임베딩 묶음마다 보고, 넘으면 남은 묶음을 미룬 것(`deferred`)으로 셉니다. 예산 안에 끝나지 않는 큰 메시지(예: 4,194,304자 · 임베딩 88번)는 요청 밖에서 끝까지 색인하고 그동안 다시 보내지 않으며, 응답에 그 수(`in_background`)를 싣습니다(앞 수정 뒤에도 이중 색인이 되살아나던 것을 같은 날 고쳤습니다)."
      - "Word 정리본에 넘기는 대화 원문(`transcript_text`)의 기본 상한은 종전 60,000자로 두고, 새 호출부가 상한 없음을 명시합니다. 배포 중 남아 있던 옛 포털 프로세스가 새 파일을 읽으면 상한도 표식도 없이 원문 전체를 에이전트로 보낼 수 있었습니다."
      - "절차 고르기 후보(50개)와 서버 대화 목록(100건) 응답에 총수를 싣고, 2단 도구 뒤 항목 이름은 200개에서 끊지 않습니다. 51번째 후보와 101번째 대화가 있는 줄도 모른 채 사라지던 것입니다."
      - "포털이 심의 요청의 `knowledge_query`(좌석 검색어 — 문자열 또는 좌석별 사전)와 `save_report` 를 엔진에 중계합니다. 선언이 없는 키는 포털에서 말없이 사라져, 리스크 앱이 보내는 좌석 검색어와 '저장 끄기' 가 엔진에 닿지 못했습니다."
  - date: 2026-10-11
    title: "**리스크 심사 오케스트레이터** — Claude 경로의 원장 제출·브리프 수신 · 재고 스크립트"
    tag: 기술
    items:
      - "`infra/pipeline/hwax-risk-review.js` 가 원장에 내는 좌석 발언을 엔진과 같은 순서(관점→권장→해석→우려)로 잇고 고정 2,000자 칸에서 자르지 않습니다. 결정문은 통째로 싣고, 제출 에코 예산(60,000자)에 맞춰야 할 때만 해석부터 줄인 뒤 그 상한을 원장에 남깁니다. 해석이 긴 좌석의 권장·우려가 원장에서 사라지고, 결정문 25,000자 패널이 `payload_too_large` 로 웹에 올라가지 못하던 것입니다."
      - "그 2,000자 칸은 앱이 근거마다 원문 길이(`result_chars`)를 실어 원문 보존을 알릴 때만 걷습니다. 옛 리스크 앱과 만나면 종전처럼 줄이되 글마다 표식을 달고 원장 `evidence_omitted` 에 알립니다(앞 수정이 옛 앱과 섞이면 표식 없이 앞 2,000자만 남던 것을 같은 날 고쳤습니다)."
      - "브리프 오류의 문구(`message`)와 고칠 곳(`detail.fix`)을 사람에게 그대로 보입니다. 위임 없는 신원의 `delegation_required` 와 게이트웨이 거부가 코드만 보이던 것입니다."
      - "브리프를 옮겨 적는 에이전트가 빈 값을 내면 `no_planned_panel` 대신 `brief_echo_failed` 로 가르고, 앱이 실은 원문 길이와 옮겨 적은 근거가 다르면 심의를 돌리지 않습니다. MCP 결과가 파일로 저장됐다는 안내는 실패로 보지 않고 끝까지 읽게 합니다. 출력 상한에 걸린 브리프가 '앱에서 패널을 먼저 편성하라' 는 틀린 진단으로 멈추거나 `brief_unavailable` 로 닫힐 수 있었습니다."
      - "`infra/scripts/risk-review-inventory.sh` 를 더했습니다. 리스크 심사 재설계 M0 의 재고로, 박스의 모델 창·한도 설정·심사 대상과 변경 수·패널 저장 실패 흔적을 읽기 전용으로 찍습니다."
  - date: 2026-10-11
    title: "**에이전트 서버** — 챗 이력·도구 루프를 토큰으로 재어 창 안에 맞춥니다"
    tag: 기술
    items:
      - "넓은 창의 문서 없는 턴은 도구 결과 한 건의 몫(`TOOL_RESULT_MAX` 최악 환산)을 먼저 떼고 이력 몫을 나눕니다. 1백만 토큰 창에서 이력이 85% 를 다 쓰면 남는 약 149K 토큰이 도구 결과 하나(약 190K 토큰)보다 작아, 긴 대화에서 큰 조회 한 번에 ReAct 루프가 창을 넘었습니다."
      - "챗 ReAct 루프가 모델을 부르기 전에 쌓인 메시지의 추정 토큰이 창 − 예비분을 넘으면 오래된 도구 결과부터 원문 길이 표식을 달아 넘는 만큼 줄여 싣고 `loop_results_cut` 경고를 냅니다(대화 상태는 원문 그대로입니다). 이 맞추기는 별도 노드(`pre_model_hook`)가 아니라 agent 노드의 prompt 안에서 해 재귀 한도 80 에서 연속 도구 왕복 39회를 지킵니다. 처음 단 훅은 langgraph 1.2.5 가 별도 노드로 넣어 연속 왕복이 25회로 줄었고, 26번째의 `GraphRecursionError` 를 자동 재시도가 처음부터 다시 돌려 도구를 두 번 더 실행했습니다. 이제 그 오류는 `CHAT_AUTO_RETRY` 없이 '도구 왕복 상한' 안내로 끝납니다."
      - "가장 최근 이력 항목도 원문 몫을 넘으면 원문 길이를 적고 줄이며 `history_item_cut` 경고로 알립니다. 예전에는 첫 항목을 예산과 상관없이 통째로 실어, 창을 넘는 붙여넣기 한 번 뒤로 그 대화의 모든 턴과 자동 재시도가 같은 400 으로 끝났습니다. 예비분이 창보다 큰 좁은 창(dev 16K 등)에서는 그 항목 하나로 창을 넘길 때만 줄이고(창 − 예비분, 예비분은 창의 절반까지만 봅니다), 직전 답이면 '직전 답의 앞부분만 이력에 실었다' 고 항목의 role 에 맞춰 경고합니다."
      - "글자 수로 환산한 길이를 실제로 싣는 글 전체의 토큰으로 다시 잽니다. `/보고서` 정리본·빈 응답 구제·챗 이력이 앞 20,000자 표본의 밀도로 환산해, 앞이 영문(로그·코드·JSON)이고 뒤가 한국어인 글에서 창의 두세 배를 싣고 400 으로 실패하던 것을 고쳤습니다. 이력 항목을 줄일 때도 줄인 글 자체의 토큰으로 맞추고, 문서 예산에서 빼는 이력 토큰도 글 전체로 재며, 줄일 때 더 덜던 여유는 2% 에서 0.5% 로 줄였습니다."
      - "화두 뽑기·되묻기·좌석 축 같은 보조 호출은 넓은 창에서 창의 5%(약 55,000자)만 읽고, 몫을 넘는 최근 발화는 원문 길이를 적고 줄이며, 뺀 대화 수를 프롬프트와 로그에 적습니다. 예전에는 세 호출이 챗 이력 예산 전부(약 72만~88만 자)를 각각 프리필해 포털 600초 한도에 걸릴 수 있었습니다."
      - "챗→심의 맥락은 사람 발화와 챗 답변을 최근부터 예산에 담고, 남은 예산보다 긴 발화는 원문 길이를 적고 줄이며, 뺀 챗 답변 수를 남깁니다. 웹 챗에서 넘어온 대화도 앞 60건·발화당 4,000/2,500자·합 150,000자로 자르지 않고 최근부터 남기며, 넓은 창에서는 발화마다 끊지 않고 챗 몫 하나로만 지킵니다."
  - date: 2026-10-11
    title: "**에이전트 서버** — 심의 요청 값·조회 원문·좌석 지식카드의 창 회계와 MCP 쪽 나누기"
    tag: 기술
    items:
      - "양보 불가 조항·후보안·지정 좌석 역할은 항목 하나를 이어하기 요약이 받는 길이까지 받습니다(종전 1,200자·400자·2,000자). 그 합은 조항·후보안을 carry 몫(1M 창 29,077자)에, 지정 좌석 역할을 role 몫(9,692자)에 담아 근거 몫에서 먼저 떼고, 넘는 합은 항목마다 같은 몫으로 줄여 카드로 알립니다. 항목 상한만 넓혔을 때는 합이 어느 몫에도 없어 조항 12건·후보안 8건(58만 자)이 매 라운드 전 좌석에 실려 창을 넘었고, 다단 심의는 요청 해석을 거치지 않고 조항을 넘겼습니다."
      - "조회 턴 래퍼가 이미 자른 도구 결과는 꼬리 경고에서 원문 길이를 읽어 발언 턴 표식·'자기 조회 결과 상한 초과' 카드·공용 풀 원문 길이에 씁니다. 발언 턴이 다시 줄이며 경고가 잘려 60만 자 결과가 '200,110자 중' 으로 적히던 것을 고쳤습니다."
      - "좌석 지식카드는 예산을 넘는 카드도 같은 몫으로 앞부분만 싣고 1위 카드를 빼지 않습니다. 절 전문이 된 첫 히트가 예산보다 길면 좌석이 카드 0장으로 '관련 지식 없음' 이라 발언했고, 좁은 창은 10건이 4~5건으로 줄었습니다(띵킹 예심도 같은 함수를 씁니다). 줄인 줄 끝 표식의 최대 길이 주석도 31자로 바로잡았습니다."
      - "`deliberate_list` 와 재기동 정리가 원장 파일 대신 원장 옆 목록 색인(`list/<id>.json` — 목록 한 행의 칸과 원장의 mtime·크기 도장)을 읽고, 도장이 다르거나 색인이 없을 때만 원장을 읽어 색인을 다시 씁니다. 넓은 창에서 원장 하나가 수백 KB~수 MB 가 되어 목록 한 번이 남의 원장을 최대 300개 통째로 읽었습니다."
      - "심의 MCP 응답을 Claude Code 의 MCP 결과 상한(25,000토큰 ≈ 25,000자) 안에서 쪽으로 나눕니다. `deliberate_transcript` 는 글자·항목 경계로 나눠 `page.next`·`page.pieces` 와 다음 묶음(`next_offset`·`remaining`)을 알리고, `deliberate_result`·`deliberate_status`·`deliberate_list` 는 `part`·`page.next` 로 나누되 진행 조회·결과는 화두를 맨 뒤로 보내 첫 쪽에 상태가 다 실립니다. 다시 부르면 심의가 또 열리는 `deliberate_start`·`deliberate_continue` 는 화두 메아리가 넘치면 머리와 전체 길이(`question_chars`)만 싣습니다. 예전에는 넓은 창 21석 3라운드 전사 한 쪽이 15만 자라 본문 대신 파일 저장 안내가 갔습니다."
      - "쪽 나누기의 경계 결함 둘을 고쳤습니다. 쪽을 받는 사이에 단계·좌석·경과·상태가 바뀌면 화두를 자르는 자리가 밀려 이은 화두가 326자 겹치거나 3자 빠지던 것은, 화두를 새 쪽에서 시작하고 되풀이하는 짧은 글(상태 이름)을 16자 자리로 잡으며 쪽 안내에 이음 확인을 실어 막았습니다. 되풀이 칸의 자리값은 숫자·null 만 9자리로 잡고 글 칸은 실제 값으로 잡습니다."
  - date: 2026-10-11
    title: "**에이전트 서버** — 리스크 심사 좌석이 앞 패널 판정을 읽던 길을 막았습니다"
    tag: 기술
    items:
      - "리스크 심사 좌석의 `search_reports` 결과에서 같은 과제(질문 머리의 과제 코드)의 앞 패널 심의 보고서를 빼고 뺀 수를 결과에 적습니다. 엔진이 패널마다 결정문이 든 RA 초안을 남기고 RA 는 소유한 초안도 검색에 넣어, 같은 잡 자격으로 도는 다음 패널 좌석이 앞 패널 판정을 읽을 수 있었습니다."
      - "등록부 도구 둘을 리스크 앱의 앱 조건부 읽기 목록에서 빼고, 엔진이 직접 부르는 보고서 검색(지정 도구·정량 근거 선주입)도 앞 패널 보고서를 뺍니다. 등록부·패널 목록·패널 전사(`risk_get_panel_transcript`)는 리스크 심사에 지정 도구로 와도 부르지 않습니다. 예전에는 지정만 하면 앞 패널의 결정문·risk_spec 이 전 좌석 프롬프트에 실려 원장의 지지 수가 독립 근거 없이 올랐습니다."
      - "질문 머리를 '마지막 토막이 target_key' 로 읽어 '힌지 개선 2차' 처럼 공백·한글이 든 과제 코드에서도 거름이 걸립니다. 질문에 '[리스크심사' 가 있는데 머리를 못 읽으면 경고와 카드로 알립니다. 예전 식(공백 없는 두 토막)에서는 거름이 알림 없이 꺼졌습니다."
      - "Claude 에서 apps 없이 `deliberate_start(job='risk-review')` 를 부른 길에서도 좌석 자유 조회에서 RA 보고서 읽기 도구 9종(`get_report`·`list_my_reports`·`get_reports_digest` 등)을 이름으로 빼 러너 패널과 같은 시야로 맞춥니다. 과제 코드를 읽지 못한 길(머리 없이 손수 부른 길·머리를 못 읽은 길)은 엔진이 남긴 '심의 — …' 보고서를 전부 빼고 `risk_head_missing`·`risk_head_unread` 경고와 카드로 알립니다."
      - "리스크 심사 좌석의 변경 비교·스냅샷 조회가 `not_visible` 로 막히면 경고와 '좌석에 주지 않음' 카드로 심의에 한 번 알립니다. 그 응답은 isError 가 아닌 정상 JSON 이라 게이트웨이 감사에는 성공으로 남고, 변경 전체 보기가 버려진 채 패널이 done 으로 끝났습니다."
  - date: 2026-10-11
    title: "**MCP 게이트웨이 · HEAX 허브** — 리스크 앱 위임 신원 · 허브 지침 · 등록 사본 · verify_answer"
    tag: 기술
    items:
      - "리스크 앱으로 가는 사람별 발급 요청에 호출자를 `X-Hwax-Delegate-Email` 로도 싣고, 앱 단언이 보낸 사람 것이 아니면 거부하며, 클라이언트가 보낸 같은 헤더는 `/mcp`·`/api/` 모두 버립니다. Caddy forward_auth 가 `X-Heax-User-Email` 을 서비스 토큰 주인으로 덮어, 게이트웨이를 거친 모든 사람이 HEAX 첫 관리자 한 계정으로 과제를 쓰고 잡을 세웠습니다."
      - "접힌 단언의 거부는 위임 표지(`d`)가 있는 앱에만 겁니다. 위임 헤더를 모르는 옛 리스크 앱의 접힌 단언은 종전대로 부르되 경고 한 줄과 감사 `note=folded-old-app` 을 남기고, 거부 문구에는 원인을 적습니다. 처음 판에서는 옛 앱이 붙은 dev 에서 첫 관리자가 아닌 모든 사람의 `hwax_risk` 호출이 `risk_taxonomy` 같은 읽기까지 거부됐습니다."
      - "허브 지침에 '설계 리스크 심사는 `risk_next_step` 부터, 그 next 를 따라 쓰기를 부를 때도 사용자 확인 뒤(consent 는 사람이 동의한 뒤에만)' 항목(11번)을 더했습니다. 이 항목은 그 도구가 카탈로그에 있을 때만 싣고 재집계마다 다시 맞춰, 길잡이 없는 옛 리스크 앱이 붙은 박스에서 없는 도구부터 부르라고 시키지 않습니다."
      - "`verify_answer` 의 근거 원장이 숫자 줄기 끝의 점을 떼고 점뿐인 줄기는 싣지 않습니다. 산문 'thickness was 0.85.' 의 줄기가 '0.85.' 로 남아 진짜 값 0.85 를 지어낸 값으로 고발하던 것을 고쳤습니다."
      - "HEAX 허브의 hwax-risk 등록 사본 매니페스트를 리스크 앱 정본과 두 번 맞췄습니다. 도구가 14종에서 25종(Claude 입구 11종·`risk_next_step`)으로, 다시 26종(입구 12종, `risk_repersist_panel` 추가)으로 늘었고, 쓰기는 위임 신원으로만·직접 등록은 읽기 전용이라는 설명도 맞췄습니다."
  - date: 2026-10-11
    title: "**AIDataHub** — 검색·카드 도구가 전문과 총수를 주고, 남는 상한은 알립니다"
    tag: 기술
    items:
      - "`get_record_sections` 는 `sections` 를 주지 않으면 절 전부를 주고, `limit`·`offset` 은 나눠 읽을 때만 씁니다. 예전에는 앞 10절(최대 50절)에서 말없이 끊겼고 offset·total 이 없어 50절 넘는 문서의 뒤를 읽을 길이 없었습니다."
      - "`get_context_bundle` 의 절 발췌를 500자(markdown 은 200자 + '...')에서 자르지 않고 전문으로 주며, 좌석의 레코드 총수(`records_bound`)와 레코드마다 절 총수(`sections_total`)를 싣습니다. JS 심의 좌석이 발언 전에 이 번들로 카드를 읽습니다."
      - "`recommend_agents` 는 폴백 카탈로그 설명(200자)·`relevant_tools` 설명(300자)을 전문으로 주고 `ranked_total`·`more_available` 을 싣습니다. `list_records`·`list_tags` 는 요약을 200자에서 자르지 않고, `list_tags` 의 `total` 은 자르기 전 수·`count` 는 반환 수이며 최대 500 상한도 걷었습니다."
      - "의미검색 `top_k` 의 숨은 기본 천장 100 을 걷었습니다. `AIDH_SEARCH_TOP_K_MAX` 는 운영자가 낮출 때만 쓰는 천장이고 걸리면 WARNING 을 남깁니다. 예전에는 hybrid 가 top_k 34 부터, 추천은 후보 300 을 달라 해도 100 에서 잘렸습니다."
      - "그대로 두는 상한은 걸리면 말합니다. 임베딩 모델 입력 한도(e5 512토큰)를 넘은 뒤쪽은 적재 잡 결과(`over_model_limit`)·경고 로그·`agent_search`·`recommend_agents` 응답(`query_over_model_limit`)·`/api/embed`(`over_limit`)에 남기고, `/api/embed` 의 2,000자 선절단은 걷었습니다. FTS OR 폴백의 질의 앞 12토큰 상한(`FTS_OR_MAX_TOKENS`)도 걸리면 경고합니다."
      - "적재 때 4단계 이하 절·중복 `section_id` 의 본문이 색인에서 빠진 수와 글자 수를 경고로 남기고, `bind_records_to_agent` 자동 바인딩이 훑기 상한 500건에 걸리면 `scan_limit`·`scan_truncated`·`bound_ids_omitted` 와 경고를 남깁니다."
      - "재정렬 크로스인코더는 입력을 모델 입력 상한 `AIDH_RERANK_MAX_LENGTH`(기본 512, 넘친 쌍은 WARNING)에서 읽고, 동기 predict 를 스레드에서 한 번에 하나씩 돌립니다. hybrid 는 semantic 단계가 같은 질의로 매긴 히트를 다시 매기지 않습니다. 히트 본문이 전문이 된 뒤 절 전문을 8192토큰까지 읽어 연산이 8~16배가 됐고, 그동안 다른 요청이 전부 섰습니다."
      - "GPU 실패 뒤 CPU 폴백이 `SentenceTransformer` NameError 로 죽던 것을 고쳤습니다. 그 이름이 `__init__` 의 지역 import 라 폴백 메서드에 없었고, 시험은 모듈 전역에 이름을 꽂아 가렸습니다(dev 의미검색이 이 오류로 전부 실패했습니다)."
  - date: 2026-10-11
    title: "**리스크 심사 앱** — 위임 신원 표지 · 동의 출처 · 겹쳐 뜬 서버 잠금"
    tag: 기술
    items:
      - "게이트웨이 위임 단언(`POST /api/auth/sso`)을 HEAXHub Caddy 의 `forward_auth` 가 덮지 않는 `X-Hwax-Delegate-Email` 헤더로 먼저 만들고, 그렇게 발급한 `rrsso_` 단언에만 위임 확인 클레임 `d` 를 넣습니다. 예전에는 `X-Heax-User-Email` 이 게이트웨이 서비스 토큰 주인으로 덮여 게이트웨이를 거친 모든 사람이 한 계정으로 접혔습니다."
      - "MCP 쓰기 도구 11종은 클레임 `d` 가 있는 신원(`entry.require_delegate`)으로만 쓰고, 접힌 단언·서비스 세션 Bearer·신원 없음은 무엇이 없는지 말하며 `delegation_required` 로 거절합니다. MCP 신원에서 역할(role)을 떼고 옛 두 도구의 소유권도 자칭 actor 대신 그 신원으로 정합니다. `risk_get_brief` 는 브리프를 동결하기 전에 같은 검사를 하고, 거절 문구는 원인별로 고칠 곳(게이트웨이 판 올리기 · 직접 등록은 읽기 전용 · 사람별 위임 설정)을 가립니다."
      - "잡 params 에 동의가 들어온 입구 `consent_source` 를 남깁니다(쿠키 'web' · 위임 단언 'mcp' · Bearer 'api' · C3 자동 후속 'close_level'). `risk_next_step` 의 다음 걸음은 `risk_open_target`·Tier C `risk_start_job` 의 consent 를 미리 채우지 않고 사용자에게 받으라고만 말합니다."
      - "러너가 좌석 질문에 `diff_id` 를 싣기 전에 게이트웨이가 좌석을 잡 자격의 사람으로 보이는지 봅니다. 단언 발급이 위임 헤더를 실었는지를 `rr_metrics`(period 'live')에 적어 판정하고, 못 실은 까닭(`gateway_folded`·`gateway_unseen`·`service_credential`·`not_member`)을 패널 품질 `diff_ref_withheld` 에 남깁니다. 게이트웨이 시크릿이 빈 박스는 `gateway_sso_off` 로 막고, 발급 기록이 없거나 낡았으면 막지 않되 `gateway_unverified` 로 남기며, 지표 재계산은 이 기록을 지우지 않습니다."
      - "데이터 디렉터리의 `runner.lock` 을 쥔 프로세스만 러너 루프와 재기동 복구를 돌고 나머지는 REST·MCP 만 엽니다(헬스 `runner_lock_held`, 주인이 죽으면 이어받음). 스키마 이행은 `migrate.lock` 안에서 돌고 DB 사본은 출발 버전 이름으로 한 번만 떠 갈래마다 둘만 남기며, 헬스는 저장소 락을 기다리지 않습니다. 허브가 같은 디렉터리에 둘째 서버를 띄워 도는 패널을 닫거나 ADD COLUMN 을 다시 돌려 죽고, 실패하는 이행이 45초마다 DB 사본을 쌓던 것을 막았습니다."
      - "앱의 모든 HTTP 클라이언트를 `common.http_client` 로 만들어 루프백 주소(127.0.0.1·localhost·::1)는 프록시를 타지 않습니다. NO_PROXY 가 빠진 박스에서 포털·게이트웨이·AIDataHub 호출이 사내 프록시로 나가 실패하던 것을 막았고, 사내 CA 변수를 쓰도록 `trust_env` 는 그대로 둡니다."
  - date: 2026-10-11
    title: "**리스크 심사 앱** — 패널 결과 선저장(스키마 v3)과 다시 저장 경로"
    tag: 기술
    items:
      - "스키마를 v3 으로 올려 `rr_panels` 에 엔진 결과 원문 열 셋(`result_gz`·`result_hash`·`result_saved_at`)을 더했습니다. 러너는 엔진이 끝나면 결과를 먼저 이 열에 적고, 원장 저장이 실패하면 패널을 `persist_error` 로 닫아 좌석을 깎지 않고 잡을 멈춥니다. `POST /api/panels/{id}/repersist` 와 재기동 복구가 그 결과로 다시 앉힙니다. `result_gz` 는 반출에 싣지 않고, v3 DB 는 옛 SIF 가 열지 못하므로 되돌리려면 이행 전 사본(`pre-migrate-v2-*`)을 써야 합니다."
      - "다시 저장을 기다리는 패널이 있는 타깃은 러너가 그 잡을 queued 그대로 건너뛰고(까닭은 잡 행에) 브리프 미리보기도 새로 편성하지 않습니다. `POST /api/panels/{id}/repersist?discard=1` 로 다시 저장을 포기하면 `persist_abandoned` 와 감사 행을 남기고 결과는 지우지 않습니다. 예전에는 다른 잡·재개·브리프 탭이 그 좌석을 새 패널로 가져가 다시 저장이 `seats_moved` 로 영영 거절됐습니다."
      - "원장 밖 좌석(반대석 등)의 회차를 `100000+패널 번호` 로 두었습니다. 늘 회차 1 이던 반대석 때문에 같은 타깃의 두 번째 패널 저장이 통째로 롤백됐습니다. 발언 0 으로 되돌아간 원장 좌석은 의견 행을 만들지 않고, 발언 글이 없어도 스트림이 그 좌석의 발언 프레임을 셌으면 의견 행을 둡니다."
      - "Claude(MCP) 회수 길에서 planned 패널의 좌석을 running 으로 옮기는 일을 저장 트랜잭션 안으로 넣었습니다. 밖에서 커밋해 저장이 터지면 패널·좌석이 running 에 굳어 그 타깃이 재기동까지 멈췄습니다."
      - "브리프 조립 실패를 좌석 재시도·연속 실패에 세지 않습니다. 결정론 실패(`brief_error`)는 잡을 멈추고 일시 장애(`brief_retry`)는 다시 편성하다 세 번째에 멈춥니다. 같은 자리에서 다시 멈추는 조립 실패 세 번에 좌석이 skipped 로 굳고 잡이 `engine_fail_streak` 로 죽던 것을 막았습니다."
  - date: 2026-10-11
    title: "**리스크 심사 앱** — 브리프 크기 프로파일 · 변경 줄 표기 · 인용 범위와 등급 규칙 판"
    tag: 기술
    items:
      - "브리프 크기를 `BriefProfile` 이 정합니다. 웹 러너는 엔진 `/health` 의 근거 예산(`evid_budget`)에서, 옛 엔진이면 종전 크기(`web-legacy`, 11,000자)로 정하고, 상한표·E5·E7·메모·좌석 계약표와 위생의 종류별 길이 상한(주장 160·진술 200·경고 350자 등)을 같은 배수로 키우며 남는 자리는 잘린 항목에 빌려줍니다."
      - "Claude Code 길(`risk_get_brief`)의 브리프는 MCP 결과 상한(25,000토큰)을 넘지 않게 JS 파이프라인의 옛 한도(11,000자·12항목·항목 2,000자)로 되돌리고, 항목마다 원문 길이(`result_chars`)를 싣습니다. 잘린 것은 줄 표식·`brief_notice`·패널 품질에 남고, 토큰의 패널이 이미 돌았으면 다른 패널을 내주지 않습니다. 변경 150건 브리프가 88,583자에서 15,702자가 됐습니다."
      - "변경 줄 표기를 `render` 한 곳(참조 떼기·해시를 이름으로·인용 정규화·판단어 방패·이름 색인)에서 만들고, diff 요약도 그 정본 생성기로 만들어 snap 요약에 판단어 린터를 실제로 돌립니다. [의미] 묶음은 변경 목록과 같은 순서(`event_order`)로 세우고 접은 수를 이벤트 수로 세며, [결과] 는 바뀐 행만 싣고 허용오차 안의 행은 '변화 없음 N건' 으로 셉니다."
      - "변경-델타 선례를 근거 많은 조합부터, IR 경고를 WARNING·INFO 순으로 싣고 E0 에 변경 규모 한 줄을 더했습니다. 패널 품질의 절단 기록에서 러너가 갈아 끼우는 E0c 를 빼고, 좌석 기억 발췌가 위생 상한에 잘려도 원문 길이를 밝힙니다."
      - "좌석 기억(E7) 칸이 좌석의 `key` 를 읽지 못해 늘 '착석 좌석 없음' 이던 것을 고쳤고, 앞 패널 발췌를 «» 안에 싣습니다. 인젝션 검사는 실제로 싣는 부분에만 걸고 자리표시자로 바꾼 줄을 `meta.shielded` 와 패널 품질 `brief_shielded` 로 남깁니다. 질문과 지식카드 검색어에 싣는 부품 이름도 E2 와 같은 위생(`_q`)을 거쳐, 걸린 이름은 «[suspect_text …]» 로 서고 검색어에서 빠집니다."
      - "인용 대조 범위(저장 스코프)에 IR 의 명명 치수·경고·서브어셈블리 접두·판과 그 패널의 동결 브리프를 싣고, 인용문을 정규화하며 수치는 값으로 대조합니다. 패널을 처음 저장할 때 근거 등급 규칙 판(`quality_json.grade_rules`, 지금 cites-2)을 남겨 다시 낼 때 그 판으로 등급을 내고, 표식이 없는 옛 패널은 cites-1 로 냅니다."
  - date: 2026-10-11
    title: "**리스크 심사 앱** — 원장·보고서의 말없는 절단 제거와 합성 다건 변경 데이터"
    tag: 기술
    items:
      - "엔진 스트림에서 발언 원문(`say_full`)과 지식카드 집계를 받아 좌석별 `knowledge_hits_n` 을 남기고, 지식카드·실패한 조회·브리프 메아리를 도구 성공으로 세지 않습니다. 의견의 인용 수와 좌석 기억 발췌는 2,000자로 다시 자른 글이 아니라 원문에서 만듭니다."
      - "잡 메모(2,000자)·패널과 잡의 오류 문구(400·500자)·엔진 사유(200자)를 저장에서 자르지 않고, 제출 events 가 상한을 넘으면 패널 품질에 그 수를 적습니다. 의장 글 가운데 스키마 상한을 넘는 칸(trigger_text·one_liner·성격 진술 등)도 자르지 않고 저장하며 `parse_warnings` 에 남깁니다."
      - "MCP 클라이언트가 응답의 text 블록을 전부 읽습니다. 목록을 항목마다 블록 하나로 내는 서버에서 첫 블록만 읽어 로스터·필드 근거·어댑터 조회의 둘째 항목부터 버렸습니다."
      - "통합 보고서 조립이 risk_spec 스키마의 키(from_domain·to_domain·path·question)를, 등록부 영역 필터가 병합 키(domains·owner_domain)를 읽고, 등록부 표의 주장·인용을 자르지 않습니다. `close_level` 이 레벨 상승(`raised`)을 돌려줘 러너가 보고서를 조립하고, 조립이 실패해도 패널 저장을 무르지 않고 `report_build_failed` 를 남깁니다."
      - "`devseed` 에 어댑터 결과 수준의 합성 다건 변경 생성기와 크기 3·40·150 대본을 두었습니다. 다건 diff 를 실제 생산자로 만들 길이 없어 변경 종류 33종 가운데 18종이 한 번도 돌지 않았고, 생산자 결함 둘(접촉 종류 무시 · 짝 있는 부품의 판 두께가 이동·회전으로 읽힘)은 재현 시험으로 남깁니다."
      - "합성기·손 픽스처의 두께 변경을 실제 어댑터가 내는 모양(bbox·size_def 와 `min_dim=min(size_def)`)으로 바꾸고, 공장 `make_snapshot` 이 어댑터가 낼 수 없는 mcad 모양을 거절합니다. 생산자 결함 표를 '내지 못한다'(`PRODUCER_GAPS`)와 '틀리게 낸다'(`PRODUCER_MISREADS`)로 갈라, 커버리지 셈이 운영에서 나는 `cross.bridge_stale` 을 빼지 않게 했습니다."
  - date: 2026-10-11
    title: "**StepForge** — 착지 확인 2회차 · 접기 예외 · 넓이 적분 비용 · kind 변경 원장"
    tag: 기술
    items:
      - "챗 접기와 `full` 인자를 표(SPECS)의 도구 60종에만 걸고, 전부 읽는 목록을 내는 도구(`list_parts`·`list_interfaces`·`project_tree`·`find_parts`)와 `job_status` 의 params 는 접지 않습니다. 리스크 심사 앱의 캡처가 MCP 폴백에서 접힌 목록을 받아 파트를 거의 다 잃었고, 모든 dict 도구에 `full` 을 더하자 스키마가 16.8% 늘어 작은 창의 챗이 바인딩에서 도구를 잃었습니다. 뺀 설명의 요지는 `chat_fold.dropped` 에 남깁니다."
      - "B-spline 매듭이 빽빽한 면은 넓이 적분의 안쪽 축을 고르고(값은 비트까지 같습니다) 압출면은 구간 몫을 다시 써, 합성 대형 판의 파싱이 171초에서 34초가 됐습니다. 파싱에 실패한 STEP 은 형상 키에서 빼(`geokey._files`, 옛 지문은 `migrate_failed` 로 옮김) detect → graph → mesh 를 거짓으로 다시 권하지 않습니다."
      - "다시 검출이나 `set_interface` 가 kind 를 바꾸면 그 위에 지은 구조 문서·덱을 관계 지문(`AssemblyGraph.kinds_digest`)으로 가려 `structure_on_old_relations`·`mesh_on_old_relations` 로 막고 `what_next` 가 graph·mesh 를 다시 권합니다. 확정한 kind 와 다시 검출이 다르면 `confirmed_kind_disagrees` 로 말하고, pipeline 잡 결과도 `kind_changed` 를 싣습니다. `compare_snapshots` 는 두 판에 다 있는 시트 파트를 removed·added 대신 `parts.undescribed_a/_b` 로 냅니다."
      - "결과를 낸 detect·graph·mesh 잡의 `job_status` 가 원장의 낡음 줄(`result_unknowns`)을 싣습니다. `slenderness_check` 는 구멍 탐침 예산이 답을 바꾸면 `unexamined` 로 말하고 `find_similar_parts` 에 `unverified_matches` 가 생겼습니다. 견적은 덜 잰 이력을 예상에서 빼되 한도 판정의 하한으로 씁니다."
  - date: 2026-10-11
    title: "**DynaForge** — 덱 카드 공용 판정기 · 그림 좌표 관문 · 덱 op 스모크 · 게시 박스 BUILD_INFO"
    tag: 기술
    items:
      - "카드 칸 읽기 보조 12개를 `include/parser/CardFields.h` 로, 요소 카드 줄 수 판정(`elementCardSpan`)을 `ElementCardLayout` 으로 옮겨 `cleanup-nodes` 와 참조 무결성 검사·조립이 같은 판정을 씁니다. 사본이 갈리면 쓰이는 절점을 지울 수 있었습니다. 폭을 아는 `*ELEMENT_*`·`*NODE` 줄은 `fieldsFixed` 로 폭만 믿고 읽습니다(덱 바이트는 그대로입니다)."
      - "`stackdiagram` 꼬리말이 네 줄일 때 캔버스 밖에 찍혀 사라지던 것을 꼬리말 띠를 먼저 떼어 고쳤고, 회귀가 SVG 의 모든 좌표를 캔버스와 비교합니다. `modelmeta` 는 2차 솔리드 파트를 `model.second_order_solid_pids`·`parts[].second_order`·콘솔 경고로 표시합니다."
      - "덱을 쓰는 op 을 살아 있는 스택에서 지키는 `deckops_smoke.py`(9항)를 두어, 바이너리·카탈로그·API·MCP 가운데 하나만 낡아도 빨개집니다."
      - "게시하는 박스도 `BUILD_INFO.txt` 를 자기 `bin/` 에 내려놓아 `/api/health` 의 revision 이 뒤처지지 않습니다. 같은 내용이면 `cp -p` 로 mtime 을 지켜 update-all 재기동 판정이 매번 '바뀜' 으로 오판하지 않게 했습니다."
  - date: 2026-10-10
    title: "지식카드 검색과 Claude 의 도구 찾기가 **전문을 돌려줍니다**"
    tag: 챗
    items:
      - "지식카드 검색이 절의 앞 200자가 아니라 전문을 돌려주고, `get_record_sections` 는 앞 10절이 아니라 모든 절을 줍니다. `agent_search` 는 건수(top_k)를 정할 수 있고 더 있으면 그렇다고 알립니다."
      - "Claude 의 `search_tools` 가 도구 설명을 220자·인자 12개에서 자르지 않습니다. `deliberate_start` 의 심의 유형 목록처럼 뒤쪽에 있던 안내가 이제 보입니다."
      - "챗 답이 모델 출력 상한에서 문장 중간에 끊기면 정상 답처럼 끝나지 않고, 뒷부분이 빠졌을 수 있다고 알려 줍니다."
      - "웹 심의를 서버에 남길 때 긴 발언의 한글이 '�' 로 깨지던 것을 고쳤습니다. 다른 기기나 Claude 에서 열어도 원문 그대로 보입니다."
  - date: 2026-10-10
    title: "심의에 **넣은 좌석·의견·옵션이 그대로** 걸립니다"
    tag: 심의
    items:
      - "시험 계획 심의에서 적어 넣은 의견과 고른 좌석이 말없이 빠지던 것을 고쳤습니다. 이제 고정 좌석 뒤에 고른 좌석을 앉히고 의견도 좌석에게 전합니다."
      - "품질 전문가가 불량 이력(PLM 문제점) 도구 대신 VOC 도구부터 받던 것을 고쳤습니다. 챗과 심의 모두 해당합니다."
      - "Claude 에서 좌석을 `recommend_agents` 결과 모양으로 넘기면 전부 걸러지고 서버가 고른 패널로 돌던 것을 고쳤습니다. 못 앉힌 좌석은 카드로 알리고, 쓸 수 있는 좌석이 없으면 시작하지 않습니다."
      - "켜고 끄는 옵션(보고서 저장·자유 조회·지식카드 등)을 'off' 로 보내면 켜진 채 돌면서 기록에는 꺼진 것처럼 남던 것을 고쳤습니다. 기록에는 실제로 적용된 값이 남습니다."
      - "이어하기에서 직접 지어 준 좌석이 역할의 앞 280자만 받던 것을 고쳤고, `deliberate_continue` 에도 근거(evidence)를 다시 실을 수 있습니다."
      - "다른 사람의 심의는 job_id 를 알아도 멈출 수 없고, 이어가도 그 사람의 보고서에 덧붙지 않습니다."
  - date: 2026-10-10
    title: "Claude 의 hwax 도구가 **헛짚거나 빠뜨리지 않습니다** — verify_answer · 대화 저장 · 심의 전사"
    tag: 연결
    items:
      - "`verify_answer` 가 큰 조회 결과의 뒤쪽 수치나 앞서 여러 번 조회한 값을 '지어낸 값' 으로 잘못 짚던 것을 고쳤습니다. 수치는 글자 조각이 아니라 수 단위로 맞춰 봅니다."
      - "조회한 지 30분이 지나 검증하면 '조회 기록이 없다' 대신 '만료됐으니 다시 조회하라' 고 말합니다."
      - "`save_conversation` 이 2만 자를 넘는 발언을 표시 없이 자르고 200건이 넘으면 가운데 발언을 빼던 것을 고쳤습니다. 이제 끝까지 저장합니다."
      - "`deliberate_transcript` 가 화면용으로 줄인 발언을 원문처럼 주던 것을 고쳤습니다. 줄인 발언에는 표시가 붙고, `full=true` 로 줄이지 않은 발언을 받습니다."
      - "`rest_call` 에 같은 필터를 여러 값으로 주면 값이 글자로 깨지던 것을 고쳤습니다."
  - date: 2026-10-10
    title: "**Claude 심의 워크플로·브라우저 사본** — 창에서 유도한 상한과 절단 표식"
    tag: 기술
    items:
      - "Claude Code 로 돌리는 심의 워크플로(`infra/pipeline/*.js`)의 상한을 서브에이전트 창(`ctxTokens`, 기본 200,000 토큰)에서 유도하고, 줄인 것은 반환값과 원장에 알립니다. 근거 12건·11,000자·항목 2,000자가 엔진과 40배 어긋났고, 1라운드 근거 해석 600자·인용 80자·대화 발언 19,500자·조항 1,200자를 표식 없이 끊었습니다. 작은 창(16,384 토큰)에서는 종전 값 그대로입니다."
      - "같은 수정에서 리스크 심사 길이 1라운드 발언의 조회 기록(`reads`)을 빼던 것과, 시뮬 2단의 꼬리 발췌가 쉬운 설명을 집던 것을 고쳤습니다."
      - "근거의 출처·도구·인자를 Claude 경로에서는 엔진과 같은 상한(200·80·1,200자)으로 끊고 원문 길이를 남깁니다. 웹 프론트는 같은 값으로 미리 자르지 않아 엔진의 절단 표식이 붙습니다. 예전에는 JS 가 출처 120자·인자 400자에서 말없이 끊었습니다."
      - "저장소 쿼터 때문에 줄인 브라우저 사본의 메시지에 표식(`cacheTrimmed`)을 달고, 열 때 서버 정본으로 되채웁니다. 저장할 때 표식을 이어 받고, 되채우지 못하면 대화 머리에 알립니다(새로고침 직후 저장이 표식을 지워 두 번째 새로고침부터 넘기기·이어하기·내보내기가 줄인 판으로 말없이 만들어지던 것을 같은 날 고쳤습니다)."
  - date: 2026-10-10
    title: "**에이전트 서버** — 리스크 앱과 주고받는 검색어·지식카드 집계·근거 예산"
    tag: 기술
    items:
      - "심의 요청이 좌석 지식카드 검색어를 받습니다(`knowledge_query` — 문자열 또는 좌석별 사전). 예전에는 전 좌석이 변경 내용 없는 화두 한 줄로 같은 카드를 찾았고 호출자가 검색어를 줄 길이 없었습니다."
      - "지식카드를 물은 좌석마다 상태줄에 집계(`knowledge` — 실은 줄 수·강등 여부·검색어 출처)를 싣습니다. 리스크 앱이 좌석별 적중을 셀 원천이 생겼습니다."
      - "`/health` 에 좌석 근거 예산(`evid_budget`)을 싣습니다. 리스크 앱이 박스의 모델 창에 맞춰 브리프 크기를 잡을 수 있습니다(예전에는 어느 박스에서나 같은 상수를 썼습니다)."
      - "리스크 심사 좌석에 변경 전체를 보는 도구(`risk_get_diff`·`risk_get_snapshot`)를 열고, 조회 단계에도 도메인 계약 줄을 싣습니다. 앱키가 러너의 apps 밖이라 닫혀 있었고, 계약의 '필수 도구' 는 도구 없는 발언 턴에만 보였습니다."
  - date: 2026-10-10
    title: "**에이전트 서버** — 심의 좌석이 받는 조회·근거·의견 몫을 모델 창에서 유도합니다"
    tag: 기술
    items:
      - "직전 라운드 몫과 값당 직렬화 상한을 모델 창에서 유도합니다. 1백만 토큰 창에서도 다음 라운드 좌석이 라운드 합 48,000자·값마다 700자로 끊긴 판을 받았습니다."
      - "좌석이 직접 조회한 결과(종전 호출당 900자·합 3,500자)의 몫을 창에서 유도하고, 넘치면 호출마다 같은 몫으로 줄여 원문 길이를 남깁니다. 조회 턴은 그 턴 창의 15% 를 결과 몫에서 떼어 논의 발췌(종전 base 앞 4,000자·직전 전사 꼬리 4,000자)·'이미 조회된 것'(1,200자)·호출 인자(140자)를 받습니다. 다른 좌석의 조회 결과에는 풀에 담은 길이(최대 840자)가 아니라 원문 길이를 '전체 N자' 로 적고, 넓은 창은 항목을 몫이 닿는 데까지 싣습니다."
      - "지정 도구 결과(종전 도구당 2,000자·합 5,000자)와 인자 스키마(12개·설명 100자)를 넓은 창에서는 창에서 유도하고, 도구 하나만 끊겨도 원장에 남깁니다. 좌석에 싣는 지정 도구 머리줄의 인자(160자)와 재시도 계획자에게 주는 오류(500자)는 좁은 창에서만 끊고 원문 길이를 적습니다."
      - "좌석 지식카드 발췌를 창 몫(`_ROOM_SHARE` knowledge)에서 유도합니다(1백만 토큰 창 약 19,000자, 좁은 창은 종전 3,500자). 뺀 카드 수는 상태줄과 '지식카드 예산 초과' 카드로 남기고, 카드 한 줄을 700자에서 끊으면 원문 길이를 남기며, 심의 좌석은 한 줄을 자기 지식카드 예산까지 받습니다."
      - "사람 의견(`human_note`)의 상한을 `DELIB_HUMAN_NOTE_MAX` 로 빼고, 적지 않았으면 모델 창에서 유도합니다(1M 9,692자, 종전 2,000자). 잘랐으면 카드와 잡 원장에 남기고 메뉴의 `limits` 도 그 값을 알립니다. 근거 천장 옆 주석의 1M 유도값은 사람 의견 몫을 뗀 430,356자로 고쳤습니다."
      - "사전 근거 항목의 출처·도구·인자를 끊으면 원문 길이를 남기고, 형식 밖 키를 버리면 '요청 값 해석 불가' 카드로 알립니다."
      - "반대석 축 명명(화두 앞 1,500자)·VOC 환기(본문 200자·경보 300자·브리핑 400자·대화 턴 600자)·근거 선주입(2,500/8,000/3,000자)의 고정 절단을 좁은 창에만 남기고 원문 길이를 적습니다. 웹 인용 대조 상한(40건)을 넘으면 대조하지 않은 수를 결정문에 적습니다."
      - "해석 설계·시험 설계 2단에 까는 자산·물성 스냅샷을 넓은 창에서는 블록마다 자르지 않고(종전 500~1,400자), 끊으면 글에 원문 길이를 적습니다. 예전에는 전체 상한 절단을 서버 로그에만 남겼습니다."
  - date: 2026-10-10
    title: "**에이전트 서버** — 심의 기록·후처리·다단 승계가 원문을 지킵니다"
    tag: 기술
    items:
      - "기록용 발언(`say_full`)이 버블과 같은 필드만 골라 1라운드 해석(reads)·우려와 3라운드 양보 불가 조항을 빼던 것을 고쳐, 라운드가 요구한 필드를 전부 싣습니다. 넓은 창에서는 `say_full`·회의록 발언을 12,000자에서 끊지 않고, RA '결과' 칸(종전 전사 앞 1,500자·환기 1,200자)은 RA 항목 상한을 나눠 지키며, 블록 건수 상한에 걸리면 카드로 알립니다."
      - "좌석 출력의 JSON 을 앞 100,000자에서만 찾던 것을, 마지막 최상위 객체와 펜스 블록을 먼저 선형으로 찾고 폴백 스캔은 뒤쪽을 훑게 바꿨습니다. JSON 이 깨진 좌석의 원문은 2,000자가 아니라 전부 보존하고 강등 표식에 원문 길이를 적습니다."
      - "심의 잡 원장이 사람 의견·이어받은 요약 같은 요청 값을 앞 117자가 아니라 전문으로 남기고, 응답만 전체 길이 표식을 달아 줄입니다. 전사 상한(400턴)에 걸리면 경고로 알리고, 지정 좌석 역할(`seat_roles`)은 2,000자가 아니라 엔진이 받는 길이와 같게 적어 이어하기가 줄여 넘기지 않습니다."
      - "핵심 요약(결정문 앞 6,000자)·쉬운 설명(7,000자)·best-of 심판(후보마다 4,000자)이 읽는 길이를 창에서 유도하고(바닥은 종전 값) 줄였으면 카드로 알립니다. 의장 결정문이 출력 상한에서 끊기면 경고하고, 날조 가능 웹 인용이 8건을 넘으면 총 건수를 적습니다."
      - "이어하기가 받는 이전 결정문(종전 8,000자)과 다단 승계(1단 결정문을 2단에 앞 8,000자, 2단 결정문을 3단에 20,000자·조항 12건)를 모델 창에서 유도한 이어하기 요약 길이로 넘깁니다. 결정문 뒤의 risk_spec·sim_spec 이 잘리지 않고, 줄이면 카드로 알리며, 턴의 조항은 1,200자에서 끊으면 원래 길이를 남기고 목록은 항목으로 잇습니다."
  - date: 2026-10-10
    title: "**에이전트 서버** — 챗·띵킹·/보고서의 고정 글자 상한을 좁은 창에만 남깁니다"
    tag: 기술
    items:
      - "넓은 창에서 챗 이력 항목(24,000자)·빈 응답 구제 발췌(12,000자)·이어하기의 끊긴 답(2,000자)·VOC 한 건(600자)·페르소나 역할(8,000/3,000자)을 끊지 않고, 좁은 창에서만 끊으며 원문 길이를 적습니다. 화두 뽑기·되묻기·좌석 축은 예산을 최근 대화부터 쓰고, 재시도는 문서가 있는 턴의 이력 몫을 씁니다."
      - "챗→심의 핸드오프(`result_full`·`detail_full`, 종전 4,000자)·결정문 수치 대조 원문(결과마다 120,000자·합 400,000자)·유령 ID 게이트의 출처 정수(2,000개)를 창에서 유도합니다(좁은 창은 종전 값). 도구 결과를 자르면 상태줄로도 알리고, `TOOL_RESULT_MAX=0`·`TOOL_DESC_MAX=0` 은 무제한으로 읽습니다. 예전에는 0 이 0자 절단이거나 도구 설명이 '…' 한 글자가 됐고, 무절단을 뜻한 `desc_max=0` 은 2,400자로 떨어졌습니다."
      - "`/보고서` 의 원문 보존형 보고서가 발언(400자·40건)·질문 전문(1,200자)·결과(답 6건 × 1,500자)·권고(마지막 답 10문단)를 자르지 않고 RA 항목 상한은 나눠 지킵니다. 정리본은 이력을 60,000자로 덜지 않고 챗 이력 예산(창 유도, 바닥 60,000자)만큼 읽으며, 남는 상한은 결과 문구에 적습니다."
      - "확정 종결의 직접 실행 결과에도 핸드오프용 `result_full` 을 싣습니다(종전 220자 미리보기뿐). VOC 검색어 추출은 화두를 좁은 창에서만 1,500자로 끊고 원문 길이를 적습니다."
      - "낱장 표지가 없는 긴 붙인 문서를 앞부분만 실었을 때도 가운데를 덜어낸 경우처럼 상태줄에 적습니다."
      - "띵킹 좌석 지식카드 발췌를 심의 좌석과 같은 창 몫에서 유도하고(좁은 창은 종전 2,500자), 뺀 수를 예심 사유에, 좌석에 싣지 않은 앞선 대화 수를 상태줄에 적습니다."
  - date: 2026-10-10
    title: "**MCP 게이트웨이** — 도구 안내·REST·캐시·감사가 큰 결과를 자르지 않고 다룹니다"
    tag: 기술
    items:
      - "`use_experts` 가 역할 문서를 8,000자에서 자르지 않고, 5명·앱 3·입구 도구 12 를 넘긴 것과 `browse_experts` 가 limit 로 자른 것을 말합니다. `list_tool_apps` 의 앱·영역 상세는 도구 설명과 레지스트리 앱 설명을 300자에서 자르지 않습니다."
      - "`search_tools` 는 limit 로 자른 결과에 잘랐다고 말하고, 찾은 도구의 이름 순위(`ranked`)·안내를 설명·스키마 전문보다 앞에 싣습니다. `list_tool_apps` 앱 상세는 `tool_names` 를 먼저 싣습니다. 작은 창 소비자(dev 웹 챗 6,000자)가 앞에서부터 자르면 뒤 도구가 이름조차 사라져 '없다' 로 읽혔습니다."
      - "`rest_call` 이 JSON 이 아닌 본문을 8,000자에서 자르지 않고, `rest_catalog` 는 요약을 120자에서 자르지 않으며 경로의 인자·본문 스키마를 싣습니다."
      - "응답 캐시는 한 건이 1MiB 를 넘는 결과를 그대로 돌려주되 담지 않고, 담은 것의 합을 64MiB 로 묶어 오래된 것부터 버리며, `/health` 에 `too_big`·`bytes` 를 싣습니다. 검색 상한이 걷힌 뒤 수십 MB 결과를 건수(512)만 보는 캐시가 300초씩 쥐었습니다."
      - "감사 원장에 도구 결과의 크기를 남기고, 잘린 오류·메모에는 원문 길이를 답니다."
  - date: 2026-10-10
    title: "**StepForge** — 넓이 적분 판 3 · 시트 판정 칸 · 관문 단가 · 챗 접기 · 잡 행 기록"
    tag: 기술
    items:
      - "면 넓이(`oc.face_area`)를 매듭에서 가른 그린 정리 적분 한 식으로 바꾸고 부호 있는 합의 크기로 냅니다. 부울(`oc._boolean`)은 인자를 고치지 않고(`SetNonDestructive`) 한 번만 지어, 검출 뒤 공차 지문이 바뀌는 파트와 쌍 순서에 따라 판정이 갈리던 것을 없앴습니다. 정의 저장 넓이 판을 `DEF_MEASURE_VERSION` 3 으로 올렸고, `backfill` 이 `area_changed` 를 내며 `compare_revisions` 는 식이 다른 두 개정의 시트 짝을 넓이로 견주지 않습니다."
      - "시트 바디 쌍의 판정을 열린 면이 상대 솔리드 안에 들었는지로 바꾸며 새 칸 `penetration_sheet_depth`(공차 수준일 때)·`interfaces.pen_rule`·`shape_defs.open_faces`·`interface_diff.stale_pen_rule_rows` 를 더했습니다. 옛 규칙으로 잰 행은 막는 사유 `sheet_kind_stale` 로 다시 검출을 권하고, 다시 검출이 kind 를 바꾼 쌍은 잡 결과의 `kind_changed`(사람이 확정한 것은 `kept_by_human`)가 말합니다."
      - "`stackup_profile` 관문의 단가를 고쳤습니다. 축 추정의 거리 몫을 짝의 꼴별 셈(`AXIS_*_S`)으로, `axis_gap` 은 잰 거리로 다시 세고, 가로지르는 곡선 모서리를 부울 작업량에 넣었습니다. 정점 상자·정의 상자·구간 안 단면 최소 같은 싼 하한으로 먼저 멈춰 큰 판의 멈춘 응답이 30초대에서 1~2초대로 줄었고, 새 칸 `nonadjacent_in_budget`·`sections_skipped` 를 냅니다."
      - "사이드카의 '파싱 뒤 바뀜' 을 시각이 아니라 내용 지문으로 가르고(`judged_by`), 옛 형상 판정 셋(`relations_on_old_shape`·`structure_on_old_shape`·`mesh_on_old_shape`)을 한 판정(`_on_old_shape`)으로 묶었습니다. `parse_pending` 을 DB·조합 도구, 거절 문구(`catalog.ON_REFUSE`), 측정·치수·대응·precheck 잡 결과에도 싣고, 그림 텍스트는 상한에 닿아도 주의 한 줄을 남깁니다."
      - "`core/chatfold.py` 가 챗 컷을 넘는 dict 응답을 나가는 글 한 자리에서 접습니다(표의 도구 62종 — 설명·스키마를 빼고 긴 목록은 앞 N행, 맨 앞에 `chat_fold`). REST 와 도구끼리의 호출은 접지 않으며, `what_next` 의 묶은 칸 `not_yet_by_needs`·`unknown_groups` 와 `glossary(field=)` 를 더했습니다. 판 일곱 6,384호출에서 컷을 넘는 응답이 1,380 에서 49 로 줄었습니다."
      - "잡 행에 `closed_by`·`closed_before_marks` 를 남겨 옛 판 서버가 닫은 잡을 말하고, `job_status.result_unknowns`·`data_folder.unmarked_claims` 를 더했습니다. 얼어 있는 러너에게 건 취소는 두 박자 뒤 워커를 직접 끊고, `core/logpipe.py` 로 로그 파이프가 끊겨도 워커·계산 서버가 죽지 않습니다."
      - "도구 이력 행에 `outcome`(멈춤·덜 잼·재사용·비워 냄)을 남겨 `estimate_cost` 는 끝까지 잰 호출만 그 호출의 비용으로 셉니다. `drop_check`·`structure_report` 하중 경로의 동률은 노드 경로 순으로 정하고, `download_artifact(content=)` 는 글 파일을 text 한 벌로만 냅니다."
  - date: 2026-10-08
    title: "심의가 **오래 걸려도 끊기지 않습니다** — 시간 제한을 다시 잡았습니다"
    tag: 심의
    items:
      - "좌석이 많은 심의·리스크 심사가 시간 때문에 잘리지 않도록 경로 전체의 시간 제한을 다시 잡았습니다. 리스크 심사 패널은 40분에서 **12시간**까지, 모델 호출 한 번은 30분까지(요청하면 4시간까지) 기다립니다."
      - "심의가 조용히 생각하는 동안에도 15초마다 살아 있다는 신호를 보냅니다. 화면에는 마지막 진행이 몇 분 전인지 보이고, 신호가 끊기면 '신호 없음' 으로 바뀝니다. 예전에는 의장이 결정문을 쓰는 긴 침묵 동안 중간 장비가 연결을 끊을 수 있었습니다."
      - "긴 심의 도중 로그인 토큰이 만료돼 자료 조회와 마지막 보고서 저장이 실패하던 것을 고쳤습니다(심의용 토큰이 30~60분에서 24시간으로 늘었습니다)."
      - "의장이 결정문을 끝내 쓰지 못해도 회의가 통째로 버려지지 않습니다. 좌석별 마지막 입장과 회의록이 남고 이어하기가 됩니다."
      - "화면 연결이 끊겨도 심의는 서버에서 계속 돕니다. 이제 그 사실을 알려 주어, 같은 심의를 다시 눌러 두 번 돌리는 일을 막습니다."
  - date: 2026-10-08
    title: "심의가 **버린 것을 숨기지 않습니다** — 근거 120칸 · 봉인 심사 · 대기 줄"
    tag: 심의
    items:
      - "심의에 넣는 사전 근거가 40칸에서 **120칸**으로 늘었습니다. 좌석에 주지 않은 근거(칸 초과·예산 초과·본문 없음)는 조용히 사라지지 않고 '좌석에 주지 않음' 카드로 남으며, Claude(MCP)로 부른 심의의 진행 조회·결과에도 실립니다."
      - "근거 본문을 result 가 아닌 이름(text·content·summary 등)으로 보내도 받습니다. 예전에는 그 항목이 통째로 버려져 심의가 근거 없이 끝까지 돌았습니다. 근거에 내 번호(key)를 붙여 보내면 결정문 인용이 [e:3|E1-CH-015] 처럼 찍혀 내 목록과 맞춰 볼 수 있습니다."
      - "의장이 결정문을 쓸 때 라운드 발언을 훨씬 많이 봅니다. 예전에는 라운드마다 6,000자(실제 발언의 6분의 1)만 보고 써서 가운데 좌석의 입장이 결론에 들어가지 못했습니다."
      - "동시에 도는 심의가 가득 차면 거절하지 않고 **줄을 세워** 순번을 알려 줍니다. 자리가 나면 스스로 시작합니다. 다른 사람의 심의 목록은 보이지 않습니다."
      - "소급 검증용 **봉인 리스크 심사**(risk-review-sealed)가 생겼습니다. VOC 환기·자유 조회·지식카드·웹 검색을 한꺼번에 닫고 준 자료만으로 심의하며, 결정문에 봉인 실행이라고 적힙니다."
  - date: 2026-10-08
    title: "관리자 화면 — **소속 없는 사람만 골라 보기** · 관리자 지정·해제"
    tag: 수정
    items:
      - "사용자 관리에 '소속 미지정만 보기' 가 생겼습니다. 사내 로그인으로 새로 들어온 사람은 소속이 없어 일반 챗만 쓸 수 있는데, 이제 그 사람들만 모아 한 명씩 소속을 줄 수 있습니다. 가입 시각과 부서 코드도 함께 보입니다."
      - "관리자 지정과 해제를 화면에서 합니다. 해제하면 그 사람의 로그인과 개인 토큰이 바로 끊겨, 예전처럼 옛 토큰으로 관리자 권한이 남지 않습니다. 자기 자신과 마지막 관리자는 해제할 수 없습니다."
      - "사용자를 정지하면 포털 토큰뿐 아니라 SmartTwin(ste)·Report Archive·MCP 게이트웨이 쪽 자격도 함께 회수합니다."
      - "AI Ready Portal 타일이 포털 로그인 그대로 열리도록 바뀝니다(서버 설정이 끝난 뒤 적용됩니다)."
  - date: 2026-10-08
    title: "심의가 붐빌 때도 **챗·띵킹·지식카드가 덜 끊깁니다**"
    tag: 챗
    items:
      - "큰 심의가 공용 모델을 오래 차지해도 챗이 첫 글자를 300초까지 기다립니다. 예전에는 120초에서 끊겨 시작도 못 했습니다."
      - "그래도 늦으면 'LLM 서버에 연결하지 못했습니다' 대신 무엇을 몇 초 기다리다 멈췄는지 알려 줍니다. 서버가 내려간 것과 답이 밀린 것을 가려 볼 수 있습니다."
      - "띵킹 모드의 전문가가 답을 600초까지 기다립니다(예전 180초)."
      - "심의 여러 건이 겹치면 지식카드 검색이 실패하던 것을 고쳤습니다. 멈춘 검색은 90초에 취소하고 그렇다고 알립니다."
      - "줄 서 있던 심의가 차례를 받은 순간 도구 게이트웨이가 재기동 중이면 곧바로 오류로 끝나던 것을 고쳤습니다. 이제 몇 번 다시 묻습니다."
  - date: 2026-10-08
    title: "**리스크 심사** — 패널이 'HTTP 422' 로 닫히던 것과 취소·대기 문제를 고쳤습니다"
    tag: 심의
    items:
      - "웹에서 시작한 리스크 심사 패널이 'HTTP 422' 오류로 하나도 돌지 못하고 닫히던 것을 고쳤습니다."
      - "잡을 취소하거나 일시정지하면 지금 도는 패널도 20초 안에 닫힙니다. 예전에는 그 패널이 끝날 때까지 새 잡이 시작되지 않았고, 취소한 잡의 결과가 등록부에 합쳐지기도 했습니다."
      - "동시에 도는 심의가 가득 차면 최대 한 시간까지 자리를 기다리고, 그래도 안 나면 좌석을 깎지 않고 잡을 멈춥니다. 진행판에 '엔진 자리 대기 n회째' 가 보입니다."
      - "앱 재기동·연결 끊김·결정문 실패로 끊긴 패널은 좌석 실패로 세지 않고 잡을 멈춰 둡니다. 재개하면 이어 돕니다."
      - "잡을 낼 때 적은 메모가 그 잡의 패널에 그대로 실립니다."
      - "심사 대상을 열 때 전문가 명단 조회가 길어지면 504 오류 뒤에 대상이 생기던 것을 고쳤습니다. 이제 받은 만큼으로 열고 못 받은 분야를 알려 줍니다."
  - date: 2026-10-08
    title: "**리스크 심사** — 브리프가 실제로 걸린 규칙과 CAD↔해석 대조를 싣습니다"
    tag: 심의
    items:
      - "좌석이 받는 브리프의 규칙 줄에 실제로 걸린 규칙(간섭 등)이 건수와 함께 실립니다. 예전에는 통과한 규칙만 실렸습니다."
      - "CAD 파트와 해석(K 파일) 파트를 잇는 연결이 한 건도 서지 않던 것을 고쳤습니다. 이제 CAD↔해석 치수 대조가 돕니다."
      - "확인하지 못한 게이트를 '실패' 로 적지 않고, 비어 있는 ECAD 는 '없음' 으로 적습니다."
      - "큰 형상의 스냅샷 조회를 120초까지 기다려, 일부만 받은 형상으로 심사하던 일을 줄였습니다."
  - date: 2026-10-08
    title: "심의 **기다림과 오류 안내**가 분명해졌습니다 — 브리프 건너뛰기 · 거절 사유"
    tag: 심의
    items:
      - "심의로 넘기는 브리프에서 화두 제안·전문가 발굴을 기다리는 동안 몇 초째인지 보이고 '건너뛰기' 로 넘어갈 수 있습니다."
      - "챗·심의 요청이 거절되면 'Request failed (422)' 대신 어느 칸이 무엇을 어겼는지 보입니다. 같은 값으로는 다시 거절되므로 '다시 시도' 버튼을 내지 않습니다."
      - "심의가 시간 한도에 걸리면 '라운드 수를 줄이라' 는 권고 대신 어느 한도에 걸렸는지 알려 줍니다."
      - "의장이 결정문을 내지 못한 심의가 '서버에 연결하지 못했습니다' 로 보이던 것을 고쳤습니다. 이제 결정문이 없다는 것과 라운드 발언은 남았다는 것이 그대로 보입니다."
  - date: 2026-10-08
    title: "Claude 의 도구 호출이 **느리거나 다시 붙어도** 제대로 갑니다"
    tag: 연결
    items:
      - "느린 도구가 120초에 끊긴 뒤 한 번 더 실행되던 것을 고쳤습니다. 이제 600초까지 기다리고, 넘기면 다시 부르지 않고 '앱은 아직 일하고 있을 수 있다' 고 알립니다. 쓰기 도구가 두 번 실행될 일이 없어졌습니다."
      - "긴 심의 도중 앱이 재배포되면 좌석이 'unknown tool' 을 받아 그 도구를 버리던 것을 고쳤습니다. 10분까지는 앱이 잠시 내려가 있다고 알립니다."
      - "`rest_call` 이 느린 사이트를 30초에 끊고 '닿지 않는다' 고 말하던 것을 고쳤습니다."
      - "토큰 수명이 끝나면 틀린 토큰과 같은 거절 대신 수명이 끝났다고 답합니다."
      - "연결이 다시 붙은 뒤의 재시도가 본인 대신 서비스 계정으로 나가 심의 조회가 '내 것이 없다' 로 답하던 것과, 사내 프록시 때문에 Report Archive 본인 연결이 403 으로 거절되던 것을 고쳤습니다."
  - date: 2026-10-08
    title: "절차 — 단계가 **정해진 시간**을 넘기면 멈추고 묻습니다"
    tag: 챗
    items:
      - "절차의 단계가 정해진 시간(빠름 30초 · 느림 110초)을 넘기면 그 자리에서 '실행 여부 모름' 으로 멈춥니다. 예전에는 이 시간이 실제로 걸리지 않아 600초까지 기다렸습니다."
      - "멈춘 쓰기 단계는 사람이 확인한 뒤에만 다시 보냅니다. 예전에는 끊긴 쓰기가 확인 없이 다시 나갈 수 있었습니다."
      - "늘 오래 걸리는 단계는 절차에서 '느림' 으로 적어 두세요."
  - date: 2026-10-08
    title: "심의 결정문의 경고가 **보고서에도 남고** 더 정확해졌습니다"
    tag: 심의
    items:
      - "결정문의 '근거에서 확인되지 않은 수치'·'확인 안 된 웹 인용' 경고가 Report Archive 에 저장되는 보고서에도 남습니다."
      - "수치 대조가 좌석의 원래 발언과 좌석이 받은 지식카드·조회 결과까지 출처로 봅니다. 근거를 대고 말한 수치에 붙던 헛경고가 줄었습니다."
      - "확인되지 않은 수치가 많으면 '표시 6건 · 총 N건' 으로 전체 수를 함께 적습니다."
      - "웹 인용을 확인하는 조회가 실패한 것을 '날조' 로 세지 않고 '확인하지 못했습니다' 로 따로 적습니다."
      - "시간 한도에 걸려 요약·쉬운 설명·VOC 환기가 빠지면 처음부터 없던 것처럼 보이지 않고 빠졌다고 알립니다."
  - date: 2026-10-08
    title: "사내 로그인 — 처음 들어온 사람의 **소속이 자동으로** 정해집니다 · 정지된 계정 안내"
    tag: 연결
    items:
      - "사내 로그인으로 처음 들어오는 사람의 소속을 로그인 정보(회사·부서 코드)에 따라 자동으로 정할 수 있습니다. 서버에 소속 대응표를 둔 뒤부터 적용됩니다."
      - "자동 지정은 계정이 처음 생길 때 한 번뿐입니다. 지금 소속이 빈 사람은 관리자가 '소속 미지정만 보기' 에서 지정합니다."
      - "정지된 계정으로 로그인하면 '잠시 뒤 다시 시도하세요' 대신 '이 계정은 정지되었습니다. 포털 관리자에게 문의하세요.' 가 보입니다."
  - date: 2026-10-08
    title: "관리자 화면 — **정지 보호** · 줄마다 거절 사유 · 권한 변경이 Claude 에도 바로"
    tag: 수정
    items:
      - "본인과 마지막 관리자는 정지할 수 없습니다. 예전에는 요청 한 번으로 관리자가 아무도 남지 않을 수 있었습니다."
      - "사용자 관리 표에서 관리자 스위치·소속 칸이 거절되면 사유가 그 줄 바로 아래에 보입니다."
      - "관리자 해제·소속·개별 허가를 바꾸면 개인 Claude(MCP)에도 곧바로 적용됩니다. 예전에는 최대 60초 동안 옛 권한으로 도구가 불렸습니다."
      - "접속 이력에서 자동 지정된 소속이 코드 대신 이름으로 보입니다."
  - date: 2026-10-08
    title: "운영 갱신 — **설정 한 줄**로 관리자·프록시 우회·AI Ready Portal 을 맞춥니다"
    tag: 배포
    items:
      - "관리자는 이제 사용자 원장과 `infra/.env` 의 `PORTAL_ADMIN_EMAILS` 로만 정해집니다. 반영 전에 운영자 이메일을 적어 두세요. 활성 관리자가 0명이면 ⚠ 로 알립니다."
      - "포털과 배포 스크립트가 NO_PROXY 를 스스로 맞춥니다. 운영자 셸의 임시 설정 없이도 Report Archive·TestScope 호출이 사내 프록시로 새지 않습니다."
      - "`infra/.env` 의 `ARP_HOST` 한 줄에서 게이트웨이의 AI Ready Portal 주소를 맞춥니다."
      - "박스에만 있는 앱은 `access.local.yaml`(권한)·`systems.local.yaml`(외부 링크 타일)로 붙입니다."
      - "update-all 이 매번 헛되이 게이트웨이·에이전트 서버를 다시 띄우던 경우를 없앴고, 새 설정 채우기가 박스에 정한 값을 예시 기본값으로 덮던 것을 고쳤습니다."
  - date: 2026-10-08
    title: "**포털 대화 저장소** — WAL · 잠금 대기 30초 · 저장이 포털을 세우지 않게"
    tag: 기술
    items:
      - "서버 대화 저장소의 SQLite 잠금 대기를 5초에서 30초로 늘렸습니다(`CONV_STORE_BUSY_TIMEOUT_S`). 끝난 심의를 저장하다 실패하면 사유·손잡이 이름·대화 id 를 경고 로그로 남깁니다. 백업이 DB 를 쥔 사이 서버 사본이 빠져도 아무 표시가 없었습니다."
      - "대화 저장소의 저널을 WAL 로 옮겨, 읽기만 하는 백업이 도는 동안에도 저장이 멈추지 않습니다(잠금 대기를 늘린 뒤 1.3GB DB 백업 15초 동안 저장과 이벤트 루프가 함께 멈추던 것입니다). 전환할 때 다른 연결이 DB 를 쥐고 있으면 기동을 막지 않고 경고 뒤 종전 모드로 돕니다."
      - "저장소의 쓰기 다섯(생성·덧붙이기·삭제·이름 바꾸기·벡터 쓰기)이 실패하면 되돌립니다. 잠금 대기가 다 찬 쓰기 한 번 뒤로 그 연결의 쓰기가 재기동 전까지 전부 'database is locked' 로 즉시 실패하고, 읽기는 옛 내용만 보던 것을 고쳤습니다."
      - "대화 REST 여섯과 `/chat` 의 발화 저장·검색 색인 통계를 이벤트 루프 밖(스레드)에서 부릅니다. 잠금을 기다리는 저장 하나가 로그인·다른 릴레이·게이트웨이 조회까지 포털 전체를 최대 30초 세웠습니다(잠금 대기를 늘린 뒤 생긴 것을 같은 날 고쳤습니다). 끝난 스트림의 저장은 취소에서 가려 브라우저가 도중에 떠나도 받은 발언을 남기고, 막히면 사유 없는 500 대신 503 과 사유를 돌려줍니다."
  - date: 2026-10-08
    title: "**포털 시간 한도** — 릴레이 침묵 13시간 · 도우미 600초 · nginx 14시간 · 절차 워밍업 690초"
    tag: 기술
    items:
      - "포털이 에이전트 서버 스트림을 읽을 때 침묵 한도(`AGENT_STREAM_IDLE_TIMEOUT_S`, 기본 46,800초 = 13시간)를 둡니다. 바이트 사이 간격만 재므로 신호를 내는 심의는 길이와 무관하게 끊기지 않습니다. 멈춘 서버를 로그 한 줄 없이 영영 기다리며 동시 실행 퍼밋을 쥐던 것입니다. 걸리면 `agent_stream_idle` 오류와 함께 심의가 서버에서 계속 돌 수 있다고 알립니다."
      - "심의 전 도우미(좌석 발굴·화두 제안·되묻기·VOC 미리보기)와 전문가 상세·지식카드·그림 프록시 등 비스트리밍 프록시 여덟이 에이전트 서버 응답을 600초까지만 기다립니다(`AGENT_UNARY_TIMEOUT_S`). 넘으면 종전 폴백으로 진행하고 `agent_timeout` 과 경고 로그를 남깁니다. 느린 서버가 브리프의 스피너를 nginx 가 끊을 때까지 돌렸습니다."
      - "nginx 의 `/agent/` 읽기 침묵 한도를 1시간에서 14시간(`NGINX_AGENT_READ_TIMEOUT`, 기본 50,400초)으로 올리고 MCP 쪽(`NGINX_MCP_READ_TIMEOUT`, 기본 1시간)과 함께 손잡이로 냈습니다. 연결 한도는 300초에서 10초로 줄였고, 모양이 틀리거나 0 인 값은 버리고 기본값으로 만듭니다. 순서는 포털 릴레이 46,800초 < nginx 50,400초 < 리스크 앱 54,000초입니다."
      - "`start.sh` 가 포털의 챗·심의 시간 한도 넷(`AGENT_STREAM_IDLE_TIMEOUT_S`·`AGENT_UNARY_TIMEOUT_S`·`CHAT_PAT_TTL_S`·`CONV_STORE_BUSY_TIMEOUT_S`)을 값이 있을 때 컨테이너에 명시해 넘기고 예시 파일에 적습니다. `infra/.env` 에 늘려 적은 값이 닿을 길이 상속뿐이었습니다."
      - "`CHAT_PAT_TTL_S` 가 발급 창(30분) 이하면 쓰지 않고 기본값(24시간)으로 읽으며, 버린 값과 가장 긴 실행(46,800초)보다 짧은 값은 기동 로그와 `/health/ready` 로 알립니다. 0 을 '만료 없음' 으로 적은 박스의 모든 챗·심의가 찍자마자 만료된 토큰을 받았습니다."
      - "절차 워밍업 한도를 125초에서 690초로 올렸습니다(게이트웨이 호출 상한 600 + 바깥 기한 60 + 여유 30). 게이트웨이 상한이 600초가 되면서 워밍업이 콜드스타트를 흡수하기 전에 먼저 끊을 수 있었습니다. 단계 상한(30·110초)은 그대로입니다."
  - date: 2026-10-08
    title: "**update-all 게이트웨이 점검** — 빠진 백엔드 · 옛 항목 · 사람별 위임을 맞춥니다"
    tag: 기술
    items:
      - "Knox 브리지(형제 리포와 그 비밀 파일)가 있는 박스에서는 게이트웨이 `knox-bridge` 백엔드를 기대합니다. config 에서 빠져도 '빠진 백엔드 없음' 으로 초록이었고, 그 사이 챗의 메일·메신저 도구 6개가 통째로 사라질 수 있었습니다. 없는 박스는 '안 켠 기능(○)' 으로 남깁니다."
      - "ARP 토큰이 게이트웨이 config 의 `arp` 항목에 실려 있지 않으면 재프로비저닝합니다. 옛 프로비저너가 토큰 없이 등재한 항목 때문에 토큰을 적어도 `arp` 가 401 인 채 남았습니다. 재프로비저닝 뒤에도 안 실리면 누락으로 셉니다."
      - "게이트웨이가 이제 빼는 옛 항목(옛 기본 주소의 `smart-twin-mcp` · 토큰 없는 `arp`)이 config 에 남아 있으면 재프로비저닝을 한 번 돌립니다. 반영 뒤에도 가짜 DOWN 과 거꾸로 된 안내가 남던 것입니다. 옛 주소에 듣는 것이 있거나 ARP 주소가 config 에만 있으면 걷어내지 않고 알립니다."
      - "ARP 토큰은 있는데 주소를 모르는 박스도 '안 켠 기능(○)' 으로 남깁니다. 기대하지 않아 빠져도 재프로비저닝이 돌지 않는데 아무 말이 없었습니다."
      - "일반 앱의 사람별 위임(`PER_USER_SSO_APPS`)을 게이트웨이 프로비저닝까지 나릅니다. 접두마다 `<접두>_SSO_SECRET`·`_SSO_URL` 을 재프로비저닝 서브셸 안에서만 넘기고, 위임이 없거나 비밀·주소가 다르면 재프로비저닝을 당깁니다. 그동안은 손으로 돌릴 때만 켜졌습니다."
      - "목록에서 뺀 일반 앱의 위임을 끄도록 그 이름을 게이트웨이에 넘기고, 일반 앱을 끌 때는 그 앱에 맞는 말로 알립니다(비밀은 게이트웨이 `provision.env` 에 있고 끄면 서비스 계정으로 돌아갑니다). 걷어낸 앱에 옛 비밀로 계속 사람별 토큰을 청하던 것입니다."
  - date: 2026-10-08
    title: "**AI Ready Portal 타일·nginx 라우트** — 라우트 없는 박스에서 숨기고 큰 업로드를 받습니다"
    tag: 기술
    items:
      - "jwt-handoff 타일에도 `hide_unless_routed` 를 허용하고, AI Ready Portal 타일은 라우트(`aireadyportal=`)가 있는 박스에서만 켭니다. 라우트가 없는 박스에서 타일이 켜진 채 보이고, 누르면 포털 자신이 토큰을 받아 새 탭에 405 가 떴습니다."
      - "로그아웃 때 쳐야 할 하위 서비스 목록에서 이 박스에 라우트가 없는 타일을 뺍니다. 매 로그아웃마다 포털 자신이 405 로 받아 경보가 울렸습니다. 같은 콜백을 쓰는 두 타일 때문에 같은 주소가 두 번 실리던 것도 한 번으로 줄였습니다."
      - "update-all 1f 가 ARP 타일 라우트가 없거나 `ARP_HOST` 와 다른 서버를 가리키면 ⚠ 로 알립니다. 라우트는 nginx 생성기와 같은 방식(키 둘레 공백 허용, 키를 정의한 첫 파일에서 멈춤)으로 읽습니다(같은 날 멀쩡한 라우트에 매 실행 '없다' 경고가 뜨던 것을 고쳤습니다)."
      - "update-all 1f 가 ARP 타일 주소를 `systems.local.yaml` 에 쓰지 않습니다. 타일 id 가 바뀐 뒤 매 실행 고아 `arp:` 를 다시 써 재기동 지문만 흔들었습니다."
      - "nginx 생성기가 `odb-hub` 에 큰 업로드 묶음(2048m · 스트리밍 · 600초)을, `aireadyportal` 에 본문 상한 없음 · 버퍼링 끔 · 읽기 3,600초를 붙입니다. ODB++ 업로드가 /tmp 에 버퍼링되고 ARP 6GB 업로드가 413 으로 잘리던 것입니다. 전역 상한(2048m)은 그대로입니다."
      - "nginx conf 생성기의 ✗·⚠ 줄을 update-all 화면에도 올리고, `backend/.env` 를 읽지 못해도 코드 기본값으로 견주어 conf 를 만듭니다. 버린 손잡이 값 경고가 운영 박스에서는 한 번도 보이지 않았고, 참고용 알림이 정문 conf 생성을 조용히 멈출 수 있었습니다."
  - date: 2026-10-08
    title: "**포털 기동·프록시 우회 점검** — 신원 설정을 명시해 넘기고 NO_PROXY 를 httpx 처럼 판정합니다"
    tag: 기술
    items:
      - "`start.sh` 가 고정 관리자(`PORTAL_ADMIN_EMAILS`)와 SSO 기본 소속(`SSO_DEFAULT_AFFILIATION`)을 값이 있을 때 컨테이너에 명시해 넘기고, 새 설정 넷(`PORTAL_ADMIN_EMAILS`·`SAML_ATTR_DEPT_ID`·`SAML_ATTR_SABUN`·`SSO_DEFAULT_AFFILIATION`)을 예시 파일에 적습니다. 상속이 끊기면 `infra/.env` 에 적힌 값이 조용히 꺼졌습니다."
      - "모양이 틀린 `RA_HOST`·`ARP_HOST` 는 포털의 NO_PROXY 에 더하지 않습니다. 같은 날 넣은 NO_PROXY 자동 맞춤에서 주소 한 줄의 오타로 포털이 아예 뜨지 않던 것을 고쳤습니다."
      - "`check-egress.sh --internal` 이 이 박스가 부르는 다른 서버(`RA_HOST`·`ARP_HOST`·원격 라우트·`TESTSCOPE_BASE_URL`)를 설정에서 유도해, NO_PROXY 에 없으면 설정 이름으로 경고하고 update-all §6 이 그것을 부릅니다. 예전에는 루프백 둘만 봤고 부르는 자리도 없어, RA 호출이 사내 프록시를 타 403 이 났을 때도 점검은 초록이었습니다."
      - "`check-egress` 가 NO_PROXY 를 httpx 가 읽는 대로 판정합니다. 대역·`*.도메인`·공백 구분 항목은 덮인 것으로 보지 않고, 포트가 붙은 항목은 그 포트로 가는 호출만 덮으며, `NO_PROXY`·`no_proxy` 가 다르면 소문자를 먼저 읽고 다르다고 알립니다(같은 날 처음 넣은 판정이 그런 항목을 덮인 것으로 봐 프록시로 새는 호출에 초록을 내던 것을 고쳤습니다)."
  - date: 2026-10-08
    title: "**권한 표·계정 원장** — 박스 파일 실수를 알리고 사번으로 정지를 봅니다"
    tag: 기술
    items:
      - "SSO 정지를 사번으로도 봅니다(`SAML_ATTR_SABUN`). 켜면 사번을 원장 `sabun` 칸에 적고, 같은 사번의 정지된 행이 있으면 로그인을 거절해 접속 이력에 `sso:disabled:sabun` 을 남깁니다. 정지된 사람이 다른 메일 Claim 으로 들어오면 active 새 행이 생겨 그대로 로그인됐습니다."
      - "계정 원장을 열 때 칸 추가가 '이미 있는 칸' 이 아닌 이유(예: 다른 프로세스의 쓰기 잠금)로 실패하면 삼키지 않고 기동을 멈춥니다. 칸 없이 기동해 사용자 목록이 500 이고 SSO 원장 쓰기가 로그인마다 실패할 수 있었습니다."
      - "정지·재활성화·승인의 '누가 누구를' 을 WARNING 으로 남기고 승인 줄에 준 역할을 싣습니다. 포털은 INFO 로그를 버려 이 기록이 어디에도 없었습니다."
      - "`access.local.yaml` 이 같은 id 로 추적 플랫폼을 통째로 바꿔 쓰면서 그 타일·백엔드가 어느 항목에도 남지 않으면 관리자 화면의 배선 설정에 알립니다. 표에서 빠진 타일은 모두에게 보이고 게이트웨이는 그 백엔드를 전체 공개로 보는데 조용했습니다. 안내 문구에도 '같은 id 는 통째로 바꾼다' 를 적었습니다."
      - "배선 설정에 새 확인(`tiles_in_access_table`)을 두어, 권한 표의 어느 플랫폼에도 없는 타일을 관리자에게 띄웁니다. `systems.local.yaml` 로 타일만 붙이면 권한과 무관하게 모두에게 보이는데 알릴 자리가 없었습니다."
      - "`systems.local.yaml` 에서 매핑이 아닌 항목(예: `<id>: <주소>`)을 버릴 때 어느 id 를 버렸는지와 맞는 모양을 WARNING 으로 남깁니다. 버린 주소는 싣지 않습니다."
      - "배선 설정의 'ste 를 smarttwin 허가에' 확인이 떠 있는 포털에서 늘 unknown 이던 것을 고쳤습니다. 확인이 정책 로더에 없는 속성을 읽어 예외가 삼켜졌고, 시험은 그 속성을 가진 대역으로 초록이었습니다."
      - "헬스게이트가 권한 표에 없는 게이트웨이 백엔드를 찾으면 박스 전용 백엔드는 `backend/config/access.local.yaml` 에 적으라고 함께 안내합니다. 종전 안내는 박스 사정을 추적 파일에 적게 이끌었습니다."
  - date: 2026-10-08
    title: "**관리자 화면 동작** — 관리자 지정 확인 · 미지정 필터 해제 · 접속 이력 라벨"
    tag: 기술
    items:
      - "관리자 스위치를 켜는 쪽도 확인창을 거칩니다. 문구에 되돌릴 때 그 사람의 개인 토큰이 전부 폐기된다는 것을 적습니다. 예전에는 한 번 잘못 누르면 곧바로 전권이었습니다."
      - "'소속 미지정만 보기' 는 미지정이 0명이 되면 값도 끕니다. 나중에 누가 미지정이 되는 순간 손대지 않은 필터가 다시 걸려 표가 한 줄로 접혔습니다."
      - "접속 이력에서 정지된 계정의 SSO 줄(`sso:disabled`)에 'SSO — 정지된 계정' 라벨을 붙입니다. 그 줄만 코드 원문으로 나왔습니다."
      - "접속 이력 사유 문장(`detailText`)을 `frontend/src/lib/accessDetail.ts` 로 떼고, 소속 미지정 판정·관리자 스위치의 여덟 갈래·사유 문장을 node 로 실제로 돌리는 시험을 더했습니다. 화면 쪽 판정은 타입 검사와 린트뿐이었습니다."
  - date: 2026-10-08
    title: "**심의 포털 계약·화면 문구** — 엔진 키 중계 · 알림 카드 · 핸드오프 근거 상한"
    tag: 기술
    items:
      - "포털 심의 스키마(`DelibOpts`)에 엔진이 새로 받는 키 둘(`persona_knowledge`·`sealed`)을 선언했습니다. 포털을 거치는 길(웹·리스크 앱 러너)에서만 말없이 사라져, 봉인을 청한 심의가 열린 채 돌 수 있었습니다. 엔진이 요청에서 읽는 키(33개)를 포털 선언과 대조하는 계약 시험을 두었습니다."
      - "엔진이 알림으로 표시한 근거 카드(`notice`)는 '좌석에 주지 않음' 이 아니라 '알림' 으로 부릅니다. 의장 입력을 줄였다는 알림이 좌석이 못 받았다는 말로 읽혔습니다."
      - "브리프에서 고른 VOC 와 대화 근거를 합칠 때(`mergeEvidence`) 12건에서 자르지 않고 근거 상한 상수(`EVID_ITEMS`)를 씁니다. 근거 칸을 120 으로 올린 것이 웹 핸드오프에만 닿지 않았습니다."
      - "챗의 LLM 응답이 한도에 걸렸을 때 심의 손잡이(`timeout_s`·`DELIB_TIMEOUT_S`)를 올리라고 안내하지 않습니다. 엔진 글의 `LLM_TIMEOUT_S` 가 심의 한도 갈래에 걸려 챗 사용자에게 엉뚱한 손잡이를 권했습니다."
      - "좌석 상한 계약 시험이 엔진의 기본값(`DELIB_MAX_SEATS`, 20)을 읽게 고치고, 사람 의견(`human_note`) 상한 계약 시험을 더했습니다(엔진 기본값 2,000자가 포털 상한 8,000자를 넘지 않는지 봅니다). 좌석 상한 시험은 엔진이 설정으로 바뀐 뒤 '못 찾았다' 로 죽어 있었습니다."
  - date: 2026-10-08
    title: "**심의 워크플로(Claude Code)** — 의장 출력 형식 · 버린 근거 기록 · 브리프 토큰 안내"
    tag: 기술
    items:
      - "`hwax-deliberate.js` 에서 의장에게 [출력 형식] 지시가 한 번도 가지 않던 것을 고쳤습니다. 프롬프트 두 조각 사이가 쉼표라 옵션 자리로 들어갔고, 마커를 못 들은 의장의 결정문이 '절단 의심' 으로 올라와 리스크 심사 패널이 제출되지 않을 수 있었습니다."
      - "워크플로가 줄여 실은 근거(앞 2,000자)·본문 후보가 여럿이던 근거·키 없는 좌석을 반환값(`inputNotices`)과 원장에 남기고, 키 없는 좌석은 앉히지 않습니다. 예전에는 'undefined' 라는 좌석이 끝까지 돌거나 null 한 줄이 워크플로를 통째로 죽였습니다."
      - "`hwax-risk-review.js` 가 근거 키를 자식 심의까지 넘겨 좌석 인용이 [e:N|KEY] 로 찍히고, 자식 심의가 버린 근거와 앱이 뺀 것을 제출 기록·보존분에 남깁니다."
      - "리스크 심사 MCP 길이 좌석에 못 간 근거를 제출 도구(`evidence_omitted`)에 실어 보냅니다. 받는 자리만 생기고 보내는 쪽이 없어 원장의 품질 플래그가 비었습니다."
      - "리스크 심사 오케스트레이터가 브리프 토큰 만료를 알릴 때 수명(기본 900초)과 손잡이(`HWAXRISK_BRIEF_TOKEN_TTL_S`)를 함께 말하고, 엔진 길로 손수 돌린 패널은 `deliberate_transcript(full=true)` 로 받으라고 안내합니다. 줄인 글을 내면 뒤쪽 인용이 원장에서 사라집니다."
  - date: 2026-10-08
    title: "**HE팀 페르소나 정본** — 게이트웨이 도구 이름과 심의 안내를 지금 계약대로"
    tag: 기술
    items:
      - "`he-team.json` 이 ste 와 이름이 겹치는 도구 셋(`heaxstep_forge_list_jobs`·`smarttwinmcp_submit_job`·`reportarchive_prepare_upload`)을 게이트웨이의 접두 이름으로 적고, 동기화(`sync-he-personas.py`)는 접두 이름을 언제나 받는 호출 별칭으로도 맞춥니다. 겹치는 상대가 있거나 없는 박스에서 동기화가 '이 앱에 없는 도구' 로 통째로 멈췄습니다."
      - "심의 운영자 페르소나가 대기열(`queued` 면 다시 시작하지 말고 순번을 알린다)·내 심의만 접을 수 있음·근거 상한(`deliberate_jobs` 의 limits)을 엔진의 지금 계약대로 안내합니다. 줄 선 심의를 실패로 읽고 다시 시작하게 이끌었습니다."
      - "심의 운영자 페르소나가 좌석 상한을 '최대 20석' 으로 박아 두지 않고 `deliberate_jobs` 의 `limits.seats` 를 가리킵니다. 상한을 올린 박스에서 21·22석 패널을 줄이거나 거절하게 이끌었습니다. 반영은 박스마다 `python3 infra/scripts/sync-he-personas.py --apply` 입니다."
  - date: 2026-10-08
    title: "**설정 예시·킷 안내·주석** — 손잡이를 적고 낡은 안내를 걷었습니다"
    tag: 기술
    items:
      - "에이전트 서버 킷(`infra/env-kits/agent-server.env`)에 엔진의 새 손잡이(`DELIB_JOB_MAX_RUNNING`·`DELIB_JOB_MAX_RUNNING_PER_USER`·`DELIB_JOB_QUEUE_MAX`·`DELIB_KNOWLEDGE_SYNTHETIC_SEATS`·`DELIB_KNOWLEDGE_CONCURRENCY`·`DELIB_MAX_SEATS`·`DELIB_EVID_ITEMS`·`DELIB_HUMAN_NOTE_MAX`·`DELIB_DECISION_CTX`·`DELIB_CHAIR_RESERVE`)를 주석으로 적었습니다. 코드 주석에만 있었습니다."
      - "같은 킷에 재기동 전 심의 수를 묻는 한도(`AGENT_HEALTH_PROBE_S`, 기본 3초)를 적고, 엔진의 시간 한도 손잡이가 킷에 빠짐없이 있는지 시험이 묻습니다."
      - "예시 설정에서 mock 사용자가 `MOCK_USER_GROUPS` 로 관리자가 된다는 안내를 걷었습니다(관리자는 원장과 `PORTAL_ADMIN_EMAILS` 만 봅니다). ARP 타일 목적지가 `systems.local.yaml` 이 아니라 `routes.local.env` 의 `aireadyportal=` 이라고 바로잡았습니다."
      - "update-all 머리의 `provision.env` 준비물 목록에 `SMARTTWIN_MCP_URL`·`PER_USER_SSO_APPS` 를 적었습니다. §5 가 읽는데 운영자가 보는 목록에 없었습니다."
      - "절차 판정기(`judge.py`)의 '불통' 갈래 주석을 바로잡고, 게이트웨이의 시간 초과 문구 넷을 원문에서 꺼내 판정해 보는 시험을 포털 쪽에도 두었습니다. 느린 도구의 시간 초과를 '불통' 으로 읽으면 절차가 600초짜리 쓰기를 다시 보냅니다. 동작은 바꾸지 않았습니다."
      - "주석의 사실을 바로잡았습니다. 심의 호출당 타임아웃은 엔진이 죄면 카드와 잡 기록에 남긴다는 것, RA 위임 경로에서도 `X-Workspace-Slug` 를 싣는 까닭, 의장 쉼표 결함의 근거(블록을 넣은 뒤의 실행 넷)입니다."
      - "주석·안내 문구에서 쌍점으로 끝난 한국어 문장을 고쳤습니다(대화 저장·오류 문구·절차 판정·update-all·배포 스크립트·심의 파이프라인·시험 설명)."
  - date: 2026-10-08
    title: "**에이전트 서버** — LLM·도구·지식카드 호출의 시간 한도와 생존 신호를 설정으로 뺐습니다"
    tag: 기술
    items:
      - "설정이 없으면 시간 한도가 아예 없던 LLM 호출에 기본값(심의 1,800초·챗 900초·연결 10초)을 걸고, 심의의 SDK 재시도를 1회로 줄였습니다. 챗 스트리밍 청크 침묵 한도는 `LANGCHAIN_OPENAI_STREAM_CHUNK_TIMEOUT_S`(기본 300초, 라이브러리 기본은 120초)로 내보냅니다."
      - "요청의 호출당 타임아웃을 10~1,800초로 말없이 죄던 상한을 `DELIB_TIMEOUT_MAX_S`(기본 14,400)로 빼고, 죄었으면 카드와 잡 기록에 남겨 이어하기가 이어받습니다. 엔진의 도구 호출 1건에는 MCP 세션 요청 기한 `MCP_CALL_TIMEOUT_S`(900초)를 걸고, 좌석 지식카드 조회 한도 `KNOWLEDGE_TIMEOUT_S` 는 120초에서 180초로 올렸습니다(AIDataHub 의 `DB_POOL_TIMEOUT` + `AIDH_SEARCH_STATEMENT_TIMEOUT_S` 보다 커야 합니다)."
      - "심의 스트림이 이벤트가 없는 동안에도 `DELIB_HEARTBEAT_S`(기본 15초)마다 ping 을 흘립니다. MCP 진행 조회에는 마지막 이벤트 뒤 경과(`idle_s`)·그 이벤트(`last_step`)·조용해도 되는 시간(`quiet_ok_s`)을 싣고, `quiet_ok_s` 와 heartbeat 를 끈 박스의 경고는 좌석 발언 하나의 침묵((1 + 파싱 재시도) × 호출 한 번의 최악)으로 잽니다."
      - "의장 결정문 호출이 실패하면 `DELIB_CHAIR_RETRIES`(기본 1)만큼 다시 부르고, 그래도 안 되면 좌석별 마지막 입장과 회의록을 남기고 `chair_failed` 로 끝내 이어갈 수 있게 합니다."
      - "좌석 유실·LLM 연결 시간 초과 알림에 걸린 한도·시도 횟수·예외 종류를 사유별로 적고, 올릴 설정을 `knob` 으로 싣습니다. 지식카드 조회가 한도에 걸려 강등돼도 어느 설정인지 싣습니다."
      - "도는 중에 사용자 토큰이 만료돼 거절(401)된 호출을 서비스 계정으로 한 번 더 하고 자격 강등을 알립니다."
      - "게이트웨이 `/tools-map` 조회 실패를 60초 캐시해, 매달린 게이트웨이를 도구마다 5초씩 다시 물어 이벤트 루프가 통째로 멈추던 것을 막았습니다. `/v1/models` 조회 실패는 기본값(128K)으로 굳히지 않고 60초 뒤 다시 묻습니다."
  - date: 2026-10-08
    title: "**에이전트 서버** — 심의가 줄이거나 뺀 요청 값·근거·좌석을 카드와 진행 조회로 남깁니다"
    tag: 기술
    items:
      - "근거 항목을 항목 상한에서 줄여 실으면 카드와 잡 원장에 남기고, 본문 후보 키가 여럿이면 실은 키와 뺀 키를 카드로 알립니다."
      - "요청에 실린 이전 요약·양보 불가 조항·후보안·지정 도구·앱·좌석을 상한에서 줄였으면 카드로 알립니다."
      - "좌석 유실·지정 도구 미실행·앱 범위 제한 불가·직전 라운드 절단이 상태줄 한 줄뿐이라 결과를 받을 때는 사라져 있던 것을 카드로도 남깁니다."
      - "MCP 진행 조회에도 경고를 싣고, 창 밖으로 밀려난 경고·상태줄은 전체 수로 남깁니다. '좌석에 주지 않은 근거' 는 앞 30건에 마지막 5건을 더해 맨 끝의 '의장 전사 상한 초과' 가 빠지지 않게 하고 사이에서 빠진 수를 적으며, 원장의 제외 카드 글을 자르면 원문 길이를 함께 적습니다."
      - "`deliberate_start` 의 근거 안내(낡은 '항목당 12,000자')와 메뉴의 지정 도구·앱·후보안 상한(≤6·≤3·≤8)을 손으로 적지 않고 엔진 상수에서 읽어 만듭니다."
      - "웹 화면 알림 카드에서 설정·필드 이름을 빼 잡 원장에만 붙이고, 의장 전사 카드는 알림으로 표시합니다. '공용 근거 … 예산 밖 N건 생략' 상태줄은 주입한 근거가 잘린다는 말로 읽혀 '다른 좌석의 조회 결과' 로 바꿨습니다."
  - date: 2026-10-08
    title: "**에이전트 서버** — 좌석 지식카드 조회·지정 도구·전사 예산을 다시 나눴습니다"
    tag: 기술
    items:
      - "합성 지정석(반대석 등)에는 지식카드를 묻지 않습니다. 매번 404 였고 그 오류가 80자에서 끊겨 다른 버그로 읽혔습니다. AIDataHub 에 등록한 합성 좌석은 `DELIB_KNOWLEDGE_SYNTHETIC_SEATS` 에 키를 적어 좌석 키 단위로 되살리고, 묻지 않은 좌석은 한 줄로 밝혀 '2/2명 확보' 가 전원에게 물은 것으로 읽히지 않게 했습니다."
      - "좌석 지식카드 조회를 한꺼번에 쏘지 않고 `DELIB_KNOWLEDGE_CONCURRENCY`(기본 6)로 묶으며, 띵킹 예심 조회도 같은 상한을 씁니다. 심의가 접히면 아직 안 끝난 조회도 접습니다."
      - "좌석 지식카드 조회를 요청 단위로 끄고 켭니다(`persona_knowledge`). 종전에는 환경변수뿐이라 한 심의만 끄려면 서버를 다시 띄워야 했습니다."
      - "지정 좌석의 역할 원문을 좌석 수만큼 직렬로 받던 것을 지식카드 조회와 같은 수로 한꺼번에 받고, 좌석마다 줄을 내며 못 받은 좌석을 말합니다."
      - "지정 도구 결과를 이어 붙여 5,000자에서 자르던 것과 인자 계획자가 앞선 결과를 앞 2,000자만 받던 것을, 도구마다 같은 몫으로 줄이고 줄였으면 글과 상태줄로 알리게 했습니다."
      - "의장 전사 상한을 모델 컨텍스트에서 유도하고(종전 라운드마다 6,000자) LLM 의 `max_tokens` 를 출력 몫으로 뺍니다. 줄일 때는 좌석마다 같은 몫으로 줄이되 짧은 발언이 안 쓴 몫은 긴 발언에 돌리고, 발언 항목마다 700자에서 끊던 것도 걷어 끊었으면 좌석이 쓴 길이로 화면·잡 원장에 알립니다."
      - "구조화에 실패한 좌석의 원문(say)도 다른 값과 같은 상한을 탑니다(종전 표식 없이 800자). 다른 좌석의 조회 결과 예산은 고정값이 아니라 풀이 쌓이는 만큼 라운드에 비례해 늘립니다."
      - "좌석 상한을 `DELIB_MAX_SEATS`(기본 20)로 빼 21·22석 패널이 코드 수정 없이 돕니다. 지정 반대석은 좌석 상한에 세지 않아, 꽉 찬 패널을 이어갈 때마다 '상한을 넘겨 뺐다' 고 적던 것을 고쳤습니다."
  - date: 2026-10-08
    title: "**에이전트 서버** — 심의 잡 대기열·동시 실행 상한·재기동 판정과 설정 값 읽기"
    tag: 기술
    items:
      - "동시 실행 상한에 걸리면 거절하지 않고 줄을 세웁니다(`DELIB_JOB_QUEUE_MAX`, 기본 20 · 0 이면 종전처럼 거절). 사용자별 상한 `DELIB_JOB_MAX_RUNNING_PER_USER`(기본은 전역과 같음)를 두고, 거절할 때는 어느 상한인지와 제 잡·건수만 싣습니다(종전에는 남의 잡 id 를 전부 보였습니다)."
      - "심의 MCP 의 동시 실행·대기열·전사 설정 값이 숫자가 아니면 MCP 가 통째로 떨어지던 것을 경고하고 기본값으로 읽으며, `DELIB_JOB_MAX_RUNNING` 이 0 이하이면 기본값(2)으로 읽습니다."
      - "에이전트 서버 `/health` 가 진행·대기 심의 수를 주고, `start.sh` 는 심의가 있으면 떠 있는 서버를 내리지 않고 나갑니다(강행은 `AGENT_RESTART_FORCE=1`). 숫자로 못 읽는 `AGENT_STOP_GRACE_S`·`AGENT_HEALTH_PROBE_S` 는 경고와 함께 기본값으로 읽어, 옛 서버만 내리고 끝나거나 도는 심의를 끊던 것을 막습니다."
      - "서버가 내려가는 동안에는 줄 선 심의에 자리를 넘기지 않습니다. 예전에는 떴다가 결정문 없는 done 으로 남았습니다."
      - "이어하기가 이전 회차의 봉인과 유입 손잡이를 이어받습니다. 봉인으로 돈 심의는 봉인으로만 이어지고 끄고 돈 손잡이는 꺼진 채 이어집니다. 봉인이 닫는 빈 목록은 요청마다 새로 만들어 표의 목록 한 객체를 잡 기록들이 함께 물던 것을 고쳤고, 봉인 안내 문장의 쌍점도 줄표로 바꿨습니다."
      - "시험이 실 잡 원장에 쓰지 못하게 `conftest.py` 가 원장 경로를 세션 내내 임시 디렉터리로 돌려 둡니다. 시험이 끝난 뒤 도는 뒷정리가 실 원장에 기록을 썼습니다."
  - date: 2026-10-08
    title: "**MCP 게이트웨이** — 백엔드 탐침·첫 연결·토큰 검증이 게이트웨이를 세우지 않습니다"
    tag: 기술
    items:
      - "생사 탐침이 한 번 놓쳤다고 세션을 갈지 않고, 갈 때는 그 세션에 걸린 호출을 곧바로 풀어 줍니다. 재집계의 무응답은 횟수로 세지 않아 20초 남짓 바빴던 백엔드가 '연속 2회' 로 갈리지 않습니다."
      - "백엔드의 첫 핸드셰이크에 탐침과 같은 기한을 겁니다. 연결만 받고 답하지 않는 백엔드 하나가 부팅과 재활 패스 전체를 세웠습니다."
      - "포털 키 조회를 5초 한도로 이벤트 루프 밖에서 합니다. 포털이 매달리면 게이트웨이 전체가 30초씩 멈췄습니다."
      - "호출 한도와 재연결 한도에 0 이하를 적으면 기본값으로 돌고, 이 프로세스에 실제로 걸린 시간 한도를 기동 때 한 줄로 남깁니다. 예전에는 0 을 '끔' 으로 적으면 백엔드에 닿기도 전에 모든 도구 호출이 실패했습니다."
      - "`save_conversation` 이 포털의 확인을 15초가 아니라 120초 기다립니다. 수 시간짜리 심의 전사를 남기는 쓰기가 느린 포털에서 조용히 빠지던 것을 막습니다."
      - "PAT 에 박힌 `portal-admin` 을 하위로 넘기지 않고 포털이 지금 관리자라고 답할 때만 붙이며, REST 프록시(`/api`)도 같은 규칙을 씁니다. 포털이 거두었다고 알린 답과 직전 값의 관리자 표지는 포털 불통 때 되살리지 않습니다."
      - "도구 영역 정본에 quality 영역과 plm-defect·knox-bridge 기본값을 넣고(박스에만 있던 분류) bridge_* 미분류를 걷었습니다."
  - date: 2026-10-08
    title: "**MCP 게이트웨이 프로비저닝** — 사람별 위임 순회 · 조건부 등재 · 사내 주소 제거"
    tag: 기술
    items:
      - "`PER_USER_SSO_APPS` 를 일반 순회해 여섯 번째 앱부터 `provision-config.sh` 를 고치지 않습니다. 한 키를 두 번 적으면 먼저 적힌 쌍만 쓰고, 순회가 쓴 항목에 `managed_by` 표지를 남겨 목록에서 뺀 앱도 `PER_USER_SSO_OFF` 로 끌 수 있게 했습니다."
      - "위임 토큰의 수명(`expires_in`)이 호출 한도(`GATEWAY_CALL_TIMEOUT`)보다 길지 않으면 발급 때 경고합니다. 값이 다른 리포에 있어 어긋나도 아무도 모르던 계약입니다."
      - "smart-twin-mcp 는 주소가 설정된 박스에서만, arp 는 주소와 토큰이 둘 다 있을 때만 등재하고 토큰을 싣습니다. 예전에는 띄운 적 없는 박스·인증을 켠 ARP 에 가짜 DOWN 이 남았습니다. arp 가 토큰이 없어 빠질 때는 주소도 함께 사라진다고 말하고, 토큰만 있고 주소를 모르는 실행도 조용히 넘기지 않습니다."
      - "프로비저너에 기본값으로 박혀 있던 ODB 자동화 허브의 사내 주소를 걷고, 주소를 `ODB_HUB_BASE` > 직전 config > 없음 순으로 읽습니다. 토큰만 있고 주소를 모르면 만들지 않고 말합니다. ARP 주석의 사내 IP 예시도 자리표시자로 바꿨습니다."
      - "포털 update-all 이 글자로 읽는 프로비저너의 조건식 두 줄 위에 그렇다고 경고 주석을 달았습니다. 모르고 고쳐 쓰면 옆 리포의 재프로비저닝 방아쇠가 조용히 꺼집니다."
  - date: 2026-10-08
    title: "**AIDataHub** — DB 풀·연결·검색·health 에 한도를 걸고 손잡이를 말합니다"
    tag: 기술
    items:
      - "커넥션 풀을 SQLAlchemy 기본값(5+10·대기 30초)에서 12+8·60초로 올리고 env 손잡이 셋으로 뺐습니다. 풀 대기 만료 문구는 무엇을 올릴지(`DB_POOL_TIMEOUT`·`DB_POOL_SIZE`) 말합니다."
      - "죽은 PG 를 60초 기다리던 연결에 한도 10초(`AIDH_DB_CONNECT_TIMEOUT_S`)를 걸고, 만료 문구가 손잡이를 말합니다."
      - "검색 트랜잭션에 문장 한도 90초(`AIDH_SEARCH_STATEMENT_TIMEOUT_S`)를 걸어 멈춘 쿼리가 풀 자리를 끝없이 쥐지 않습니다."
      - "`/api/system/health` 의 게이지 쿼리를 2초(`AIDH_HEALTH_GAUGE_TIMEOUT_S`)로 묶어 health 가 DB 만큼 느리지 않습니다."
      - "watchdog 은 연결 거부면 곧바로, 시간 초과는 연속 3회 뒤에만 재기동합니다. 바쁜 API 를 죽은 것으로 보고 재기동하던 것을 고쳤고, 'watchdog 도 /health 를 찌른다' 는 틀린 안내를 바로잡았습니다(watchdog 은 `/api/system/health` 를 5초 한도로 잽니다)."
  - date: 2026-10-08
    title: "**리스크 심사 앱** — 시간 한도 손잡이 · 패널 진행 신호 · 자격 여유"
    tag: 기술
    items:
      - "시간 한도를 환경 손잡이로 뺐습니다. `HWAXRISK_PANEL_TIMEOUT_S`(패널 벽시계, 기본 43200초)·`HWAXRISK_ENGINE_READ_TIMEOUT_S`(스트림 침묵, 54000초)·`HWAXRISK_ENGINE_BUSY_WAIT_S`·`HWAXRISK_ENGINE_BUSY_MAX_WAIT_S`(포털 429 대기 간격 30초·예산 3600초)·`HWAXRISK_SOURCE_CALL_TIMEOUT_S`(스냅샷 소스 호출 120초, 연결 10초)·`HWAXRISK_FIELD_TIMEOUT_S`(필드 근거 20초)·`HWAXRISK_ROSTER_DEADLINE_S`(명단 조회 540초)·`HWAXRISK_PORTAL_CALL_TIMEOUT_S`(패널 전 대화 생성 30초)입니다. 앱은 cleanenv SIF 라 값은 매니페스트 `launch.env` 로만 닿습니다."
      - "`McpHttpClient` 가 응답을 줄 단위로 읽으며 기한(`deadline`)을 봅니다. 게이트웨이의 15초 ping 이 침묵 한도를 되감아 필드 근거·명단 조회가 한도를 넘겨도 끝나지 않던 것을 막고, 기한을 넘긴 필드 줄은 원장(`rr_brief_calls`)에 `deadline_exceeded` 로, 명단 조회 결과는 응답의 `domains_failed`·`relevance_source`·`roster_notice` 로 남깁니다."
      - "엔진 스트림이 끊긴 까닭을 `EngineStreamLost`(침묵 `engine_silent` · 중간 절단 `engine_stream_cut` · 포털의 `agent_stream_idle`)와 `EngineError` 로 가르고, 한도 문구가 값·손잡이·경과·마지막 단계·conv_id 를 말합니다. 포털이 침묵 한도로 끊은 스트림을 패널 벽시계 초과로 적던 것은 벽시계 검사를 프레임 단계로 옮겨 고쳤습니다."
      - "러너가 도는 패널의 마지막 신호(`last_frame_at`·`last_event_at`·`last_step`)를 60초 간격으로 잡 행 `progress_json` 에 적고, `GET /targets/{key}/coverage`·`risk_get_coverage` 의 `job.signal` 이 그 패널이 도는 동안에만 서버 시계 경과(`frame_idle_s`·`event_idle_s`)와 함께 냅니다."
      - "포털 429 뒤의 재시도는 앞 시도가 만든 포털 대화를 다시 써, 패널 하나가 빈 대화를 여럿 남기지 않습니다. 패널 전 대화 생성이 끝내 실패하면 패널 품질에 `conversation_absent` 를 붙입니다."
      - "등록 PAT 는 패널 벽시계·429 예산·600초를 더한 여유(기본 47400초, `HWAXRISK_CREDENTIAL_MARGIN_S`)보다 오래 남을 때만 쓰고, 건너뛰면 잡 응답 `credential_note` 와 잡 행 오류에 까닭을 남깁니다. 요청자 자격으로 집힌 잡은 엔진에도 요청자를 넘깁니다(예전에는 늘 타깃 owner 였습니다). 이 여유가 PAT 등록 하한(86400초) 이상이면 기동을 막고, 그 문구가 손잡이를 적을 자리(매니페스트 `launch.env`)를 말합니다."
      - "스트림 침묵 한도(`HWAXRISK_ENGINE_READ_TIMEOUT_S=0`)를 끈 박스는 기동 로그에 WARNING, 벽시계까지 끈 박스는 ERROR 로 그 결과를 남깁니다. 스냅샷 `model_too_large` 안내에서 집행하지 않는 '예산 600 s' 를 뺐고, 엔진 클라이언트의 설명 문장을 다시 나눴습니다(동작은 그대로입니다)."
  - date: 2026-10-08
    title: "**리스크 심사 앱** — 브리프 E0·E9 배치 · 브리지 어댑터 · 근거 누락 기록 · 보고서 배선"
    tag: 기술
    items:
      - "브리프 E9 는 발화한 규칙을 경고보다 앞에 싣고, E0 는 결측 플래그·소스 id 줄을 줄여(1,362자 → 713자) 다른 항목이 남긴 자리를 빌립니다. 예전에는 경고가 다섯 건만 넘어도 규칙 줄이, 실제 스냅샷에서는 E0 의 결측·소스·잣대·외부 검색 네 줄이 통째로 잘렸습니다."
      - "StepForge `part_mesh_map` 을 `limit=500` 으로 청하고 잘리면 `part_mesh_truncated` 경고를 남깁니다. dyna pid 가 없는 스냅샷은 브리지 후보 경고를 행마다 쌓지 않고 `bridge_without_dyna`(INFO) 한 줄로 셉니다. 해석 파트에 크기·기하 지문이 새로 서므로 dyna 어댑터 세대를 1.1 로 올려, 고치기 전 스냅샷과의 비교가 설계 변경 대신 `parser_differs` 로 강등됩니다."
      - "패널 근거 12칸(`fit_evidence_slots`)을 넘겨 빠진 항목과 잘린 메모를 패널 `quality_json.evidence_dropped`·`user_memo_cut` 과 같은 이름의 플래그로 남기고, 브리프 응답과 잡 생성 응답에도 싣습니다. 메모 칸(M) 상한을 넘는 메모는 통째로 빠지지 않고 들어가는 만큼 실린 뒤 줄 끝에 '…(메모 N자 중 M자)' 가 붙습니다."
      - "엔진이 좌석에 주지 않았다고 알린 근거 카드(`included=false`)를 패널 `quality_json.engine_withheld` 와 같은 이름의 플래그로 옮겨 적고, `risk_submit_panel_result` 는 선택 인자 `evidence_omitted` 로 같은 기록을 받습니다(재제출이 지우지 않습니다)."
      - "브리프 항목 키(E0~E9·E0c·M)를 엔진까지 넘겨 줄 머리가 `[e:N|E3]` 로 찍힙니다. `brief_hashes` 는 키를 빼고 세어 옛 동결본이 `brief_drift` 로 적히지 않습니다. 의장이 이 표지를 cites 에 옮겨 적어도 지어낸 참조(dangling)로 세지 않고 `rr_claim_refs` 에도 앉히지 않습니다."
      - "통합 보고서의 [품질 플래그] 가 `quality_json.flags` 를 읽고(단수 `flag` 를 읽어 늘 '없음' 이었습니다), [패널] 줄은 좌석을 `seats_json.key` 로, `tool_calls_ok` 를 좌석 의견의 합으로 적습니다(좌석 도구를 세지 못하는 MCP 길은 None 으로 둡니다)."
  - date: 2026-10-08
    title: "**StepForge** — stackup_profile 응답 차례와 축 추정 비용 · 파싱 전 안내 · 잡 러너 옆자리"
    tag: 기술
    items:
      - "`stackup_profile` 응답을 판정·멈춤·축·사유·`job_call` → 단위 → 세는 칸 → 목록 순으로 내고, 이웃이 아닌 쌍의 줄이 5,000자를 넘으면 그 목록만 줄입니다. 축 추정은 정확한 상자가 벌어진 쌍의 거리를 재지 않고, 축 추정·단면·이웃 쌍의 예상 합이 60초를 넘으면 재기 전에 멈춥니다(`_CallGate`). 측정 잡이 받는 도구에 `stackup_profile` 을 더하고 부울 작업량 식을 하나(`overlap_cost` = 교차 몫 + `build_work`)로 합쳤습니다."
      - "파싱 전 형상 도구의 응답 맨 앞에 `parse_pending`(안 얹힌·파싱 뒤 바뀐 사이드카, mm 가 아닌 선언 단위)을 싣고, 표의 조용한 여덟 도구는 선행이 안 섰을 때 `empty_because` 를 냅니다. `summarize_warnings` 는 파일만 올린 과제에서 `total_unknown`·`total_why` 를 내고, 올린 사이드카의 시각은 올린 시각으로 둡니다."
      - "잡 표에 `started_before_marks`·`cancel_requested` 칸을 더하고, 러너가 아닌 서버의 취소는 요청으로 남겨 러너가 박자마다 집행합니다. pid 1 인 서버의 워커를 고아로 정리하던 것과, 빈 폴더에 동시에 뜰 때 `PRAGMA journal_mode=WAL` 에서 기동이 실패하던 것(최대 30초 재시도)을 고쳤습니다."
      - "닫힌 셸과 그 솔리드 쌍둥이가 한 합동 그룹이 되어 셸 쌍이 솔리드 쌍의 침투 행을 복제 받던 것을, 합동 서명에 품은 솔리드 수를 더해 막았습니다."
  - date: 2026-10-08
    title: "**낙하 해석 전처리(pyKooCAE)** — D2R 카드 의미 원복 · 바닥판 접촉 옵션 · 인덱스 락"
    tag: 기술
    items:
      - "`*DEFORMABLE_TO_RIGID_AUTOMATIC` 의 전환 CODE 를 매뉴얼대로 되돌렸습니다(2 = 접촉력이 0 일 때 전환, 4 = 접촉력이 있을 때 전환). 3월 말 변경이 2 와 4 를 바꿔 v110 까지 충돌 중에는 강체, 날아가는 동안에는 변형체로 전환됐습니다."
      - "D2R 을 켜면 바닥판 접촉을 면대면(S2S)으로 자동 전환합니다(매뉴얼 Remark 1 — S2S·N2S 접촉만 자동 파트 전환을 켤 수 있음). 명시 General 이면 🔴 `D2R_FLOOR_GENERAL`, 바닥판 CID 가 없으면 조용히 0장 대신 🔴 `D2R_SKIPPED` 로 알립니다. 선도 강체 파트 `D2RLrb`(시나리오 `deformable_to_rigid.lrb`)를 열어 파트 간 CNRB 가 있는 모델의 Error 30164 를 피합니다."
      - "D2R 세부 8필드(time1~3·nrbf·ncsf·rwf·dtmax·offset)를 KMM 키 `D2RTime1`… 와 시나리오 `deformable_to_rigid` dict 로 열었습니다. 작은 값이 `>10.1f` 포맷에서 0 으로 사라지거나 `.1e` 로 반올림되던 것은 손실 없는 최단 지수표기로 고쳤고, 기존 토큰(1.0e+20 등)은 바이트 그대로 둡니다."
      - "바닥판 접촉에 `DropContact.InheritGeneral`(원본 GENERAL 값 상속 — OptCardA 8필드 포함, robust_contact 가 강제하는 SOFT·DEPTH 가 우선)·`DropContact.Type`(SurfaceToSurface 선택)·`DropContact.Scope`(All 이면 전 파트)를 더했습니다. 키와 시나리오 별칭은 대소문자·밑줄을 가리지 않고, 조합 C·GEN 바닥판의 마찰·감쇠 값도 명시값을 따릅니다."
      - "`*HOURGLASS` 가 첫 블록의 첫 줄만 읽고 하나만 쓰던 것을 전 블록·전 줄로 고쳤고(입력·등록 개수가 다르면 🔴 로그), 덱에 `*CONTROL_HOURGLASS` 가 있으면 `ControlHourglass` 옵션이 말없이 무시되던 것을 옵션 우선으로 바꿨습니다."
      - "러너의 `simulation_index.json` 락에서 타임아웃 때 락 파일을 지우고 다시 열어 상호배제가 깨지던 것을 없앴고(`_open_lock` — O_RDWR|O_CREAT, 0664), NFSv4 soft 마운트에서 open state 를 잃어 나는 EBADF 는 같은 경로를 다시 열어 최대 3회 재시도합니다."
  - date: 2026-10-07
    title: "**리스크 심사** 화면을 새로 정돈했습니다 — 사이드바 · 빠른 찾기"
    tag: 수정
    items:
      - "위쪽 링크 넷이던 화면을 사이드바와 아이콘으로 바꿨습니다. 좁은 화면에서는 사이드바가 위쪽 줄로 접힙니다."
      - "Ctrl+K(맥은 ⌘K)로 과제·스냅샷·심사 대상·비교를 찾아 바로 엽니다."
      - "과제 카드가 이름·소스 연결 상태·열린 대상과 커버리지를 먼저 보여 줍니다. 아직 재지 않은 커버리지는 0 이 아니라 '—' 로 보입니다."
      - "설정 화면이 등록한 개인 토큰의 상태를 폐기·만료·곧 만료·정상으로 가려 보여 줍니다. 토큰이 죽으면 무인 패널이 멈추므로 먼저 알립니다."
      - "캡처가 잘 되는 소스를 과제 목록에서 '연결 안 됨' 으로 적던 것을 고쳤습니다."
  - date: 2026-10-07
    title: "**리스크 심사 앱** — 화면 shadcn 전환 · preflight · 서버 타입 정합 · 패널 VOC 환기 끔"
    tag: 기술
    items:
      - "공용 조각(SectionCard·Badge·DataTable·StateBlocks·GateBanner)을 Report Archive 와 같은 shadcn 스택으로 옮기고 PageHeader·TabBar·Banner 원형을 더한 뒤, 과제·스냅샷·타깃·비교·큐레이션·홈·설정 일곱 화면의 레거시 `rr-*` 클래스 사용을 0 으로 만들었습니다. 라벨은 사람 말로 바꾸고 원시 필드 이름은 hint 로 남기며, 사이드바 면 구분과 홈 탭 세그먼트 컨트롤도 실제 렌더를 보고 손봤습니다."
      - "레거시 CSS 340줄을 지우고 Tailwind preflight 를 켰습니다. 꺼져 있던 동안 `border-*` 유틸이 전부 무효였고 카드 제목·설명에 UA 여백이 남아 있어, 그 사이 `:where()` 리셋으로 메웠습니다. 네이티브 컨트롤 리셋이 `.rr-input` 을 이겨 입력란 테두리가 사라지던 것과 `border: 0` 축약이 테두리를 되돌리던 것도 고쳤습니다."
      - "탭을 바꾸면 비활성 탭이 언마운트돼 저장 전 입력이 사라지던 것을 `TabPanel` 로 마운트를 유지해 고쳤고, 브리프 탭은 실제로 볼 때만 `GET /targets/{key}/brief` 를 불러 타깃 화면에 들어가기만 해도 브리프 토큰이 재발급되던 것을 막았습니다. 5초 폴링이 보던 탭을 바꾸던 것은 배너 알림으로 바꿨습니다."
      - "프런트 타입(`SnapshotHeader`·`ProjectSource.ref`)을 서버 열 이름에 맞춰 과제 화면이 백지가 되던 것(React #31·`undefined.join`)을 고쳤고, 0 과 '모름'(null)과 '아니다' 를 따로 그립니다. 본문이 flex 자식에 `w-full` 을 써 화면 전체가 사이드바 폭만큼 가로로 밀리던 것도 `min-w-0 flex-1` 로 고쳤습니다."
      - "패널 `delib_opts` 에 `voc: 'off'` 를 늘 실어, 엔진의 자동 VOC 환기가 diff 요약 문구에 따라 SignalForge 를 부르던 것을 껐습니다. 필드 이력은 브리프 E5 의 E10 블록이 정본입니다."
      - "매니페스트 `launch.env` 에 `HWAXRISK_PORTAL_BASE` 를 고정했습니다(앱과 HEAXHub 등록본 두 사본). 허브 `.env` 에만 두면 재배포 때 값이 빠져 PAT 등록·폐기 대조·무인 패널이 502 로 실패했습니다. 디버깅 중 커밋된 스크린샷 두 장은 리포에서 뺐습니다."
  - date: 2026-10-07
    title: "**StepForge** — 쌍 측정 관문 · 작업량 축 · backfill 잡 · 서버 표식과 러너 잠금"
    tag: 기술
    items:
      - "쌍 측정에 호출당 관문(`PAIR_MEASURE_BUDGET_S` 60초)을 두었습니다. OCC 가 최근접 계산 전에 상대 정점을 전부 분류기로 보내던 몫을 없애고(`boundary_first_distance`), 남은 계산은 모서리–모서리 일반 탐색 짝의 무게(`EDGE_SEARCH_PAIR_WEIGHT`)로 재기 전에 셉니다. `axis_gap` 은 넘치면 광선만으로 답하고 `part_index` 에 `nearest_confirmed` 칸이 생겼습니다."
      - "파트·행 도구의 작업량을 파싱이 정의마다 센 축 다섯(`shape_defs.brep_bytes`·`faces`·`torus_faces`·`bspline_poles`·`other_faces`)으로 셉니다. 축이 없는 옛 파싱 판은 예전 모형 아래로 세지 않고, 견적이 `remeasure` 를 분할에 옮깁니다. 재는 도중 형상이 바뀌었다 되돌아온 측정은 기록하지 않습니다."
      - "새 잡 `backfill` 이 정의 저장값(부피 유효숫자 12자리 · 작업량 축 칸)을 STEP 을 다시 읽지 않고 채웁니다. 판 표식은 정의 행마다(`shape_defs.measure_v`, `DEF_MEASURE_VERSION` 2)이고, 저장 꼴이 다른 과제끼리는 반올림 차를 부피 변화로 세지 않고 `stored_values_mixed` 로 말합니다."
      - "과제를 이름으로 받는 인자를 첫 인자뿐 아니라 other_project_id·project_a·project_b 까지 넓히고, REST 는 `_ProjectRoute` 가 경로의 과제 이름을 id 로 바꿉니다. `match` 잡은 접수 때 상대를 풉니다. `stackup_profile` 축 추정은 파고든 쌍의 겹친 몸으로 표를 주고, `read_k` 는 LS-DYNA 표준 두 줄 꼴 `*ELEMENT_SOLID` 를 읽습니다."
      - "`clearance_field` 에 인자 `spacing`(0 이면 자동)·`sort` 와 응답 칸(`sample_spacing`·`penetrating_ratio`·`signed_*` 등)을 더했고, 점 청크로 피크 메모리를 크게 줄였습니다. 구의 극·원뿔 꼭짓점에 닿은 삼각형의 현 오차 탐침과 솔리드·열린 면이 섞인 상대의 안팎 판정도 고쳤고, `risk_screen` 은 `sort='min'` 으로 받습니다."
      - "한 데이터 폴더에 판이 다른 서버가 둘 뜰 때를 위해 서버 표식(`servers/<토큰>.json`, 사는 동안 flock)과 러너 잠금(`servers/runner.lock`)을 두었습니다. 러너는 하나만 잡을 집고 이 판이 아는 종류만 집으며, 집은 서버를 `jobs.runner` 에 적고 `job_status.runner_note`·`system_capabilities.data_folder` 가 말합니다. pid 네임스페이스의 1번 프로세스로 뜬 서버가 자기 자신을 다른 서버로 세던 것도 고쳤습니다."
      - "`what_next` 의 선행 표를 등록 도구 141개 실호출로 다시 적고(형상 도구 스물셋은 올린 파일만 있으면 답합니다), 파싱 전 안내(`before_parse_note`)가 사이드카가 안 얹힌 답이라고 말합니다. `run_job` 의 note 는 그 잡 결과에 있는 칸만 가리키고(`JOB_APPLIED`), pipeline 결과에 `detect.tol_applied`·`detect.resumed`·`mesh.tol_applied` 를 더했습니다."
  - date: 2026-10-07
    title: "**DynaForge** — 그림 op 정비 · 위상 표 정본화 · 전처리 SIF 굽기 자동화"
    tag: 기술
    items:
      - "단면 그림 SVG 를 C++ op(`section`)이 직접 씁니다(새 의존성 0, 프런트·MCP 는 파일만 씁니다). 비등방 확대가 기본이고 어느 축을 몇 배 확대했는지와 최소피처의 픽셀값을 그림 안에 적으며, 색맹 안전 범주색(Okabe-Ito, pid 고정)·범례·눈금자를 함께 굽습니다."
      - "CP949 로 적힌 파트 제목이 SVG·JSON 을 깨뜨리던 것을, UTF-8 이 아닌 제목은 ASCII 로 내리고 `title_not_utf8`·`title_bytes_hex`(원본 바이트)를 싣게 고쳤습니다. 겹침 그림의 축 선택 근거, 제어문자 제거(`title_control_chars_stripped`), 기본 평면이 거울면이라는 안내(`at_is_default_mid_plane`)도 사실대로 적습니다."
      - "요소 면·모서리 표 여섯 벌을 `topo::facesOf`/`edgesOf` 하나로 모아, `extract-surface` 가 사면체(TET4)에서 가짜 면을 내고 진짜 면 둘을 빠뜨리던 것을 고쳤습니다. `surfview`·`section` 도 같은 진입점(`elem.topoType()`)을 타 비정규 쐐기가 면을 잃지 않고, 면적 0 삼각형은 솎되 그 수를 셉니다."
      - "`modelmeta` 부피를 면중심 4분할로 계산해 참값과 같아졌습니다(대각 2분할은 +0.13%). MCP 그림 응답은 고정 행 캡 대신 직렬화 길이를 재서 행을 뺍니다(`fit_to_budget`, `KOORM_MCP_RESULT_BUDGET` 기본 6000). `SKILL.md` 에 그림 도구 셋을 적고 패리티 관문이 그 존재를 확인합니다."
      - "그림 도구 셋을 살아 있는 스택에서만 판정하는 `figures_smoke.py`(20항)를 두고, 웹 잡 화면의 그림 캡션·alt 를 그림마다 다르게 적습니다. `.gitignore` 의 CR 뿐인 빈 줄 15개가 `check-ignore` 출력을 거짓으로 만들던 것을 고치고 `platform/scratch/` 를 무시합니다."
      - "`scripts/stage-to-appt313.sh` 가 SmartTwin 전처리 SIF 를 구울 때 KooRemapper 바이너리를 스스로 교체합니다. 백업은 `bin/` 밖에 두고, GLIBC 2.35 를 넘게 요구하는 바이너리는 거부하며, 소스를 못 찾으면 구워질 사본의 sha·날짜를 크게 적습니다. 같은 폴더의 통합 셰임 2종(`kooremapper_module.py`·`README.md`)도 sha 를 대조해 갱신하고 `--check` 는 셰임만 낡아도 rc=2 입니다."
  - date: 2026-10-06
    title: "**DynaForge** — 격자를 그림으로 봅니다(단면 · 겉모습 · 층 모식도)"
    tag: 연결
    items:
      - "`mesh_section_figure` 가 덱을 한 평면으로 자른 단면을 그립니다. 축은 스스로 고르고 왜 그 축인지 적으며, 두 덱을 나란히 또는 겹쳐 그립니다."
      - "`mesh_surface_figure` 는 겉면을, `mesh_stack_diagram` 은 층과 중립축·굽힘강성을 한 그림에 그립니다."
      - "챗은 그림을 볼 수 없으므로 응답에 자른 축·파트 수·최소 두께·파트별 두께를 숫자로 함께 싣습니다. 웹의 잡 결과에는 '그림 보기' 가 생겼습니다."
      - "2차 솔리드(10절점 사면체 등) 덱은 단면이 틀리게 나오므로 그리지 않고 그렇다고 알립니다."
      - "충격 보고서의 부품 외곽선 가운데 실측이 아닌 것은 빨간 점선과 '지어낸 footprint' 표시로 구분합니다."
  - date: 2026-10-05
    title: "**StepForge** — 루프 공백 · 치수 작업량 예산 · 입력 관문 · 역할 판정 · BLAS 한 스레드"
    tag: 기술
    items:
      - "큰 판에서 이벤트 루프가 멈추던 자리를 걷어냈습니다. graph.json 을 최상위 칸만 풀어 읽고(66MB 0.25 → 0.023초), where_is·part_location·mass_estimate·compare_revisions·explain_number 본문과 compare_snapshots 재료를 스레드로 옮겼으며, `compare_projects(set='기본')` 는 과제 재료와 역할 판정을 한 번만 합니다(24~29 → 1.1초). `detected_on_other_build` 주의도 루프 밖에서 읽습니다."
      - "`apply_dimension` 의 상한을 STEP MB·과제 수에서 예상 초(`APPLY_BUDGET_S` 60초)로 바꿨습니다. 캐시 적재·측정 수 × 도구별 단가·DB 몫을 세고, 그 키를 잰 기록의 측정당 중앙값을 바닥으로 씁니다. `APPLY_READ_MB_BUDGET`·`APPLY_PROJECTS_BUDGET` 은 은퇴했고 공개 표 글과 예산 상수 이름 가드를 맞췄습니다."
      - "`render_interface` 는 지금 형상에서 잰 침투 행의 선분을 다시 재지 않고, 겹침 입체는 부울 전에 `overlap_cost` 를 세어 `OVERLAP_WORK_BUDGET`(700만)을 넘으면 그리지 않고 `overlap.skipped_work` 로 말합니다."
      - "앞 도구가 아는 주의·사유를 뒤 도구가 옮깁니다. compare_snapshots·what_changed_near·explain_difference 가 `shell_detect_stale`·`detected_on_other_build`·`distance_below_box` 를, 이웃 간극이 null 이면 `why_a`·`why_b` 를, 옛 엔진의 거짓 0 행에 `distance_check` 를 싣습니다. `estimate_cost.cache_read` 는 실제로 읽는 과제를 세어 견적이 실측에 맞아졌습니다."
      - "공동 마개의 OCC 오프셋을 따로 띄운 프로세스(`core.cavity` 자식)에서 돌려 SIGSEGV 를 그 단의 실패로 칩니다. 단면은 `plane_cut` 한 곳에서 PCurve 를 켜고 면이 빠진 단면만 다시 자르며(최악 98초 → 1.1초), 자동 단면 자리는 맞닿은 면 위를 고르지 않습니다. `debug_ingest` 는 묶음 멤버를 512MiB 까지만 읽습니다."
      - "과제 이름 검사를 `check_project_name` 한 관문으로 모으고(빈·공백·문자열 아닌 이름 거절), `build_cavity`·`export_step` 은 `check_job_params` 를 부르며, `field_check` 기본 판 셋은 `JOB_PARAMS` 를 정본으로 합니다. 용어집 4항목과 관계 행의 처분 칸(`contained_fraction`·`pen_over_min_extent`·`sliver_verdict`), REST `GET /api/dimension-chart`·`/api/projects/{id}/dimension-view` 를 더했고 긴 `next_call` 을 텍스트 상한 안으로 접습니다."
      - "역할 판정에서 다른 역할의 동의어가 함께 걸리면 길이가 아니라 분류로 가르고 영어 규칙 복수(SCREWS 등)를 같은 낱말로 읽어, 소켓머리 나사를 커넥터로 읽던 것을 고쳤습니다. 나사 호칭은 규격 번호(DIN·ISO)와 길이가 함께 있을 때만 체결로 봅니다."
      - "계산 서버가 `OPENBLAS_NUM_THREADS=1` 로 numpy·단면·그림 모듈을 미리 읽어, 자식 작업이 호출마다 모듈을 다시 읽고 OpenBLAS 스레드 때문에 연속 단면이 직렬로 떨어지던 것을 없앴습니다(작은 판 단면 0.30 → 0.03초)."
  - date: 2026-10-03
    title: "개인 Claude 설정이 **데스크톱 앱 안의 Claude Code** 에도 HWAX 를 붙입니다"
    tag: 연결
    items:
      - "개인 토큰 화면의 설정 배치파일이 claude 명령을 따로 설치하지 않은 PC 에서도 Claude Code 사용자 설정에 HWAX 를 등록합니다. 데스크톱 앱 안의 Claude Code 는 데스크톱 설정이 아니라 이 파일을 읽어서, 그동안 데스크톱 채팅에만 보이고 Code 에는 안 보였습니다."
      - "Report Archive 를 SmartTwin(ste)처럼 **포털 로그인 그대로 본인 명의로** 쓰는 연결을 준비했습니다. Report Archive 쪽 설정이 끝나면 켜지고, 그때부터 토큰을 붙여 넣을 필요가 없습니다(그 전까지는 지금처럼 등록)."
      - "'개인 토큰 › 외부 연결' 에 **TestScope** 카드가 생겼습니다(TestScope 가 연결된 서버에서). TestScope 에서 발급한 개인 토큰을 붙여 넣으면 Claude·챗이 TestScope 를 내 계정으로 씁니다. TestScope 쪽이 준비되면 Report Archive 처럼 등록 없이 포털 로그인으로도 연결할 수 있습니다."
  - date: 2026-10-03
    title: "**StepForge** — 그림에 파트 이름이 찍히고, 두 과제의 같은 파트를 나란히 봅니다"
    tag: 연결
    items:
      - "3D·단면 그림에 파트 이름이 한글 그대로 찍힙니다. 챗은 그림을 볼 수 없으므로 응답에 그림 속 이름 목록을 함께 싣습니다."
      - "`section_view(through=<파트>)` 로 그 파트를 지나는 단면을 확대해 봅니다."
      - "`render_3d` 가 네 방향을 한 장에, 보이는 선과 가려진 선을 나눈 선 도면으로 그리고, 단면에는 최소 간극 치수선을 붙입니다."
      - "`compare_part_view` 로 두 과제의 같은 파트를 나란히·겹쳐 봅니다. 짝을 확실히 정할 수 없으면 그리지 않고 후보와 이유를 알려 줍니다."
      - "`render_interface` 로 두 파트 사이 관계 하나를 접촉 면·최소거리·겹친 부분과 함께 한 장에 봅니다."
  - date: 2026-10-03
    title: "**StepForge** — 잰 치수를 이름으로 남겨 과제끼리 견줍니다(치수 기록부)"
    tag: 연결
    items:
      - "`record_dimension` 으로 잰 간극·두께·부피·질량 같은 값을 이름을 붙여 남기고, `compare_dimension` 으로 다른 과제의 같은 치수와 견줍니다."
      - "다른 과제에서 같은 정의로 다시 재는 것은 `apply_dimension` 이 합니다. 형상이 바뀌어 기록이 낡았으면 그렇다고 알려 줍니다."
      - "치수 세트(기본 31치수)로 `compare_projects` 가 과제 × 치수 표와 기준 과제 대비 가장 크게 다른 치수를 냅니다."
      - "`dimension_chart`·`dimension_view` 그림과 웹 화면(`/view/dimensions`)에서 봅니다."
  - date: 2026-10-03
    title: "**DynaForge** — 접힘(폴더블) 적층 도구 여섯과 해석 카드 수정"
    tag: 연결
    items:
      - "폴더블 적층 모델을 만드는 도구 여섯이 생겼습니다(`foldsurface` · `refshell` · `stackwrap` · `neutralaxis` · `linkage-fit` · `applyfold`). 접힘 중심선을 만들고, 적층을 중립면에 맞춰 감고, 펴진 덱과 접힌 덱 사이 접힘 변환을 역산합니다."
      - "DynaForge 가 만든 접촉 카드에서 LS-DYNA 가 키워드 단계에서 멈추던 것을 고쳤습니다."
      - "응력 결과 CSV 의 주응력 값이 부호 오류로 틀리게 나오던 것을 고쳤습니다(von Mises 는 맞았습니다). 셸만 있는 덱에서 `prestress` 가 빈 초기응력을 쓰고 성공처럼 끝나던 것도 실패로 알립니다."
      - "`shellmap` 의 전개 시트가 메시에 따라 자기 위로 접혀 치수가 작아지던 것을 고쳤습니다."
      - "세션을 지울 때 도는 잡을 먼저 멈춥니다. 예전에는 그 잡이 흔적 없이 사라지고 실행 자리를 최대 30분 붙들었습니다."
  - date: 2026-10-03
    title: "**포털 화면 구조** — 디자인 토큰 · 페이지 뼈대 · 겹침 순서 · 선 아이콘"
    tag: 기술
    items:
      - "`frontend/src/styles/tokens.css` 를 색·글자·간격·모서리·그림자·폭의 정본 디자인 토큰으로 두고, 옛 변수 이름은 별칭으로 남겨 기존 CSS 가 그대로 돕니다. 한국어 글꼴 Pretendard 는 글자 범위별 조각으로 번들해 런타임 CDN 없이 필요한 것만 받습니다. 클래스 없는 입력칸과 주 버튼에 기본 모양을 줍니다."
      - "라우팅을 레이아웃 라우트 하나로 바꿔 셸(헤더·팝업·프라이머)을 한 번만 마운트하고, 404 도 셸 안에 그립니다. 공통 페이지 머리(`PageHeader`)와 폭 두 등급(읽기 880 · 넓게 1200)을 토큰·권한·관리·리스크·절차 화면에 적용했습니다. 메뉴를 누를 때마다 제목이 옆으로 튀던 것입니다."
      - "겹침 순서를 토큰(`--z-dock` < `--z-drawer` < `--z-header` < `--z-modal`)으로 정해 헤더 메뉴가 챗 독·서랍 밑에 숨지 않습니다. 메뉴 버튼은 키를 메뉴 안에서만 처리하고(Home/End, Tab·포커스 이탈 시 닫힘), 좁은 화면 시트는 Esc·바깥 탭·창 넓힘에 닫히며, 메뉴로 옮긴 화면에서는 메뉴 버튼에 현재 위치를 표시합니다."
      - "단계 1·2 의 전역 변경이 번진 자리를 고쳤습니다. 폼 기본값은 클래스 없는 칸에만, 전역 포커스 링은 `:where` 로 명시도 0, 줄바꿈은 `overflow-wrap: anywhere` 로 바꿨고, 챗 독이 열려도 페이지 뼈대가 자리를 비웁니다."
      - "화면 장식 이모지를 선 아이콘(`icons.tsx` 의 IconChat·IconFile·IconWrench·IconOrg 등)으로 바꿨습니다. 챗 독 버튼·심의 저장·좌석 조정·조직도·전문가·도구·첨부·Thinking 이 해당하고, ⚠·✓ 같은 글자 기호는 그대로 둡니다."
      - "챗 빈 화면을 시작 카드 넷(권한 없는 카드는 숨김)으로 바꾸고, 첫 질문 말풍선을 덮던 절대배치 내보내기 버튼을 흐름 안의 스레드 머리 줄로 옮겼습니다. 글 블록만 46rem 폭으로 두고, 사이드바 머리는 지금 보는 이력 종류('대화'·'심의')를 보입니다."
  - date: 2026-10-03
    title: "**화면 스타일 정리·화면 점검 하네스** — 인라인 스타일을 CSS 토큰으로 옮기고 다시 늘지 않게 막습니다"
    tag: 기술
    items:
      - "절차 화면의 인라인 스타일을 216곳에서 9곳으로 줄여 `procedures.css` 토큰으로 옮겼습니다. 남은 9곳은 실행 상태로 색이 바뀌는 것뿐이고, 탭 활성 표시는 `aria-current` 로 합니다."
      - "사용자 관리·접속 이력·권한 조각·RA 연결 카드의 인라인 스타일을 `admin.css`·`tokenpage.css` 토큰으로 옮겨 0곳이 됐습니다. 표 셋은 `.adm-table` 하나로 합쳤습니다."
      - "인라인 스타일을 다 옮긴 화면(관리·개인 토큰·RA 연결·허브 앱 등)에 ESLint 로 `style` 속성을 금지해 다시 늘지 않게 했습니다."
      - "글꼴 굵기를 400·500·600·700 네 단으로 맞췄습니다(620·640·650 → 600, 680·750·800 → 700, 23곳)."
      - "화면 점검 하네스를 더했습니다. `frontend/scripts/ui-check.sh` 가 저장소가 전부 임시인 포털을 빈 포트에 띄워 Playwright(`e2e/ui.spec.ts`)로 경로 × 폭(1440~390) × 권한 층마다 가로 넘침·밝은 패널·마크다운 기호 노출·헤더 줄바꿈을 단언하고, `check-css-vars.mjs` 가 정의되지 않은 CSS 변수를 찾습니다. 넘침이 나면 범인 요소를 함께 적고 나머지 인자는 Playwright 로 넘깁니다(같은 날 재시드로 대화가 쌓이던 것과 한글 경로에서 검사기가 죽던 것을 고쳤습니다)."
      - "개인 토큰 탭 이전으로 깨진 시험 둘을 고쳤습니다. 개인 토큰 화면의 Claude Desktop 조각 호출은 소스 단언이 찾도록 한 줄로 되돌렸습니다."
  - date: 2026-10-03
    title: "**TestScope 타일과 핸드오프 타일 조건** — 라우트가 있는 박스에서만 켭니다"
    tag: 기술
    items:
      - "TestScope 타일과 권한 `plat:testscope` 를 카탈로그·권한 표에 더하고, `testscope=` 라우트가 있는 박스에서만 켭니다. 콜백 주소만으로 켜면 없는 서비스로 로그인 토큰을 보내고 nginx 가 SPA 를 200 으로 돌려 조용히 깨지기 때문입니다(같은 날 TestScope 가 다른 조직의 포털이라 외부 링크 타일로 바꿨습니다)."
      - "타일 스키마가 jwt-handoff 타일에도 `hide_unless_routed` 를 받습니다. 표식이 없는 기존 핸드오프 타일은 그대로입니다."
  - date: 2026-10-03
    title: "**MCP 게이트웨이** — RA·TestScope 사람별 연결을 토큰 등록과 위임 중에서 고릅니다"
    tag: 기술
    items:
      - "사람별 위임(`per_user_sso`)에 `strip_headers` 를 두어 서비스 설정에만 맞는 헤더(RA 의 `X-Workspace-Slug`)를 사람별 호출에서 뺍니다. 프로비저너는 `RA_SSO_SECRET` 을 `per_user_sso.reportarchive` 로 옮기고, 비밀이 이번 실행에 없어도 기존 항목을 지우지 않습니다."
      - "사람별 위임 토큰은 발급 응답의 `expires_in` 보다 일찍 다시 받습니다. RA 위임 토큰 12시간을 캐시도 12시간 쥐어 만료 직전 토큰을 쓸 수 있었습니다. 안내 문구의 옛 페이지 이름 'API 토큰' 은 '개인 토큰 › 외부 연결'·'허브에 보일 앱' 으로 바꿨습니다."
      - "TestScope 를 `PORTAL_CONN_BACKENDS` 에 넣어 사람이 등록한 본인 토큰으로만 부르고(조직 헤더 없음), 백엔드는 `TESTSCOPE_MCP_URL` 로 등재합니다. 거부·실패 문구는 서비스 라벨과 토큰 꼴로 말합니다."
      - "`TESTSCOPE_SSO_SECRET`(+`TESTSCOPE_SSO_URL`, 기본 주소 없음)이 있으면 `per_user_sso.testscope` 위임을, 없으면 등록 토큰을 씁니다. update-all 이 빈 RA·TestScope 비밀을 `PER_USER_SSO_OFF` 로 넘기면 그 위임만 지워, 비밀을 비워도 위임이 남아 포털 화면과 어긋나던 것을 고쳤습니다."
  - date: 2026-10-03
    title: "**StepForge** — 그림 형식 한 곳 · 선 도면과 연속 단면 · 그림 세부 수정"
    tag: 기술
    items:
      - "그림 형식을 `core/figure.py` 한 곳에 모아 `format` 을 png(기본)·svg 로 고르게 했습니다. SVG 는 글자를 글자로 싣고 3D 형상만 래스터로 넣으며 바이트가 결정적이고, 5MB 를 넘으면 거절합니다. 응답은 [텍스트, 이미지] 꼴이며 챗 컷에 그림 URL 이 잘리던 것, 이름표 겹침, 제어문자로 SVG 가 깨지던 것도 함께 고쳤습니다."
      - "`render_3d(view='sheet', style='lines', highlight=…)` 의 선 도면은 다각형 은선 투영(`HLRBRep_PolyAlgo`)으로 그립니다. 정확 판(`HLRBRep_Algo`)은 실물 한 파트에서 350초 넘게 멎었습니다. `section_view(count=n)` 연속 단면을 더했습니다."
      - "`section_view` 에 `around`(둘레 폭)·`emphasis`(이웃 옅게) 인자를 더했고, 계산 자식에서 부른 등록 도구의 이력 행에 바깥 도구 이름(`parent`)을 남깁니다. `compare_part_view` 단면 칸의 이웃 이름표는 그 파트 단면 곡선이 둘러싼 쪽(짝홀 판정)으로 밀어, 늘 오른쪽 위로 찍혀 지목 파트 영역에 들던 것을 고쳤습니다."
      - "단면 위 치수(`dims=true`)가 사이를 다른 파트가 채운 쌍을 '마주한 간극' 으로 그리지 않습니다. 정확한 단면 영역으로 막힘을 가르고 `nearest_blocked`·`blocked_pairs[].by` 와 꼬리말로 뺀 쌍 수를 알립니다."
      - "`render_interface` 의 최소거리 선분을 검출·`measure_distance` 와 같은 `oc.bounded_distance(points=True)` 로 재고(`segment.remeasured`·`segment.undecided`), 상자 거리 아래 판정은 `explain_kind.distance_check` 를 그대로 옮겨 같은 질문에 판정이 둘이던 것을 없앴습니다."
  - date: 2026-10-03
    title: "**StepForge** — 현장 점검·진단 묶음 · 공개 표 135도구 · REST 150경로"
    tag: 기술
    items:
      - "현장 점검 잡 `run_job(kind='field_check')`(`field_check_report`·CLI 포함)이 받는 쪽 서버의 환경을 탐침하고 합성 판 진리값과 대조합니다. `debug_bundle`(MCP·REST·CLI 한 함수)은 설치별 소금 토큰으로 이름을 가리고 비밀 검사를 두 번 하며 원본 STEP·메시·DB 는 싣지 않고, `scripts/debug_ingest.py` 로 우리 쪽에서 받아 읽습니다. `delete_project` 가 warnings·joint_verdicts·risk_verdicts 고아 행을 남기던 것도 고쳤습니다."
      - "`model_provenance.sidecar`(found·applied·of·source·at·stale)를 더했고, 파일이 수백 개인 과제의 응답을 `files_summary`·`include_files` 로 접습니다(940파일 624,634자 → 3,388자). 시트 바디의 부피는 0 대신 null 과 사유로 내고(`is_solid_body` 한 곳), 오프로드 도구 24종과 이름 받는 무거운 도구는 형상을 읽기 전에 같은 문구로 인자를 거절합니다(`offload.task(check=…)`). 옛 검출 엔진 행은 `shell_detect_stale` 로 판정을 막고 검출이 빌드를 남깁니다."
      - "공개 표(`core/data/disclosure.yaml`)를 49 → 135도구로, REST 를 60 → 150경로로 넓히고 모든 도구가 REST 경로나 사유 있는 면제를 갖는지 완전성 가드를 두었습니다. 이름 없는 임계 상수를 0 으로 줄이고 접미사 규칙 밖 숫자 상수를 가드하며, gmsh 네이티브 충돌은 그 파트만 실패로 칩니다. `upload_step` 이 남의 STEP 을 덮던 것과 웹 UI 폴링이 도구 이력을 채우던 것을 고쳤습니다."
      - "잘림 칸(`truncated`·`omitted`)을 `core/disclosure.py` 의 도우미 하나(`truncation`·`truncation_lists`)가 짓고 정적·실호출 가드가 꼴을 지킵니다. 잡 인자 기본값은 `JOB_PARAMS` 표 한 곳에서 읽고(AST 가드), `export.source` 기본값을 'raw' 로 맞췄으며 export·cavity 의 대소문자·공백을 워커도 정리합니다."
      - "웹 과제 목록·PATCH 가 MCP 본체를 부르고 과제 정보 쓰기를 `write_meta` 한 벌로 모았습니다. PATCH 가 tol_config 를 못 받고 MCP 가 description 을 못 바꾸던 것을 고쳤고 빈 이름 쓰기는 거절합니다."
      - "`measurement_guide` 에 숨어 있던 도구 넷(contact_preview·leak_report·material_lookup·material_sources)과 칸 넷을 올렸습니다. 진리값 검사기(`verify_rows`)가 접촉 면적·겹친 부피를 형상에서 다시 재고 모든 쌍의 완비를 봅니다."
  - date: 2026-10-03
    title: "**StepForge** — 이음매 감사 1~3차 · 치수 기록부 v2 · 유효숫자와 견적 상한"
    tag: 기술
    items:
      - "이음매 감사 1차(32건)로 치수 그림의 SVG 규칙과 이름 자르기를 `figure.short_label` 하나로 모으고, 과제·파일 수만큼 자라는 목록(`compare_dimension` 등)을 챗 컷 안으로 접었습니다. 재는 동안의 재정의·같은 새 키 동시 기록·취소가 남기던 단계 행과 오프로드 계산, SIF 안에서 죽던 운영 셸 명령 넷과 `field_check --json` 도 고쳤습니다."
      - "이음매 감사 2차(26건)로 옛 기하 키를 기동 때 옮기고 빌드를 샤드 줄에 남깁니다. `compare_dimension` 은 읽기만 하고 다시 재기는 쓰기 도구 `apply_dimension` 이 맡습니다(게이트웨이가 `compare_` 를 300초 캐시해 다시 재기가 서버에 닿지 않았습니다). 키 NFC 정규화, `render_3d`·`section_view`·`dimension_view` 오프로드, `files_not_parsed` 막는 사유, 형상 적재의 STEP 한 번 읽기를 더했습니다."
      - "이음매 감사 3차(16건)로 게이트웨이 재호출·재는 도중 수명주기·사이드카 배치 표식·입력 꼴을 고치고, 형상 도구 31곳이 `ShapeIndex.from_placed` 기하 캐시를 씁니다. `apply_dimension` 은 재기 전에 작업량으로 잴 과제를 정하고 나머지는 `next_call` 로 돌려줍니다."
      - "치수 기록부 v2 에서 역할·글롭으로 여러 파트를 지목하는 모음과 행 고르기, 치수 세트 정의(`core/data/dimension_sets.yaml`), 웹 화면 정적 파일을 올렸고, 모음 정의가 `apply_dimension` 작업량 판정을 비켜 가던 것을 막았습니다."
      - "관성 주값 불일치 경보를 응답에서 빼고 원점 착 경고는 '보조 신호' 로 한계를 말합니다. 부피·관성·단면 2차 모멘트는 소수 9자리 절대 반올림 대신 유효숫자 12자리로 내고 기술자 캐시 판을 2 로 올렸습니다."
      - "`estimate_cost` 가 다른 빌드 이력에서 옮긴 위쪽 값을 그 도구의 최악 단가 아래로 두지 않아 `risk_screen` 과 판정이 갈리지 않습니다."
  - date: 2026-10-03
    title: "**DynaForge** — 반입 뒤 재기동 · shellmap 경고 셋 · 회귀 관문 복구"
    tag: 기술
    items:
      - "`dist-from-drive.sh --restart` 가 반입 뒤 `start.sh`(postgres → alembic upgrade head → api 순)와 `restart-api-only.sh` 까지 돌리고 `/api/health` 200 과 revision·binary_sha256·`revision_matches_binary` 를 확인합니다. 반입만 하면 떠 있는 API 가 옛 코드로 계속 돌았습니다."
      - "`shellmap` 이 bbox 정합으로 디테일을 늘린 양을 퍼센트로 찍어 0.05% 를 넘으면 경고하고, 축 교환이 반사가 아니라 90° 회전이라 평면 Y 방향이 뒤집힌다고 정확히 말하며, 평면 디테일의 z 중심이 두께의 절반 넘게 벗어나면 경고합니다. 층별 강성비가 100배를 넘으면 강성층 응력이 상한이라고 알리고 `relax` 를 권합니다(산출 덱은 바이트 그대로입니다)."
      - "회귀 관문 둘을 되살렸습니다. 손도구 `deck_manifest.py` 를 시험 폴더(`tools/regress`)에서 `tools/` 로 옮겨 CI 가 시험으로 돌리지 않게 하고, `matdb` 도움말 사례가 번들 재료 DB 를 `needs` 로 선언합니다."
  - date: 2026-10-02
    title: "포털 화면을 **새로 정돈**했습니다 — 메뉴 위치가 바뀌었습니다"
    tag: 수정
    items:
      - "위쪽 메뉴를 챗 · 심의 · 앱 · 절차 넷으로 줄였습니다. **내 권한 · 개인 토큰 · 업데이트 이력 · 로그아웃**은 오른쪽 위 내 이름을 누르면 나옵니다. 관리자는 '관리' 메뉴에서 사용자 관리 · 접속 이력을 엽니다."
      - "'리스크 심사'는 위쪽 메뉴 대신 **앱** 목록의 HWAX Risk Review 타일로 엽니다."
      - "한국어 글꼴(Pretendard)을 쓰고, 단어 중간에서 줄이 끊기던 것('홍/길/동')을 고쳤습니다. 노트북(화면 배율 150%)·좁은 창에서 메뉴가 깨지던 것도 고쳤습니다."
      - "파일을 붙였을 때 흰 상자로 뜨던 '어디로 보낼까요' 패널, 심의 화면에서 제목이 잘리던 것, 업데이트 안내 제목에 굵게 표시 기호가 그대로 보이던 것을 고쳤습니다."
      - "챗 입력창 아래에 **검색 · Thinking · 전문가**를 작은 버튼으로 모았습니다. 입력창 위에 늘 떠 있던 두 줄 막대와 오른쪽 '대화 설정' 칸은 없어졌습니다(활동이 있을 때만 오른쪽에 보입니다). 내보내기(HTML·JSON·Word)는 대화 위 '내보내기' 메뉴에 있습니다."
      - "앱 목록을 분류(해석·시뮬레이션 · 설계·검증 · 데이터·지식 · AI 플랫폼)와 검색으로 찾게 했고, 이제 **모든 앱이 새 탭에서** 열립니다."
      - "로그인 화면에서 삼성 AD(SSO) 로그인이 맨 위 버튼입니다. 이메일 계정 로그인은 그 아래 'SSO 를 쓸 수 없나요?' 를 누르면 나옵니다."
      - "'내 권한' 화면이 쓸 수 있는 것은 한 줄로 모아 보이고, 요청할 수 있는 것에는 설명이 붙습니다."
      - "SSO 로그인이 실패하면 흰 오류 화면 대신 **로그인 화면으로** 돌아옵니다. '자세히'를 누르면 원인이 보이니, 계속 실패하면 그 내용을 포털 관리자에게 알려 주세요."
      - "개인 토큰 화면을 **개인 토큰 · 허브에 보일 앱 · 외부 연결** 세 탭으로 나눴습니다. Report Archive 연결은 '외부 연결' 탭에 있습니다."
      - "심의 회의록에 전문가가 기계 이름(pcb-warpage) 대신 **사람 이름**으로 나오고, 지난 심의를 다시 열면 진행 표시가 '완료'로 보입니다. '얹을 층'은 '심의 옵션' 안의 '방법 보강'으로 옮겼고, 전문가 선택기의 관련도는 높음 · 보통 · 낮음으로 보입니다."
      - "업데이트 안내를 어디까지 봤는지 서버에 남깁니다. 다른 PC나 브라우저에서 로그인해도 **아직 못 본 안내만** 뜹니다."
      - "전문가 고르기 · 조직도 · 그림 확대 같은 창이 열려 있으면 키보드 Tab 이 뒤 화면으로 빠져나가지 않고, 닫으면 누른 버튼으로 돌아옵니다. 좁은 화면에서 대화 목록 항목이 눌리지 않던 것도 고쳤습니다."
      - "(관리자) 배선 설정 상자를 앱 목록에서 **사용자 관리** 맨 위로 옮겼습니다. 남은 건수는 위쪽 '관리' 옆에 보이고, 포털이 확인할 수 없는 항목은 해 둔 뒤 '확인함'을 누르면 빠집니다."
  - date: 2026-10-02
    title: "**삼성 AD(SSO)** 계정으로 운영 포털에 로그인합니다"
    tag: 연결
    items:
      - "운영 서버에서 삼성 AD(SSO) 로그인이 됩니다. 예전에는 인증을 통과한 뒤에도 서버 오류나 거절로 끝났습니다."
      - "예전 이메일 계정으로 쓰던 대화·개인 토큰·절차가 AD 로그인에서도 그대로 보입니다. 메일 주소의 대소문자가 달라도 같은 계정으로 봅니다."
      - "AD 가 아직 이름을 보내지 않아 승인된 포털 계정 이름이나 메일 주소를 보입니다. AD 가 이름을 보내기 시작하면 따로 손대지 않아도 그 값으로 바뀝니다."
  - date: 2026-10-02
    title: "**SAML 로그인 설정** — SLO 광고 끄기 · IdP 메타데이터 TLS 검증 · 빈 이름 표시"
    tag: 기술
    items:
      - "SP 메타데이터에서 SingleLogoutService 광고를 끌 수 있습니다(`SAML_ADVERTISE_SLO=false`). SLO 는 아직 구현되지 않아(`/auth/saml/sls` 는 501) 광고하면 다른 서비스에서 시작한 전역 로그아웃이 포털에서 조용히 실패합니다. 기본값은 종전 동작입니다."
      - "IdP 메타데이터를 URL 로 받을 때 TLS 를 검증합니다(`SAML_IDP_METADATA_VALIDATE_CERT`, 기본 켬). 메타데이터에 IdP 서명 인증서가 들어 있어 중간자가 갈아끼우면 위조 Assertion 이 통과할 수 있었습니다. 사내 CA 면 끄지 말고 `SSL_CERT_FILE` 로 그 CA 를 줍니다."
      - "SSO 로 새로 생긴 원장 행은 이름을 비워 두고, 관리자 사용자 표는 이름이 빈 행을 '—' 로 보입니다."
  - date: 2026-10-02
    title: "**배포·기동 스크립트** — set -e 아래 사유 없이 끝나던 자리와 빠지던 설정"
    tag: 기술
    items:
      - "AIDataHub 의 안내 전용 함수 `_aidh_runtime_autotune` 이 조건에 따라 1 을 돌려, `set -e` 인 `start_postgres.sh` 가 안내 한 줄 뒤 말없이 끝나던 것을 고쳤습니다(늘 0 을 돌려줍니다)."
      - "SmartTwin(ste) 배포 스크립트의 헬스체크·정적 서빙 curl 과 CA 인증서 수 세기가 연결 거부·빈 글롭에서 사유 줄과 journal 덤프 없이 끝나던 것을 고쳤습니다. 결과(실패)는 같고 진단이 남습니다."
      - "SignalForge `sync-from-drive.sh` 가 Drive 에 db-dumps 폴더가 없으면 [WARN] 없이 말없이 끝나던 것을 고쳤습니다."
      - "HEAX 허브의 hwax-risk 매니페스트 `launch.env` 에 `HWAXRISK_PORTAL_BASE` 를 고정했습니다. `.env` 를 소싱하지 않은 재배포에서 값이 빠지면 PAT 등록·폐기 목록 대조·무인 패널이 502 로 죽어 토큰 탓처럼 보였습니다."
  - date: 2026-10-01
    title: "이름이 한글인 계정도 SmartTwin(ste)에 **자동 로그인**됩니다"
    tag: 수정
    items:
      - "포털 계정 이름이 한글이면 ste 자동 로그인이 서버 오류로 실패하고, ste 에 들어갈 때마다 따로 로그인해야 하던 문제를 고쳤습니다. 이름이 영문인 계정은 달라지는 것이 없습니다."
      - "그동안 ste 계정 이름이 '%ED%99%8D…' 같은 글자로 만들어졌다면 다음 로그인 때 원래 이름으로 바로잡힙니다."
      - "'내 권한' 표에 **SimFlow** 와 **PLM 결함 검색**이 생겼습니다. SimFlow 도구는 이제 그 권한이 있어야 챗·Claude 에 붙고(그동안은 권한 없이 모두에게 열려 있었습니다), PLM 결함 검색은 그동안 누구도 받을 수 없던 권한을 이제 요청할 수 있습니다."
  - date: 2026-10-01
    title: "운영 갱신 — **'portal failed' 로 옛 화면이 남던 것**을 고쳤습니다 · 포털만 올리기"
    tag: 배포
    items:
      - "Drive 의 이미지가 바뀌지 않은 날 운영 갱신이 사유 없이 'portal failed' 로 끝나고 옛 화면·옛 백엔드가 남던 것을 고쳤습니다."
      - "떠 있는 포털을 '없다' 로 잘못 읽어 nginx 가 안 뜨거나 포털이 멈추지 않던 경우를 고쳤습니다."
      - "`./infra/scripts/update-forges.sh portal` 로 포털만 올릴 수 있습니다. 모르는 이름이면 고를 수 있는 목록을 보여 줍니다."
      - "⚠ 경고를 끝에서 건수와 함께 다시 모아 보여 줍니다."
  - date: 2026-10-01
    title: "**배포·진단 스크립트** — 옛 화면 업로드 차단 · DynaForge 갱신 위임 · ste-doctor 인증서 점검"
    tag: 기술
    items:
      - "`images-to-drive.sh` 가 빌드 표식이 없거나 지금 HEAD 와 다른 `frontend/dist` 는 올리지 않습니다. 옛 화면에 지금 HEAD 표식을 찍던 구제 경로를 없애, 받는 쪽 게이트가 옛 화면을 '지금 소스' 로 읽던 거짓 초록을 막았습니다. update-all 의 '표식 없음' 안내는 `build-all-to-drive.sh portal` 을 가리킵니다."
      - "`update-forges.sh dynaforge` 가 손으로 베낀 축약판 대신 update-all 의 kooremapper 절(`deploy-all-from-drive.sh kooremapper`)에 위임합니다. 축약판은 Drive remote 설정이 없으면 옛 아티팩트로 재기동한 뒤 초록으로 끝났고, 지문 기반 재기동이 없었으며, 헬스 프로브가 SPA 루트를 봐 백엔드 고장을 놓쳤습니다."
      - "`ste-doctor.sh` 의 teleport 행이 터널이 실제로 쓰는 ssh_config 인증서(tbot 포함)의 유효 기간을 보고, 터널 유닛이 같은 파일을 쓰는지(`tunnel-cfg`) 확인합니다. tbot 박스에서는 사람 tsh 세션 행을 건너뜁니다. 예전에는 tbot 박스에서 헛경고를 내고 터널 설정 불일치는 못 봤습니다."
  - date: 2026-09-30
    title: "포털 로그인과 서비스 이동이 **접속 기록**으로 남습니다"
    tag: 연결
    items:
      - "포털에 로그인하거나 타일로 서비스에 들어갈 때 **계정·접속 IP·시각·서비스**가 기록됩니다. 포털 관리자만 '접속 이력' 화면에서 볼 수 있습니다."
      - "로그인하면 계정을 식별하는 쿠키(hwax_uid)가 하나 더 생깁니다. 권한과는 무관하며, 포털을 거쳐 각 서비스로 가는 요청을 계정별로 묶는 데만 씁니다(14일 보관)."
      - "포털 탭을 오래 열어 두면 로그인이 끊긴 뒤에도 배경에서 로그인을 계속 다시 시도하던 문제를 고쳤습니다. 이제 실패가 이어지면 간격을 점점 늘립니다."
  - date: 2026-09-29
    title: "Report Archive 에 쓴 보고서가 **본인 이름**으로 올라갑니다"
    tag: 수정
    items:
      - "포털 API 토큰 페이지에 Report Archive 토큰을 등록했는데도 챗·Claude 에서 만든 보고서의 작성자가 **관리자 계정**으로 기록되던 문제를 고쳤습니다. 서버 설정이 갱신되면서 '누가 쓰는지' 를 확인하는 경로가 끊겨, 모두가 관리자 이름으로 쓰고 있었습니다."
      - "이제 그 확인이 안 되면 다른 이름으로 몰래 쓰지 않고 **저장을 멈춘 뒤 이유를 알려 줍니다.** 이미 관리자 이름으로 올라간 보고서의 작성자 변경은 Report Archive 관리자에게 요청해 주세요."
      - "Report Archive 토큰을 등록하지 않은 채로는 챗·Claude 에서 Report Archive 를 **읽거나 쓸 수 없고**, 등록 안내가 나옵니다. 그동안은 공용 계정으로 대신 불려 **다른 사람의 개인 공간**에 글이 쌓이고 그 사람의 '내 글'이 보였습니다. 포털 **API 토큰** 페이지에서 Report Archive 토큰을 등록해 주세요."
  - date: 2026-09-27
    title: "운영 갱신이 **바뀐 것만** 받고 다시 띄웁니다"
    tag: 배포
    items:
      - "관리자 운영 갱신(update-all)이 서비스마다 코드·이미지·설정의 지문을 **마지막으로 띄운 시점**과 비교해 **달라진 것만 재기동**합니다. 바뀐 게 없으면 '변경 없음 · 살아 있음 → 재기동 생략' 한 줄을 남기고 넘어갑니다 — 그동안은 아무것도 안 바뀐 날에도 모든 서비스를 내리고 다시 띄웠습니다."
      - "Drive 에서 받는 이미지·산출물은 영구 캐시에 받아 **안 바뀐 파일은 전송하지 않습니다.** 갱신 시간의 대부분이 여기서 줄어듭니다."
      - "전부 다시 띄우고 싶으면 `HWAX_RESTART_ALL=1` 로 돌립니다. 설정 파일(.env)이 바뀐 서비스는 코드가 그대로여도 다시 띄웁니다."
  - date: 2026-09-27
    title: "**Report Archive** — 보고서 보관소가 별도 서버로 옮겨졌습니다"
    tag: 연결
    items:
      - "보고서 보관소(Report Archive)가 포털과 같은 서버에서 **전용 서버**로 이사했습니다. 포털 타일과 챗의 보고서 도구(검색·저장·심의 보고서)는 새 서버를 봅니다 — 쓰시는 방법은 그대로입니다."
      - "포털 로그인 그대로 Report Archive 에 들어가는 연결(타일 한 번 클릭)은 **양쪽 설정이 맞물리는 대로** 켜집니다. 그때까지 타일이 Report Archive 로그인 화면으로 보내면 거기서 로그인해 주세요."
      - "큰 첨부(2MB 를 넘는 파일)도 포털 주소를 거쳐 그대로 올라갑니다 — 예전엔 포털이 중간에서 잘랐습니다."
  - date: 2026-09-27
    title: "운영 갱신 한 번으로 연결이 같이 맞춰집니다"
    tag: 배포
    items:
      - "관리자가 운영 갱신(update-all)을 한 번 돌리면 Smart Twin Explorer 코드·Report Archive 주소·챗 도구 게이트웨이 설정이 **함께** 맞춰집니다. 손으로 세 파일을 고치다 하나를 빠뜨려 옛 주소를 보던 일이 없어집니다."
      - "기능이 있는데 옵션·설정이 없어 **켜지지 않은 것**은 조용히 지나가지 않고 ○ 로 이유와 켜는 법을 함께 보여 줍니다. 끝에서 전부 다시 모아 냅니다."
      - "헬스게이트가 \"살아 있나\" 만 보던 자리를 **실제 값**으로 판정합니다 — 자격 중계 시크릿이 양쪽 같은지, 클러스터 도구가 실제로 붙었는지, 보고서 보관소 로그인 연결이 어느 조각에서 막혔는지(라우트·버전·설정·방화벽)를 숫자로 말합니다."
      - "포털 메인에 **아직 안 된 연결**이 있으면 관리자에게 그것만 보여 주고, 다 되면 조용히 사라집니다."
  - date: 2026-09-25
    title: "**토큰 페이지** — 이 토큰으로 무엇이 열리는지, 인증서는 어떻게 되는지 먼저 보여 줍니다"
    tag: 연결
    items:
      - "토큰 페이지에 **\"이 토큰으로 지금 열리는 플랫폼\"** 목록이 생겼습니다. 열린 것과 닫힌 것이 갈려 보이고, 닫힌 것은 그 자리에서 '내 권한' 요청으로 이어집니다."
      - "토큰 발급 권한이 없으면 빈 버튼 대신 **'내 권한'에서 요청하는 링크**를 보여 줍니다. 승인은 관리자가 합니다."
      - "포털 인증서가 사내 CA·자체서명이면 Claude Code 등록 배치파일이 **CA 를 함께 심어** 연결이 인증서 오류로 끊기지 않게 합니다. 인증서 상태를 모르거나 만료됐거나 CA 를 구하지 못하면 배치 버튼을 잠그고 **왜 잠겼는지** 보여 줍니다 — 안 될 것을 내려받게 하지 않습니다."
      - "챗·Claude 에서 **권한이 없는 앱**은 도구 목록에서 빠지는 대신 \"왜 없는지\" 가 옵니다 — 포털 '내 권한'에서 요청할 것인지, 관리자에게 문의할 것인지, 잠시 뒤 다시 시도할 것인지를 사유별로 안내합니다. 도구 이름을 지어내거나 우회하지 않습니다."
  - date: 2026-09-25
    title: "**Smart Twin Explorer 도구** — 챗·Claude 에서 큰 파일을 올리고 잡을 돌립니다"
    tag: 챗
    items:
      - "Smart Twin Explorer(24대 클러스터) 도구가 게이트웨이에 붙었습니다. 이름이 겹치는 것들은 **`ste_` 접두사**로 부릅니다 — `ste_prepare_upload` → 받은 주소로 업로드 → `ste_submit_job(upload_id)`, 그리고 `ste_list_jobs`·`ste_cancel_job`."
      - "업로드는 **2GB 까지** 스트리밍으로 올라가고 업로드 티켓은 24시간 유효합니다. 결과 파일은 `get_job_file` 로 64KB 까지 바로 읽습니다."
      - "Smart Twin 허가가 있는 분은 따로 요청하지 않아도 이 도구들이 함께 열립니다."
  - date: 2026-09-23
    title: "**토큰 하나**로 하위 사이트 전부를 씁니다"
    tag: 연결
    items:
      - "토큰 페이지에서 발급한 토큰 **하나**로 권한이 있는 하위 사이트 전부에 들어갑니다. 화면이 대상을 좁히던 것을 뗐습니다 — 범위는 포털 권한이 정합니다."
      - "Claude 에서 `rest_catalog` 로 각 사이트의 REST API 목록을 보고 `rest_call` 로 부릅니다. 읽기는 기본으로 열려 있고 **쓰기는 사이트별로 허용한 것만** 됩니다."
  - date: 2026-09-22
    title: "**Smart Twin Explorer** — 포털에 로그인하면 함께 열립니다"
    tag: 연결
    items:
      - "포털에 로그인하면 Smart Twin Explorer(24대 클러스터 웹)도 **열린 상태**가 됩니다. 따로 가입하거나 토큰을 복사할 일이 없습니다 — 포털이 자격을 중계합니다."
      - "타일 주소는 포털 아래 `/ste/` 입니다. 사용자 PC 에서는 포털을 거쳐 들어가고, 클러스터 직결은 관리 서버에서만 됩니다."
  - date: 2026-09-19
    title: "**앱 접속** — 이름이 한글이면 앱 화면이 안 열리던 문제를 고쳤습니다"
    tag: 수정
    items:
      - "로그인은 되는데 **앱만** 열리지 않던 분들이 있었습니다. 이름을 앱으로 넘기는 자리가 한글을 못 실어 그대로 실패했습니다 — 이제 실을 수 없는 이름은 비워서 넘기고, 앱은 정상적으로 열립니다."
      - "되돌리기 어려운 단계(게시·태그 확정 같은)가 **승인을 받고도** 막히던 자리를 고쳤습니다. 승인한 절차만 통과하고, 승인 없는 호출은 그대로 막힙니다."
      - "절차에서 **여럿을 한 번에** 고를 수 있습니다(태그를 여러 개 붙이는 자리처럼). 고른 것이 목록 하나로 다음 단계에 넘어갑니다."
      - "인자를 못 푸는 단계에서 실행이 **도는 것처럼 보인 채 영영 남던** 문제를 고쳤습니다 — 그 단계에서 멈추고 무엇이 안 풀렸는지 말합니다."
  - date: 2026-09-19
    title: "**STEP 검토** — 가짜 간섭을 수치로 가려냅니다"
    tag: 연결
    items:
      - "공차 수준으로 겹친 것(맞닿아야 할 면이 CAD 오차만큼 파고든 것)은 \"접촉으로 봐도 된다\"고 **근거 수치와 함께** 알려 줍니다. 반대로 얇은 부품이 통째로 묻힌 것은 그렇게 말합니다 — 둘은 두께만 보면 구분되지 않습니다."
      - "종류를 **자동으로 바꾸지는 않습니다.** 덱의 접촉 정의가 조용히 달라지면 어제 구운 덱과 오늘 구운 덱의 물리가 달라지기 때문입니다. 바꾸는 것은 사람이 `set_interface` 로 합니다."
      - "접촉 규칙의 우선순위를 도구가 직접 설명합니다 — **구체적인 규칙이 이기는 것이 아니라 선언 순서**이고, 타입을 바꾸는 뒤 규칙도 앞 규칙의 옵션을 물려받습니다."
      - "검출 중 일부 작업이 죽으면 **빠진 목록을 그대로 쓰던** 자리를 고쳤습니다 — 이제 잡이 실패로 끝나고, 관계 표는 건드리지 않습니다."
  - date: 2026-09-14
    title: "**절차** — 한 번 해낸 일을 절차로 굳혀 대상만 바꿔 다시 돌립니다"
    tag: 챗
    items:
      - "도구를 **한 단계씩** 돌리면 절차 기능이 과정을 전부 기록합니다. 끝나고 \"절차로 저장\" 을 누른 뒤 어떤 값이 과제마다 바뀌는지 표시하면, 다음 과제에서는 그 값만 채워 **한 번에 재생**됩니다."
      - "절차는 서버에 쌓이고 남과 공유됩니다. 다만 **실행은 언제나 누른 사람의 권한·명의로** 돕니다 — 남의 절차를 돌려도 내가 못 부르는 도구는 시작 전에 막힙니다."
      - "되돌리기 어려운 단계(게시·태그 확정·잡 제출 같은)는 **반드시 멈춰서 확인을 받습니다**. 확인 화면에는 치환이 끝난 실제 인자가 그대로 보이고, 확인한 뒤 값이 바뀌면 그 확인은 무효가 됩니다."
      - "실행은 화면을 닫아도 서버에서 계속됩니다. 확인을 기다리는 실행은 **실행 이력 맨 위**에 뜹니다."
      - "챗·심의와 자원을 공유하지 않습니다 — 절차 기능이 오래 걸리는 도구를 돌려도 챗이 느려지거나 막히지 않습니다."
  - date: 2026-09-13
    title: 심의를 이어갈 때 **이전 회차가 조회한 수치를 가져갑니다**
    tag: 심의
    items:
      - "이어하기를 하면 이전 회차 전문가들이 도구로 뽑은 값이 **근거로 따라갑니다**. 전에는 결정문 문장에 살아남은 수치만 넘어가서, 다음 회차가 같은 것을 다시 조회하거나 기억으로 말하는 일이 있었습니다."
      - "출처에 **이전 회차**라고 적혀 있어 이번 회차에 새로 조회한 것과 구분됩니다."

  - date: 2026-09-13
    title: 대화 목록에 **어느 전문가와 나눈 대화인지** 보입니다
    tag: 챗
    items:
      - "왼쪽 대화 목록의 제목 아래에 그 대화에서 고른 전문가가 표시됩니다. 전에는 열어 봐야만 알 수 있었습니다."

  - date: 2026-09-13
    title: 대화 시작 전에 고른 전문가·도구가 **새로고침에도 남습니다**
    tag: 챗
    items:
      - "첫 발화 전에 전문가나 도구를 골라 두고 새로고침하면 선택이 풀려 있었습니다. 화면엔 아무 표시가 없어서, **여전히 골라 둔 줄 알고** 질문을 던지면 아무것도 적용되지 않은 답이 왔습니다."
      - "이제 선택이 그대로 남고, 대화가 시작되면 그 대화로 옮겨 가면서 비워집니다."

  - date: 2026-09-13
    title: 전문가 역할을 못 불러오면 **그렇다고 말합니다**
    tag: 챗
    items:
      - "전문가를 골랐는데 그 사람의 역할 문서를 못 가져오면 화면에 알립니다. 전에는 아무 표시 없이 **일반 어시스턴트가 대신 답했고**, 화면엔 전문가 이름이 그대로 떠 있어서 알아챌 방법이 없었습니다."
      - "\"역할 문서가 없다\"와 \"불러오지 못했다\"를 나눠서 말합니다 — 지식카드가 이미 그렇게 하고 있던 것을 역할에도 맞췄습니다."
      - "답변도 \"이 전문가의 역할 문서를 불러오지 못했다\"고 먼저 밝히고 시작합니다. 전문가인 척하지 않습니다."

  - date: 2026-09-13
    title: 전문가에게 **자기 역할만** 전달합니다 — 남의 사용설명서를 걷어냈습니다
    tag: 챗
    items:
      - "전문가에게 넘기던 지시문의 **69%가 다른 프로그램용 사용 안내**였습니다(실측). \"WebFetch를 쓰지 마라\" 같은, 이 챗에는 해당하지도 않는 지시였습니다. 이제 역할 본문만 전달합니다."
      - "그만큼 비운 자리에 **실제 지식과 대화 맥락**이 더 들어갑니다."
      - "덤으로, 그 안내문에 적혀 있던 도구 이름들이 \"이 전문가의 도구\" 판단을 흐리고 있던 것도 함께 사라졌습니다."

  - date: 2026-09-13
    title: 지식카드에 **출처와 근거 등급**이 함께 실립니다
    tag: 챗
    items:
      - "전문가가 인용하는 사내 지식에 **문서 번호와 절 번호**가 같이 갑니다. 전에는 제목만 줘 놓고 \"출처를 적으라\"고 지시해서, 모델이 얼버무리거나 없는 번호를 지어낼 수 있었습니다."
      - "카드가 **측정된 사실인지 경험칙인지 전문가 판단인지**도 함께 표시됩니다. 경험칙을 측정값처럼 인용하는 일이 줄어듭니다."
      - "챗과 심의가 같은 형식을 씁니다 — 따로 만들다 보니 양쪽 모두 이 정보를 빠뜨리고 있었습니다."

  - date: 2026-09-13
    title: 다른 기기에서 대화를 열어도 **고른 전문가가 유지됩니다**
    tag: 챗
    items:
      - "회사 PC에서 전문가와 나눈 대화를 노트북에서 열면 전문가가 풀려 있었습니다. 화면엔 그 전문가의 지난 답이 그대로 남아 있어서, 모르고 다음 질문을 하면 일반 답이 왔습니다."
      - "이제 대화를 열면 고른 전문가와 보조 전문가가 그대로 복원됩니다. 예전에 나눈 대화는 기록이 없어 종전처럼 비어 있습니다."

  - date: 2026-09-13
    title: 심의 진행 표시가 **실제로 전달된 양**을 말합니다
    tag: 심의
    items:
      - "\"공용 근거 N건\" 이 좌석에 **실제로 들어간 건수**입니다. 전에는 조회된 전체 수를 세어서, 300건 조회한 심의가 \"300건 전달\" 로 뜨고 실제로는 18건만 가는 일이 있었습니다."
      - "예산이 모자라 못 실은 건수도 **좌석별로** 함께 표시하고, 전문가에게도 알립니다 — 안 알리면 \"반박할 자료가 없다\" 로 읽힙니다."
      - "좁은 예산에서 한 전문가의 조회 결과가 전부 차지하지 않도록 **여러 전문가 것을 돌아가며** 싣습니다. 관점이 갈리는 것이 심의의 값어치입니다."
      - "근거 카드에 보이는 조회 결과 분량을 늘렸습니다 — 사람이 전문가보다 적게 보는 일이 없게 했습니다."

  - date: 2026-09-13
    title: 전문가를 고르면 **그 사람이 쓰는 도구**가 먼저 붙습니다
    tag: 챗
    items:
      - "챗에서 전문가를 지목하면 그 전문가의 분야 도구가 우선 연결됩니다. 전에는 **운영자 전문가만** 그랬고, 물성·해석 같은 도메인 전문가는 도구가 질문 문장으로만 정해져서 정작 그 사람이 늘 쓰는 DB 가 빠지는 일이 있었습니다."
      - "**직접 고른 도구·앱이 언제나 먼저입니다.** 분야 도구는 아무것도 고르지 않았을 때만 끼어듭니다."
      - "전문가의 역할로 분야를 짐작할 수 없으면 **아무것도 바꾸지 않습니다** — 엉뚱한 도구가 질문에 맞는 도구를 밀어내지 않게 했습니다."
      - "어떤 도구가 우선 붙었는지 진행 표시줄에 뜹니다."

  - date: 2026-09-13
    title: 심의에서 한 전문가가 조회한 값을 **모두가 함께 봅니다**
    tag: 심의
    items:
      - "한 좌석이 찾아낸 물성값·과거 사례를 다른 좌석도 근거로 씁니다. 전에는 각자 조회한 것을 자기만 보고 있어서, 옆자리가 이미 찾아 놓은 수치를 두고도 기억으로 말하는 경우가 있었습니다."
      - "공용 근거에는 **누가 조회했는지**가 붙습니다. 값이 자기 판단과 어긋나면 그 전문가를 지목해 반박할 수 있습니다."
      - "다음 라운드에서는 이미 조회된 항목을 알려 줘 같은 조회를 되풀이하지 않고 빈 각도를 채우게 합니다."

  - date: 2026-09-13
    title: 심의 좌석이 말하기 전에 **직접 도구를 돌려** 확인합니다
    tag: 심의
    items:
      - "전문가가 발언 전에 자기 분야 도구로 **실제 값을 조회**합니다 — 물성 DB, 적층 계산, 규격 조회 등. 누가 무엇을 조회했는지 진행 중에 좌석 이름과 함께 뜨고, 결과는 근거 카드로 남습니다."
      - "좌석마다 **자기 분야에 맞는 도구만** 쥐여 줍니다. 전에는 수백 종을 통째로 줘서 전문가가 엉뚱한 곳을 헤매거나, 조회를 아예 못 하고 넘어갔습니다."
      - "같은 도구를 같은 조건으로 부르면 **한 번만 부르고 나눠 씁니다.** 조건이 다르면 각각 부릅니다 — 결과가 다르니까요."
      - "조회 결과가 길면 잘라 넣고 **얼마까지 넣었는지 화면에 적습니다.** 잘린 것을 모르고 읽는 일이 없게 했습니다."

  - date: 2026-09-13
    title: 지식카드를 기다리는 시간을 넉넉히 주고, 받는 과정을 보여 줍니다
    tag: 심의
    items:
      - "전문가 지식카드를 기다리는 시간을 **20초에서 2분으로** 늘렸습니다. 전에는 검색이 조금만 느려도 \"시간 안에 못 받았다\" 며 지식 없이 발언하는 좌석이 생겼습니다."
      - "누구 것을 받았고 누가 남았는지 **받는 대로 화면에 표시**합니다. 다 끝날 때까지 아무것도 안 보이던 구간이 없어졌습니다."

  - date: 2026-09-13
    title: PPT·문서를 붙이면 원하는 시스템으로 바로 보냅니다
    tag: 챗
    items:
      - "챗 입력창의 **+** 로 **PPT·Word·PDF** 를 붙이면 “어디로 보낼까요” 가 뜹니다 — **Report Archive**(슬라이드 한 장이 보고서 페이지 한 장, **그림·표까지**) 또는 **AI 데이터 허브**(지식카드 초안). 각 시스템이 자기 방식으로 직접 읽습니다."
      - "**DRM 이 걸려 있어도 대개 그냥 됩니다.** 붙이는 순간 파일 첫 바이트를 보고 평문이면 바로 보내고, 정말 암호화된 경우에만 PC 에서 읽는 방법을 안내합니다. 예전에는 형식만 보고 무조건 안내를 띄웠습니다."
      - "지금 **전문가를 골라 대화 중이면** 그 전문가의 시스템이 맨 앞에 뜨고 미리 선택돼 있습니다. 보낼 곳이 하나뿐이어도 **자동으로 보내지 않고** 물어봅니다."
      - "AI 데이터 허브로 보낸 것은 **저장까지 하지 않습니다** — 변환 초안만 만들고, 모자란 항목(팀·그룹 등)은 챗에서 확인한 뒤 저장합니다."
      - "K파일(.k·.key·.dyn)은 **DynaForge 세션**으로 갑니다. 파일이 커도 대화로 나르지 않고 서버끼리 넘깁니다."

  - date: 2026-09-13
    title: 심의로 넘길 때 대화를 읽어 질문을 대신 만들어 줍니다
    tag: 심의
    items:
      - "**심의로 넘기기** 를 누르면 그동안 오간 대화를 읽고 **무엇을 판단해 달라는 것인지** 한 문장으로 뽑아 질문 칸에 채웁니다. 예전에는 맨 처음 발화가 그대로 들어갔는데, 대화가 길어질수록 그건 이미 지나온 질문이었습니다."
      - "왜 그 질문인지 한 줄과 **다른 각도의 화두 1~2개**를 같이 보여 줍니다. 마음에 안 들면 **↩ 첫 발화 그대로** 로 되돌립니다. 직접 고쳐 쓰면 제안이 덮어쓰지 않습니다."
      - "챗에서 **/심의** 만 치거나 너무 짧게 던져도 같습니다 — 대화에서 화두를 뽑고 **무엇을 화두로 삼았는지 알려 줍니다**(예전에는 빈 질문으로 그냥 돌았습니다). 구체적으로 적으면 적은 그대로 갑니다."

  - date: 2026-09-13
    title: VOC 검색이 한국어로도 제대로 걸립니다
    tag: 연결
    items:
      - "한국어로 물으면 거의 안 걸리던 문제를 고쳤습니다 — **번역본만 색인**하고 있어서 원문 한국어가 검색에 잡히지 않았습니다(재현율 1.1% → 100%)."
      - "**“최근 검색”이 구형 제품을 보여주던 문제** — 기본 정렬을 최신순으로 바꾸고, 발행일이 미래로 잘못 찍힌 데이터를 바로잡았습니다."
      - "**결함 시나리오 도출 도구 5종** 이 생겼습니다 — 제품·증상·조건 축을 조합해 “이런 상황에서 이런 불만이 나온다” 를 이야기로 구성합니다."
      - "인도네시아 커뮤니티(Kaskus) 유입이 28일간 멈춰 있던 것을 고쳤습니다 — 댓글을 마지막 페이지부터 읽도록 바꿨습니다."

  - date: 2026-09-13
    title: 구어로 물어도 전문가 지식이 찾아집니다
    tag: 연결
    items:
      - "**“부풀어 올랐다”·“메시가 깨졌다”** 처럼 현장에서 쓰는 말로 물어도 전문 용어로 넓혀 찾습니다. 현장표현 사전을 **전 분야 137개**로 넓혔습니다."
      - "예전에는 구어로 물으면 전문가가 **“근거가 부족하다”며 거절**하는 일이 많았습니다. 전문가 검색에도 같은 확장을 걸었습니다."
      - "사전을 넓히다 **오히려 정확도가 떨어지는 것**을 발견해 라벨 1,000건으로 다시 재고 고쳤습니다(한 글자짜리 항목이 엉뚱한 말에 걸리고 있었습니다). 사전은 고치면 재기동 없이 바로 반영됩니다."

  - date: 2026-09-13
    title: Claude 에서 쓸 때 전문가를 조직도로 고르고, 답의 수치를 검증합니다
    tag: 연결
    items:
      - "Claude·스크립트에서 MCP 로 연결해 쓸 때 **browse_experts** 로 전문가 조직도를 펼쳐 보고 **use_experts** 로 골라 그 사람으로 답하게 합니다 — 포털에서 고르는 것과 같습니다."
      - "**verify_answer** — 답에 쓴 수치가 **이번 세션에서 실제로 조회한 도구 결과에 있는지** 코드가 대조합니다. 기억으로 채운 값이 여기서 걸립니다."
      - "**권한이 없는 도구·앱은 목록에서 아예 빠집니다.** 예전에는 '권한 없음' 딱지만 붙어 있어 계획에 넣었다가 실패했습니다."
      - "심의도 **내 계정으로** 조회합니다 — 호출자 신원이 심의 백엔드까지 전달돼, 내가 볼 수 있는 자료만 근거가 됩니다."

  - date: 2026-09-12
    title: DRM 문서(PPT·Word·PDF)를 붙여 읽고, 심의하고, 원하는 곳에 올립니다
    tag: 챗
    items:
      - "**DRM 이 걸린 발표자료도 됩니다.** 사내 DRM 문서는 그 PC·그 계정에서만 풀리기 때문에, 파일을 그대로 올리면 서버는 암호 덩어리만 봅니다. 그래서 **내 PC 에 설치된 Office 로 한 번 읽어** 글만 올립니다 — 원본 파일은 PC 를 떠나지 않습니다."
      - "챗 입력창의 **+** 로 PPT·Word·PDF·HTML 을 붙이면 추출기 내려받기와 쓰는 법이 안내됩니다. 받은 .bat 에 문서를 끌어다 놓으면 옆에 `.hwax.md` 가 생기고, 그 파일을 붙이면 내용을 읽습니다. 추출기는 **처음 한 번만** 받으면 됩니다."
      - "붙인 뒤 **어디로 보낼지 고릅니다** — 심의 걸기 · 요약과 쟁점 뽑기 · 지식카드로 등록 · Report Archive 에 올리기 · MX 백서에 싣기 · 논문 코퍼스에 넣기. 권한이 있는 곳만 보이고, 문서 형식에 맞는 순서로 뜹니다."
      - "지금 **전문가를 골라 대화 중이면** 그 전문가의 플랫폼이 맨 앞에 뜨고 입력창에 미리 채워집니다. 읽고 보내기만 하면 됩니다 — 저절로 보내지는 일은 없습니다."
      - "**200슬라이드짜리 긴 자료도 받습니다.** 모델이 한 번에 볼 수 있는 양을 넘으면 앞에서 자르지 않고 **가운데를 덜어냅니다** — 발표자료는 결론이 뒤에 있기 때문입니다. 어느 슬라이드가 빠졌는지 번호로 알려 주고, 그 대목을 물으면 \"못 봤다\"고 답합니다."
      - "**대화가 길어져도 앞부분을 잃지 않습니다.** 예전에는 오래된 대화가 그냥 버려져서 \"아까 말했잖아\"가 통하지 않았습니다. 이제 최근 대화는 그대로 두고 오래된 것은 발췌로 압축해 남깁니다."
      - "K파일(.k·.key·.dyn)을 붙이면 **DynaForge 세션**으로 보냅니다. 파일이 커도 됩니다 — 대화로 나르지 않고 서버끼리 넘깁니다."
      - "올릴 곳이 하나뿐이어도 **묻고 고르게** 합니다. 예전에는 하나면 묻지 않고 바로 갔는데, 보낼 곳이 늘어난 지금은 잘못 보낼 수 있습니다."

  - date: 2026-09-12
    title: 심의가 붙인 자료를 훨씬 많이 읽습니다
    tag: 심의
    items:
      - "챗에서 심의로 넘길 때 싣는 근거가 **11,000자에서 최대 50만 자로** 늘었습니다. 예전에는 발표자료 한 건도 다 못 들어가 좌석이 표지만 보고 논의했고, 그런데도 심의는 멀쩡히 끝나서 알아채기 어려웠습니다."
      - "얼마나 실을지는 **쓰는 모델이 한 번에 볼 수 있는 양에서 자동으로 계산**합니다. 대화가 길면 자료 몫이 줄고, 그럴 때는 \"대화가 길어 자리가 적다\"고 알려 줍니다."
      - "**Thinking** 에서도 붙인 자료를 전문가들이 함께 봅니다."

  - date: 2026-09-12
    title: Report Archive 보고서가 어느 조직에 쌓이는지 분명해졌습니다
    tag: 연결
    items:
      - "**API 토큰** 메뉴의 Report Archive 연결에서, 토큰을 등록하기 전에도 **조직 고르는 칸이 등록 뒤에 생긴다**는 안내가 보입니다. 고를 수 있는 조직 목록을 그 토큰으로 물어와야 해서 등록이 먼저입니다."
      - "조직을 안 고르면 보고서가 RA 계정 기본 워크스페이스(대개 개인함)로 가서 **남이 못 봅니다.** 문서를 보고서로 올릴 때도 어느 워크스페이스에 생겼는지 확인해 알려 줍니다."
      - "보고서를 만든 뒤 **축 태그**를 붙이고 **부서 게시판**에 올릴지 묻습니다 — 태그가 없으면 나중에 목록·집계에서 안 찾힙니다."

  - date: 2026-09-11
    title: 소속과 허가에 따라 쓸 수 있는 기능과 플랫폼이 정해집니다
    tag: 연결
    items:
      - "**CAE그룹(CAEG)** 소속은 모든 기능과 플랫폼을 씁니다. 그 밖은 기본으로 **일반 챗**만 쓰고, 심의·Thinking·전문가와 대화·각 플랫폼·파일 올리기·API 토큰은 허가가 있어야 보입니다."
      - "상단 메뉴의 **내 권한** 에서 기능·플랫폼마다 쓸 수 있는지와 그 이유를 봅니다. 없는 것은 한 줄 사유와 함께 **요청**하면 관리자가 승인하고, 승인되면 새로고침 없이 메뉴에 나타납니다."
      - "권한이 없는 메뉴(예: 심의)는 비활성으로 두지 않고 아예 보이지 않습니다. 챗에서 /심의 를 직접 쳐도 권한 안내가 답으로 옵니다."
      - "Claude·스크립트에서 MCP 로 부르는 도구도 같은 권한으로 걸립니다. 권한을 거두면 이미 발급한 API 토큰에도 곧바로 반영됩니다."
      - "관리자는 **사용자 관리** 에서 소속을 지정하고, 개별 허가를 켜고, 요청을 승인합니다."

  - date: 2026-09-11
    title: 전문가 한 명을 전체 화면으로 깊게 봅니다
    tag: 챗
    items:
      - "조직도에서 전문가를 누르고 **⤢ 전체 화면으로 보기** — 설명, 역할 문서 전문(이 전문가가 받는 지시), 예시 질문, 그리고 **지식카드 전체**를 한 화면에서 봅니다."
      - "지식카드는 제목·요약으로 검색하고 50건씩 넘깁니다. 카드를 누르면 본문·표·출처(DOI)까지 오른쪽에 펼쳐집니다."
      - "상세칸의 '보유 지식' 수가 실제 수로 나옵니다(전에는 미리보기 20건이 전부처럼 보였습니다). 태그도 이제 보입니다."
      - "심의 좌석 조직도에서도 같은 화면으로 확인하고 바로 좌석에 넣거나 뺄 수 있습니다."

  - date: 2026-09-11
    title: 전문가 조직도가 계층으로 정리되고, HE팀 도구 전문가가 생겼습니다
    tag: 챗
    items:
      - "조직도가 **전문 지식 에이전트**(스마트폰 HW 지식 → 신뢰성·디스플레이·기구 구조… / 스마트폰 SW 지식 → 앱·UX·연결성·시스템… / 공통·업무 지식)와 **플랫폼 에이전트**로 나뉩니다. 챗 조직도와 심의 좌석 조직도가 같은 계층입니다."
      - "**플랫폼 에이전트 → HE팀** 에 MCP 앱마다 그 앱을 다루는 전문가가 있습니다 — StepForge·DynaForge·SmartTwin·Laminate Analyzer·Thermal Shock·MaterialTwin·SignalForge·AI 데이터 허브·Report Archive·MX 백서·Web Design Agents·웹 리서치·Paper Ingest·전문가 심의·Risk Review."
      - "HE팀 전문가를 골라 대화하면 **그 앱의 도구를 직접 호출해** 답합니다 — 앱의 작업 순서·단위·판정 기준·틀리기 쉬운 점을 알고 시작하고, 지우기·게시·제출처럼 되돌리기 어려운 일은 먼저 확인을 받습니다."
      - "HE팀 전문가는 심의 좌석 **자동 추천에는 나오지 않습니다**(도구 담당이라 분야 전문가 자리를 차지하지 않게). 조직도에서 직접 고르는 것은 됩니다."

  - date: 2026-09-11
    title: 심의 전에 질문을 보강하고, VOC 를 먼저 봅니다
    tag: 심의
    items:
      - "질문이 짧으면 **메커니즘 분석에 필요한 정보 중 빈 칸만** 몇 가지 되묻습니다(원인 규명이면 대상·현상·조건·범위·이미 확인한 것). 답하면 질문에 붙어 전문가를 다시 찾고, 남은 칸만 다시 묻습니다. 건너뛰어도 됩니다."
      - "**📡 VOC 먼저 보기** — 질문으로 고객 불만을 검색해 목록을 보여 줍니다. 관련 있는 것만 골라(최대 6건) 근거로 넣고, 고른 VOC 로 질문을 보강할 수 있습니다. 여기서 직접 봤으면 심의의 자동 VOC 조회는 끕니다."

  - date: 2026-09-11
    title: 심의 전문가를 분야별로 고르고, 20명까지 앉힙니다
    tag: 심의
    items:
      - "전문가 선정 화면에 **🗂 조직도에서 고르기** — 분야 → 그룹 → 사람으로 훑으며 여러 명을 고릅니다. 질문 관련도(%)가 그대로 보이고, 분야마다 몇 명을 앉혔는지 보입니다."
      - "한 번에 앉힐 수 있는 전문가가 **12명 → 20명**으로 늘었습니다. 다 차면 조용히 무시하지 않고 '가득'으로 알려 줍니다."
      - "한 번 돌려 보고 토론이 잘 안 되면 **전문가를 다시 고를 수** 있습니다 — 이어하기 칸의 🗂 좌석 조정에서 빼고(경고가 뜹니다) 조직도로 더한 뒤 이어가세요. 고친 명단 그대로 갑니다. 1라운드에서 멈추는 체크포인트와 같이 쓰면 좋습니다."
      - "반박 라운드에서 각 전문가가 **자기 발언과 가장 관련 깊은 두 명**을 지정받아 반박합니다(전에는 옆자리 한 명). 아무에게도 반박받지 않고 넘어가는 전문가는 없게 했습니다."
      - "심의가 끝나면 **관계도**에서 누가 누구의 어떤 말을 반박했는지 네트워크로 봅니다."
      - "챗에서 심의로 넘길 때도 '이 주제를 맡을 전문가가 없을 수 있다' 경고가 뜹니다. 전에는 /심의 화면에만 있었습니다."

  - date: 2026-09-11
    title: 도구를 '하는 일'로 고릅니다
    tag: 챗
    items:
      - "도구 선택에 **영역 칩**이 생겼습니다 — CAD·형상 제어, 메시·해석 모델 구성, 시뮬레이션 실행·잡, 해석 계산·예측, 해석 결과 분석, 물성·재료, VOC·시장 신호 등 13가지. 영역을 고르면 그 일을 하는 도구가 어느 앱에 있든 한 번에 모입니다."
      - "영역을 고르면 앱 목록도 그 영역에 도구가 있는 앱만 보여 줍니다. 목록이 길면 '… N개 더' 로 알려 줍니다."

  - date: 2026-09-11
    title: 심의 이어하기가 앞 회차를 제대로 잇습니다
    tag: 수정
    items:
      - "이어하기 회의록의 라운드 번호가 **앞 회차에 이어서** 매겨집니다(3라운드 뒤면 4·5·6). 전에는 회차마다 다시 '1라운드'로 시작해 어느 회차 발언인지 헷갈렸습니다."
      - "이어하기가 **같은 보고서에 페이지로 이어 붙습니다.** 전에는 회차마다 보고서가 새로 생겨 흩어졌습니다."
      - "앞 회차의 **양보 불가 조항**이 이어하기에 그대로 넘어갑니다. 전에는 웹에서 이어할 때 조용히 빠져, 이미 정한 것이 되돌아갈 수 있었습니다."
      - "앞 회차에서 **갈렸던 쟁점**(누가 누구의 무엇을 반박했는지)이 이어하기에 함께 넘어가, 같은 논점을 처음부터 다시 파지 않습니다."
      - "1라운드에서 멈추는 **체크포인트** 토글이 실제로 동작합니다. 전에는 켜도 아무 일이 없었습니다."
      - "다시 열어 본(저장된) 심의를 이어갈 때 전문가가 **처음부터 새로 뽑히던** 것을 고쳤습니다. 앞 회차 전문가가 그대로 이어받습니다."

  - date: 2026-09-11
    title: 심의의 VOC 조회가 실제 고객 발언을 싣습니다
    tag: 수정
    items:
      - "불량 질문에서 돌던 VOC 조회가 **고객 발언을 한 건도 싣지 못하고** 있었습니다(경보 요약 한 줄만 들어갔습니다). 이제 부정 VOC 원문과 제품별 이슈가 근거로 들어갑니다."

  - date: 2026-09-10
    title: Thinking 모드 — 이름과 실패 안내
    tag: 챗
    items:
      - "화면 이름을 **Thinking** 으로 바꿨습니다. 기능은 그대로이고 `/띵킹` 으로 부르던 것도 계속 됩니다."
      - "전문가가 응답에 실패하면 **왜 실패했는지** 보여 줍니다(예: 시간 초과). 전에는 그 전문가가 이유 없이 사라진 것처럼 보였습니다 — 시간 초과면 다시 시도, 형식 실패면 질문을 바꾸는 쪽이라 대응이 갈립니다."

  - date: 2026-09-10
    title: 전문가 지식 검색이 제대로 걸립니다
    tag: 수정
    items:
      - "전문가에게 물으면 **그 전문가의 자료 안에서** 관련도 순으로 찾습니다. 전에는 전체에서 먼저 추린 뒤 걸러서, 흔한 검색어일수록 그 전문가의 자료가 통째로 빠졌습니다(실측: 22건 중 0건)."
      - "검색 결과가 관련도 순으로 정렬됩니다. 전에는 사실상 저장된 순서였습니다."
      - "검색 결과 수(총 몇 건)가 실제 값으로 나옵니다. 전에는 화면에 보이는 만큼만 세고 있었습니다."
      - "보유 자료가 없는 전문가는 **없다고 답합니다.** 전에는 다른 전문가의 자료를 자기 근거처럼 인용했습니다."

  - date: 2026-09-09
    title: 무엇이 바뀌었는지 아무 때나 볼 수 있습니다
    tag: 배포
    items:
      - "로그인하면 **아직 못 보신 업데이트**만 한 번 안내로 뜹니다. 다 보셨으면 안 뜹니다."
      - "상단 메뉴의 **업데이트** 에서 지난 이력을 날짜별로 넘겨 볼 수 있습니다. 분류(챗·심의·연결·배포·수정)로 좁히는 것도 됩니다."

  - date: 2026-09-09
    title: 전문가 페르소나 챗을 실제로 쓸 수 있게
    tag: 챗
    items:
      - "대화가 시작된 뒤에도 오른쪽 **현재 전문가** 칸에서 전문가를 바꾸거나 해제할 수 있습니다. 전에는 첫 발화를 보내는 순간 바꿀 방법이 없어 새 대화를 열어야 했습니다."
      - "전체 조직도가 생겼습니다. 분야 → 그룹 → 사람으로 훑고, 사람을 누르면 역할·태그·보유 지식이 뜨고 거기서 바로 지정합니다."
      - "전문가가 답한 말풍선에 그 사람의 이름과 색이 붙습니다. 심의 회의록과 같은 색이라 누구인지 한눈에 이어집니다."
      - "'/전문가' 로 찾은 목록에서 바로 고를 수 있습니다. 전에는 이름만 흘러가고 고를 수가 없었습니다."
      - "화면이 기계 키(sim-drop-impact) 대신 사람 이름을 보여 줍니다."

  - date: 2026-09-09
    title: 챗 그림을 눌러서 크게 볼 수 있습니다
    tag: 챗
    items:
      - "도구가 그린 그래프·구조도·HTML 미리보기를 누르면 확대 창이 열립니다. 휠로 확대, 끌어서 이동, 0 으로 맞춤, Esc 로 닫기."
      - "가로로 아주 긴 차트는 억지로 줄이지 않고 가로 스크롤로 둡니다 — 줄이면 축 라벨을 못 읽습니다."

  - date: 2026-09-09
    title: 보고서가 쌓일 조직(워크스페이스)을 고를 수 있습니다
    tag: 연결
    items:
      - "설정의 Report Archive 연결에서 조직을 고릅니다. 기본값이 개인함으로 잡혀 보고서가 개인함에 쌓이던 문제를 함께 고쳤습니다."
      - "조직을 바꾸면 즉시 반영됩니다. 전에는 최대 5분이 걸렸습니다."

  - date: 2026-09-09
    title: 지식카드 검색이 크게 빨라졌습니다
    tag: 수정
    items:
      - "전문가 지식 검색이 수백 배 빨라졌습니다(실측 221초 → 0.1초). 심의·챗에서 근거를 못 찾고 넘어가던 경우가 줄어듭니다."
      - "검색이 실패했을 때 \"아는 게 없다\"가 아니라 \"못 물어봤다\"라고 구분해서 말합니다."

  - date: 2026-09-09
    title: 심의 표결에서 침묵을 동의로 세지 않습니다
    tag: 심의
    items:
      - "입장을 밝히지 않은 좌석은 **미표명**으로 따로 표시합니다. 전에는 동의로 칠해져 실제보다 합의가 강해 보였습니다."
      - "만장일치는 착석한 좌석 전원이 동의했을 때만 그렇게 부릅니다."

  - date: 2026-09-09
    title: Windows 에서 MCP 설정이 안 되던 문제
    tag: 수정
    items:
      - "Claude Code 를 설치했는데도 설정 배치가 못 찾던 경우를 고쳤습니다. 설치 직후 PATH 가 아직 반영되지 않은 창에서 실행하면 생기던 일입니다."

  - date: 2026-09-08
    title: Thinking 모드 — 답할 수 있는 전문가만 각자 답합니다
    tag: 챗
    items:
      - "입력창의 Thinking 모드를 켜면 질문에 답할 수 있는 전문가들이 **각자** 답합니다. 심의와 달리 서로 토론하지는 않습니다."
      - "답할 수 없는 전문가는 기권하고 알맞은 분야로 넘깁니다. 아무도 못 답하면 화면이 그렇게 말합니다."

  - date: 2026-09-07
    title: 리스크 심사를 내 명의로 봅니다
    tag: 연결
    items:
      - "리스크 심사에서 본인에게 보이는 프로젝트만 뜹니다. 전에는 공용 계정으로 조회해 내 비공개 프로젝트가 보이지 않았습니다."

  - date: 2026-09-03
    title: 이메일로 가입해서 쓸 수 있습니다
    tag: 연결
    items:
      - "사내 SSO 연동 전이라도 이메일로 가입 신청을 하고 승인받아 쓸 수 있습니다. 나중에 SSO 가 붙어도 같은 계정이 이어집니다."
      - "부서 정보를 넣을 수 있고, 보고서가 그 부서 이름으로 저장됩니다."

  - date: 2026-09-03
    title: 보고서를 내 명의로 저장합니다
    tag: 연결
    items:
      - "설정에서 Report Archive 를 연결하면 심의·챗이 만든 보고서가 **본인 명의**로 저장됩니다. 전에는 전부 공용 계정 것이었습니다."

  - date: 2026-09-03
    title: 같은 브라우저를 나눠 쓸 때 이전 사용자의 대화가 보이던 문제
    tag: 수정
    items:
      - "대화 기록을 계정별로 분리했습니다. 공용 PC 에서 로그인하면 앞사람의 대화 목록이 그대로 보이던 일이 있었습니다."

  - date: 2026-09-03
    title: 심의 결정문이 근거를 인용합니다
    tag: 심의
    items:
      - "결정문의 수치와 주장에 근거 번호가 붙습니다. 어느 자료에서 나온 말인지 되짚을 수 있습니다."
      - "결정문이 중간에 잘렸는지 시스템이 스스로 확인하고, 잘렸으면 그렇게 알려 줍니다."

  - date: 2026-09-02
    title: 심의에 들어갈 전문가를 직접 고를 수 있습니다
    tag: 심의
    items:
      - "심의를 열기 전 브리프에서 화두·좌석·진행 방식을 확인하고 바꿀 수 있습니다. 전체 명단에서 직접 고르는 것도 됩니다."
      - "챗에서 도구로 뽑아 둔 실제 데이터가 요약이 아니라 **원본 그대로** 심의 근거로 넘어갑니다."

  - date: 2026-09-01
    title: 챗에 올린 파일을 어디로 보낼지 고릅니다
    tag: 챗
    items:
      - "파일을 올리면 목적지를 되묻습니다. STEP 같은 도면은 StepForge 로 보내 과제명·단계·특이사항까지 적어 반입할 수 있습니다."

  - date: 2026-08-31
    title: 포털에 한 번 로그인하면 앱까지 그대로 들어갑니다
    tag: 연결
    items:
      - "포털에 로그인하면 HEAX 앱들에 다시 로그인하지 않아도 됩니다. 앱을 열 때마다 인증을 요구하던 것이 사라집니다."
      - "리스크 심사 메뉴가 상단에 생겼습니다(권한이 있는 분에게만 보입니다)."
